# =====================================================================
# imedge - STORE NODE configuration (one executable = one shop).
# Encoding: ISO-8859-1, the java.util.Properties historical charset -
# keep non-ASCII out of new keys.
#
# What this node is. It is the shop's aggregator: it ingests what the
# registers push (sessions, tickets, refunds, movements, counter
# tickets), it holds the shop's referential and exports it to the
# registers, and it is where the shop is supervised. It sells nothing:
# no drawer, no scanner, no payment terminal, no sale screen - and
# none of those keys exist in this file.
#
# ROLE. pos.role=store. Without it the ingestion and export endpoints
# answer 403 off-role, which is the guard that stops a register being
# mistaken for the node.
#
# ABSENCE-MEANS-OFF pattern: a feature activates by the mere presence
# of its URL key and stays silent without it -
#   pos.sync.central-url  -> two-level referential pull (route A)
#   pos.valuation.url     -> engine feed delivery to the local engine
#
# COMMISSIONING CHECKLIST of a real store node:
#   pos.pdv.number        -> the point of sale this node aggregates
#   pos.sync.token        -> the shared token the registers send
#   pos.valuation.url     -> the shop's imvaluation engine
#
# DEV PROFILE notes: H2 in-memory with drop-and-create wipes the base
# at each restart. A node meant to keep its sales across restarts runs
# on a file database (see sh/imedge.sh).
# =====================================================================

# --- Role and port ---
# The store node runs the store role by default: this IS the node.
pos.role=store

# The node listens on 8070, not on the framework's 8080: a register is what
# sits on 8080, and the two run side by side on a developer's machine. The
# port is declared HERE rather than passed on every launch, so a node started
# by hand, by sh/imedge.sh, by the demo stack or from an IDE is always on the
# same port and a register's pos.sync.store-url never has to be guessed.
quarkus.http.port=8070

# Configuration de la base de donnees
quarkus.datasource.db-kind=h2
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Configuration Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# --- Securite ---
# DEUX surfaces d'authentification, a ne pas confondre :
#
#  1. LES ECRANS (/admin/*, /dashboard). Authentification par formulaire,
#     identites lues dans la table employees par les fournisseurs ecrits a
#     la main dans com.intermarche.pos.security : identifiant + PIN.
#
#  2. LES SURFACES MACHINE (imports CSV, flux moteur, GraphQL, ingestion
#     et export referentiel). HTTP Basic : ces clients envoient un en-tete
#     Authorization et attendent une reponse, jamais une page.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/admin/login
quarkus.http.auth.form.error-page=/admin/login?error=true
quarkus.http.auth.form.landing-page=/dashboard
quarkus.http.auth.form.post-location=/j_security_check
quarkus.http.auth.form.username-parameter=j_username
quarkus.http.auth.form.password-parameter=j_password

# HTTP Basic conserve en parallele du formulaire. Sa priorite (2000) passe
# avant le formulaire (1000), donc une requete portant l'en-tete
# Authorization est traitee par Basic.
quarkus.http.auth.basic=true

# Cle de chiffrement du cookie de session (16 caracteres minimum). Une cle
# versionnee permettrait de forger un cookie valide et d'usurper n'importe
# quel compte : en production elle vient de l'environnement, SANS valeur de
# repli, afin que le demarrage echoue plutot que de tourner avec un secret
# connu de quiconque lit le depot.
%prod.quarkus.http.auth.session.encryption-key=${POS_SESSION_KEY}
%dev.quarkus.http.auth.session.encryption-key=dev-only-not-for-production-0123456789
%test.quarkus.http.auth.session.encryption-key=test-only-not-for-production-01234567

# Les surfaces MACHINE s'authentifient en Basic et attendent un 401, jamais
# une redirection vers un ecran de connexion. Cette politique force le
# mecanisme sur leurs chemins. Les ecrans, eux, ne sont PAS ici : ils
# portent @RolesAllowed sur leurs ressources, ce qui laisse le formulaire
# emettre sa redirection, et laisse /admin/login et les feuilles de style
# /admin/*.css publiques sans avoir a les enumerer.
quarkus.http.auth.permission.api.paths=/feeds/import/*,/graphql
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.auth-mechanism=basic

# Enable Virtual Threads (Project Loom)
quarkus.threading.virtual.enabled=true

# Configuration des logs
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.category."stdout".level=INFO

# Configuration de la console
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# Optimisation Hibernate
quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true

# CORS
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# --- Point de vente agrege par ce noeud --------------------------------
# Le numero du PDV dont ce noeud resout les parametres d'echelon et dont
# il exporte le referentiel. Absent, la resolution d'echelon n'a pas de
# porteur et retombe sur les valeurs locales.
#pos.pdv.number=

# --- Jeton partage de synchronisation ----------------------------------
# Les caisses le presentent dans l'en-tete X-Sync-Token a l'ingestion et
# au tirage. Absent = aucun jeton exige (developpement uniquement).
#pos.sync.token=

# --- Tirage referentiel a deux niveaux (route A) -----------------------
# Absent = ce noeud n'herite de rien et son referentiel est celui qu'on
# lui charge. Present = il tire du noeud central, puis ré-expose a ses
# caisses la valeur effective, jamais la chaine.
#pos.sync.central-url=
#pos.referential.pull-seconds=300

# --- Livraison des flux au moteur imvaluation local --------------------
# Le noeud livre les fichiers de flux verbatim (domaine ENGINE_FEEDS) a
# son imvaluation attache, dans l'ordre du catalogue (partages avant
# specifiques), avec ACK par version. Absent = inactif.
pos.valuation.url=http://localhost:8090
pos.valuation.user=admin
pos.valuation.password=admin
#pos.valuation.feed-delivery-seconds=30
#pos.valuation.feed-timeout-millis=60000

# --- Production bootstrap of the FIRST administrator -------------------
# When the employee table is empty AND this password is set, startup
# creates the initial ADMIN employee (forced password change at first
# sign-in). No variable = no account = nobody can sign in on a virgin
# node.
pos.bootstrap.admin.username=admin
pos.bootstrap.admin.email=admin@pos.local
%prod.pos.bootstrap.admin.password=${POS_ADMIN_PASSWORD:}
