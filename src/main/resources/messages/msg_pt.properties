j.montant-au-dela-duquel-le-controle-du=Montante acima do qual o controlo do montante do artigo é acionado, comparado em valor absoluto. Vazio: sem limite, o controlo nunca é acionado (BO-10-02-16).
j.montant-au-dela-duquel-le-controle-du-2=Montante acima do qual o controlo do montante de pagamento é acionado, comparado em valor absoluto. Vazio: sem limite, o controlo nunca é acionado (BO-10-02-17).
j.montant-au-dela-duquel-un-mouvement-de=Montante acima do qual um movimento de caixa (recolha, reforço, despesa, adiantamento, declaração) exige a aprovação de um gestor. Um movimento deste montante ou inferior passa sem aprovação (BO-04-01-44).
j.montant-compte-obligatoire-et-positif=Montante contado obrigatório e positivo.
j.montant-d-article-plafond=Limite do montante do artigo (€)
j.montant-de-chargement-obligatoire-et-non-nul=Montante de carregamento obrigatório e não nulo.
j.montant-de-l-ecart-visible-du-caissier=Montante da diferença visível pelo operador de caixa
j.montant-de-la-remise=Montante do desconto
j.montant-de-reglement-plafond=Limite do montante de pagamento (€)
j.montant-des-annulations=Montante das anulações
j.montant-des-ventes=Montante das vendas
j.montant-du-ticket=Montante do talão
j.montant-du-en-caracteres-agrandis=Montante devido em caracteres ampliados
j.montant-maximal-rendu-en-especes-par-cashback=Montante máximo devolvido em numerário por cashback numa transação; acima dele, o pedido é recusado antes de consultar o TPA. 0: sem limite (LC-07-04-07/08).
j.montant-moyen-par-tpv=Montante médio por TPV
j.montant-moyen-par-client=Montante médio por cliente
