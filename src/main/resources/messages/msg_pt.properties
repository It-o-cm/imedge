j.nombre-de-chiffres-du-code-saisi-en=Número de algarismos do código introduzido na caixa: teclado de entrada, alteração de código e código gerado na criação de uma conta. De 4 a 8; abaixo, 4, acima, 8 (BO-10-02-23).
j.nombre-de-decimales-du-total-hors-taxe-2=Número de casas decimais do total sem IVA de cada linha de artigo na fatura e na guia de remessa: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
