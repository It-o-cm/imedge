j.une-ligne-de-cumul-des-remises-immediates=Uma linha de acumulado dos descontos imediatos — descontos de linha e desconto de talão — sai por baixo dos totais. Desativado: nenhuma linha de acumulado (BO-03-03-24).
j.une-ligne-du-flux-client-en-compte=Uma linha do fluxo de clientes com conta cuja rua, código postal ou localidade esteja em falta é REJEITADA e indicada no relatório de importação, sendo o resto do ficheiro integrado. Desativado — o predefinido — a linha é integrada com a morada que contém (BO-10-08-27).
j.une-periode-est-deja-ouverte=Já está aberto um período.
j.une-remise-ou-un-discount-ligne-ou=Um desconto ou uma redução (linha ou talão) exige a aprovação de um supervisor. Desativado: o operador de caixa aplica sozinho (EXP-32).
j.une-remise-ou-un-rabais-saisi-librement=Um desconto ou abatimento introduzido livremente aplica-se a um artigo que já tem um desconto manual ou uma promoção automática. Desativado: a ação é recusada nessa linha. Uma tecla predefinida com CUMUL ignora esta predefinição (BO-03-07-11).
j.une-regle-par-ligne-path-pay-bloque=Uma regra por linha: path:/pay bloqueia o pagamento; path:/action/discount/* bloqueia todas as ações de desconto; key: seguido de um identificador do relatório de utilização das teclas bloqueia essa tecla específica. As teclas continuam visíveis e explicam a sua recusa. Vazio: nenhum bloqueio adicional. A saída da formação continua acessível; as proibições de produzir operações reais continuam prioritárias (LC-13-05-04).
