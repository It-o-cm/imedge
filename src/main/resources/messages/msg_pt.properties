j.u-def-fiscal-archive-auto=Arquivos fiscais mensais automáticos
j.u-def-fiscal-archive-auto-aide=O nó da loja produz ele próprio, no início de cada mês, os arquivos fiscais do mês anterior TaxAuditExtracts_XXXXX_aaaammdd.zip (talões, linhas, pagamentos, IVA, devoluções, faturas, sessões, movimentos) e TaxAuditReports_XXXXX_aaaammdd.zip (volume de negócios diário, IVA por taxa, pagamentos por meio, sessões), à disposição do controlador de gestão no ecrã Arquivos fiscais. Desativado: os arquivos só são produzidos a pedido (BO-05-01-01).
j.u-def-fiscal-online-retention-years=Conservação online dos talões e faturas (anos)
j.u-def-fiscal-online-retention-years-aide=Duração durante a qual os talões, faturas, notas de crédito e documentos fiscais permanecem consultáveis, exportáveis e imprimíveis no ecrã Exportação das transações: nenhuma purga de retenção apaga uma venda ou fatura mais recente, qualquer que seja o prazo de retenção administrado por outro lado (BO-05-01-06).
j.u-def-fiscal-einvoicing-enabled=Faturação eletrónica (e-invoicing)
j.u-def-fiscal-einvoicing-enabled-aide=Cada fatura emitida pelas caixas a um cliente profissional sujeito a IVA em França (SIRET ou IVA FR) é convertida para o formato estruturado UN/CEFACT CII (perfil EN 16931) e depositada na plataforma de desmaterialização designada, com acompanhamento do seu ciclo de vida (depositada, rejeitada, disponibilizada, aprovada, recusada, cobrada…); a caixa imprime a menção de fatura eletrónica na fatura. Desativado: nenhuma fatura é transmitida (BO-05-01-02).
j.u-def-fiscal-einvoicing-mention=Menção de fatura eletrónica
j.u-def-fiscal-einvoicing-mention-aide=Texto que a caixa imprime no rodapé de cada fatura quando a faturação eletrónica está ativa (categoria da operação, transmissão por plataforma aprovada). Vazio: nenhuma menção (BO-05-01-02).
j.u-def-fiscal-pdp-provider=Plataforma de desmaterialização (código do fornecedor)
j.u-def-fiscal-pdp-provider-aide=Código do fornecedor de serviço do tipo Fiscal (ecrã Fornecedores de serviço) que funciona como plataforma de desmaterialização: o seu endereço e a sua chave servem para o depósito das faturas eletrónicas e a transmissão dos dados de e-reporting (BO-05-01-02, BO-05-01-03).
j.u-def-fiscal-ereporting-enabled=E-reporting das transações
j.u-def-fiscal-ereporting-enabled-aide=No fim de cada período, o nó da loja extrai as transações B2C e B2B internacionais consolidadas (vendas e devoluções, por dia e por taxa de IVA), coloca-as no formato de transmissão e transmite-as à plataforma de desmaterialização, acompanhando depois o aviso de receção; um envio falhado é repetido. Desativado: os períodos só são transmitidos a pedido (BO-05-01-03).
j.u-def-fiscal-ereporting-period=Periodicidade do e-reporting
j.u-def-fiscal-ereporting-period-aide=DECADE: uma transmissão por década (do dia 1 ao 10, do 11 ao 20, do 21 ao fim do mês); MONTH: uma transmissão por mês (BO-05-01-03).
j.u-def-fiscal-saft-realtime=SAF-T em tempo real
j.u-def-fiscal-saft-realtime-aide=Cada documento fiscal português enviado por uma caixa (FS, FT, NC, RC) é transmitido uma vez, de imediato, a cada fornecedor de serviço ativo de protocolo SAFT: no formato RegisterInvoice ao serviço da administração fiscal (tipo Fiscal) para as faturas e notas de crédito, no formato SAF-T (PT) aos outros; um envio falhado é repetido, e os dados permanecem consultáveis pela API /api/fiscal/saft/documents. Desativado: nenhum envio em tempo real (BO-05-01-05, BO-11-04-02).
j.u-def-fiscal-saft-deadline-day=SAF-T mensal: dia limite de extração
j.u-def-fiscal-saft-deadline-day-aide=Dia do mês antes do qual o ponto de venda extrai e transmite o ficheiro SAF-T do mês anterior; o ecrã Exportação SAF-T lembra-o e assinala o atraso, de 1 a 28 (BO-05-01-04).
j.u-def-fiscal-transmission-retry-seconds=Prazo entre duas tentativas de transmissão fiscal (segundos)
j.u-def-fiscal-transmission-retry-seconds-aide=Prazo antes de repetir um depósito de fatura eletrónica, uma transmissão de e-reporting ou um envio SAF-T falhados, de 10 a 86400 segundos (BO-05-01-02, BO-05-01-03, BO-05-01-05).
j.u-def-safe-pouch-requires-day-validation=Entrega ao cofre após validação do dia
j.u-def-safe-pouch-requires-day-validation-aide=Uma bolsa só é declarada depois de validado o dia contabilístico no ecrã Histórico dos dias: cada movimento dos operadores validado, depois o volume de negócios líquido do dia. Desativado: uma bolsa pode ser declarada a qualquer momento (BO-05-02-10).
j.u-def-safe-pouches-per-day=Número de bolsas por dia contabilístico
