j.code-de-l-attribut-article-servant-a=Código do atributo de artigo que serve para ordenar ou isolar as linhas do talão. Vazio: nenhuma ordenação por atributo (BO-03-03-18).
j.code-de-la-raison=Código do motivo
j.code-de-validation-attribue-par-l-administration=Código de validação atribuído pela Autoridade Tributária a cada série de documentos da caixa, na forma TIPO:CÓDIGO separados por pontos e vírgulas (ex. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). O ATCUD impresso é o código, um hífen e depois a posição do documento na sua série. Administrável por caixa, tendo cada caixa as suas próprias séries. Tipo sem código: ATCUD « 0-posição » (LC-08-04-23).
j.code-du-gabarit-imprime-quand-aucune-carte=Código do modelo impresso quando nenhum cartão foi apresentado e o programa respondeu, ou seja, para a projeção anónima. Vazio: a caixa imprime a sua zona integrada (BO-10-03-05).
j.code-du-gabarit-imprime-quand-aucune-carte-2=Código do modelo impresso quando nenhum cartão foi apresentado e o programa não respondeu. Vazio: a caixa imprime a sua zona integrada, limitada à mensagem da loja (BO-10-03-05, BO-10-03-13).
j.code-du-gabarit-imprime-quand-une-carte=Código do modelo impresso quando um cartão foi apresentado e o programa não respondeu. Vazio: a caixa imprime a sua zona integrada, cartão e mensagem offline (BO-10-03-05, BO-10-03-11).
j.code-du-gabarit-imprime-a-la-place=Código do modelo impresso em vez da zona de fidelização integrada quando um cartão foi apresentado e o programa respondeu. Vazio: a caixa imprime a sua zona integrada (BO-10-03-05, BO-10-03-12).
j.code-du-gabarit-imprime-a-la-place-2=Código do modelo impresso em vez do modelo de portador em linha quando o agrupamento das vantagens é CATEGORY. Vazio: aplica-se o modelo de portador em linha, com ou sem agrupamento (BO-10-03-21).
j.code-du-monnayeur-obligatoire=Código do moedeiro obrigatório.
j.code-du-type-de-reglement-associe-a=Código do tipo de pagamento associado a um cupão GS1 (AI 255). Vazio: nenhum cupão GS1 aceite como pagamento (LC-11-03-06).
j.code-famille=Código de família
