j.delai-maximal-d-attente-de-la-reponse=Tempo máximo de espera pela resposta do serviço de garantia de cheque, em milissegundos; além disso, o serviço é considerado inacessível e a autorização do supervisor assume (BO-03-02-24).
j.articles-de-consigne=Artigos com tara
j.codes-ean-des-articles-de-consigne=Códigos EAN dos artigos com tara (garrafa, grade, embalagem com tara), separados por ponto e vírgula. Uma linha de venda destes artigos alimenta o lado tara do mapa tara / devolução de tara, uma linha retomada o lado devolução. Vazio: só as devoluções de tara e os vales de devolução de tara alimentam o mapa (BO-03-13-11).

