j.moyen-de-reglement-inconnu=Meio de pagamento desconhecido.
j.moyen-de-reglement-supprime=Meio de pagamento eliminado.
j.moyens-de-paiement-d-un-mouvement=Meios de pagamento de um movimento
j.moyens-de-paiement-destination=Meios de pagamento de destino
j.moyens-de-paiement-proposes-pour-un-mouvement=Meios de pagamento propostos para um movimento de caixa (recolha/reforço de um cheque, de um vale de refeição...), separados por ponto e vírgula. Vazio: o movimento incide sempre sobre numerário (BO-03-02-20).
j.moyens-de-paiement-proposes-en-destination-d=Meios de pagamento propostos como DESTINO de um movimento financeiro, mesma sintaxe que a origem — exemplo CREDIT:Crédito cliente, serve nomeadamente para liquidar a dívida de um cliente com conta. Vazio: o movimento financeiro não é proposto (LC-12-06-01/02).
j.moyens-de-paiement-proposes-en-source-d=Meios de pagamento propostos como ORIGEM de um movimento financeiro — um montante recebido neste meio é devolvido noutro fora de uma venda, separados por ponto e vírgula, na forma CHAVE:DESCRIÇÃO — exemplo CASH:Numerário;CARD:Cartão bancário. Vazio: o movimento financeiro não é proposto (LC-12-06-01/02).
j.moyens-de-paiement-restreints-dont-l-assiette=Meios de pagamento restritos cuja base elegível é apresentada durante a venda, separados por ponto e vírgula, na forma CÓDIGO:ATRIBUTO:DESCRIÇÃO — atributos disponíveis: MEAL_VOUCHER_ELIGIBLE, ECO_VOUCHER_ELIGIBLE, SOCIAL_CARD_ELIGIBLE. Vazio: vale de refeição, eco-cheque e cartão de compras social (LC-09-01-11 a -18).
j.moyens-de-paiement-source=Meios de pagamento de origem
j.moyens-de-reglement-proposes-au-prelevement-manu=Meios de pagamento propostos para a recolha manual, separados por ponto e vírgula, na forma CHAVE:DESCRIÇÃO — exemplo CASH:Numerário;CHEQUE:Cheques. Um meio recolhido automaticamente não figura na lista e não é proposto na caixa (LC-12-03-02/03).
j.moyens-de-reglement-proposes-en-source-et=Meios de pagamento propostos como origem e destino de uma transferência de pagamento, mesma sintaxe que a recolha. Vazio: aplica-se a lista da recolha (LC-12-10-02).
j.moyens-de-reglement-prelevables-manuellement=Meios de pagamento recolhíveis manualmente
j.moyens-de-reglement-transferables=Meios de pagamento transferíveis
