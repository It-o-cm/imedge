# ---- lot 21: T ----
j.t21-parametre-1=Fluxo de integração: fluxos recolhidos
j.t21-parametre-2=Códigos dos fluxos que o nó de loja vai buscar, separados por « ; », ao endereço do prestador de serviço do tipo Serviço comercial em protocolo HTTP/JSON declarado no ecrã Prestadores de serviço: artigos PRODUCTS, famílias FAMILIES, clientes CUSTOMERS, IVA VAT_RATES, nomenclatura NOMENCLATURE=<esquema>. Cada fluxo é lido em GET em <endereço>/<código> com a chave do prestador e integrado como um depósito. Um ficheiro idêntico ao último integrado não é reprocessado. Vazio: nada é recolhido (BO-11-01-01).
j.t21-parametre-3=Fluxo de integração: frequência (minutos)
j.t21-parametre-4=Intervalo entre duas recolhas dos fluxos de integração, de 1 a 1440 minutos (BO-11-01-01).
j.t21-parametre-5=Ofertas reembolsadas pela central
j.t21-parametre-6=Inícios de rótulo de oferta do motor de promoções, separados por « ; », cujos descontos imediatos são reembolsados pela central: o seu montante, levado por cada linha descontada, alimenta a coluna REMISES_AMONT do fluxo VN por família e por ilha. Vazio: todos os descontos imediatos do motor são considerados reembolsados pela central (BO-11-01-08).
j.t21-parametre-9=Fluxo pagamentos GS1 e vales digitalizados
j.t21-parametre-10=Produz todos os dias o ficheiro dos códigos de pagamento lidos na caixa — vales GS1 (DataMatrix, QR, Databar), vales de compra, notas de crédito, cartões — com a sua caixa, o seu talão, o seu montante e o seu estado de consumo, e dos vales liquidados nos talões fechados (BO-11-01-18).
j.t21-parametre-11=Consumo centralizado dos vales
j.t21-parametre-12=Antes de aceitar um vale GS1, a caixa pergunta ao nó de loja se já foi liquidado num talão de uma caixa da loja; um vale já consumido é recusado. Desativado: só a venda em curso é controlada (BO-11-01-18).
j.t21-parametre-13=Gestão dos selos
j.t21-parametre-14=A caixa calcula o número teórico de selos de cada talão segundo a fórmula abaixo, imprime-o no talão e oferece o ecrã de declaração dos selos distribuídos pela operadora no seu turno (BO-11-01-20).
j.t21-parametre-15=Selos: escalão de compra (€)
j.t21-parametre-16=Montante de compra com IVA que dá direito a selos: o número teórico de um talão é o número de escalões completos deste montante multiplicado pelo número de selos por escalão. 0: nenhum selo teórico (BO-11-01-20).
j.t21-parametre-17=Selos por escalão
j.t21-parametre-18=Número de selos distribuídos por escalão de compra completo (BO-11-01-20).
j.t21-parametre-19=Fluxo selos teóricos e declarados
j.t21-parametre-20=Produz todos os dias, por caixa e por turno, o número de talões, de selos teóricos calculados segundo a fórmula administrada e de selos declarados pela operadora, e a sua diferença (BO-11-01-20).
j.t21-parametre-21=Exposição dos preços aos quiosques de preços
j.t21-parametre-22=O nó de loja responde aos quiosques de preços declarados no ecrã Prestadores de serviço (tipo Quiosque de preços) em GET /api/price-kiosk/<EAN>, com a chave do prestador no cabeçalho Authorization: Bearer: rótulo, preço com IVA, preço ao quilo ou ao litro. Desativado: qualquer pedido é recusado (BO-11-02-06).
j.t21-parametre-23=Formato de resposta dos quiosques de preços
j.t21-parametre-24=Formato esperado pelo protocolo do quiosque: JSON, XML ou TEXT (uma linha EAN|rótulo|preço). Qualquer outro valor: JSON (BO-11-02-06).
j.t21-parametre-25=Envio automático dos preços às etiquetas
j.t21-parametre-26=Cada preço criado, alterado ou que entra em vigor é enviado por si só a todos os fornecedores de etiquetas eletrónicas ativos do ponto de venda; na primeira passagem, partem todos os preços em vigor. Um fornecedor que não respondeu recebe na passagem seguinte tudo o que perdeu. Desativado: só se aplica o envio manual de uma lista de artigos (BO-11-03-05).
j.t21-parametre-27=Cadência de envio às etiquetas (segundos)
j.t21-parametre-28=Intervalo entre dois envios automáticos dos preços às etiquetas eletrónicas, de 10 a 86400 segundos (BO-11-03-05).
j.t21-parametre-29=Entradas e retiradas pelo moedeiro
j.t21-parametre-30=Uma entrada de trocos em numerário é depositada no moedeiro, que conta o que aceitou; uma retirada de numerário é entregue pelo moedeiro, que indica o que distribuiu; é o montante do moedeiro que é registado. O ecrã Moedeiro mostra o nível de numerário por valor facial. Desativado: entradas e retiradas contam-se à mão (BO-11-03-03).
j.t21-parametre-31=Endereço do servidor NEXO Retailer
j.t21-parametre-32=Endereço base do servidor dos produtos desmaterializados (cartões e caixas presente) que a caixa chama no protocolo NEXO Retailer, em <endereço>/api/nexo. Vazio: aplica-se a propriedade de implementação pos.nexo.hub-url (BO-11-03-04).
j.t21-parametre-33=Identificador POI NEXO
j.t21-parametre-34=Identificador POIID que a caixa endereça no servidor NEXO Retailer. Vazio: aplica-se a propriedade de implementação pos.nexo.poi-id (BO-11-03-04).
j.t21-parametre-35=Momento da troca NEXO na venda
j.t21-parametre-36=SCAN: o produto desmaterializado é ativado logo na sua venda, na leitura do seu código. PAYMENT: é ativado na entrada em pagamento, todos os produtos do talão em conjunto; um produto recusado sai do talão antes de qualquer pagamento (BO-11-03-04).
j.t21-parametre-37=Confirmação dos pagamentos com cartão pré-pago
j.t21-parametre-38=No fecho do talão, cada pagamento com cartão pré-pago validado pelo servidor NEXO Retailer é-lhe confirmado por uma mensagem Payment do tipo Completion. Desativado: só é pedida a validação do pagamento (BO-11-03-04).
j.t21-parametre-41=E-commerce: motor de valorização exposto
j.t21-parametre-42=A plataforma de e-commerce faz valorizar os seus cestos pelo motor de promoções do ponto de venda em POST /api/ecommerce/valuation, com o mesmo token do depósito das encomendas. Desativado: o pedido é recusado (BO-11-04-03).
j.t21-parametre-43=E-commerce: retorno do estado de integração
j.t21-parametre-44=O relatório de integração de cada encomenda de e-commerce — integrada, rejeitada, canal fechado —, com o número do ponto de venda, é devolvido aos prestadores de serviço do tipo E-commerce, reenviado até à sua confirmação. Desativado: a plataforma só lê o estado pedindo-o (BO-11-04-03).
j.t21-parametre-45=Chamada de fidelização VT síncrona
j.t21-parametre-46=No fim do talão, a caixa envia o cesto ao serviço de fidelização e espera a sua resposta (chamada VT), no prazo de resposta administrado. Um envio sem êxito é confiado ao reenvio GT. Desativado: o cesto parte em diferido pela fila de envio (BO-11-04-05).
j.t21-parametre-47=Dados de pagamento na chamada VT
j.t21-parametre-48=A chamada VT leva todos os pagamentos do talão: meio, montante, referência de autorização. Desativado: só leva o cesto valorizado (BO-11-04-05).
j.t21-parametre-49=Reenvio GT das transações sem êxito
