j.mot-de-passe-actuel-incorrect=Palavra-passe atual incorreta.
j.mot-de-passe-du-compte-ftp-des=Palavra-passe da conta FTP das balanças (BO-03-06-56).
j.mot-de-passe-modifie-reconnectez-vous=Palavra-passe alterada. Inicie sessão novamente.
j.motif-de-reconnaissance-en-expression-reguliere=Padrão de reconhecimento, em expressão regular, do código de barras de uma transação qbusting (cabaz constituído na fila de espera): lido na caixa, carrega o cabaz depositado no nó da loja. Vazio: nenhuma transação qbusting reconhecida (BO-03-06-57).
j.motifs-d-abandon=Motivos de abandono
j.motifs-de-demande-de-service=Motivos de pedido de serviço
j.motifs-de-depense=Motivos de despesa
j.motifs-de-redemarrage=Motivos de reinício
j.motifs-de-retour=Motivos de devolução
j.motifs-proposes-au-caissier-lors-d-un=Motivos propostos ao operador de caixa numa devolução, separados por ponto e vírgula. O motivo escolhido aplica-se a toda a devolução, é registado e impresso no talão de devolução (utilizável nos relatórios do BackOffice). Vazio: a introdução do motivo não é pedida (LC-05-05-01/02).
j.motifs-proposes-au-caissier-pour-abandonner-un=Motivos propostos ao operador de caixa para abandonar um talão, separados por ponto e vírgula. O motivo escolhido é registado e impresso no talão de abandono. Vazio: a introdução do motivo não é pedida (LC-04-04-10).
j.motifs-proposes-au-caissier-pour-une-depense=Motivos propostos ao operador de caixa para uma DESPESA paga pela gaveta, separados por ponto e vírgula; o motivo é obrigatório, um motivo em falta recusa a despesa. A lista já não mistura os motivos de recolha e de reforço, que têm os seus próprios ecrãs (BO-04-01-44).
j.motifs-proposes-a-l-ecran-d-appel=Motivos propostos no ecrã de chamada do supervisor, separados por ponto e vírgula — lista configurada em vez dos quatro botões fixos (EXP-84).
j.motifs-proposes-separes-par-des-points-virgules=Motivos propostos, separados por ponto e vírgula. Vazio: motivos traduzidos fornecidos pela caixa (LC-13-03-04).
j.mouvement-corrige=Movimento corrigido.
