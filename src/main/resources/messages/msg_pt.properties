j.k19-def-ticket-header-template-label=Modelo de cabeçalho do talão
j.k19-def-ticket-header-template-hint=Código do modelo Cabeçalho de talão impresso no topo dos talões desta caixa, escolhido entre os modelos administrados. Vazio ou código desconhecido: o primeiro modelo de cabeçalho ativo, senão a mensagem de cabeçalho (BO-03-09-02).
j.k19-def-ticket-footer-template-label=Modelo de rodapé do talão
j.k19-def-ticket-footer-template-hint=Código do modelo Rodapé de talão impresso no fundo dos talões desta caixa, escolhido entre os modelos administrados. Vazio ou código desconhecido: o primeiro modelo de rodapé ativo, senão a mensagem de rodapé (BO-03-09-02).
j.k19-def-ticket-vat-table-label=Quadro de IVA do talão
j.k19-def-ticket-vat-table-hint=Modelo do quadro de IVA impresso no talão: NONE (nenhum), COMBINED (combinado com o talão, sob o total), SEPARATE (separado, num talão à parte após o talão) ou AMOUNT_ONLY (apenas o montante do IVA). Vazio: decide a discriminação do IVA do talão (BO-03-09-03).
j.k19-def-print-logo-code-label=Logótipo impresso
j.k19-def-print-logo-code-hint=Código do logótipo de talão impresso no topo dos documentos desta caixa, escolhido entre os logótipos importados na biblioteca de imagens. Vazio ou código desconhecido: o logótipo resolvido para a loja (BO-03-09-04).
j.k19-def-menu-code-label=Menu da caixa
j.k19-def-menu-code-hint=Código do menu da caixa apresentado pela caixa, escolhido entre os menus administrados. Colocado na ilha, vale para as suas caixas; colocado na caixa, prevalece sobre o da ilha; colocado no país ou na insígnia, torna-se o menu por omissão. Vazio: todas as teclas (BO-03-09-06, BO-03-10-09, BO-03-10-16, BO-03-10-18).
j.k19-def-queue-single-enabled-label=Fila única ativa
j.k19-def-queue-single-enabled-hint=A caixa apresenta a tecla FILA ÚNICA, que permite à operadora declarar ao sistema terceiro de fila única que a caixa está disponível para o cliente seguinte ou indisponível. Desativado: nem tecla nem envio (BO-03-09-10).
j.k19-def-queue-single-url-label=Endereço do sistema de fila única
j.k19-def-queue-single-url-hint=URL onde a caixa publica o seu estado de disponibilidade: POST de um corpo JSON com o terminal e o estado AVAILABLE ou UNAVAILABLE. Vazio: o estado não é publicado (BO-03-09-10).
j.k19-def-hardware-drawer-enabled-label=Gaveta ativa
j.k19-def-hardware-drawer-enabled-hint=O controlador da gaveta está ativo nesta caixa: impulsos de abertura e leitura do sensor. Desativado: nenhum impulso é enviado e a gaveta é considerada fechada (BO-03-09-11).
j.k19-def-hardware-drawer-address-label=Endereço da gaveta
j.k19-def-hardware-drawer-address-hint=Endereço do controlador da gaveta transmitido ao módulo de hardware: porta de entrada-saída (por exemplo 0x48F), porta série (por exemplo /dev/ttyS0) ou PRINTER para uma gaveta ligada à impressora. Vazio: o endereço de arranque do módulo (BO-03-09-11).
j.k19-def-hardware-scanner-driver-label=Controlador do scanner
j.k19-def-hardware-scanner-driver-hint=Controlador de leitura do scanner: AUTO (deteção automática), EVDEV (teclado HID), HIDRAW (HID POS) ou OPOS (controlador OPOS Datalogic, mantido pelo módulo de hardware). Um valor desconhecido volta a AUTO (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-name-patterns-label=Scanners reconhecidos
j.k19-def-hardware-scanner-name-patterns-hint=Fragmentos do nome dos periféricos reconhecidos como scanner, separados por pontos e vírgulas, por exemplo datalogic;honeywell. Vazio: a lista de implementação da caixa (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-opos-device-label=Periférico OPOS do scanner
j.k19-def-hardware-scanner-opos-device-hint=Nome lógico OPOS do scanner Datalogic transmitido ao módulo de hardware quando o controlador é OPOS, por exemplo DLS_Magellan. Vazio: o periférico por omissão do controlador (BO-03-09-17).
j.k19-def-hardware-scanner2-enabled-label=Segundo scanner ativo
j.k19-def-hardware-scanner2-enabled-hint=Um segundo scanner, do lado do cliente, lê ao mesmo tempo que o primeiro os cartões de fidelização e os cupões: as suas leituras vão para a fidelização e os vales, nunca para os artigos. Desativado: todos os scanners alimentam a venda (BO-03-09-18).
j.k19-def-hardware-scanner2-name-patterns-label=Segundo scanner: periféricos
j.k19-def-hardware-scanner2-name-patterns-hint=Fragmentos do nome dos periféricos que formam o segundo scanner, separados por pontos e vírgulas, por exemplo zebra;client. Vazio: nenhum periférico é designado e o segundo scanner fica mudo (BO-03-09-18).
j.k19-def-hardware-printer-type-label=Tipo de impressora
j.k19-def-hardware-printer-type-hint=Modelo da impressora de talões transmitido ao controlador: ESCPOS (genérico), EPSON_TM, WINCOR_TH, IBM_4610 ou TOSHIBA_TCX. Um valor desconhecido volta a ESCPOS (BO-03-09-21).
j.k19-def-hardware-printer-speed-label=Velocidade da impressora (bauds)
j.k19-def-hardware-printer-speed-hint=Velocidade de comunicação da impressora de talões transmitida ao controlador, em bauds (9600, 19200, 38400, 115200). 0 ou valor negativo: a velocidade do controlador (BO-03-09-21).
j.k19-def-hardware-printer-code-page-label=Página de codificação da impressora
j.k19-def-hardware-printer-code-page-hint=Página de código dos caracteres da impressora de talões, por exemplo 858 (Europa Ocidental com o euro), 850 ou 1252. 0 ou valor negativo: 858 (BO-03-09-21).
j.k19-def-hardware-printer-paper-width-label=Largura do papel (mm)
j.k19-def-hardware-printer-paper-width-hint=Tamanho de página da impressora de talões: 80 ou 58 milímetros. Qualquer outro valor: 80 (BO-03-09-21).
j.k19-def-hardware-printer-cheque-flip-label=Inversão do cheque
j.k19-def-hardware-printer-cheque-flip-hint=A impressora vira o cheque para imprimir a frente depois da leitura da linha magnética. Desativado: o cheque não é virado (BO-03-09-21).
j.k19-def-printer2-enabled-label=Segunda impressora ativa
j.k19-def-printer2-enabled-hint=É proposta à operadora uma segunda impressora para imprimir um documento fora do rolo da caixa. Desativado: servem apenas o rolo e a impressora de rede da implementação (BO-03-09-22).
j.k19-def-printer2-format-label=Formato da segunda impressora
j.k19-def-printer2-format-hint=Formato dos documentos saídos na segunda impressora: A4 (página A4) ou TICKET (texto do rolo). Um valor desconhecido volta a A4 (BO-03-09-22).
j.k19-def-printer2-connection-label=Ligação da segunda impressora
j.k19-def-printer2-connection-hint=NETWORK (impressora de rede, o endereço é um URL) ou LOCAL (impressora ligada à caixa e mantida pelo módulo de hardware, o endereço é o nome da fila de impressão). Um valor desconhecido volta a NETWORK (BO-03-09-22).
j.k19-def-printer2-address-label=Endereço da segunda impressora
j.k19-def-printer2-address-hint=URL do serviço de impressão de rede, ou nome da fila de impressão local. Vazio: a segunda impressora não é utilizável (BO-03-09-22).
j.k19-def-payment-terminal-type-label=Tipo de monética
j.k19-def-payment-terminal-type-hint=Monética desta caixa: VERIFONE (monética centralizada), INGENICO_SIBS (Ingenico, Portugal, SIBS) ou WORLDLINE (Bélgica). Vazio: a monética da implementação. Tida em conta no arranque da caixa (BO-03-09-19).
j.k19-def-payment-terminal-address-label=Endereço da monética
j.k19-def-payment-terminal-address-hint=Endereço anfitrião:porta do cliente de monética desta caixa, por exemplo 127.0.0.1:8200. Vazio: o endereço da implementação (BO-03-09-19).
j.k19-def-terminal-island-label-label=Etiqueta de monética da ilha
j.k19-def-terminal-island-label-hint=Etiqueta da ilha transmitida nos pedidos da monética centralizada Verifone sob a tag D7V; coloca-se na ilha e vale para todas as suas caixas. Vazio: nenhuma tag D7V (BO-03-09-29).
j.k19-def-catalina-enabled-label=Fluxo Catalina ativo
j.k19-def-catalina-enabled-hint=Os talões de venda desta caixa, linhas de artigos e meios de pagamento, sobem em tempo real ao servidor Catalina declarado entre os fornecedores de serviço (protocolo Catalina). Desativado: nada é enviado à Catalina (BO-03-09-20).
j.k19-def-export-planexa-enabled-label=Fluxo Planexa
j.k19-def-export-planexa-enabled-hint=A loja produz o ficheiro Planexa das transações por caixa e por faixa horária, base do planeamento das operadoras; as caixas das ilhas excluídas do fluxo Planexa não figuram nele (BO-03-10-06).
j.k19-section-menu-caisse=MENU DA CAIXA
j.k19-section-file-unique=FILA ÚNICA

