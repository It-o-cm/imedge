j.un-nif-saisi-ou-scanne-qui-n=Um NIF introduzido ou lido composto apenas por algarismos, precedidos ou não de PT, deve ter 9 algarismos, começar por um prefixo legal e ter o dígito de controlo correto (módulo 11); caso contrário é recusado. Um NIF estrangeiro, que contém letras, não é controlado (LC-08-06-04).
j.un-article-peut-etre-repris-sans-que=Um artigo pode ser retomado sem que o seu talão de origem seja identificado: os artigos são introduzidos livremente e o seu preço continua modificável. Desativado: qualquer devolução passa pela recuperação do talão de origem (LC-05-02-09/14).
j.un-article-scanne-alors-qu-un-reglement=Um artigo lido enquanto um pagamento está em curso é registado na venda. Desativado — o predefinido — é recusado e o operador de caixa é avisado: um cabaz que cresce enquanto se cobra é um cabaz cujo total já não é válido (BO-10-02-15).
j.un-article-scanne-que-le-referentiel-ne=Um artigo lido que o ficheiro de referência não conhece envia um pedido de serviço para o painel, tal como uma chamada de supervisor. Desativado — o predefinido — o artigo desconhecido só pode ser consultado posteriormente no registo (BO-04-02-06).
