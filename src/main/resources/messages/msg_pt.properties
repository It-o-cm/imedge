j.un-article-scanne-a-nouveau-s-ajoute=Um artigo lido de novo soma-se à quantidade da sua linha em vez de abrir mais uma linha, desde que a linha não tenha preço modificado nem subtotal depois dela. Desativado: cada artigo é uma linha. As pesagens continuam a ser uma linha cada (BO-10-08-32).
j.une-mise-a-jour-des-articles-prix=Uma atualização de artigos, preços, famílias, IVA, gamas de códigos, tipos de vales ou fluxos do motor de promoções que chegue durante uma venda é adiada até a caixa estar livre: o cesto em curso mantém os preços e promoções com que foi iniciado. Desativado: a atualização aplica-se de imediato (BO-10-08-25).
