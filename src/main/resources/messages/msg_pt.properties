j.regle-appliquee-quand-un-montant-calcule-en=Regra aplicada quando um montante calculado na caixa é reduzido a duas casas decimais — total de linha, repartição do IVA, valores sem imposto das faturas: HALF_UP (ao mais próximo, a metade para cima, por defeito), HALF_EVEN (ao mais próximo, a metade para o par), HALF_DOWN (ao mais próximo, a metade para baixo), UP (sempre para cima), DOWN (sempre para baixo). Um valor desconhecido volta a HALF_UP (BO-10-02-18).
