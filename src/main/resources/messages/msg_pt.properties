j.le-point-de-vente-integre-les-commandes=O ponto de venda integra as encomendas de e-commerce validadas: o nó da loja aceita-as, regista-as como transações da loja e a caixa retoma os cestos de e-commerce. Desativado: qualquer encomenda de e-commerce é recusada (BO-10-01-01).
j.e-commerce-prix-des-articles=E-commerce: preço dos artigos
j.prix-retenu-pour-les-articles-d-un=Preço aplicado aos artigos de um cesto de e-commerce: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço da transação) ou TRANSACTION (o preço da transação). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-07).
j.e-commerce-articles-en-vente-interdite=E-commerce: artigos de venda proibida
j.integration-d-une-commande-e-commerce-portant=Integração de uma encomenda de e-commerce com um artigo de venda proibida: ACCEPT (integrada, o artigo assinalado no relatório) ou REJECT (recusada na totalidade, nada é registado; o relatório indica o artigo) (BO-10-01-14).
j.e-commerce-ean-generique-des-articles-inconnus=E-commerce: EAN genérico dos artigos desconhecidos
j.ean-qui-porte-sans-bloquer-l-integration=EAN que transporta, sem bloquear a integração, um artigo de uma encomenda de e-commerce que a base do ponto de venda não conhece: a linha mantém a sua designação, marcada « ART. INCONNU » com o código de origem, no talão e no relatório de integração. Vazio: a linha mantém o seu próprio código, e o relatório assinala-a sempre (BO-10-01-06).
j.e-commerce-canal-promotion=E-commerce: canal de promoção
j.canal-transmis-au-moteur-de-promotion-avantage=Canal transmitido ao motor de promoções (vantagem cartão e desconto imediato) para os cestos de e-commerce retomados na caixa: POINT_OF_SALE (ponto de venda), WEB ou OTHER (outro). Vazio: nenhum canal é transmitido e o pedido fica idêntico ao byte (BO-10-01-13).
j.e-commerce-ilot-de-rattachement=E-commerce: ilha de ligação
j.code-de-l-ilot-auquel-la-caisse=Código da ilha à qual a caixa virtual de e-commerce está ligada: o volume de negócios das transações de e-commerce é-lhe afetado e as suas regras (fluxos, mapas por ilha) aplicam-se. Vazio: a caixa virtual não pertence a nenhuma ilha (BO-10-01-08).
j.e-commerce-caisse-virtuelle=E-commerce: caixa virtual
j.identifiant-de-la-caisse-virtuelle-sur-laquelle=Identificador da caixa virtual na qual o nó da loja regista as transações de e-commerce integradas; o número do talão é este identificador seguido da referência da encomenda (BO-10-01-08).
j.e-commerce-operateur-d-integration=E-commerce: operador de integração
j.identifiant-de-l-employe-au-nom-duquel=Login do funcionário em nome do qual as transações de e-commerce são registadas no sistema de caixa; um login desconhecido faz rejeitar a integração, com o motivo no relatório (BO-10-01-03).
j.e-commerce-moyen-de-paiement-par-defaut=E-commerce: meio de pagamento por defeito
j.code-du-moyen-de-paiement-cash-card=Código do meio de pagamento (CASH, CARD, CHEQUE, TR, VOUCHER…) com o qual é integrada uma encomenda de e-commerce paga com um meio desconhecido do sistema de caixa; o relatório assinala a substituição (BO-10-01-09).
j.e-commerce-archivage-des-commandes-d-origine=E-commerce: arquivo das encomendas de origem
j.la-commande-e-commerce-telle-que-la=A encomenda de e-commerce tal como a plataforma a enviou é arquivada com o seu relatório, para a análise de suporte (ecrã Encomendas e-commerce). Desativado: só o relatório é conservado (BO-10-01-11).
j.e-commerce-duree-d-archivage-jours=E-commerce: duração do arquivo (dias)
j.au-dela-de-ce-nombre-de-jours=Para além deste número de dias, a limpeza de fim de período elimina as encomendas de e-commerce arquivadas. 0: conservadas sem limite (BO-10-01-11).
j.e-commerce-types-de-retour-ticket-autorises=E-commerce: tipos de devolução de talão autorizados
j.types-de-retour-libelles-de-la-liste=Tipos de devolução (designações da lista de tipos de devolução, separadas por « ; ») autorizados para a devolução do talão inteiro de uma transação de e-commerce; outro tipo, ou nenhum tipo, é recusado. Vazio: qualquer devolução é autorizada (BO-10-01-04).
j.e-commerce-types-de-retour-article-autorises=E-commerce: tipos de devolução de artigo autorizados
j.types-de-retour-libelles-separes-par-autorises=Tipos de devolução (designações separadas por « ; ») autorizados para a devolução de uma parte dos artigos de uma transação de e-commerce; outro tipo, ou nenhum tipo, é recusado. Vazio: qualquer devolução é autorizada (BO-10-01-05).
j.selfscanning-activation=Selfscanning: ativação
j.le-self-scanning-est-ouvert-sur-ce=O selfscanning está aberto neste ponto de venda: a caixa recupera e controla os cestos dos aparelhos de selfscanning. Desativado: qualquer cesto de selfscanning é recusado com uma mensagem (BO-10-01-15).
j.selfscanning-mode-de-recuperation=Selfscanning: modo de recuperação
j.comment-la-caisse-recupere-un-panier-selfscanning=Como a caixa recupera um cesto de selfscanning: SCAN (leitura do código de barras), KEYED (introdução do código no ecrã CHAMADA) ou BOTH (ambos) (BO-10-01-16).
j.selfscanning-ajout-d-articles-en-caisse=Selfscanning: adição de artigos na caixa
j.quand-le-caissier-peut-saisir-des-articles=Quando o operador pode registar artigos em torno da recuperação de um cesto de selfscanning: BEFORE (apenas antes), AFTER (apenas depois), BOTH (antes e depois) ou NONE (nem antes nem depois) (BO-10-01-17).
j.selfscanning-identifiant-de-reprise=Selfscanning: identificador de retoma
j.ce-qui-identifie-le-panier-selfscanning-a=O que identifica o cesto de selfscanning a retomar: TRANSACTION (o código de barras da transação) ou CUSTOMER (o número de cliente, introduzido no ecrã CHAMADA: a caixa retoma o último cesto desse cliente) (BO-10-01-18).
j.selfscanning-prix-des-articles=Selfscanning: preço dos artigos
j.prix-retenu-pour-les-articles-d-un-panier=Preço aplicado aos artigos de um cesto de selfscanning: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço da transação) ou TRANSACTION (o preço da transação). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-19).
j.selfscanning-coupons-du-panier=Selfscanning: cupões do cesto
j.les-coupons-et-bons-d-achat-scannes=Os cupões e vales de compra digitalizados num cesto de selfscanning são aceites e retomados na caixa como pagamentos. Desativado: não são retomados e a caixa assinala-o (BO-10-01-20).
j.selfscanning-ean-generique-des-articles-inconnus=Selfscanning: EAN genérico dos artigos desconhecidos
j.ean-qui-porte-sans-bloquer-la-reprise=EAN que transporta, sem bloquear a retoma, um artigo de um cesto de selfscanning que a base do ponto de venda não conhece: a linha mantém a sua designação, marcada « ART. INCONNU » com o código de origem, no ecrã e no talão. Vazio: a linha mantém o seu próprio código, sem marca (BO-10-01-21).
j.selfscanning-canal-promotion=Selfscanning: canal de promoção
j.canal-transmis-au-moteur-de-promotion-avantage-carte=Canal transmitido ao motor de promoções (vantagem cartão e desconto imediato) para os cestos de selfscanning: POINT_OF_SALE (ponto de venda), WEB ou OTHER (outro). Vazio: nenhum canal é transmitido e o pedido fica idêntico ao byte (BO-10-01-22).
j.selfscanning-articles-en-vente-interdite=Selfscanning: artigos de venda proibida
j.integration-d-un-panier-selfscanning-portant-un=Integração de um cesto de selfscanning com um artigo de venda proibida: ACCEPT (integrado como os outros) ou REJECT (recusado na totalidade; a caixa mostra a designação, o código e a mensagem do artigo e não carrega nada) (BO-10-01-23).
j.gestion-commerciale-articles-en-vente-interdite=Gestão comercial: artigos de venda proibida
j.integration-d-une-commande-d-un-devis=Integração de uma encomenda, orçamento ou talão de venda da gestão comercial com um artigo de venda proibida: ACCEPT (integrado como os outros) ou REJECT (recusado na totalidade; a caixa mostra a designação, o código e a mensagem do artigo e não carrega nada) (BO-10-01-24).
j.gestion-commerciale-mode-de-recuperation=Gestão comercial: modo de recuperação
j.comment-la-caisse-recupere-une-commande-ou=Como a caixa recupera uma encomenda ou orçamento da gestão comercial: SCAN (leitura do código de barras), KEYED (introdução do código no ecrã CHAMADA) ou BOTH (ambos) (BO-10-01-25).
j.gestion-commerciale-transmission-des-commandes=Gestão comercial: transmissão das encomendas
j.sens-et-mecanisme-d-echange-des-commandes=Sentido e mecanismo de troca das encomendas e orçamentos: PUSH (a gestão comercial deposita-os no nó da loja, POST /api/orders) ou PULL (o nó da loja vai buscá-los ao endereço e com a frequência abaixo) (BO-10-01-25).
j.gestion-commerciale-adresse-de-tirage=Gestão comercial: endereço de recolha
j.adresse-http-que-le-n-ud-magasin=Endereço HTTP que o nó da loja consulta em modo PULL; responde com a lista JSON dos documentos no formato do depósito. Vazio: nenhuma recolha (BO-10-01-25).
j.gestion-commerciale-frequence-de-tirage-minutes=Gestão comercial: frequência de recolha (minutos)
j.intervalle-entre-deux-tirages-des-commandes-en=Intervalo entre duas recolhas das encomendas em modo PULL; 0 vale um minuto (BO-10-01-25).
j.gestion-commerciale-document-imprime-a-l-encaissement=Gestão comercial: documento impresso no pagamento
j.code-du-modele-de-document-ecran-modeles=Código do modelo de documento (ecrã Modelos de documentos) impresso automaticamente após o pagamento de uma encomenda ou orçamento da gestão comercial. Vazio: nenhum documento adicional (BO-10-01-26).
j.gestion-commerciale-moyen-de-paiement-des-acomptes=Gestão comercial: meio de pagamento dos sinais
j.code-du-moyen-de-paiement-cash-card-cheque=Código do meio de pagamento (CASH, CARD, CHEQUE…) com o qual o sinal recebido na caixa sobre uma encomenda ou orçamento é registado; só um sinal em numerário entra na gaveta. Vazio: numerário (BO-10-01-27).
j.gestion-commerciale-canal-promotion=Gestão comercial: canal de promoção
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et=Canal transmitido ao motor de promoções (vantagem cartão e desconto imediato) para as encomendas, orçamentos e talões de venda da gestão comercial: POINT_OF_SALE (ponto de venda), WEB ou OTHER (outro). Vazio: nenhum canal é transmitido e o pedido fica idêntico ao byte (BO-10-01-28).
j.gestion-commerciale-prix-des-articles=Gestão comercial: preço dos artigos
j.prix-retenu-pour-les-articles-d-une=Preço aplicado aos artigos de uma encomenda ou orçamento da gestão comercial: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço da encomenda) ou TRANSACTION (o preço da encomenda). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-29).
j.qbusting-mode-de-recuperation=Qbusting: modo de recuperação
j.comment-la-caisse-recupere-un-panier-qbusting=Como a caixa recupera um cesto de qbusting: SCAN (leitura do código de barras), KEYED (introdução do código no ecrã CHAMADA) ou BOTH (ambos) (BO-10-01-30).
j.qbusting-canal-promotion=Qbusting: canal de promoção
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise=Canal transmitido ao motor de promoções (vantagem cartão e desconto imediato) para os cestos de qbusting: POINT_OF_SALE (ponto de venda), WEB ou OTHER (outro). Vazio: nenhum canal é transmitido e o pedido fica idêntico ao byte (BO-10-01-31).
j.qbusting-articles-en-vente-interdite=Qbusting: artigos de venda proibida
j.integration-d-une-transaction-qbusting-portant-un=Integração de uma transação de qbusting com um artigo de venda proibida: ACCEPT (integrado como os outros) ou REJECT (recusado na totalidade; a caixa mostra a designação, o código e a mensagem do artigo e não carrega nada) (BO-10-01-32).
j.qbusting-prix-des-articles=Qbusting: preço dos artigos
j.prix-retenu-pour-les-articles-d-un-panier-qbusting=Preço aplicado aos artigos de um cesto de qbusting: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço da transação) ou TRANSACTION (o preço da transação). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-33).
j.mobilite-canal-promotion=Mobilidade: canal de promoção
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise-immediate=Canal transmitido ao motor de promoções (vantagem cartão e desconto imediato) para as transações de mobilidade: POINT_OF_SALE (ponto de venda), WEB ou OTHER (outro). Vazio: nenhum canal é transmitido e o pedido fica idêntico ao byte (BO-10-01-34).
j.mobilite-prix-des-articles=Mobilidade: preço dos artigos
j.prix-retenu-pour-les-articles-d-un-panier-mobilite=Preço aplicado aos artigos de um cesto de mobilidade: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço da transação) ou TRANSACTION (o preço da transação). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-36).
j.mobilite-articles-en-vente-interdite=Mobilidade: artigos de venda proibida
j.integration-d-une-transaction-mobilite-portant-un=Integração de uma transação de mobilidade com um artigo de venda proibida: ACCEPT (integrado como os outros) ou REJECT (recusado na totalidade; a caixa mostra a designação, o código e a mensagem do artigo e não carrega nada) (BO-10-01-37).
j.mobilite-moyen-de-paiement-complementaire=Mobilidade: meio de pagamento complementar
j.code-du-moyen-de-paiement-ajoute-a=Código do meio de pagamento acrescentado na integração de uma transação de mobilidade cujo total pago é inferior ao total do talão (promoção ativada na mobilidade mas não no pagamento), pela diferença. Vazio: a diferença continua devida na caixa (BO-10-01-39).
j.bon-de-vente-mode-de-recuperation=Talão de venda: modo de recuperação
j.comment-la-caisse-recupere-un-bon-de=Como a caixa recupera um talão de venda — válido apenas no próprio dia, sendo o número reiniciado diariamente: SCAN (leitura do código de barras), KEYED (introdução do código no ecrã CHAMADA) ou BOTH (ambos) (BO-10-01-40).
j.bon-de-vente-prix-des-articles=Talão de venda: preço dos artigos
j.prix-retenu-pour-les-articles-d-un-bon=Preço aplicado aos artigos de um talão de venda: POS (o preço atual da base do ponto de venda; um artigo desconhecido mantém o preço do talão de venda) ou TRANSACTION (o preço do talão de venda). Vazio: aplica-se a regra dos documentos recuperados (BO-10-01-41).

