j.codes-de-validation-atcud-des-series=Códigos de validação ATCUD das séries
j.codes-des-devis-commandes-et-bons-de=Códigos dos orçamentos, encomendas e notas de venda externos
j.codes-des-paniers-selfscanning=Códigos dos cestos de selfscanning
j.codes-des-etats-edites-automatiquement-a-la=Códigos dos relatórios emitidos automaticamente no fim do período, separados por pontos e vírgulas e pela ordem de emissão. Um código desconhecido é ignorado. Vazio: nenhuma emissão automática (BO-09-01-10, BO-09-01-11).
j.codes-pays-iso-separes-par-une-virgule=Códigos de país ISO separados por vírgula, propostos na caixa para a introdução de um NIF estrangeiro. O NIF português obedece ao seu próprio algoritmo e não está nesta lista (BO-10-04-17).
j.colonnes-de-la-grille-articles=Colunas da grelha de artigos
j.combien-d-articles-du-plus-cher-au=Quantos artigos, do mais caro ao menos caro, são indicados no talão de saída. Fora do intervalo de 1 a 20, o valor recorre a 3 (BO-03-03-36).
j.combien-de-minutes-avant-la-fin-de=Quantos minutos antes do fecho de período o back-office começa a anunciar a contagem decrescente e os seus alertas — caixas abertas, caixas desligadas, talões em espera. 0 ou menos: sessenta minutos (BO-09-01-04, BO-09-02-02).
