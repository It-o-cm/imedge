j.prelevement-et-transfert=RECOLHA E TRANSFERÊNCIA
j.purge-a-la-cloture=LIMPEZA NO FECHO
j.paiement-partiel-en-credit-client=Pagamento parcial com crédito cliente
j.palier-du-don-centimes=Escalão do donativo (cêntimos)
j.palier-propose-pour-le-don-5-10=Escalão proposto para o donativo: 5, 10, 100 cêntimos, por exemplo (LC-07-17-02).
j.panels-marketing-scan=Painéis de marketing (leitura)
j.par-caissiere=Por operadora de caixa
