j.plafond-de-contenu-du-tiroir=Limite do conteúdo da gaveta (€)
j.plafond-de-remise-ligne=Limite do desconto de linha (€)
j.plafond-de-remise-ticket=Limite do desconto de talão (€)
j.plafond-du-cashback=Limite do cashback (€)
j.plage-article-creee=Intervalo de artigos criado.
j.plage-article-enregistree=Intervalo de artigos guardado.
j.plage-article-inconnue=Intervalo de artigos desconhecido.
j.plage-article-supprimee=Intervalo de artigos eliminado.
j.plage-creee=Intervalo criado.
j.plage-d-identifiants-modifiable-par-le-point=Intervalo de identificadores modificável pelo ponto de venda
j.plage-de-dates=Intervalo de datas
j.plage-de-numeros-que-la-caisse-attribue=Intervalo de números que a caixa atribui aos clientes que cria, na forma PREFIXO:PRIMEIRO-ÚLTIMO (ex. CLI:500000-599999). O prefixo e os limites são os que a central reserva ao ponto de venda, para que um cliente criado na caixa nunca colida com um cliente integrado. Vazio: numeração por caixa CAISSE-CLInnnnnn, a anterior a este parâmetro (BO-03-06-53).
j.plage-des-cartes-de-fidelite=Intervalo dos cartões de fidelização
j.plage-des-codes-clients-attribues-en-caisse=Intervalo dos códigos de cliente atribuídos na caixa
j.plage-des-numeros-de-compte-client=Intervalo dos números de conta de cliente
j.plage-des-transactions-qbusting=Intervalo das transações qbusting
j.plage-enregistree=Intervalo guardado.
j.plage-inconnue=Intervalo desconhecido.
j.planification-annulee=Agendamento cancelado.
j.planification-introuvable-ou-deja-executee=Agendamento não encontrado ou já executado.
j.plusieurs-cartes-de-fidelite-peuvent-etre-scanne=Podem ser lidos vários cartões de fidelização durante a transação, só o último é considerado. Desativado: um cartão já lido bloqueia os seguintes (BO-10-03-02).
j.pochette-remise-au-coffre=Bolsa entregue no cofre.
j.point-de-caisse-cree=Ponto de caixa criado.
j.point-de-caisse-enregistre=Ponto de caixa guardado.
j.point-de-caisse-inconnu=Ponto de caixa desconhecido.
j.point-de-caisse-supprime=Ponto de caixa eliminado.
j.point-de-vente-enregistre=Ponto de venda guardado.
j.point-de-vente-inconnu=Ponto de venda desconhecido:
j.population-inconnue=População desconhecida.
j.port-ftp-des-balances=Porta FTP das balanças
j.port-du-serveur-ftp-des-balances-bo=Porta do servidor FTP das balanças (BO-03-06-56).
j.porte-d-entree-du-back-office-a=Porta de entrada do back-office neste nível: ANY (palavra-passe ou SSO do grupo, predefinição), PASSWORD (só palavra-passe) ou SSO (só SSO: nenhuma palavra-passe local abre o back-office). Acresce ao modo de início de sessão de cada conta; um valor desconhecido volta a ANY (BO-01-02-01, BO-01-02-09).
j.portugal-fatura-ft=Portugal — Fatura (FT)
j.portugal-fatura-simplificada-fs=Portugal — Fatura simplificada (FS)
j.portugal-nota-de-credito-nc=Portugal — Nota de crédito (NC)
j.portugal-recibo-rc=Portugal — Recibo (RC)
j.portee-de-l-aval-superviseur=Alcance da aprovação do supervisor
j.position-du-symbole-monetaire=Posição do símbolo monetário
j.pourcentage-des-paniers-selfscanning-tires-au-so=Percentagem dos cabazes selfscanning sorteados para um controlo parcial na sua recuperação na caixa, para além daqueles para os quais o próprio aparelho pede um controlo. 0: só os controlos pedidos pelo aparelho (LC-06-05-04).
j.pourcentage-maximal-d-un-discount-de-ligne=Percentagem máxima de uma redução de linha (LC-03-02-07).
j.pourcentage-maximal-d-une-remise-ticket-lc=Percentagem máxima de um desconto de talão (LC-03-02-13).
j.pousse-chaque-ticket-retour-et-ticket-monetique=Envia cada talão, devolução e talão de pagamento eletrónico aos prestadores de serviço subscritos logo após a consolidação. Desativado: nada é colocado em fila, e a fila existente deixa de ser processada (BO-11-02-02/03/04).
j.prise-de-poste-au-scan-du-badge=Início de turno ao ler o crachá
j.prix-applique-aux-articles-d-un-devis=Preço aplicado aos artigos de um orçamento, de uma encomenda ou de um vale de venda recuperado na caixa: DOCUMENT (o preço indicado no documento, predefinição) ou CAISSE (o preço atual do artigo na base da caixa; um artigo desconhecido da caixa mantém o preço do documento). Um valor desconhecido volta a DOCUMENT (LC-06-02-08, LC-06-02-12).
j.prix-au-detail=Preço de retalho
j.prix-des-articles-d-un-document-rappele=Preço dos artigos de um documento recuperado
j.prix-du-ticket-comptoir-celui-du-comptoir=Preço do talão de balcão: o do balcão
j.prix-force=Preço forçado
j.prix-a-saisir-en-caisse=Preço a introduzir na caixa
j.productivite-des-caisses=Produtividade das caixas
j.produit-dematerialise-code-d-activation-a-scanne=Produto desmaterializado: código de ativação a ler
j.produit-la-ventilation-par-taux-de-tva=Produz a discriminação por taxa de IVA dos montantes das encomendas do dia contabilístico (BO-11-01-23).
j.produit-le-detail-ligne-a-ligne-des=Produz o detalhe linha a linha das transações do dia contabilístico, incluindo as linhas anuladas, assinaladas (BO-11-01-14).
j.produit-le-fichier-plat-des-factures-et=Produz o ficheiro simples das faturas e guias de remessa de clientes com conta: identidade, contactos, vencimento, linhas faturadas, ecotaxa. Ativação pedida ao nível País / Insígnia / Ponto de Venda (BO-11-01-06, BO-11-01-12).
j.produit-le-flux-de-chiffre-d-affaires=Produz o fluxo de volume de negócios por dia contabilístico, acumulável em vários dias (BO-11-01-03).
j.produit-le-flux-de-chiffre-d-affaires-2=Produz o fluxo de volume de negócios discriminado por família de artigos e por ilha de caixas, com os descontos aplicados nas linhas (BO-11-01-08).
j.produit-le-flux-livre-de-caisse-montants=Produz o fluxo do livro de caixa — montantes por meio de pagamento — por dia contabilístico (BO-11-01-04).
j.produit-les-indicateurs-de-productivite-par-cais=Produz os indicadores de produtividade por operadora de caixa e por início de turno: talões, artigos, duração, artigos por hora, cabaz médio (BO-11-01-21).
j.produit-par-caisse-les-compteurs-et-la=Produz, por caixa, os contadores e o intervalo de números de talão do dia contabilístico, vendas e não vendas separadas, para o controlo de completude (BO-11-01-17).
j.produit-une-fois-par-mois-les-reglements=Produz, uma vez por mês, os pagamentos de fidelização discriminados por taxa de IVA na proporção do montante c/ IVA de cada talão (BO-11-01-13).
j.produits-dematerialises=Produtos desmaterializados
j.profil-introuvable=Perfil não encontrado.
j.profil=Perfil «
j.profondeur-de-recherche-d-un-ticket-jours=Profundidade de pesquisa de um talão (dias)
j.profondeur-des-meilleures-ventes=Profundidade dos mais vendidos
j.programme-externe-2=Programa externo
j.projection-cagnotte-sans-carte=Projeção do saldo acumulado sem cartão
j.promotions-personnalisees-a-la-carte=Promoções personalizadas no cartão
j.promotions-echues-plafond-supprime-par-passage=Promoções expiradas: limite eliminado por passagem
j.promotions-echues-retention-jours=Promoções expiradas: retenção (dias)
j.proposer-le-ticket-par-e-mail-en=Propor o talão por e-mail no fim da venda
j.protocole-inconnu=Protocolo desconhecido.
j.prefixe-ajoute-devant-le-numero-de-ticket=Prefixo adicionado antes do número do talão no código de barras impresso no rodapé do talão, para que os pórticos ou os terminais de jogos reconheçam o intervalo que lhes está reservado. Vazio: o código de barras tem apenas o número do talão, como atualmente (BO-03-06-55).
j.prefixe-du-code-barres-imprime-sur-le=Prefixo do código de barras impresso no talão
j.prefixe-du-code-barres-superviseur=Prefixo do código de barras do supervisor
j.prefixe-imprime-devant-le-code-superviseur-sur=Prefixo impresso antes do código do supervisor no seu código de barras. Enquanto estiver definido, uma identificação de supervisor SÓ é aceite a partir de um código com prefixo: o código sozinho, que se escreve, deixa de valer como identificação. Vazio: o código do supervisor basta, como antes (BO-10-02-32).
j.prefixes-des-bons-sogec=Prefixos dos vales SOGEC
j.prefixes-reconnaissant-un-bon-sogec-separes-par=Prefixos que reconhecem um vale SOGEC, separados por ponto e vírgula; um código com um deles segue para o circuito de compensação SOGEC em vez do cupão GS1 genérico. Vazio: nenhum vale SOGEC reconhecido (EXP-58).
