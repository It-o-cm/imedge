j.une-demande-de-service-tranchee-deja-traitee=Um pedido de serviço decidido — já tratado na caixa, reenviado para a caixa ou recusado — continua apresentado no painel, claramente assinalado, até à sua confirmação. Desativado: desaparece da lista assim que é decidido (BO-04-02-03/-04/-05).
