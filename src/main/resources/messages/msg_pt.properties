j.sur-l-ecran-de-vente-la-touche=No ecrã de venda, a tecla Enter premida SEM NADA ESCRITO abre o pagamento. Desativado — o predefinido — não faz nada, como sempre fez: um código escrito é validado por ela em ambos os casos (BO-10-02-13).
j.sur-un-ticket-melant-ventes-et-retours=Num talão que mistura vendas e devoluções, o detalhe dos artigos devolvidos e dos seus recálculos é impresso num talão separado, indicando o talão principal apenas o seu valor. Desativado: as devoluções são detalhadas no talão principal (LC-05-07-02).
j.sur-un-ticket-sans-carte-la-caisse=Num talão sem cartão, a caixa pergunta ao imfid o que o cliente teria ganho com o cartão e imprime-o (imfid resposta C). Desativado: nada é pedido nem impresso para um talão sem cartão (BO-03-03-28).
