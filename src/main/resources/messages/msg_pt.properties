j.l-hote-sse-peut-creer-en-caisse=O operador de caixa pode criar na caixa um cliente VOLATIL — um cliente de passagem, sem conta nem crédito, criado para suportar uma fatura. Desativado: só podem ser usados os clientes com conta já integrados (BO-10-04-01).
j.l-identifiant-doit-compter-au-moins=O identificador deve ter pelo menos
j.l-identifiant-du-terminal-est-obligatoire=O identificador do terminal é obrigatório.
j.l-image-imprimee-du-ticket-part-compressee=A imagem impressa do talão é enviada comprimida (gzip e depois Base64) em vez de texto simples. A codificação segue na carga: o leitor nunca tem de a adivinhar (BO-11-02-02).
j.l-interrogation-du-service-fidelite-imfid-cagnot=A consulta do serviço de fidelização imfid (saldo acumulado, vantagens, pagamento com fidelização) está ativa. Desativado: a caixa comporta-se como se nenhum serviço de fidelização estivesse configurado, mesmo que o seu URL esteja preenchido (BO-10-03-07).
j.l-operateur-peut-changer-la-langue-a=O operador pode mudar de idioma a qualquer momento, incluindo durante uma transação. Desativado: a mudança só é possível antes da abertura da caixa (LC-13-06-04).
j.l-ecran-client-affiche-en-permanence-jusqu=O ecrã do cliente mostra permanentemente, até ao pagamento, o total dos artigos elegíveis para eco-cheques, recalculado a cada alteração do talão. Desativado: a menção não aparece (LC-10-01-09).
j.l-ecran-client-affiche-en-permanence-jusqu-2=O ecrã do cliente mostra permanentemente, até ao pagamento, o total dos artigos elegíveis para o cartão de compras social, recalculado a cada alteração do talão. Desativado: a menção não aparece (LC-10-01-11).
j.lait-demi-ecreme-1l=LEITE MEIO-GORDO 1L
j.la-cagnotte-disponible-de-la-carte-rattachee=O saldo acumulado disponível do cartão associado, lido junto da fidelização, é apresentado no VISOR DO CLIENTE até ao pagamento. Independente do nome do titular: a loja pode mostrar o saldo sem a identidade. Desativado — o predefinido — o visor do cliente não mostra nenhum saldo (LC-03-04-13).
j.la-caisse-propose-au-caissier-quels-documents=A caixa propõe ao operador de caixa os documentos a imprimir: todos, talão de caixa, talão de cartão bancário, vale de compra ou nenhum. Desativado: a caixa imprime como atualmente, sem ecrã de escolha (LC-08-03-01).
j.la-caisse-emet-les-documents-fiscaux-portugais=A caixa emite os documentos fiscais portugueses: uma fatura simplificada (FS) por venda, com o NIF do cliente, ou uma fatura (FT) quando o cliente a pede durante a venda ou o pagamento; uma nota de crédito (NC) após uma devolução ou para anular uma FS convertida posteriormente em FT; um recibo (RC) sobre uma FT. Cada documento tem o seu número de série, o seu ATCUD, os 4 caracteres da sua assinatura encadeada, a menção de certificação e o código QR fiscal. Uma venda paga em parte com cartão de compras social é emitida em duas FS, com os artigos elegíveis pagos pelo cartão na primeira. Desativado: a caixa imprime os talões como antes (LC-08-01-05, LC-08-01-06, LC-08-04-18 a -23, LC-05-07-03).
j.la-carte-de-fidelite-est-transmise-au=O cartão de fidelização é transmitido ao motor de promoções, que lê as ofertas pessoais do titular e as pode ativar. Desativado: o cabaz é valorizado de forma anónima e nenhuma promoção personalizada é ativada (BO-10-03-22).
j.la-connexion-sso-n-est-pas-activee=O início de sessão SSO não está ativado neste nó.
j.la-creation-d-un-client-en-compte=A criação de um cliente com conta é recusada, tanto na caixa como no back-office: um cliente com conta entra pela integração da gestão comercial. Desativado: a criação volta a ser possível (BO-10-04-05, BO-02-04-12).
j.la-date-de-fin-de-validite-de=A data de fim de validade do crédito sai no vale. Desativado: o vale indica apenas o seu número e montante (BO-03-03-08).
j.la-deconnexion-demande-le-code-de-l=O fim de sessão pede o código do operador. Desativado: a tecla fecha a caixa sem pedir nada (LC-01-02-02/03, BO-10-02-24).
j.la-diffusion-au-fil-de-l-eau=A difusão contínua não está ativada neste nível.
j.la-fin-de-diffusion-precede-son-debut=O fim da difusão é anterior ao seu início.
j.la-langue-que-la-base-des-clients=O idioma que a base de clientes fidelizados regista para o titular do cartão identificado na caixa passa a ser o idioma do visor do cliente, do talão de caixa e do talão conservado para restituição por API, para a transação em curso; um idioma que a caixa não propõe é ignorado. Desativado: o idioma continua a ser o da caixa ou o escolhido pelo cliente (LC-13-06-09, LC-13-06-14).
j.la-largeur-doit-etre-comprise-entre=A largura deve estar compreendida entre
j.la-ligne-du-total-a-payer-est=A linha do total a pagar é emitida em caracteres de altura dupla e largura dupla, pela mesma diretiva que o negrito. Desativado: é impressa no tipo de letra normal (BO-10-07-14).
j.la-longueur-du-code-doit-etre-comprise=O comprimento do código deve estar compreendido entre
j.la-mention-carte-fidelite-et-son-numero=A menção cartão de fidelização e o seu número saem na zona de vantagens do cartão do talão. Desativado: o talão não menciona o cartão (BO-03-03-32).
j.la-remise-accordee-au-client-en-compte=O desconto concedido ao cliente com conta é anunciado ao operador de caixa assim que o cliente é lido ou introduzido. Desativado: o desconto aplica-se sem ser anunciado (BO-10-04-08).
j.la-remise-ou-le-rabais-pose-sur=O desconto ou abatimento aplicado ao total do talão incide também sobre as linhas que já têm um desconto manual ou uma promoção automática. Desativado: essas linhas saem da base E da repartição — o desconto global custa então exatamente o que anuncia nas restantes linhas (BO-03-07-12).
j.la-remise-le-rabais-ou-le-prix=O desconto, o abatimento ou o preço forçado de uma linha sai por baixo do artigo em causa. Desativado: só o desconto de talão sai por baixo dos totais (BO-03-03-22).
j.la-section-cagnotte-du-jour-et-les=A secção « SALDO DO DIA » e as vantagens de fidelização são impressas no talão. Desativado: nenhuma secção de fidelização é impressa (BO-10-03-15).
j.la-tare-reellement-appliquee-a-une-pesee=A tara efetivamente aplicada a uma pesagem — recipiente, artigo ou tara predefinida — é impressa em quilogramas por baixo da linha do artigo pesado. Desativado: o talão indica apenas o peso líquido, como antes (BO-10-05-04).
j.la-validation-manuelle-d-un-paiement-secours=A validação manual de um pagamento 'contingência de pagamento eletrónico' — introdução do montante aceite sem leitura do código QR de retorno — exige a aprovação de um supervisor. Desativado: o operador valida sozinho (LC-07-07-09).
j.la-zone=A zona
j.la-zone-soldes-carte-sort-en-fin=A zona de saldos do cartão sai no fim da secção de fidelização: saldo disponível, total das vantagens do dia, montante utilizado e novo saldo após a transação. Desativado: nenhuma zona de saldos (BO-03-03-31, BO-03-03-34).
j.label-point-de-vente=Etiqueta do ponto de venda
j.langue-du-client-fidele=Idioma do cliente fidelizado
j.langue-systeme-du-point-de-vente=Idioma de sistema do ponto de venda
j.langues-proposees-en-caisse=Idiomas propostos na caixa
j.langues-que-l-operateur-peut-choisir-separees=Idiomas que o operador pode escolher, separados por ponto e vírgula, por exemplo fr;nl;pt. A lista de idiomas disponíveis não está fixada no software: é descoberta a partir dos ficheiros de mensagens fornecidos e dos colocados no diretório pos.messages.dir. Um idioma sem ficheiro de mensagens é ignorado; lista vazia: só é proposto o francês (LC-13-06-03/04).
j.largeur-de-tranche=Largura do intervalo
j.largeur-de-tranche-horaire-min=Largura do intervalo horário (min)
j.largeur-du-logo-imprime-en-points=Largura do logótipo impresso, em pontos
j.largeur-a-laquelle-le-logo-est-imprime=Largura a que o logótipo é impresso, em pontos da cabeça térmica: 384 pontos, ou seja 48 mm, por predefinição, até 576 pontos para toda a largura de um rolo de 80 mm (Epson TMH6000 IV e V). Um valor fora do intervalo 8-576 volta a 384 (BO-03-03-14).
j.largeur-en-minutes-des-tranches-du-ca=Largura, em minutos, dos intervalos do volume de negócios por intervalo horário (R17): 15, 30 ou 60. Os intervalos cobrem do primeiro ao último talão do período, sem falhas. Predefinição 60.
j.le-label-point-de-vente-administre-ci=A etiqueta do ponto de venda configurada abaixo é adicionada a cada pedido enviado ao cliente de pagamento eletrónico. Desativado: o pedido não a inclui (BO-03-09-31).
j.le-qr-code-de-recuperation-du-ticket=O código QR de recuperação do talão digital aparece no ecrã do cliente no fim da transação. Desativado: nenhum código QR (BO-10-07-02).
j.le-badge-scanne-ouvre-la-caisse-seul=O crachá lido abre a caixa SOZINHO quando este parâmetro está desativado. Ativo: o crachá preenche o identificador e o operador introduz o seu código (LC-01-01-03/09, BO-10-02-22).
j.le-bon-n-est-pas-un-document=O vale não é um documento fiscal: é uma prova de saída de mercadoria. Dois exemplares permitem ao cliente DEIXAR o seu no ponto de levantamento, que o responsável recolhe à noite, e GUARDAR um com o que falta levantar. 1: um único vale, o que o cliente guarda (LC-02-08-05).
j.le-bordereau-de-commande-de-monnaie-est=A guia de pedido de trocos é impressa: número da caixa, operador, data e hora e uma tabela das denominações com as colunas montante e número de rolos, preenchidas ou vazias conforme a introdução. Desativado: nenhuma guia preenchida é impressa (LC-12-05-08).
j.le-champ=O campo
j.le-client-choisit-lui-meme-sur-la=O cliente escolhe ele próprio, no visor do cliente tátil, o idioma do visor do cliente e do seu talão de caixa entre os idiomas propostos na caixa; a escolha vale para a transação em curso e o visor do cliente passa então a um único idioma. Desativado: nenhuma tecla de idioma no visor do cliente (LC-13-06-08/13).
j.le-client-peut-regler-en-carte-un=O cliente pode pagar com cartão um montante superior ao valor em falta e receber a diferença em numerário: o montante do cartão introduzido acima do valor em falta, ou a tecla CASHBACK que pede o numerário pretendido e calcula o montante a debitar. Desativado: o montante do cartão está limitado ao valor em falta (LC-07-04-07/08).
j.le-code=O código
j.le-code-de-l-ilot-est-obligatoire=O código da ilha é obrigatório.
j.le-code-de-la-commande-est-obligatoire=O código da encomenda é obrigatório.
j.le-code-de-la-devise-est-obligatoire=O código da moeda é obrigatório.
j.le-libelle-de-la-devise-est-obligatoire=A descrição da moeda é obrigatória.
j.le-code-de-la-nomenclature-est-obligatoire=O código da nomenclatura é obrigatório.
j.le-code-de-la-plage-article-est=O código do intervalo de artigos é obrigatório.
j.le-code-de-la-plage-est-obligatoire=O código do intervalo é obrigatório.
j.le-code-doit-comporter-au-moins=O código deve ter pelo menos
j.le-code-du-fournisseur-est-obligatoire=O código do fornecedor é obrigatório.
j.le-code-du-gabarit-est-obligatoire=O código do modelo é obrigatório.
j.le-code-du-groupe-est-obligatoire=O código do grupo é obrigatório.
j.le-code-du-nouveau-groupe-est-obligatoire=O código do novo grupo é obrigatório.
j.le-code-du-regime-est-obligatoire-et=O código do regime é obrigatório e limitado a
j.le-code-enseigne-est-obligatoire=O código da insígnia é obrigatório.
j.le-code-et-le-libelle-de-l=O código e a descrição do atributo são obrigatórios.
j.le-code-et-le-libelle-de-l-2=O código e a descrição da entrada são obrigatórios.
j.le-code-et-le-libelle-de-l-3=O código e a descrição da imagem são obrigatórios.
j.le-code-et-le-libelle-de-la=O código e a descrição da lista são obrigatórios.
j.le-code-et-le-libelle-sont-obligatoires=O código e a descrição são obrigatórios.
j.le-code-interne-rattache-a-l-ean13=O código interno associado ao EAN13 é impresso por baixo da linha do artigo que o tenha — o que os produtos desmaterializados exigem. Desativado: só a linha do artigo é impressa (BO-10-02-20).
j.le-code-pays-est-obligatoire=O código do país é obrigatório.
j.le-code-2=O código «
j.le-compteur-de-transactions-de-la-caisse=O contador de transações da caixa recomeça em 1 no fim de cada período. Desativado — o predefinido — continua sem interrupção. Só o número do talão recomeça: a numeração fiscal nunca conta para trás e não é afetada (BO-09-03-04).
j.le-credit-client-peut-ne-regler-qu=O crédito cliente pode pagar apenas uma parte do talão, sendo o resto pago de outra forma. Desativado: o crédito cliente paga a totalidade do valor em falta, ou nada (BO-10-04-10).
j.le-detail-de-la-tva-par-taux=O detalhe do IVA por taxa (s/ IVA / IVA) é impresso no talão de caixa e no talão de devolução. Desativado: nenhuma discriminação do IVA é impressa (BO-10-06-04).
j.le-forcage-du-prix-d-une-ligne=Forçar o preço de uma linha exige a aprovação de um supervisor. Desativado: o operador de caixa força sozinho (EXP-32).
j.le-fournisseur-et-le-code-message-sont=O fornecedor e o código de mensagem são obrigatórios.
j.le-lieu-ou-le-client-va-retirer=O local onde o cliente vai levantar os artigos marcados A LEVANTAR, impresso na guia de levantamento: o cliente sai da caixa e dirige-se lá de veículo, por isso a guia deve indicá-lo. Um único ponto de levantamento por loja (o BATI em bricolage, o DRIVE em alimentar). Vazio: a guia não indica nenhum (LC-02-08-05).
j.le-montant-est-declare-encode-mais-aucun=O montante está declarado como codificado, mas nenhum campo PRICE está configurado.
j.le-montant-reglable-en-especes-est-arrondi=O montante a pagar em numerário é arredondado ao múltiplo mais próximo deste passo, e a diferença é registada no meio de pagamento ARRONDI. 0 ou 1: sem arredondamento (França). 5: obrigação legal belga desde 01/12/2019 (LC-07-03-01).
j.le-montant-total-doit-etre-un-nombre=O montante total deve ser um número positivo.
j.le-motif-choisi-est-imprime-sur-le=O motivo escolhido é impresso no talão de devolução. Desativado: o motivo é registado mas não aparece no talão (LC-05-05-03).
j.le-niveau-du-profil-ne-peut-depasser=O nível do perfil não pode exceder o seu.
j.le-nom-de-la-selection-est-obligatoire=O nome da seleção é obrigatório.
j.le-nom-du-profil-est-obligatoire=O nome do perfil é obrigatório.
j.le-nom-et-le-prenom-du-porteur=O apelido e o nome próprio do titular, quando uma pesquisa os encontrou, são apresentados no VISOR DO CLIENTE ao associar o cartão. Desativado — o predefinido — o visor do cliente não mostra nenhuma identidade: está virado para a loja, e o cliente seguinte lê o ecrã do cliente à sua frente (BO-10-03-03).
j.le-nom-et-le-prenom-trouves-par=O apelido e o nome próprio encontrados por uma pesquisa de cartão são apresentados na caixa ao lado do número. Desativado: a caixa mostra apenas o número do cartão, como para um cartão lido (BO-10-03-04).
j.le-nombre-de-caracteres-doit-etre-un=O número de caracteres deve ser um inteiro de pelo menos 1.
j.le-nombre-de-decimales-de-la-valeur=O número de casas decimais do valor está fora da zona lida.
j.le-nouveau-code-est-obligatoire=O novo código é obrigatório.
j.le-nouveau-mot-de-passe-doit-compter=A nova palavra-passe deve ter pelo menos
j.le-nouveau-mot-de-passe-doit-etre=A nova palavra-passe deve ser diferente da atual.
j.le-numero=O número
j.le-numero-de-pdv-doit-comporter-exactement=O número de PDV deve ter exatamente 5 algarismos.
j.le-numero-de-tva-doit-etre-un=O número de IVA deve ser um inteiro positivo.
j.le-plafond-d-acompte-ne-peut-pas=O limite de adiantamento não pode ser negativo.
j.le-plafond-doit-etre-un-pourcentage-entre=O limite deve ser uma percentagem entre 0 e 100, ou vazio para um regime sem limite.
j.le-prix-initial-de-l-article-est=O preço inicial do artigo é relembrado no ecrã ao forçar o preço. Desativado: o preço original fica oculto (BO-10-07-12).
j.le-profil=O perfil «
j.le-prefixe-de-la-plage-est-obligatoire=O prefixo do intervalo é obrigatório.
j.le-prefixe-est-plus-long-que-le=O prefixo é mais longo do que o próprio código.
j.le-prefixe=O prefixo «
j.le-remboursement-d-un-retour-exige-un=O reembolso de uma devolução exige a aprovação de um supervisor. Desativado: o operador de caixa reembolsa sozinho (EXP-32).
j.le-rendu-monnaie-est-autorise-sur-cet=A devolução de troco é autorizada nesta ilha de caixas. Desativado: a ilha proíbe a devolução de troco mesmo onde a regra do meio de pagamento o autorizaria — a proibição da ilha prevalece (BO-03-10-04).
j.le-reglement-en-credit-client-reste-possible=O pagamento com crédito cliente continua possível quando o ficheiro de clientes já não está atualizado (corte entre o back-office e a caixa). Desativado: o crédito cliente é recusado enquanto o ficheiro não for atualizado, uma vez que o saldo em dívida e o limite já não são fiáveis (LC-07-09-05).
j.le-role=A função
j.le-scan-d-un-badge-deverrouille-la=A leitura de um crachá desbloqueia a caixa ou serve de autorização do gestor. Desativado: o crachá lido é ignorado e o operador introduz o seu identificador manualmente (BO-10-02-29/30).
j.le-taux-euros-pour-une-unite-doit=A taxa (euros por uma unidade) deve ser um número estritamente positivo.
j.le-taux-doit-etre-un-pourcentage-entre=A taxa deve ser uma percentagem entre 0 e 100.
j.le-ticket-carte-bancaire-d-un-remboursement=O talão de cartão bancário de um reembolso (devolução de artigo, talão de devolução) é impresso automaticamente (LC-08-03-10).
j.le-ticket-carte-bancaire-d-une-transaction=O talão de cartão bancário de uma transação não concluída, com a menção « débito abandonado », é impresso automaticamente (LC-08-03-12).
j.le-ticket-carte-bancaire-demandant-la-signature=O talão de cartão bancário que pede a assinatura do cliente é impresso automaticamente (LC-08-03-11).
j.le-ticket-d-abandon-liste-les-articles=O talão de abandono lista os artigos do talão abandonado. Desativado: só o cabeçalho, o motivo e o total abandonado são impressos (LC-04-04-12).
j.le-ticket-d-article-inconnu-porte-le=O talão de artigo desconhecido apresenta o código lido em CÓDIGO DE BARRAS por baixo da sua transcrição, para que a secção o volte a ler em vez de o voltar a introduzir. Desativado: o código é escrito apenas em texto (BO-10-07-11).
j.le-tiroir-s-ouvre-au-deverrouillage-de=A gaveta abre ao desbloquear a caixa para colocar o fundo de caixa. Desativado: a gaveta permanece fechada no início de sessão (BO-10-02-25).
j.le-tiroir-s-ouvre-au-lancement-de=A gaveta abre ao iniciar o fecho (contagem do Z). Desativado: a gaveta permanece fechada, a contagem faz-se com a gaveta fechada (BO-10-02-26).
j.le-tiroir-s-ouvre-sur-les-reglements=A gaveta abre nos pagamentos físicos (numerário, cheque, vales de refeição). Desativado: a gaveta permanece fechada no pagamento (BO-10-02-12).
j.les-appels-superviseur-des-caisses-s-affichent=As chamadas de supervisor das caixas aparecem no painel do back-office. Desativado: nenhum alerta é apresentado no ecrã (BO-10-08-01).
j.les-caisses-restees-ouvertes-sont-fermees-d=As caixas que ficaram abertas são fechadas automaticamente ao aproximar-se o fim do período, sendo a ordem lida por cada caixa no seu ciclo. Desativado: uma caixa esquecida fica aberta até ao dia seguinte (LC-01-02-08, BO-09-01-06/09).
j.les-champs=Os campos
j.les-deux-saisies-du-nouveau-mot-de=As duas introduções da nova palavra-passe são diferentes.
j.les-extractions-de-factures-clients-en-compte=As extrações de faturas de clientes com conta indicam a data de vencimento do cliente (BO-10-04-19).
j.les-extractions-de-factures-portent-le-montant=As extrações de faturas indicam o montante de ecotaxa associado à transação paga com crédito cliente (BO-10-04-14), e o ficheiro clitva.dat das faturas de clientes com conta uma linha de ecotaxa após as linhas de IVA de cada fatura (BO-11-01-12).
j.les-lignes-d-un-ticket-unique-balance=As linhas de um talão único de balança são registadas ao preço calculado pelo balcão. Desativado: cada linha é revalorizada ao preço do ficheiro de referência, prevalecendo o peso pesado e servindo o balcão apenas para pesar (LC-06-01-04).
j.les-listes-standard-existent-deja-rien-n=As listas padrão já existem: nada foi criado.
j.les-messages-d-information-lies-a-la=As mensagens informativas ligadas à venda de um artigo — a mensagem configurada no artigo, o alerta de preço elevado — deixam de ser apresentadas nas caixas desta ilha. As RECUSAS nunca são silenciadas: uma ação proibida continua proibida e indica-o (BO-03-10-13).
j.les-messages-d-information-lies-a-un=As mensagens informativas ligadas a um meio de pagamento — os alertas não bloqueantes dos pontos de controlo de pagamento — deixam de ser apresentadas nas caixas desta ilha. As recusas e os pedidos de aprovação nunca são silenciados (BO-03-10-14).
j.les-montants-des-documents-de-caisse-portent=Os montantes dos documentos de caixa têm o símbolo monetário. Desativado: são impressos sem símbolo, o que pedem as lojas cujo papel já vem pré-impresso (BO-10-07-04).
