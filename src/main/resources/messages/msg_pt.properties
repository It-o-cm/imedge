j.destinations-de-prelevement=Destinos de recolha
j.destinations-proposees-au-caissier-pour-un-prele=Destinos propostos ao operador de caixa para uma recolha, além do cofre que é sempre oferecido, separados por pontos e vírgulas. O destino é obrigatório: uma recolha que não diz para onde vai o dinheiro não é oponível (LC-12-03).
j.detail-quotidien-des-transactions=Detalhe diário das transações
j.deuxieme-langue-affichee-a-cote-de-la=Segundo idioma apresentado ao lado do primeiro no visor do cliente e no talão, para as regiões bilingues: « Terug te geven / A rendre ». Vazio: visor do cliente e talão monolingues (LC-13-06-06/11).
j.deuxieme-langue-de-la-visu-client-et=Segundo idioma do visor do cliente e do talão
