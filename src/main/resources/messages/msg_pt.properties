j.message-imprime-sur-le-ticket-d-un=Mensagem impressa no talão de um cliente SEM cartão quando o serviço de fidelização não respondeu durante a venda. Vazio: o talão não indica nada (BO-03-03-30).
j.message-inconnu=Mensagem desconhecida.
