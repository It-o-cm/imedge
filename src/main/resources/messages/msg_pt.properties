j.le-ticket-carte-bancaire-est-imprime-associe=O talão do cartão bancário é impresso: associado ao talão de venda ou num talão separado segundo o parâmetro « Talão monético associado ao talão de venda ». Desativado: nenhum talão de cartão é impresso, exceto o que o cliente tem de assinar; o talão fica arquivado para um duplicado (BO-03-02-34).
j.autorisation-superviseur-pour-lever-le-mode=Autorização de supervisor para levantar o modo degradado
j.la-levee-du-mode-degrade-monetique-force=O levantamento do modo degradado monético forçado na caixa exige a aprovação de um supervisor. Desativado: o operador levanta-o sozinho (LC-07-08-04, BO-03-02-50).
j.autorisation-superviseur-pour-activer-le-mode=Autorização de supervisor para ativar o modo degradado
j.l-activation-du-mode-degrade-monetique-force=A ativação do modo degradado monético forçado na caixa exige a aprovação de um supervisor. Desativado: o operador ativa-o sozinho. O levantamento tem o seu próprio parâmetro (LC-07-08-03, BO-03-02-49).
j.au-bout-de-ce-delai-le-mode-degrade-en-caisse=Decorrido este prazo, o modo degradado monético forçado na caixa levanta-se sozinho, e o modo degradado ativado no BackOffice deixa de se aplicar em cada caixa: o operador que o ativou não será o que ainda lá estará três horas depois (LC-07-08-04, BO-03-02-48).
j.composition-des-rouleaux-separes-par-des=Composição dos rolos, separados por ponto e vírgula, na forma FACIAL:MONTANTE_ROLO:NUMERO_DE_MOEDAS — exemplo 0.20:8.00:40;0.01:0.50:50; o número de moedas pode ser omitido (vale então o montante dividido pelo valor facial), e uma entrada cujos três valores não coincidem é descartada. Serve para o cálculo cruzado montante <-> número de rolos da encomenda de moedas e para os rolos propostos na contagem da caixa (LC-12-05-06/07, BO-03-02-42). Vazio: nenhum cálculo cruzado, e a contagem propõe os seus rolos habituais.

# lot 19: L2
t.autorisation-cheque-aide=O serviço de garantia de cheque administrado (parâmetros « Serviço de garantia de cheque ») é consultado; sem serviço, ou com o serviço inacessível, um supervisor autoriza o cheque.
t.reimpression-automatique-aide=A frente do cheque (montante por extenso, beneficiário, local, data) é impressa automaticamente segundo o modelo « Apresentação da frente do cheque » antes da leitura, sem gesto do operador.
t.types-de-retour-titre=Tipos de devolução
t.les-types-de-retour-que-la-caisse-propose=Os tipos de devolução que as caixas propõem, com as suas opções. Um tipo desativado desaparece das caixas na sincronização seguinte; um tipo já utilizado por devoluções é desativado em vez de eliminado.
t.reprendre-les-types-existants=Retomar os tipos existentes
t.aucun-type-de-retour-administre=Nenhum tipo de devolução está administrado: as caixas leem a lista de tipos de devolução e depois o parâmetro « Tipos de devoluções ».
t.retours-rattaches=Devoluções associadas:
t.plage-code-barres-retour=Gama de códigos de barras de devolução
t.aucune-plage=Nenhuma gama
t.mode-ticket-retour=Modo talão (talão de origem identificado)
t.sans-autorisation-superviseur=Sem autorização do supervisor
t.sans-ticket-d-origine=Autorizado sem talão de origem
t.prix-a-confirmer=Preço a confirmar
t.retour-deconsigne=Devolução de tara
t.nouveau-type-de-retour=Novo tipo de devolução
t.le-mode-ticket-impose-l-identification=Em modo talão, a caixa impõe a identificação do talão de origem (leitura do código de barras ou introdução do número e da data) antes da devolução. Uma gama de códigos de barras de devolução associada permite a devolução do artigo por leitura sem chamar o supervisor.
t.creer-le-type-de-retour=Criar o tipo de devolução
t.types-de-cartes-prepayees=Tipos de cartões pré-pagos
t.le-type-d-une-carte-prepayee-dit=O tipo de um cartão pré-pago indica em que protocolo a caixa o trata (NEXO: hub externo; LOCAL: registo da caixa), quem o emite, que gamas de números lhe pertencem e o que a caixa pode fazer com ele: pagamento, consulta do saldo, ativação na venda.
t.aucun-type-de-carte-prepayee=Nenhum tipo de cartão pré-pago está administrado: as caixas seguem o protocolo das gamas de códigos de barras.
t.plages-de-cartes=Gamas de números
t.plages-de-cartes-aide=Prefixo ou prefixo:comprimento, separados por ponto e vírgula (ex. 6299;296:13). O prefixo mais longo prevalece.
t.paiement-autorise=Pagamento autorizado
t.consultation-du-solde=Consulta do saldo
t.activation-a-la-vente=Ativação na venda
