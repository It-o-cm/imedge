# ---- lot 18: H ----
t.export-saf-t=Exportação SAF-T
t.documents-fiscaux-portugais-emis-par-les-caisses=Documentos fiscais portugueses emitidos pelas caixas e ficheiro de auditoria SAF-T do período
t.n-de-certification-fiscale=N.º de certificação fiscal
t.non-renseigne=não preenchido
t.exporter-le-fichier-saf-t=Exportar o ficheiro SAF-T
t.aucun-document-fiscal-sur-la-periode=Nenhum documento fiscal no período.
t.le-fichier-reprend-les-documents-tels-que-les-caisses=O ficheiro retoma os documentos tal como as caixas os numeraram, assinaram e imprimiram.
j.identifiant-saf-t-de-la-fatura-simplificada=Identificador SAF-T da fatura simplificada (FS)
j.code-numerique-du-type-de-document-vente=Código numérico do tipo de documento de venda talão português, presente em cada FS emitida e retomado na exportação SAF-T. O prefixo FS continua a ser o do modelo do documento (BO-10-06-01).
j.identifiant-saf-t-de-la-nota-de=Identificador SAF-T da nota de crédito (NC)
j.code-numerique-du-type-de-document-avoir=Código numérico do tipo de documento nota de crédito português, presente em cada NC emitida e retomado na exportação SAF-T. O prefixo NC continua a ser o do modelo do documento (BO-10-06-02).
j.attributs-article-portant-une-eco-taxe=Atributos de artigo com ecotaxa
j.codes-des-attributs-dynamiques-article-dont-la=Códigos dos atributos dinâmicos de artigo cujo valor é um montante unitário de ecotaxa, separados por ponto e vírgula, sem limite de número. Cada código pode ser seguido de « =Rótulo » (o rótulo impresso) e de « >NOPRINT » para que esta ecotaxa não seja impressa no talão; continua totalizada nas faturas, guias de remessa e nas suas extrações. Exemplo: « DEEE=Eco DEEE;DEA=Eco mobilier;PILES;PNEUS>NOPRINT;EMB ». O atributo ECO_TAX é sempre uma ecotaxa impressa, salvo se listado com >NOPRINT. Vazio: apenas ECO_TAX (BO-10-06-05, BO-10-06-06).
j.texte-cheque-des-unites-monetaires=Texto do cheque para as unidades monetárias
j.mot-imprime-sur-le-cheque-apres-le=Palavra impressa no cheque após o montante das unidades escrito por extenso, por exemplo « Euro(s) ». Vazio: a palavra da língua da caixa, concordada com o número (BO-10-07-05).
j.texte-cheque-des-centimes=Texto do cheque para os cêntimos
j.mot-imprime-sur-le-cheque-apres-les=Palavra impressa no cheque após os cêntimos escritos por extenso, por exemplo « Cent(s) ». Vazio: a palavra da língua da caixa, concordada com o número (BO-10-07-05).
j.logos-monetique-sur-le-ticket-monetique=Logótipos monéticos no talão monético
j.le-ticket-monetique-sort-avec-ses-images=O talão monético sai com as suas imagens: o logótipo monético administrado no topo de cada talão do terminal de pagamento, e o logótipo sem contacto no de um pagamento sem contacto, obrigação legal. As imagens são as do ecrã Imagens (utilizações « Logo monétique » e « Logo sans contact »); sem imagem administrada nada é acrescentado. Desativado: as tramas do terminal saem sozinhas (BO-10-07-13).
j.sous-totaux-par-famille=Subtotais por família
j.quand-les-articles-sont-imprimes-par-nomenclature=Quando os artigos são impressos por nomenclatura (ordem FAMILY), é impresso um subtotal da família sob os seus artigos. Desativado: as famílias sucedem-se sem subtotal (BO-10-07-15).
j.montants-en-gras=Montantes a negrito
j.les-montants-des-lignes-articles-des-sous=Os montantes das linhas de artigos, dos subtotais e do total a pagar do talão de caixa são emitidos a negrito, pela diretiva de negrito da impressora, colocada após o alinhamento. Desativado: tipo de letra corrente (BO-10-07-15).
j.premiere-langue-de-la-visu-client=Primeira língua do ecrã do cliente
j.langue-principale-de-la-visu-client-independante=Língua principal do ecrã do cliente, independente da do operador de caixa: fr, nl ou pt. A segunda língua do ecrã do cliente é apresentada ao lado. Vazia ou desconhecida: a língua da caixa (BO-10-07-17).
j.message-caisse-ouverte-deuxieme-langue=Mensagem caixa aberta (segunda língua)
j.traduction-du-message-caisse-ouverte-dans-la=Tradução da mensagem caixa aberta na segunda língua do ecrã do cliente, apresentada ao lado da mensagem principal quando o ecrã do cliente é bilingue. Vazia: apenas a mensagem principal (BO-10-07-17).
j.message-caisse-fermee-deuxieme-langue=Mensagem caixa fechada (segunda língua)
j.traduction-du-message-caisse-fermee-dans-la=Tradução da mensagem caixa fechada na segunda língua do ecrã do cliente, apresentada ao lado da mensagem principal quando o ecrã do cliente é bilingue. Vazia: apenas a mensagem principal (BO-10-07-17).
j.apparence-caisse-en-mode-deconnecte=Aparência da caixa em modo desligado
j.quand-la-caisse-ne-joint-plus-son=Quando a caixa deixa de alcançar o seu servidor de loja, em transação ou fora dela, o ecrã da caixa muda de aparência (fundo e faixa « MODO DESLIGADO ») após o atraso abaixo, e retoma a aparência ligada logo que o servidor responde. Desativado: aparência inalterada (BO-10-07-19).
j.delai-avant-l-apparence-deconnectee-secondes=Atraso antes da aparência desligada (segundos)
j.duree-pendant-laquelle-la-caisse-doit-rester=Duração durante a qual a caixa deve ficar sem resposta do servidor de loja antes de tomar a aparência desligada. 0: logo à primeira perda de ligação; um valor negativo vale 0 (BO-10-07-19).
j.decimales-des-quantites-en-unite-de-mesure=Casas decimais das quantidades em unidade de medida
j.nombre-de-decimales-affichees-et-imprimees-apres=Número de casas decimais apresentadas e impressas após a vírgula para uma quantidade vendida à unidade de medida (metro, litro…) que não é inteira, de 0 a 4. Fora deste intervalo: 2 (BO-10-08-28).
j.decimales-des-quantites-pesees=Casas decimais das quantidades pesadas
j.nombre-de-decimales-affichees-et-imprimees-apres-2=Número de casas decimais apresentadas e impressas após a vírgula para um peso, de 0 a 4. Fora deste intervalo: 3 (BO-10-08-28).
j.symbole-des-quantites-pesees=Símbolo das quantidades pesadas
j.symbole-affiche-sur-la-visu-caisse-et=Símbolo apresentado no ecrã da caixa e no ecrã do cliente e impresso nos talões ao lado de um peso e de um preço ao peso, por exemplo kg ou KG. Vazio: kg (BO-10-08-29).
j.lignes-annulees-sur-le-ticket=Linhas anuladas no talão
j.les-lignes-annulees-en-caisse-annulation-ligne=As linhas anuladas na caixa (anulação de linha ou anulação de artigo) são impressas no talão e no recibo de suspensão, marcadas ANULADO e fora dos totais. Desativado: não figuram (BO-10-08-30).
j.articles-identiques-detailles-sur-le-ticket=Artigos idênticos detalhados no talão
j.chaque-article-identique-saisi-plusieurs-fois-est=Cada artigo idêntico registado várias vezes é impresso na sua própria linha, à unidade. Desativado, que é a otimização por defeito: os artigos idênticos saem agrupados numa só linha com a quantidade (BO-10-08-31).
j.mode-d-arrondi-des-calculs=Modo de arredondamento dos cálculos
j.mode-d-arrondi-des-montants-calcules-ventilation=Modo de arredondamento dos montantes calculados (discriminação do IVA): HALF_UP (ao mais próximo, por defeito), HALF_EVEN, UP, DOWN, CEILING ou FLOOR. Um valor desconhecido recorre a HALF_UP (BO-10-02-18).
j.unites-de-mesure=UNIDADES DE MEDIDA
j.calcul=CÁLCULO
j.export-saf-t=Exportação SAF-T
j.logo-monetique=Logótipo monético
j.logo-sans-contact=Logótipo sem contacto

# ---- lot 18: I ----
t.dep-a-jour=Atualizado
t.dep-adherent=Aderente
