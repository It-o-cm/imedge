j.au-scan-d-un-code-que-rien-2=Ao ler um código que nada reconhece, aparece a mensagem « artigo desconhecido » e a caixa passa ao ecrã de introdução direta para vender o artigo pela sua família ou código. Desativado: só aparece a mensagem (BO-10-02-14).
j.ce-que-le-panneau-d-autorisation-superviseur=O que o painel de autorização do supervisor pede: CODE_PASSWORD (código do supervisor, escrito ou lido, depois palavra-passe — por defeito), BARCODE (código de barras do supervisor lido, sozinho), BARCODE_CODE_PASSWORD (código de barras lido, depois código escrito, depois palavra-passe), BARCODE_PASSWORD (código de barras lido, depois palavra-passe) ou DALLAS (chave Dallas do supervisor, sozinha). Um valor desconhecido volta a CODE_PASSWORD (BO-10-02-31).
j.comment-le-n-ud-magasin-recoit-les=Como o nó da loja recebe os cestos das balanças, que a caixa lê ao ler o talão de balança: API_FTP (enviados para a API do nó e recolhidos no servidor FTP administrado, por defeito), API (só API, o FTP não é lido), FTP (só FTP, a API recusa os cestos) ou OFF (nenhum talão de balança: o nó deixa de os receber e a caixa deixa de reconhecer o seu código de barras). Um valor desconhecido volta a API_FTP (BO-10-05-01).
j.decimales-du-total-ht-de-la-ligne=Casas decimais do total sem IVA da linha
j.en-mode-ecole-le-tiroir-s-ouvre=Em modo de formação, a gaveta abre como numa venda real (pagamento, entrada em posto, fecho). Desativado: nenhum impulso de abertura é enviado enquanto a caixa estiver em modo de formação, ficando a gaveta fechada num recebimento fictício (BO-10-02-12).
j.la-caisse-lit-les-codes-gs1-databar=A caixa lê os códigos GS1 (Databar, DataMatrix, código QR, Digital Link) e aplica os seus identificadores de aplicação. Desativado: um código GS1 deixa de ser interpretado e segue o caminho de um código comum (BO-10-09-01).
j.lecture-des-codes-gs1=Leitura dos códigos GS1
j.message-affiche-en-caisse-quand-un-article=Mensagem apresentada na caixa quando um artigo proibido de venda ou em retirada/recolha é lido e a sua ficha não tem mensagem própria (atributo FORBIDDEN_SALE_MESSAGE). Vazio: « ARTIGO RETIRADO/RECOLHIDO » (BO-10-07-20).
