j.ordre-d-affichage-des-touches-groupe-sur=Ordem de apresentação das teclas de grupo no ecrã de introdução direta: ALPHA (alfabética, predefinição), CUSTOM (ordem personalizada da ficha do grupo) ou VOLUME (volume de vendas decrescente). Um valor desconhecido volta a ALPHA (BO-03-01-10/11/13).
j.ordre-d-impression-des-articles-sur-le=Ordem de impressão dos artigos no talão de caixa: ENTRY (ordem de registo, predefinição), LABEL (alfabética por descrição) ou FAMILY (agrupados sob a descrição da sua família). Um valor desconhecido volta a ENTRY (LC-08-01-07).
j.ordre-des-articles-sur-le-ticket=Ordem dos artigos no talão
j.ordre-des-touches-articles=Ordem das teclas de artigos
j.ordre-des-touches-groupe=Ordem das teclas de grupo
j.ordre-personnalise-invalide-entier-positif-atten=Ordem personalizada inválida — esperado um inteiro positivo.
j.organisme-de-certification-metrologique=Organismo de certificação metrológica
j.origine-du-montant-inconnue=Origem do montante desconhecida.
j.ouverture-du-tiroir-a-la-cloture-de=Abertura da gaveta no fecho da sessão
j.ouverture-du-tiroir-au-paiement=Abertura da gaveta no pagamento
j.ouverture-du-tiroir-a-la-prise-de=Abertura da gaveta no início de turno
j.ouvre-la-proposition-d-envoi-apres-la=Abre a proposta de envio após o fecho de uma venda, sem enviar automaticamente nenhuma mensagem: o email parte para o endereço escolhido na caixa. Desativado: nenhuma proposta no fim da venda (LC-08-02-05, BO-10-07-22).
j.ou-l-eco-participation-des-articles-qui=Onde a ecoparticipação dos artigos que a têm é impressa no talão: NONE (em lado nenhum, predefinição), LINE (por baixo de cada artigo em causa) ou TOTAL (uma única linha, por baixo da discriminação do IVA). Um valor desconhecido volta a NONE (BO-10-06-06).
j.ou-le-nombre-d-articles-de-la=Onde o número de artigos da venda é impresso: NONE (em lado nenhum, predefinição), TOTAL_LINE (entre parênteses na linha do total a pagar) ou OWN_LINE (numa linha própria, por baixo do total). Um valor desconhecido volta a NONE (BO-10-07-10).
j.ou-sortent-les-lignes-portant-l-attribut=Onde saem as linhas com o atributo de ordenação: NONE (só ordenação, predefinição), START (isoladas no início do talão) ou END (isoladas no fim). Um valor desconhecido volta a NONE (BO-03-03-18).
j.pain-complet-500g=PÃO INTEGRAL 500G
j.pdv-a-renommer-introuvable=PDV a renomear não encontrado.
j.per-op-l-aval-vaut-pour-un=PER_OP: a aprovação vale para uma única ação (predefinição). PER_TICKET: uma vez dada, a aprovação fica associada ao talão até à tecla FIM SUPERVISOR ou ao fim do talão (EXP-33).
j.points-de-controle=PONTOS DE CONTROLO
j.produit-en-rappel-lots=PRODUTO EM RECOLHA - LOTES:
