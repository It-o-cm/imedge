j.montant-obligatoire-et-strictement-positif=Montante obrigatório e estritamente positivo.
j.montant-pre-rempli-du-fond-de-caisse=Montante pré-preenchido do fundo de caixa na abertura da sessão, que o operador de caixa pode corrigir. Configurado por loja e herdado por nível (BO-03-02-41).
j.montant-tenu-par-le-logiciel-realigne=Montante mantido pelo software realinhado.
j.montant-verse=Montante entregue:
