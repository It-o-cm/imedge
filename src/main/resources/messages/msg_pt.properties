j.connexion-par-cle-dallas=Início de sessão com chave Dallas
j.la-cle-dallas-ibutton-attribuee-a-l=A chave Dallas (iButton) atribuída ao operador no ecrã Contas abre a caixa por si só, sem código PIN — o início de sessão sem palavra-passe das caixas self-service (BO-01-02-07). Desativado: uma chave lida é ignorada.
j.langue-par-defaut-du-backoffice-de-la=Língua predefinida do BackOffice, do ecrã da caixa, do ecrã do cliente e do talão: fr, nl ou pt. É a que se aplica quando o operador não escolheu outra e nenhuma língua lhe está atribuída. Vazia ou desconhecida: francês (LC-13-06-01/05/10, BO-01-01-04, BO-10-07-18).
p.cette-cle-dallas-est-deja-attribuee-a=Esta chave Dallas já está atribuída a {0}.
j.beneficiaire-imprimable-par-le-jeton-beneficiair=Beneficiário imprimível através do token {beneficiaire} (LC-07-05-07).
j.ce-qui-est-imprime-au-dos-du=O que é impresso no verso do cheque enquanto o leitor o segura, uma linha por ponto e vírgula. Tokens disponíveis: {date}, {heure}, {montant}, {montant-lettres}, {caisse}, {pdv}, {ticket} (LC-07-05-03). Vazio: a data e a hora e depois o montante, como antes deste parâmetro (BO-03-02-43).
j.compte-optionnel-imprimable-par-compte-lc-07=Conta opcional imprimível através de {compte} (LC-07-05-07).
j.correspondance-entre-l-identifiant-renvoye-par-l=Correspondência entre o identificador devolvido pelo terminal móvel e a designação registada no talão, no formato ID=DESIGNAÇÃO separados por vírgulas. Um identificador ausente da tabela é registado como 'SECOURS MONETIQUE' (LC-07-07-08).
j.delai-d-inactivite-avant-verrouillage-automatiqu=Tempo de inatividade antes do bloqueio automático da caixa. 0 = desativado (LC-01-03-02).
p.expression-reguliere-reconnaissant-au-scan-le-co=Expressão regular que reconhece, na leitura, o código de barras do cesto que um cliente constituiu num aparelho de selfscanning da loja (ex. SS[0-9]{8}). O código reconhecido recupera o cesto depositado no nó da loja, a partir de qualquer caixa, e abre o ecrã SELFSCANNING: controlo e depois integração na venda. Vazio: os cestos recuperam-se pelo respetivo código no ecrã RECUPERAR (LC-06-05-03).
j.expression-reguliere-reconnaissant-au-scan-le-co-2=Expressão regular que reconhece, na leitura, o código de barras impresso num orçamento, numa encomenda ou num talão de venda emitido pela ferramenta de gestão comercial (ex. (DV|CM|BV)[0-9]{6,}). O código reconhecido recupera o documento depositado no nó da loja, tal como uma introdução no ecrã RECUPERAR. Vazio: apenas os códigos de encomenda criados na caixa são reconhecidos na leitura; os restantes introduzem-se no ecrã RECUPERAR (LC-06-02-01, LC-06-02-09).
j.la-lettre-du-regime-de-tva-de=A letra do regime de IVA do artigo é impressa na respetiva linha e no quadro de IVA (0=A, 1=B, 26=AA). Desativado: a linha mostra apenas o preço e o detalhe do IVA fica no quadro de totais. Ativado em França, desativado na Bélgica (BO-03-03-37).
j.le-label-point-de-vente-tel-que=O Label Ponto de Venda tal como o adquirente o escreveu, no formato {TAG}valor: a caixa emite-o tal e qual, sem compor a tag nem o valor. Vazio: nada é acrescentado, mesmo que o acréscimo esteja ativado (BO-03-09-31).
j.lieu-imprimable-par-le-jeton-lieu-lc=Local imprimível através do token {lieu} (LC-07-05-06).
j.message-affiche-au-caissier-quand-un-article=Mensagem apresentada ao operador de caixa quando um artigo GS1 tem data curta; {date} é substituído pela data lida. Vazio: « DATA CURTA (data) » (BO-03-06-64).
j.message-affiche-au-caissier-quand-un-article-2=Mensagem apresentada ao operador de caixa quando um artigo GS1 é recusado pela data de validade; {date} é substituído pela data lida. Vazio: « ARTIGO FORA DE VALIDADE (data) » (BO-03-06-64).
j.message-imprime-sur-le-ticket-d-un-2=Mensagem impressa no talão de um titular de cartão quando o serviço de fidelização não respondeu durante a venda. O token {carte} é substituído pelo número do cartão. Vazio: o talão não indica nada (BO-03-03-29).
j.message-montre-a-l-hote-sse-quand-2=Mensagem apresentada ao operador de caixa quando o pagamento levaria o cliente a ultrapassar o seu limite de crédito. Os tokens {encours} e {plafond} são substituídos pelos montantes (BO-10-04-13).
j.montant-d-especes-au-dela-duquel-la=Montante em numerário acima do qual a caixa apresenta um alerta SANGRIA sem bloquear a venda, ajustado ao montante garantido pelo seguro. 0 = sem limite (EXP-17).
j.montant-maximum-d-une-remise-en-euros=Montante máximo de um desconto em euros numa linha. Um desconto igual a este montante é aceite; acima dele é recusado. 0 = sem limite em euros (BO-03-07-04).
j.montant-maximum-d-une-remise-ticket-en=Montante máximo de um desconto no talão em euros. Um desconto igual a este montante é aceite; acima dele é recusado. 0 = sem limite em euros (BO-03-07-04).
j.montant-maximum-reglable-par-carte-titre-restaur=Montante máximo pagável com cartão refeição (TRD) numa transação, além da base elegível. 0 = limite não aplicado, só a base limita (EXP-60).
p.motif-de-reconnaissance-d-un-numero-de=Padrão de reconhecimento de um número de conta de cliente, sob a forma de expressão regular (por exemplo ^CC\\d{8}$). Um número fora do intervalo é recusado antes de qualquer pesquisa. Vazio: qualquer número é aceite e nenhum intervalo é reconhecido na leitura (BO-03-06-52).
p.motif-de-reconnaissance-d-une-carte-de=Padrão de reconhecimento de um cartão de fidelização na leitura, sob a forma de expressão regular (por exemplo ^299\\d{10}$). Vazio: aplica-se a propriedade de implementação scan.pattern.fidelity (BO-03-06-54).
j.nombre-de-rapports-caissieres-etats-x-du=NÚMERO de relatórios de operadores de caixa (relatórios X do registo técnico) conservados — os mais antigos acima deste número são eliminados. Um número de relatórios, NÃO um número de dias. 0 = conservação ilimitada (BO-10-08-07).
j.nombre-de-jours-apres-la-derniere-activite=Número de dias após a última atividade (última atualização da ficha) a partir do qual um cliente é purgado. Um cliente com saldo de crédito diferente de zero ou ainda associado a uma fatura não é purgado. 0 = conservação ilimitada (BO-10-08-26).
j.nombre-de-jours-apres-la-fin-de=Número de dias após o fim da validade a partir do qual uma promoção expirada é eliminada. 0 = conservação ilimitada (BO-10-08-17).
j.nombre-de-jours-de-conservation-des-alertes=Número de dias de conservação dos alertas (chamadas ao supervisor) registados no registo técnico. 0 = conservação ilimitada (BO-10-08-11).
j.nombre-de-jours-de-conservation-des-articles=Número de dias de conservação dos artigos « eliminados » (desativados) antes da eliminação definitiva. Um artigo ainda referenciado por um preço ou por uma linha de talão não é eliminado. 0 = conservação ilimitada (BO-10-08-24).
j.nombre-de-jours-de-conservation-des-factures=Número de dias de conservação das faturas e guias de remessa. Uma fatura associada a um cliente ainda ativo (não bloqueado) não é eliminada. 0 = conservação ilimitada (BO-10-08-16).
j.nombre-de-jours-de-conservation-des-lignes=Número de dias de conservação das linhas da auditoria de atualização dos dados de referência antes da ELIMINAÇÃO pela limpeza de fim de período. 0 = conservação ilimitada (BO-10-08-10).
j.nombre-de-jours-de-conservation-des-tickets=Número de dias de conservação dos talões em espera (suspensos) antes da eliminação. Um talão em espera associado a uma sessão ainda aberta não é eliminado. 0 = conservação ilimitada (BO-10-08-12).
j.nombre-de-jours-de-conservation-des-ventes=Número de dias de conservação das vendas de artigos (talões fechados) antes da ELIMINAÇÃO pela limpeza de fim de período. Uma venda associada a uma fatura ou a um reembolso nunca é eliminada. 0 = conservação ilimitada. Opção pela eliminação; o arquivo é uma decisão do cliente, fora da implementação (BO-10-08-03).
j.nombre-de-jours-de-conservation-des-evenements=Número de dias de conservação dos eventos técnicos diários não abrangidos por uma linha dedicada (exceto registo de acessos e alertas). 0 = conservação ilimitada (BO-10-08-08).
j.nombre-de-jours-de-conservation-du-journal=Número de dias de conservação do registo de acessos (bloqueios de autenticação, palavras-passe, bloqueio / desbloqueio da caixa). 0 = conservação ilimitada (BO-10-08-09).
j.nombre-maximum-de-promotions-echues-supprimees-a=Número máximo de promoções expiradas eliminadas em CADA passagem da limpeza, para que a purga não bloqueie o fim de período. Não é uma retenção, é um limite por execução. 0 = sem limite (BO-10-08-18).
j.prix-unitaire-au-dela-duquel-la-saisie=Preço unitário acima do qual a introdução de um artigo apresenta um aviso ao operador de caixa. 0 = nenhum aviso.
j.reference-optionnelle-imprimable-par-banque-lc-0=Referência opcional imprimível através de {banque} (LC-07-05-07).
j.un-compte-doit-rester-d-un-niveau-2=Uma conta tem de ter um nível estritamente inferior ao seu, e só um administrador pode criar um administrador.
j.une-regle-par-ligne-get-manual-required=Uma regra por linha: GET /manual=REQUIRED ou POST /sale-tax-id=REQUIRED. NONE dispensa a função de aprovação; os bloqueios e limiares de negócio continuam aplicáveis. A anulação do único artigo mantém a aprovação obrigatória. O sufixo /* abrange os subcaminhos. Prevalece a última regra correspondente. O gesto e o respetivo formulário aguardam a aprovação e são depois repetidos uma única vez. As rotas de início de sessão, de aprovação e de sondagem continuam acessíveis (LC-01-05-01).
