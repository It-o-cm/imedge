j.disposition-des-touches-lettres-des-claviers-alp=Disposição das teclas de letras dos teclados alfabéticos e alfanuméricos do visor de caixa, consoante o país ou a região: AZERTY, QWERTY, QWERTZ ou ABCD. Vazio ou desconhecido: AZERTY (LC-09-01-09).
j.disposition-du-clavier-virtuel=Disposição do teclado virtual
j.document-imprime-automatiquement-par-moyen-de-re=Documento impresso automaticamente por meio de pagamento
j.document-emis-automatiquement-en-fin-de-transact=Documento emitido automaticamente no fim da transação consoante o pagamento, separados por pontos e vírgulas, na forma REGLEMENT:TYPE — exemplo CREDIT:FACTURE. O documento só é emitido se o pagamento designar um cliente de conta. Vazio: nenhuma emissão automática (LC-08-04-16).
j.documents-de-retour-et-tickets-contenant-un=Documentos de devolução e talões que contêm uma devolução; montante c/ IVA devolvido. Apresentação e impressão do relatório de VN (LC-12-07-02).
j.documents-fiscaux-portugais=Documentos fiscais portugueses
j.documents-imprimes-d-office-quel-que-soit=Documentos impressos oficiosamente qualquer que seja a escolha do operador de caixa, separados por pontos e vírgulas: TICKET, CARTE, BON, AVOIR, FID, ENLEVEMENT, RETOUR, ACOMPTE. TICKET, CARTE e BON completam a escolha do operador. Os outros documentos, incluindo a nota de crédito de reembolso e os dois percursos de adiantamento, só saem se forem indicados aqui quando a escolha de impressão está ativada. Vazio: nenhum documento associado sai. Escolha de impressão desativada: impressão habitual. As cópias do cliente continuam disponíveis por email mesmo sem papel (LC-08-03-07, BO-03-03-01).
j.documents-toujours-imprimes=Documentos sempre impressos
j.domaine-inconnu=Domínio desconhecido:
