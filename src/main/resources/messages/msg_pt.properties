j.active-l-ecran-d-ecart-affiche-le=Ativado: o ecrã de diferença apresenta o montante constatado. Desativado (por defeito): indica apenas que a diferença ultrapassa o limiar, sem o valor — um operador que lê a diferença pode ajustar a sua contagem até a fazer desaparecer. O montante permanece no Z, no diário e para a responsável.
j.active-la-touche-monnayeur-regle-les-especes=Ativado: a tecla MOEDEIRO liquida o numerário no moedeiro, que devolve o troco; o montante inserido é apresentado nos dois visores, o numerário é recolhido para o cofre no fim da venda, e os limiares assinalados pelo moedeiro são anunciados na abertura e após cada venda (LC-07-15-01 a -04, LC-13-01-01).
j.active-palier-le-plus-proche-desactive-palier=Ativado: patamar mais próximo; desativado: patamar superior. Não é adicionado nenhum donativo negativo (LC-07-17-02).
j.active-pas-de-coupe-avant-le-ticket=Ativado: sem corte antes do talão de cliente Verifone; o talão do comerciante fica separado e não é arquivado (LC-07-04-11).
j.adresse-de-base-du-service-fidelite-appele=Endereço base do serviço de fidelização chamado para valorizar o cesto com as vantagens de fidelização, projetar o saldo acumulado e enviar as transações. Vazio: aplica-se a propriedade de implementação pos.fid.url (BO-11-04-04).
