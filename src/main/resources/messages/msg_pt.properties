j.commande-darret-du-poste=Comando de encerramento do posto
j.commande-inconnue=Encomenda desconhecida.
j.comment-l-adresse-ci-dessus-est-rendue=Como o endereço acima é apresentado: QR (código QR, por defeito), BARCODE (código de barras), TEXTE (o endereço escrito por extenso) ou AUCUN (nada é impresso, mesmo que um endereço esteja introduzido). Um valor desconhecido recorre a QR (BO-03-05-08).
j.comment-le-ticket-voyage-dans-l-email=Como o talão viaja no email: BODY (no corpo da mensagem, por defeito), ATTACHMENT (em anexo) ou BOTH (ambos). Com logótipo: corpo HTML com imagens integradas e alternativa de texto, anexo HTML autónomo. Sem logótipo: texto e anexo TXT. Um valor desconhecido recorre a BODY (LC-08-02-07/08).
j.comment-les-lignes-d-avantage-sont-regroupees=Como as linhas de vantagem são agrupadas sob o saldo acumulado do dia: TYPE (por tipo de vantagem, por defeito), CATEGORY (por categoria) ou NONE (lista plana). Com CATEGORY, os grupos saem pela ordem de prioridade de categoria comunicada pela resposta do programa de fidelidade, depois pela ordem de chegada para as categorias sem posição. Um valor desconhecido recorre a TYPE (BO-03-03-25, BO-03-03-33, BO-10-03-20).
j.compresser-l-image-du-ticket=Comprimir a imagem do talão
j.comptage-conforme-au-montant-tenu-par-le=Contagem conforme ao montante mantido pelo software.
