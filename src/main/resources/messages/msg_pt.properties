j.parametrage=Parametrização
j.pas-d-arrondi-du-reglement-especes-centimes=Passo de arredondamento do pagamento em numerário (cêntimos)
j.passages-en-formation=Passagens para formação
j.passe-manuelle-de-diffusion-au-fil-de=Passagem manual de difusão contínua:
j.pause-automatique-secondes=Pausa automática (segundos)
