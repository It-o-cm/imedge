j.niveau-de-la-nomenclature-ifls-auquel-le=Nível da nomenclatura IFLS ao qual o volume de negócios por nomenclatura é apresentado (R16): 0 é a raiz. Predefinição 1.
j.niveau-du-controle-none-aucun-controle-warn=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Acionado acima da quantidade limite abaixo (BO-10-02-06).
j.niveau-du-controle-none-aucun-controle-warn-2=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Acionado acima do total limite abaixo (BO-10-02-07). ENDORSE equivale aqui a BLOCK: não existe nenhum procedimento de aprovação neste momento.
j.niveau-du-controle-none-aucun-controle-warn-3=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Os talões em espera não retomados são anulados pelo fecho: este controlo é o que avisa o operador de caixa (BO-10-02-08). ENDORSE equivale aqui a BLOCK: não existe nenhum procedimento de aprovação neste momento.
j.niveau-du-controle-none-aucun-controle-warn-4=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Incide sobre o abandono dos pagamentos já cobrados de um talão em curso de pagamento (BO-10-02-02).
j.niveau-du-controle-none-aucun-controle-warn-5=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Incide sobre a utilização dos meios de pagamento eletrónicos na caixa (BO-10-02-10). ENDORSE equivale aqui a BLOCK: não existe nenhum procedimento de aprovação neste momento.
j.niveau-du-controle-none-aucun-controle-warn-6=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Incide sobre o montante introduzido para um meio de pagamento, comparado em valor absoluto (BO-10-02-17). ENDORSE equivale aqui a BLOCK: não existe nenhum procedimento de aprovação neste momento.
j.niveau-du-controle-none-aucun-controle-warn-7=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Incide sobre o preço forçado de uma linha, comparado em valor absoluto: uma venda e uma devolução têm o mesmo limite (BO-10-02-16).
j.niveau-du-controle-none-aucun-controle-warn-8=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Incide sobre as aberturas que não pagam nenhuma venda: início de turno e fecho de sessão (BO-10-02-04). ENDORSE equivale aqui a BLOCK: não existe nenhum procedimento de aprovação neste momento.
j.niveau-du-controle-none-aucun-controle-warn-9=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Sem efeito quando a aprovação do supervisor para anulação de linha está desativada: este sinalizador indica SE a ação é vigiada, esta chave indica o que acontece então (BO-10-02-01).
j.niveau-du-controle-none-aucun-controle-warn-10=Nível do controlo: NONE (nenhum controlo), WARN (alerta não bloqueante, a ação prossegue e o operador é avisado), BLOCK (ação recusada, que nenhuma permissão da caixa levanta) ou ENDORSE (ação recusada até à aprovação de um supervisor). Um valor desconhecido volta ao predefinido deste ponto. Sem efeito quando a aprovação do supervisor para reembolso está desativada: este sinalizador indica SE a ação é vigiada, esta chave indica o que acontece então (BO-10-02-03).
j.niveau-introuvable=Nível não encontrado.
j.niveau-echelon-et-parametre-sont-obligatoires=Nível, escalão e parâmetro são obrigatórios.
j.nom-de-l-organisme-qui-a-certifie=Nome do organismo que certificou o conjunto de pesagem da caixa (organismo notificado), apresentado pela tecla METROLOGIA do ecrã de manutenção. Vazio: « não preenchido » (LC-14-03-01).
j.nom-de-la-caissiere=Nome da operadora de caixa
j.nom-du-point-de-retrait=Nome do ponto de levantamento
j.nom-du-segment-auquel-un-client-en=Nome do segmento a que um cliente com conta deve pertencer para que o seu desconto se aplique. Vazio: o desconto da ficha aplica-se a qualquer cliente com conta que o tenha (BO-10-04-07).
j.nom-du-theme-applique-a-l-ecran=Nome do tema aplicado ao ecrã da caixa em modo formação, para o distinguir do ecrã de venda padrão (escuro, claro). Vazio: a formação mantém o tema habitual e só a faixa a assinala (BO-10-07-08).
j.nom-ou-badge-du-valideur-obligatoire=Nome ou crachá do validador obrigatório.
j.nombre-d-articles=Número de artigos
j.nombre-d-articles-que-le-caissier-re=Número de artigos que o operador de caixa volta a ler num controlo parcial; um artigo ausente do cabaz ou em excesso faz passar para controlo total (LC-06-05-04, LC-06-05-05).
j.nombre-d-articles-retenus-au-classement-des=Número de artigos incluídos na classificação dos mais vendidos, ordenados por quantidade decrescente (R19). Predefinição 20.
j.nombre-d-authentifications-back-office-erronees=Número de autenticações erradas consecutivas no back-office ao fim das quais a conta é bloqueada. 0: sem bloqueio, as tentativas não são contadas (BO-01-01-01).
j.nombre-d-exemplaires-du-bon-d-enlevement=Número de exemplares da guia de levantamento
j.nombre-de-clients=Número de clientes
j.nombre-de-colonnes-de-saisie-directe-de=Número de colunas de introdução direta, de 2 a 6 (LC-02-07-02).
j.nombre-de-decimales-de-la-base-hors=Número de casas decimais da base sem imposto de cada linha da tabela de IVA: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
j.nombre-de-decimales-du-montant-de-taxe=Número de casas decimais do montante de imposto de cada linha da tabela de IVA: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
j.nombre-de-decimales-du-prix-unitaire-hors=Número de casas decimais do preço unitário sem imposto na fatura e na guia de remessa: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-hors-taxe=Número de casas decimais do total sem imposto no rodapé do documento: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-toutes-taxes=Número de casas decimais do total com impostos no rodapé do documento: 2 ou 3. Outro valor volta a 2 (BO-10-02-19).
j.nombre-de-declenchements=Número de acionamentos
j.nombre-de-jours-au-bout-desquels-la=Número de dias ao fim dos quais a caixa e o back-office convidam o titular a mudar o seu código. 0: sem expiração, o código continua válido indefinidamente. Um segredo nunca alterado é considerado expirado assim que for definido um prazo (BO-01-02-12).
j.nombre-de-jours-avant-la-date-de=Número de dias antes da data de validade a partir do qual esta é considerada próxima. Zero: só uma data atingida ou ultrapassada aciona o alerta (LC-11-03-13).
j.nombre-de-jours-en-arriere-sur-lesquels=Número de dias para trás em que a caixa procura um talão fechado — reimpressão, troca, reembolso — antes de abandonar a pesquisa. 0 ou valor negativo: a profundidade integrada de 30 dias (BO-10-07-16).
j.nombre-de-jours-pendant-lesquels-les-etats=Número de dias durante os quais os mapas emitidos automaticamente no fim de cada período são conservados com o seu documento. 0: conservação ilimitada, como qualquer retenção não configurada (BO-09-03-02).
j.nombre-de-jours-pendant-lesquels-un-bon=Número de dias durante os quais um vale, um crédito ou um cartão-oferta cuja validade expirou SEM nunca ter sido utilizado permanece na base antes da eliminação, contados a partir da sua data de validade. 0: conservação ilimitada (BO-10-08-13).
j.nombre-de-jours-pendant-lesquels-un-instrument=Número de dias durante os quais um instrumento SEM data de validade permanece na base após a sua emissão, antes da eliminação. 0: conservação ilimitada (BO-10-08-15).
j.nombre-de-jours-pendant-lesquels-un-instrument-2=Número de dias durante os quais um instrumento datado e esgotado permanece na base após o seu esgotamento, antes da eliminação. 0: conservação ilimitada (BO-10-08-14).
j.nombre-de-jours-date-proche=Número de dias « data próxima »
j.nombre-de-lignes-annulees-et-montant-ttc=Número de linhas anuladas e montante c/ IVA retirado. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-de-lignes-imprimees-sur-une-facturette=Número de linhas impressas num talão de pagamento antes de pedir a folha seguinte. Abaixo de 1, o talão de pagamento é impresso de uma só vez (LC-08-04-12/13).
j.nombre-de-lignes-vendues-avec-prix-force=Número de linhas vendidas com preço forçado e o seu montante final c/ IVA. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-de-minutes-avant-la-fin-de=Número de minutos antes do fim do período a partir do qual as caixas ainda abertas são fechadas. Uma caixa em plena venda não é fechada: a ordem fica em espera e a caixa retoma-a assim que estiver em repouso (BO-09-03-07).
j.nombre-de-minutes-pendant-lesquelles-une-caisse=Número de minutos durante os quais uma caixa pode deixar de dar sinal de vida antes que o back-office a declare desligada. Cada caixa vem buscar as suas ordens a cada vinte segundos, pelo que um valor de três minutos tolera oito ciclos falhados. 0 ou menos: três minutos; uma tolerância nula declararia toda a gente fora de linha entre duas chamadas (BO-04-03-05).
j.nombre-de-pochettes=Número de bolsas:
j.nombre-de-reglements-et-montant-encaisse-par=Número de pagamentos e montante cobrado por meio de pagamento. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-de-secondes-entre-deux-lectures-du=Número de segundos entre duas leituras do diretório FTP das balanças. Zero: recolha parada (BO-03-06-56).
j.nombre-de-touches-de-groupe-d-articles=Número de teclas de grupo de artigos apresentadas por página no ecrã de introdução direta. Abaixo de 1 aplica-se o valor predefinido (BO-03-01-06).
j.nombre-de-touches-groupe-par-page=Número de teclas de grupo por página
j.nombre-et-montant-ttc-des-tickets-abandonnes=Número e montante c/ IVA dos talões abandonados. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-et-montant-des-apports-au-tiroir=Número e montante dos reforços da gaveta. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-et-montant-des-depenses-de-caisse=Número e montante das despesas de caixa. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nombre-et-montant-des-prelevements-du-tiroir=Número e montante das recolhas da gaveta. Apresentação e impressão do relatório de volume de negócios (LC-12-07-02).
j.nomenclature-introuvable=Nomenclatura não encontrada.
j.nothing-to-encode=Nothing to encode
j.numero-fiscal-presente-en-caisse-avant-validatio=Número fiscal apresentado na caixa antes da validação do talão, que o operador de caixa pode substituir pelo do cliente. Vazio: nenhum NIF é proposto (BO-10-04-15).
j.numero-de-certification-du-logiciel-delivre-par=Número de certificação do software emitido pela administração fiscal, impresso em todos os documentos de venda e de devolução da caixa. Vazio: nenhuma menção é impressa, o que é o caso de qualquer país que não o exija. Definido no nível PAYS, desce a todas as caixas desse país (BO-10-06-03).
j.numero-de-demande-obligatoire=Número de pedido obrigatório.
j.numero-de-pochette-obligatoire=Número da bolsa obrigatório.
j.numero-de-sac-obligatoire=Número do saco obrigatório.
j.numero-du-certificat-d-examen-de-type=Número do certificado de exame de tipo ou de avaliação do conjunto de pesagem, apresentado pela tecla METROLOGIA do ecrã de manutenção. Vazio: « não preenchido » (LC-14-03-01).
j.numeros-de-lot-en-rappel=Números de lote em recolha
j.n-article=N.º artigo
j.n-de-certificat-metrologique=N.º de certificado metrológico
j.n-de-certification-fiscale=N.º de certificação fiscal
j.n-de-compte-deja-attribue=N.º de conta já atribuído:
j.n-de-compte-obligatoire=N.º de conta obrigatório.
j.n-de-la-caissiere=N.º da operadora de caixa
j.n-de-la-promotion=N.º da promoção
j.n-de-la-raison=N.º do motivo
j.n-du-ticket=N.º do talão
j.n-famille=N.º família
