j.m19-niveau-nomenclature-regroupement=Nível da nomenclatura para agrupar os artigos
j.m19-niveau-nomenclature-regroupement-aide=Quando os artigos são agrupados por família, o nível da nomenclatura sob o qual são reunidos: 1 para o primeiro nível (secção), 2 para o segundo, e assim por diante. O título impresso é o rótulo do nó desse nível. 0: a família do artigo, como antes. Um nível que a nomenclatura não tem, ou um artigo sem nomenclatura, mantém a sua própria família (BO-03-03-17).
j.m19-emplacement-promotions=Posição das linhas de promoção
j.m19-emplacement-promotions-aide=Onde o talão imprime as promoções do motor: LINE sob o artigo em causa, FOOTER agrupadas no rodapé do talão, ENGINE segundo a posição indicada por cada vantagem (sob o artigo quando o motor o pede, no rodapé caso contrário). Valor desconhecido: ENGINE (BO-03-03-23).
j.m19-attributs-facture=Atributos do artigo impressos na fatura
j.m19-attributs-facture-aide=Códigos dos atributos do artigo impressos sob cada linha da fatura e da guia de entrega, separados por ponto e vírgula (ex. ORIGINE;CATEGORIE;VARIETE). Cada atributo é impresso na forma « rótulo : valor », um atributo sem valor para o artigo é omitido. Estes atributos nunca são impressos no talão de caixa. Vazio: apenas a família do artigo é indicada (BO-03-03-21).
j.m19-lignes-page-a4=Linhas de artigos por página A4
j.m19-lignes-page-a4-aide=Número de linhas de artigos numa página de fatura A4: além disso, o documento passa para uma nova página, cada página retomando o cabeçalho e a menção « página X / Y ». 0: uma única página (BO-03-03-02).
j.m19-compte-client-obligatoire=Número de conta de cliente obrigatório
j.m19-compte-client-obligatoire-aide=Uma fatura ou uma guia de entrega só pode ser emitida para um cliente com número de conta de cliente, impresso no bloco do cliente do documento. Desativado: o número é impresso quando o cliente o tem (BO-03-04-16).
j.m19-validation-client=Validação dos dados do cliente antes da impressão
j.m19-validation-client-aide=Após a seleção do cliente, a caixa mostra os seus dados (morada, SIRET, IVA, NIF, conta) para que o operador de caixa os valide ou modifique antes da impressão do documento. Desativado: o documento é mostrado diretamente, sem etapa de validação (BO-03-04-18).
j.m19-message-fid-2-lignes=Mensagem de vantagem de fidelização 2 linhas
j.m19-message-fid-2-lignes-aide=A mensagem curta (2 linhas) transmitida pelo programa de fidelização é impressa na zona de vantagens do cartão, antes da lista das vantagens da transação. Desativado: não é impressa (BO-03-03-26).
j.m19-messages-commerciaux-fid=Mensagens comerciais de fidelização 10 linhas
j.m19-messages-commerciaux-fid-aide=Número máximo de mensagens comerciais (10 linhas cada) transmitidas pelo programa de fidelização impressas no fim da secção de fidelização do talão, de 0 a 5. 0: nenhuma mensagem comercial é impressa (BO-03-03-27).
j.m19-documents-toujours-imprimes-aide=Documentos impressos oficiosamente qualquer que seja a escolha do operador, separados por ponto e vírgula: TICKET, CARTE, BON, AVOIR, FID, ENLEVEMENT, RETOUR, ACOMPTE, CARTE_PREPAYEE (comprovativo de pagamento com cartão oferta ou pré-pago), DEMAT (talão de ativação de um produto desmaterializado). TICKET, CARTE e BON completam a escolha do operador. Os outros documentos, incluindo o vale de reembolso e os dois percursos de adiantamento, só saem se forem aqui nomeados quando a escolha de impressão está ativada. Vazio: nenhum documento associado sai. Escolha de impressão desativada: impressão habitual. As cópias do cliente continuam disponíveis por email mesmo sem papel (LC-08-03-07, BO-03-03-01).
j.m19-atcud-aide=Código de validação atribuído pela administração fiscal a cada série de documentos da caixa, na forma TIPO:CÓDIGO separados por ponto e vírgula (ex. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). O ATCUD impresso é o código, um hífen e depois o número do documento na sua série. Administrável por caixa, tendo cada caixa as suas próprias séries. Um código com menos de 8 caracteres não é um código da administração e equivale a ausência de código. Tipo sem código: ATCUD « 0-número » (LC-08-04-23, BO-03-04-27).
