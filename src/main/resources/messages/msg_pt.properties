j.cle-du-moyen-de-paiement-sous-lequel=Chave do meio de pagamento sob o qual o crédito de cliente é registado no talão e nos relatórios. Uma chave desconhecida recorre a CREDIT (BO-10-04-09).
j.click-and-collect=Click and collect
j.clients-purge-apres-derniere-activite-jours=Clientes: limpeza após a última atividade (dias)
