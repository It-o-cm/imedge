j.rc3-parametre-01=Teclas de desconto prontas a usar, separadas por « ; ». Uma entrada é um rótulo, depois « > », depois PERCENT ou AMOUNT, « : » e o valor; acrescentar « ,CUMUL » autoriza este desconto num artigo já descontado ou em promoção. Exemplo: « -20%>PERCENT:20 ; 2€ a menos>AMOUNT:2,CUMUL ». Vazio: nenhuma tecla predefinida, apenas a introdução livre (BO-03-07-03, BO-03-07-06, BO-03-07-11).
j.rc3-parametre-02=Associações D16:código=MEIO ou D46:código=MEIO separadas por pontos e vírgulas. D16 conhecido prevalece, depois D46; caso contrário CARD (LC-07-07-04).
j.rc3-parametre-03=Aplicações de terceiros acessíveis a partir do posto, separadas por pontos e vírgulas, na forma RÓTULO>URL (ex. Cartão fidelidade>https://fid.magasin/caisse). Uma entrada mal formada é ignorada. Vazio: nenhuma aplicação proposta (BO-03-09-27).
j.rc3-parametre-04=Identificador da conta de máquina da caixa junto do serviço de fidelidade. Vazio: aplica-se a propriedade de implementação pos.fid.user. A palavra-passe define-se no parâmetro « Palavra-passe do serviço de fidelidade » (BO-11-04-04, BO-10-03-08).
j.rc3-parametre-05=Aval do supervisor: reatribuição de um talão
j.rc3-parametre-06=A reatribuição de um talão fechado a um cliente fidelizado exige o aval de um supervisor (LC-03-06-01). Desativado: o operador reatribui sozinho.
j.rc3-parametre-07=Duplicado PDV da reatribuição
j.rc3-parametre-08=A reatribuição de um talão imprime também um duplicado para o ponto de venda (LC-03-06-05). Desativado: só sai o talão do cliente.
j.rc3-parametre-09=Correspondência entre o valor facial de uma moeda ou nota e o valor em euros de um rolo completo, separadas por pontos e vírgulas, na forma FACIAL:VALOR_ROLO — exemplo 0.20:8.00;0.01:0.50. Serve para o cálculo cruzado montante <-> número de rolos (LC-12-05-06/07). Vazio: nenhum cálculo cruzado é proposto.
j.rc3-parametre-10=Tipos de devolução propostos na caixa além dos dois gestos de base, separados por pontos e vírgulas. Um tipo escreve-se « Rótulo », ou « Rótulo>TICKET » para um tipo que abre um talão de devolução dedicado em vez de retomar o artigo na venda. Vazio: só os dois gestos de base são propostos (LC-05-04-01).
j.rc3-parametre-11=Cada linha do cesto transmitido ao motor de promoções leva o código da família do artigo e o da sua subfamília, para que vantagens possam ser acionadas a esse nível; o cesto segue tal qual para o programa de fidelidade, que recebe assim a subfamília de cada artigo (gestão do artigo à subfamília, Intermarché France). Desativado: a linha só leva o código do artigo (BO-10-03-19, BO-10-08-22).
j.rc3-parametre-12=Associação de um código de nó de nível 0 a um dos quatro setores FRAIS_TRAD, FRAIS_LS, SEC, NON_ALIMENTAIRE, na forma « código>SETOR » separada por « ; » (R16). Os três primeiros formam o volume de negócios alimentar.
j.rc3-parametre-13=Produz os três ficheiros de painel — Scannels, Scvenmag, Tlogextr — num arquivo único MS.<PDV>.<jour>.zip (BO-11-01-19).
j.rc3-parametre-14=Pedir os saldos das carteiras
j.rc3-parametre-15=A caixa pede ao programa de fidelidade o saldo de CADA uma das suas carteiras (FID Portugal), calculado com os elementos da transação em curso: vantagens de fidelidade do talão e pagamento de fidelidade já liquidado. Os saldos são mostrados no ecrã de fidelidade da caixa e relidos no fecho do talão. Desativado — o padrão — só o saldo da conta é consultado (BO-10-02-33).
j.rc3-parametre-16=Meio de pagamento do pagamento de fidelidade
j.rc3-parametre-17=Chave do meio de pagamento sob o qual um pagamento com a carteira de fidelidade é registado no talão, nos relatórios e nos fluxos. Uma chave desconhecida recai em FIDELITY (BO-10-03-06).
j.rc3-parametre-18=Palavra-passe do serviço de fidelidade
j.rc3-parametre-19=Palavra-passe da conta de máquina da caixa junto do serviço de fidelidade, distribuída às caixas com os outros parâmetros e nunca reapresentada: um campo deixado vazio conserva o valor registado. Vazio: aplica-se a propriedade de implementação pos.fid.password (BO-10-03-08).
j.rc3-parametre-20=Tempo de ligação ao serviço de fidelidade (ms)
j.rc3-parametre-21=Tempo concedido à abertura da ligação ao serviço de fidelidade, em milissegundos. Para além disso, a caixa indica que a fidelidade está indisponível e a venda continua sem ela. 0: 1500 ms (BO-10-03-10).
j.rc3-parametre-22=Tempo de resposta do serviço de fidelidade (ms)
j.rc3-parametre-23=Tempo concedido ao serviço de fidelidade para responder a uma chamada (carteira, vantagens, pesquisa, pagamento), em milissegundos. Para além disso, a caixa indica que a fidelidade está indisponível e a venda continua sem ela. 0: 2500 ms (BO-10-03-10).
j.rc3-parametre-24=Enviar a data da encomenda ao motor de promoções
j.rc3-parametre-25=Quando o talão retoma uma encomenda, o cesto transmitido ao motor de promoções — e, através dele, ao programa de fidelidade — leva a data da encomenda, para que as vantagens adquiridas nessa data sejam acionadas, incluindo campanhas expiradas. Desativado — o padrão — só a data do talão é transmitida (BO-10-03-17).
j.rc3-parametre-26=Cadência dos relatórios de nó (segundos)
j.rc3-parametre-27=Intervalo entre dois relatórios de uma caixa à sua loja e de uma loja à central: versão, estado de atualização, periféricos, inventário, integrações, uso das funções. Lido no arranque do nó; zero ou menos: sessenta segundos (BO-08-04-15, BO-08-04-16, BO-08-04-20, BO-08-03-01).
j.rc3-parametre-28=Contagem do uso das funções
j.rc3-parametre-29=Cada função de caixa e cada gesto do back-office é contado por dia, por nó e por função, e depois enviado à central para as estatísticas. Desativado: nada é contado (BO-08-02-02).
j.rc3-parametre-30=As ordens de manutenção emitidas pela central ou pela loja (relançamento do TPA, reinicialização de um periférico, relançamento dos referenciais, controlo de atualização) são executadas pelo nó. Desativado: o nó recusa-as e a recusa é registada (BO-08-04-17).
j.rc3-parametre-31=Relançamento automático das integrações em erro
j.rc3-parametre-32=Um ficheiro depositado cuja integração falhou ou deixou linhas rejeitadas é conservado e reintegrado automaticamente à cadência administrada. Desativado: só o relançamento manual da consola de integração o volta a executar (BO-08-04-03, BO-08-04-04, BO-08-04-05, BO-08-04-06, BO-08-04-07, BO-08-04-08).
j.rc3-parametre-33=Intervalo entre dois relançamentos de integração (minutos)
j.rc3-parametre-34=Tempo mínimo entre duas reintegrações automáticas de um mesmo depósito em erro. Zero ou menos: dez minutos (BO-08-04-03, BO-08-04-08).
j.rc3-parametre-35=Número máximo de relançamentos de integração
j.rc3-parametre-36=Para além disso, o depósito é abandonado pelo relançamento automático e só volta a partir pelo relançamento manual. Zero ou menos: cinco (BO-08-04-03, BO-08-04-09, BO-08-04-13).
j.rc3-parametre-37=Alertas de caixa em dispositivo móvel
j.rc3-parametre-38=Os alertas de caixa (chamadas de supervisor) aparecem na página móvel do back-office, onde um responsável os confirma, autoriza ou recusa à distância. Desativado: a página móvel não mostra nenhum alerta (BO-10-08-02).
j.rc3-parametre-39=Atualização automática no arranque
j.rc3-parametre-40=Um nó cuja versão é inferior à do seu lote de implementação atualiza-se no arranque, mesmo fora da janela do lote: a caixa ou a loja sazonal recupera a versão ao ligar-se. Desativado: aguarda a próxima janela (BO-08-03-07).
j.rc3-parametre-41=Número de tentativas de atualização
j.rc3-parametre-42=Uma atualização falhada é tentada de novo automaticamente no relatório seguinte do nó, até este número; para além disso, só um forçar a partir da consola de implementação a relança. Zero ou menos: três (BO-08-04-01, BO-08-04-02).
j.rc3-parametre-43=Reversão automática
j.rc3-parametre-44=Uma versão instalada que falha o seu autoteste é substituída automaticamente pela versão aplicativa anterior, sem tocar nos dados dos referenciais. Desativado: o nó fica na versão falhada, assinalada como anomalia (BO-08-04-14).
