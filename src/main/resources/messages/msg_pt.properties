# lot 18 recette RC1: FIDÉLITÉ parameters (BO-10-02-33, BO-10-03-06, -08, -10, -17, BO-10-08-22)
j.delai-de-connexion-au-service-fidelite=Prazo de ligação ao serviço de fidelização (ms)
j.temps-accorde-a-l-ouverture-de-la-connexion-fidelite=Tempo concedido à abertura da ligação ao serviço de fidelização, em milissegundos. Para além dele, a caixa indica que a fidelização está indisponível e a venda continua sem ela. 0: 1500 ms (BO-10-03-10).
j.envoyer-la-date-de-commande-au-moteur=Enviar a data da encomenda ao motor de promoções
j.quand-le-ticket-reprend-une-commande-le-panier=Quando o talão retoma uma encomenda, o cesto transmitido ao motor de promoções — e, através dele, ao programa de fidelização — leva a data da encomenda, para que as vantagens adquiridas nessa data sejam acionadas, incluindo campanhas expiradas. Desativado — o valor por defeito — apenas a data do talão é transmitida (BO-10-03-17).
j.mot-de-passe-du-service-fidelite=Palavra-passe do serviço de fidelização
j.mot-de-passe-du-compte-machine-de-la-caisse=Palavra-passe da conta máquina da caixa junto do serviço de fidelização, distribuída às caixas com os outros parâmetros e nunca reapresentada: um campo deixado vazio conserva o valor registado. Vazio: aplica-se a propriedade de implementação pos.fid.password (BO-10-03-08).
j.moyen-de-paiement-du-paiement-fidelite=Meio de pagamento do pagamento de fidelização
j.cle-du-moyen-de-paiement-sous-lequel-fidelite=Chave do meio de pagamento sob o qual um pagamento com o mealheiro de fidelização é registado no talão, nos mapas e nos fluxos. Uma chave desconhecida recai em FIDELITY (BO-10-03-06).
j.demander-les-soldes-des-cagnottes=Pedir os saldos dos mealheiros
j.la-caisse-demande-le-solde-de-chacune-cagnotte=A caixa pede ao programa de fidelização o saldo de CADA um dos seus mealheiros (FID Portugal), calculado com os elementos da transação em curso: vantagens de fidelização do talão e pagamento de fidelização já liquidado. Os saldos são apresentados no ecrã de fidelização da caixa e relidos no fecho do talão. Desativado — o valor por defeito — apenas o saldo da conta é consultado (BO-10-02-33).
j.delai-de-reponse-du-service-fidelite=Prazo de resposta do serviço de fidelização (ms)
j.temps-accorde-au-service-fidelite-pour-repondre=Tempo concedido ao serviço de fidelização para responder a uma chamada (mealheiro, vantagens, pesquisa, pagamento), em milissegundos. Para além dele, a caixa indica que a fidelização está indisponível e a venda continua sem ela. 0: 2500 ms (BO-10-03-10).
j.chaque-ligne-du-panier-porte-famille-et-sous-famille=Cada linha do cesto transmitido ao motor de promoções leva o código da família do artigo e o da sua subfamília, para que possam ser acionadas vantagens a esse nível; o cesto segue tal como está para o programa de fidelização, que recebe assim a subfamília de cada artigo (gestão de artigos à subfamília, Intermarché França). Desativado: a linha só leva o seu código de artigo (BO-10-03-19, BO-10-08-22).
j.identifiant-du-compte-machine-mot-de-passe-parametre=Identificador da conta máquina da caixa junto do serviço de fidelização. Vazio: aplica-se a propriedade de implementação pos.fid.user. A palavra-passe é definida pelo parâmetro « Palavra-passe do serviço de fidelização » (BO-11-04-04, BO-10-03-08).
