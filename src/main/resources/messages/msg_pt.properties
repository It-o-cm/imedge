j.des-articles-peuvent-etre-repris-dans-un=Os artigos podem ser devolvidos num talão que já tem vendas: o total do talão é então positivo ou negativo consoante os montantes. Desativado: uma devolução regista-se no seu próprio talão, nunca misturada com uma venda (LC-05-01-01).
j.des-mouvements-de-la-periode-ne-sont=Há movimentos do período que não estão validados.
