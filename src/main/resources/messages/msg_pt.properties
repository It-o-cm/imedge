j.n19-parametre-2=Os artigos de um grupo do ecrã de introdução direta são apresentados do mais vendido ao menos vendido, segundo o volume de vendas calculado pelo nó de loja sobre as vendas das caixas. Desativado: são apresentados por ordem alfabética da designação, a ordenação aplicada por defeito quando nenhuma é escolhida na caixa (BO-03-01-10, BO-03-01-13).
