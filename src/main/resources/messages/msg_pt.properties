j.liste-des-contenants-proposes-au-caissier-pour=Lista dos recipientes propostos ao operador de caixa para uma tara pontual, separados por ponto e vírgula, na forma CÓDIGO:DESCRIÇÃO:PESO_KG (ex. SACPAP:Saco kraft:0.010;BQS:Cuvete S:0.035). A tara do recipiente substitui pontualmente a tara do artigo ou a predefinida e não é persistente. Vazio: nenhum recipiente proposto (LC-14-01-04/05).
