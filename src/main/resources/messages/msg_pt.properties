j.ce-profil-est-deja-affecte-a-cet=Este perfil já está atribuído a este escalão.
j.ce-que-fait-la-caisse-au-bout=O que a caixa faz ao fim do prazo de inatividade: LOCK (bloqueio — o operador fica no posto e retoma a sua venda apenas com o seu código, por defeito) ou CLOSE (fecho da sessão de trabalho — o operador é desligado e é necessária uma entrada em posto completa). Um valor desconhecido recorre a LOCK (BO-10-02-28).
j.ce-que-fait-la-caisse-quand-elle=O que a caixa faz quando lê um código de barras tendo perdido a ligação ao nó de loja: NONE (nada), INFO (mensagem ao operador, o código é tratado) ou BLOCK (o código é recusado). Vazio ou desconhecido: NONE (BO-03-06-45).
j.ce-que-fait-la-caisse-quand-un=O que a caixa faz quando um vale, vale de crédito ou cartão-presente lido não é conhecido nem pela caixa nem pelo nó de loja: INFO (mensagem, nenhum pagamento) ou BLOCK (mensagem de erro, o vale é recusado). Vazio ou desconhecido: BLOCK (BO-03-06-48).
j.ce-que-fait-la-caisse-quand-un-2=O que a caixa faz quando um código GS1 tem uma data de validade (AI 17) próxima, atingida ou ultrapassada: NONE (nada), INFO (mensagem ao operador, o artigo é registado), BLOCK (artigo recusado) ou SUPERVISOR (artigo recusado, um supervisor pode forçar o seu registo). Vazio ou desconhecido: NONE (LC-11-03-13, BO-03-06-64).
j.ce-que-fait-la-caisse-quand-un-3=O que a caixa faz quando um cupão GS1 tem uma data de expiração (AI 17) atingida ou ultrapassada: NONE, INFO ou BLOCK. Vazio ou desconhecido: NONE (LC-11-03-13).
j.ce-que-fait-la-caisse-quand-un-4=O que a caixa faz quando um pagamento parcial já está registado: CONFIRM (o ecrã anuncia os pagamentos que serão anulados e o operador valida) ou BLOCK (o abandono é recusado, o operador deve anular primeiro o pagamento). Vazio ou desconhecido: CONFIRM (LC-04-04-06/07/08/09).
j.ce-que-la-fin-de-periode-du=O que o fecho de período do PONTO DE VENDA encadeia, nomes separados por pontos e vírgulas e por ordem: CLOSE_REGISTERS (fechar as caixas que ficaram abertas), SAFE_COUNT (contagem do cofre), Z_REPORT (relatório Z consolidado), BANK_DEPOSIT (depósito bancário). Um nome desconhecido é ignorado. Vazio: o fecho de período só faz o que as chaves acima descrevem, caixa a caixa (BO-03-12-02).
j.cet-identifiant-est-deja-pris=Este identificador já está a ser utilizado.
j.cet-inventaire-ne-presente-pas-d-ecart=Este inventário não apresenta diferença a regularizar.
j.cette-affectation-depasse-votre-niveau-hierarchi=Esta atribuição ultrapassa o seu nível hierárquico.
j.cette-caisse-n-accepte-que-des-retours=Esta caixa só aceita devoluções: o modo devolução é permanente e nenhuma venda é possível. Desativado: a caixa vende e aceita devoluções (LC-05-01-03).
j.cette-demande-n-attend-plus-de-livraison=Este pedido já não aguarda entrega.
j.cette-demande-ne-peut-plus-etre-annulee=Este pedido já não pode ser cancelado.
j.cette-pochette-existe-deja=Esta bolsa já existe:
j.cette-population-demande-de-nommer-l-ilot=Esta população requer que se indique a ilha, a caixa ou o operador.
j.champs-demandes-a-la-creation-d-un=Campos pedidos na criação de um cliente na caixa, separados por pontos e vírgulas, com um asterisco a marcar os obrigatórios: companyName, contactName, street, postalCode, city, siret, vatNumber, phone, email. Vazio: todos os campos, denominação social obrigatória (LC-08-04-10).
j.champs-du-client-en-compte=Campos do cliente de conta
j.changement-de-langue-pendant-la-session=Mudança de idioma durante a sessão
j.chaque-acompte-percu-sur-une-commande-ou=Cada adiantamento recebido numa encomenda ou orçamento — criado na caixa ou chamado — imprime, além do comprovativo, uma fatura de adiantamento numerada: identidade da loja, artigos e montantes da encomenda, montante do adiantamento e o seu IVA por taxa, já pago e restante em dívida. Desativado: apenas o comprovativo de adiantamento é impresso (LC-08-04-15).
j.chaque-integration-de-referentiel-article-nomenc=Cada integração de referencial — artigo, nomenclatura, cliente, promoção — deixa uma linha datada na auditoria de atualização, consultável no ecrã de supervisão das sincronizações. Desativado — o padrão — apenas a impressão digital atual é conservada, sem histórico (BO-10-08-23).
j.chaque-ligne-du-panier-transmis-au-moteur=Cada linha do cesto transmitido ao motor de promoção tem o código da família do artigo e o da sua subfamília, para que possam ser acionadas vantagens a esse nível. Desativado: a linha só tem o seu código de artigo (BO-10-03-19).
j.character-set-b-cannot-encode=Character set B cannot encode
j.chargement-enregistre=Carregamento registado.
j.chemin-d-acces-complet-du-programme-lance=Caminho de acesso completo do programa lançado pela tecla do ecrã de caixa. Vazio: a tecla não aparece (LC-09-01-04).
j.chemin-du-programme-externe=Caminho do programa externo
j.chemin-ou-le-nud-depose-les-fichiers=Caminho onde o nó deposita os ficheiros dos fluxos de saída. Vazio: nenhum fluxo é produzido (BO-11-01-02).
j.chiffre-d-affaires=Volume de negócios
