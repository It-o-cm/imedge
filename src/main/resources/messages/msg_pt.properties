j.r20-parametre-1=Token de sistema terceiro obrigatório
j.r20-parametre-2=Uma venda depositada por um sistema terceiro (e-commerce, mobilidade) tem de apresentar o token do sistema declarado no ecrã Sistemas terceiros, no cabeçalho X-Integration-Token; o token de sincronização das caixas deixa de bastar. Desativado: o token de um sistema declarado identifica-o, e o token de sincronização continua aceite (BO-07-01-01).
j.r20-parametre-3=Acumulação de fidelização das encomendas e-commerce
j.r20-parametre-4=Uma encomenda e-commerce integrada com um cartão de fidelização desencadeia a sua acumulação: o evento de talão fechado, canal Web, segue para o programa de fidelização pela fila de envio do nó de loja, como um talão de caixa. Desativado: a encomenda não acumula (BO-07-01-03).
j.r20-parametre-5=Lançamento automático do fim de período
j.r20-parametre-6=À hora do fim de período, o nó de loja lança sozinho o tratamento de fim de período: pontos de entrada técnicos, registo dos talões em espera, controlo das caixas, mapas financeiros, fecho consolidado, edições programadas, volumes de venda, purga de retenção. Desativado: nada arranca sozinho, o tratamento lança-se a partir do ecrã Fim de dia (BO-09-03-03).
j.r20-parametre-7=Registo dos talões em espera no fim de dia
j.r20-parametre-8=O fim de dia, automático ou lançado a partir do back-office, faz-se com os talões em espera: cada um é registado — caixa, número, operador, artigos, montante — e inscrito no diário eletrónico. Desativado: só o fecho Z na caixa escreve o seu destino (BO-09-01-05, BO-09-02-01).
j.r20-parametre-9=Reposição a zero automática dos talões em espera
j.r20-parametre-10=No fim de período automático, os talões que ficaram em espera são repostos a zero: cada caixa recebe a ordem de os anular e regista a sua purga, como no fecho Z. Desativado: a reposição a zero pede-se a partir do ecrã Fim de dia (BO-09-01-08).
j.r20-parametre-11=Talão técnico no fecho forçado
j.r20-parametre-12=Uma caixa fechada oficiosamente pelo fim de período ou a partir do back-office imprime um talão técnico — caixa, sessão, operador, causa, talões em espera — e inscreve-o no diário eletrónico. Desativado: só o talão de fecho configurado é impresso (BO-09-01-06, BO-09-02-03).
j.r20-parametre-13=Declaração automática dos anfitriões das ilhas de self-service
j.r20-parametre-14=No fim de período, a sessão de um anfitrião associado a uma ilha de caixas de self-service em declaração automática é fechada pelo seu montante teórico, sem contagem, e o seu Z é impresso. Os anfitriões associam-se à ilha no ecrã Ilhas de caixa; uma ilha sem anfitrião designado abrange todos os anfitriões das suas caixas (BO-09-03-01).
j.r20-parametre-15=Pontos de entrada técnicos do fim de período
j.r20-parametre-16=Os scripts designados abaixo são executados antes e depois do tratamento de fim de período, automático ou manual; o seu código de retorno e a sua saída são conservados e inscritos no diário. Desativado: nenhum script é executado (BO-09-02-04).
j.r20-parametre-17=Script antes do fim de período
j.r20-parametre-18=Nome do script executado antes do tratamento de fim de período, tomado do diretório dos pontos de entrada do nó de loja (letras, algarismos, ponto, hífen, sublinhado). Vazio: nada antes (BO-09-02-04).
j.r20-parametre-19=Script depois do fim de período
j.r20-parametre-20=Nome do script executado depois do tratamento de fim de período, tomado do diretório dos pontos de entrada do nó de loja. Vazio: nada depois (BO-09-02-04).
j.r20-parametre-21=Duração máxima de um script de fim de período (s)
j.r20-parametre-22=Acima disso, o script é parado e a sua execução registada como falhada; o tratamento de fim de período continua. Abaixo de 1: 60 segundos (BO-09-02-04).
j.r20-parametre-23=Verificação caixa / servidor no fim de período
j.r20-parametre-24=Durante o fim de período, cada caixa compara as suas vendas do dia com as que o servidor recebeu; em caso de diferença reenvia as suas vendas e ressincroniza o seu referencial, e o resultado é inscrito no diário. Desativado: só se aplica o controlo contínuo dos referenciais (BO-09-03-05).
j.r20-parametre-25=Impressora dos mapas de fim de período
j.r20-parametre-26=Impressora de rede, no formato anfitrião:porta (porta 9100 por defeito), para a qual cada mapa editado automaticamente no fim de período é enviado logo após a sua edição. Vazio: os mapas são apenas conservados e descarregáveis a partir do ecrã Fim de dia (BO-09-01-10).
j.r20-aucune-valeur-a-representer-sur-la-periode=Nenhum valor a representar no período.

# ---- lot 21: S ----
j.s21-def-journal-secondary-monetic-servers-label=Servidores monéticos secundários
j.s21-def-journal-secondary-monetic-servers-hint=Códigos do servidor de aceitação (etiqueta VWAY devolvida pelo terminal) que designam o servidor secundário do modo degradado — 4, o que o modo degradado força (LC-07-08-02) —, separados por pontos e vírgulas. O diário eletrónico encontra os talões pagos com cartão num destes servidores, destinados ao serviço de suporte. Vazio: nenhum servidor é considerado secundário (BO-04-01-48).
j.s21-def-auth-endorsement-profiles-label=Perfis habilitados a dar uma autorização
j.s21-def-auth-endorsement-profiles-hint=Nomes dos perfis cujo titular pode autorizar um gesto na caixa, qualquer que seja a sua função, separados por pontos e vírgulas. Uma regra de autorização por função também pode indicar os seus próprios perfis depois do modo, por exemplo POST /action/pay-tender=REQUIRED:Chef de caisse. Vazio: apenas as funções habilitadas autorizam (BO-04-02-01).
j.s21-def-control-alert-rules-label=Alertas de caixa
j.s21-def-control-alert-rules-hint=Um alerta por linha: alvo = tipo ; opções. Alvos: function:POST /abandon (uma função), payment:CHEQUE (um meio de pagamento), article:3017620422003 ou article:F1020 (um artigo ou uma família), barcode:20* (um prefixo de código de barras), offline (caixa fora de linha), expired (data limite ultrapassada lida num código GS1). Tipos: YESNO (pergunta sim/não na caixa), SUPERVISOR (validação de supervisor), BACKOFFICE (alerta de informação no back-office), BLOCK (função bloqueada). Opções separadas por pontos e vírgulas: text=mensagem apresentada, notify (notificação ao operador de caixa), max=n (número de vezes na transação). Vazio: nenhum alerta (BO-04-03-08, BO-04-03-09).
j.s21-def-justification-function-routes-label=Funções de caixa justificadas
j.s21-def-justification-function-routes-hint=Uma função por linha: método caminho=código de função, por exemplo POST /abandon=CANCEL_TICKET. Quando uma lista de justificações serve este código de função, a caixa pede a justificação antes de executar a função, regista-a no diário eletrónico e depois volta a executar a função. Uma função sem lista administrada é executada sem pergunta (BO-04-03-10, BO-04-03-12).
j.s21-def-control-indicators-bar-label=Indicadores de controlo em todos os ecrãs
j.s21-def-control-indicators-bar-hint=Apresenta no topo de cada ecrã do back-office, para os perfis com acesso aos indicadores de controlo, o volume de negócios do dia, o volume de negócios por secção ou família, o cabaz médio em quantidade, o número de clientes e a comparação com o ano anterior. Desativado: os indicadores só são apresentados no seu próprio ecrã (BO-04-03-01).
j.s21-def-control-revenue-level-label=Nível de nomenclatura do detalhe do volume de negócios
j.s21-def-control-revenue-level-hint=Posição do nível de nomenclatura a que o volume de negócios do dia é detalhado (1: secção, 2: família, e assim por diante em toda a nomenclatura). 0 ou um nível desconhecido: a família a que o artigo pertence (BO-04-03-01).
j.s21-def-control-revenue-top-label=Número de rubricas do detalhe do volume de negócios
j.s21-def-control-revenue-top-hint=Número de secções ou famílias apresentadas no detalhe do volume de negócios, as mais fortes primeiro, de 1 a 20 (BO-04-03-01).
j.s21-def-audit-watched-menus-label=Menus do back-office vigiados
j.s21-def-audit-watched-menus-hint=Ecrãs do back-office cuja abertura é registada no diário eletrónico, separados por pontos e vírgulas: um código de ecrã (journal, settings, account...) ou o início de um caminho (/admin/journal). *: todos os ecrãs. Vazio: apenas as ligações são registadas (BO-04-03-04).
j.s21-def-supervision-global-alerts-label=Alertas de caixa em todos os ecrãs
j.s21-def-supervision-global-alerts-hint=Um pedido de autorização ou de serviço emitido por uma caixa aparece imediatamente no topo de cada ecrã do back-office, para os perfis com acesso à supervisão, com as suas opções de tratamento (autorizar, a tratar na caixa, recusar, confirmar). Desativado: os pedidos só aparecem no painel (BO-04-02-12).
j.s21-def-supervision-live-event-types-label=Operações do acompanhamento em tempo real
j.s21-def-supervision-live-event-types-hint=Tipos de operações apresentados pelo ecrã de vigilância das caixas em tempo real, separados por pontos e vírgulas (TICKET_CLOSED, TICKET_CANCELLED, LINE_CANCELLED, PRICE_MODIFIED, DRAWER_OPENED, REFUND_CREATED, PAYMENT_CANCELLED, CONTROL_ALERT...). Vazio: todas as operações (BO-04-03-07).
