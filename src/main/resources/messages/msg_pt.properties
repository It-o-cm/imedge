j.nom-du-prestataire-de-garantie-cheque=Nome do prestador de garantia de cheque consultado quando um meio de pagamento cheque tem a opção « Autorização de cheque » (ex. SIMULATEUR em demonstração). A caixa pede a autorização ao serviço: concedida, o cheque é aceite sem supervisor e o número de autorização é registado no pagamento; recusada, o cheque é recusado; serviço inacessível, a autorização do supervisor assume. Vazio: sem garantia, a autorização do supervisor aplica-se como antes (BO-03-02-24).
j.adresse-du-service-de-garantie-cheque=Endereço do serviço de garantia de cheque
j.adresse-de-base-du-service-de-garantie=Endereço base do serviço de garantia de cheque (a caixa chama <endereço>/api/cheque-guarantee/authorize). Vazio: o endereço configurado na caixa, que em desenvolvimento é o serviço simulado da própria caixa (BO-03-02-24).
