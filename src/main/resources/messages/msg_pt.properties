j.moyen-de-paiement-inconnu-pour-une-plage=Meio de pagamento desconhecido para um intervalo lido.
j.moyen-de-reglement-cree=Meio de pagamento criado.
j.moyen-de-reglement-enregistre=Meio de pagamento guardado.
