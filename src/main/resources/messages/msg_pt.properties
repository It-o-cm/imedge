j.un-ticket-de-prelevement-est-imprime-apres=Após a validação é impresso um talão de recolha, detalhando as denominações para o numerário e as transações para os outros meios (LC-12-03-07).
j.un-ticket-de-reprise-date-numero-du=Um talão de retoma — data, número do talão e número do talão de origem — sai em cada retoma de um talão colocado em espera. Desativado: a retoma não imprime nada (BO-03-03-07).
j.un-ticket-de-sortie-titre-code-barres=Um talão de saída — título, código de barras, total c/ IVA, número de artigos e os artigos mais caros — é impresso EM VEZ do talão de caixa. Desativado: o talão de caixa sai normalmente (BO-03-03-36).
j.un-ticket-mouvement-financier-est-imprime-apres=Após a validação é impresso um talão « Movimento financeiro », indicando o meio recebido, o meio devolvido e o montante. Desativado: nenhum talão é impresso (LC-12-06-03).
j.un-ticket-transfert-reglement-est-imprime-apres=Após a validação é impresso um talão « Transferência de pagamento », indicando os meios de origem e de destino e o montante transferido (LC-12-10-05).
j.un-ticket-paiement-carte-cadeau-code-de=Um talão « pagamento com cartão-oferta » (código do cartão, montante, saldo anterior e novo, fornecedor e o seu código) sai além do talão de caixa. Desativado: só o talão de caixa é impresso (LC-07-11-03).
j.un-ticket-emis-par-un-autre-point=Um talão emitido por outro ponto de venda é aceite em devolução. Desativado: a devolução só se faz no ponto de venda onde as compras foram efetuadas, o que é a regra entre aderentes independentes (LC-05-02-07).
