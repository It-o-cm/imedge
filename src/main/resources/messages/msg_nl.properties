j.alerte-levee-a-la-lecture-d-un=Waarschuwing bij het lezen van een toepassingsidentificatie, gescheiden door puntkomma's, in de vorm AI=NIVEAU:melding — voorbeeld 10=SUPERVISOR:Lot {value} te controleren;21=WARN:Serienummer {value}. Niveaus: INFO (melding, het artikel wordt geregistreerd), WARN (waarschuwing, het artikel wordt geregistreerd), BLOCK (artikel geweigerd) of SUPERVISOR (artikel geweigerd, een supervisor kan de registratie forceren). {value} wordt vervangen door de gelezen waarde, {ai} door de identificatie. Leeg: geen waarschuwing (BO-10-09-04).
