t.commandes-e-commerce=E-commercebestellingen
t.commandes-e-commerce-sous-titre=De gevalideerde bestellingen die het e-commerceplatform heeft afgeleverd, hun integratieverslag en de gearchiveerde oorspronkelijke bestelling.
t.aucune-commande-e-commerce=Geen e-commercebestelling ontvangen.
t.recue-le=Ontvangen op
t.articles-inconnus=Onbekende artikelen
t.articles-interdits=Verboden artikelen
