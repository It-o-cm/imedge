j.au-scan-d-un-code-que-rien-2=Bij het scannen van een code die niets herkent, verschijnt de melding « onbekend artikel » en gaat de kassa naar het scherm voor directe invoer om het artikel via zijn familie of code te verkopen. Uitgeschakeld: alleen de melding verschijnt (BO-10-02-14).
j.ce-que-le-panneau-d-autorisation-superviseur=Wat het autorisatiepaneel van de supervisor vraagt: CODE_PASSWORD (supervisorcode, getypt of gelezen, dan wachtwoord — standaard), BARCODE (gelezen supervisorbarcode, alleen), BARCODE_CODE_PASSWORD (gelezen barcode, dan getypte code, dan wachtwoord), BARCODE_PASSWORD (gelezen barcode, dan wachtwoord) of DALLAS (Dallas-sleutel van de supervisor, alleen). Een onbekende waarde valt terug op CODE_PASSWORD (BO-10-02-31).
j.comment-le-n-ud-magasin-recoit-les=Hoe het winkelknooppunt de manden van de weegschalen ontvangt, die de kassa leest bij het scannen van het weegschaalticket: API_FTP (naar de API van het knooppunt gepusht en op de beheerde FTP-server opgehaald, standaard), API (alleen API, de FTP wordt niet uitgelezen), FTP (alleen FTP, de API weigert de manden) of OFF (geen weegschaaltickets: het knooppunt ontvangt er geen meer en de kassa herkent hun barcode niet meer). Een onbekende waarde valt terug op API_FTP (BO-10-05-01).
j.decimales-du-total-ht-de-la-ligne=Decimalen van het regeltotaal excl. btw
j.en-mode-ecole-le-tiroir-s-ouvre=In oefenmodus opent de lade zoals bij een echte verkoop (betaling, aanmelding, afsluiting). Uitgeschakeld: zolang de kassa in oefenmodus staat, wordt geen openingsimpuls verzonden en blijft de lade dicht bij een fictieve betaling (BO-10-02-12).
j.la-caisse-lit-les-codes-gs1-databar=De kassa leest GS1-codes (Databar, DataMatrix, QR-code, Digital Link) en past hun toepassingsidentificaties toe. Uitgeschakeld: een GS1-code wordt niet meer geïnterpreteerd en volgt de weg van een gewone code (BO-10-09-01).
j.lecture-des-codes-gs1=GS1-codes lezen
j.message-affiche-en-caisse-quand-un-article=Melding die in de kassa verschijnt wanneer een artikel met verkoopverbod of in terugroeping wordt gescand en de fiche geen eigen melding heeft (attribuut FORBIDDEN_SALE_MESSAGE). Leeg: « ARTIKEL UIT HANDEL/TERUGROEPING » (BO-10-07-20).
