j.la-cle-dallas-ibutton-attribuee-a-l=De Dallas-sleutel (iButton) die op het scherm Accounts aan de operator is toegewezen, opent de kassa op zichzelf, zonder pincode — de wachtwoordloze aanmelding van de zelfscankassa's (BO-01-02-07). Uitgeschakeld: een gelezen sleutel wordt genegeerd.
j.langue-par-defaut-du-backoffice-de-la=Standaardtaal van de BackOffice, het kassascherm, het klantenscherm en het ticket: fr, nl of pt. Deze geldt wanneer de operator geen andere taal heeft gekozen en hem geen taal is toegewezen. Leeg of onbekend: Frans (LC-13-06-01/05/10, BO-01-01-04, BO-10-07-18).
p.cette-cle-dallas-est-deja-attribuee-a=Deze Dallas-sleutel is al toegewezen aan {0}.
j.beneficiaire-imprimable-par-le-jeton-beneficiair=Begunstigde, af te drukken via het token {beneficiaire} (LC-07-05-07).
j.ce-qui-est-imprime-au-dos-du=Wat op de achterkant van de cheque wordt gedrukt terwijl de lezer hem vasthoudt, één regel per puntkomma. Beschikbare tokens: {date}, {heure}, {montant}, {montant-lettres}, {caisse}, {pdv}, {ticket} (LC-07-05-03). Leeg: de datum en het uur, daarna het bedrag, zoals vóór deze parameter (BO-03-02-43).
j.compte-optionnel-imprimable-par-compte-lc-07=Optionele rekening, af te drukken via {compte} (LC-07-05-07).
j.correspondance-entre-l-identifiant-renvoye-par-l=Koppeling tussen de door de mobiele terminal teruggegeven ID en de omschrijving die op het kasticket wordt geregistreerd, in de vorm ID=OMSCHRIJVING, gescheiden door komma's. Een ID die niet in de tabel staat, wordt geregistreerd als 'SECOURS MONETIQUE' (LC-07-07-08).
j.delai-d-inactivite-avant-verrouillage-automatiqu=Inactiviteitstijd vóór de automatische vergrendeling van de kassa. 0 = uitgeschakeld (LC-01-03-02).
p.expression-reguliere-reconnaissant-au-scan-le-co=Reguliere expressie die bij het scannen de barcode herkent van het winkelmandje dat een klant heeft samengesteld op een selfscanningtoestel van de winkel (bv. SS[0-9]{8}). De herkende code haalt het op het winkelknooppunt geplaatste mandje op, vanaf om het even welke kassa, en opent het scherm SELFSCANNING: controle, daarna integratie in de verkoop. Leeg: mandjes worden opgehaald via hun code in het scherm OPHALEN (LC-06-05-03).
j.expression-reguliere-reconnaissant-au-scan-le-co-2=Reguliere expressie die bij het scannen de barcode herkent die gedrukt staat op een offerte, een bestelling of een verkoopbon uitgegeven door het commerciële beheerprogramma (bv. (DV|CM|BV)[0-9]{6,}). De herkende code haalt het op het winkelknooppunt geplaatste document op, zoals een invoer in het scherm OPHALEN. Leeg: alleen bestelcodes die aan de kassa zijn aangemaakt, worden bij het scannen herkend; de andere worden ingevoerd in het scherm OPHALEN (LC-06-02-01, LC-06-02-09).
j.la-lettre-du-regime-de-tva-de=De letter van het btw-regime van het artikel komt op de artikelregel en in de btw-tabel (0=A, 1=B, 26=AA). Uitgeschakeld: de regel toont alleen de prijs en het btw-detail blijft in de totalentabel. Ingeschakeld in Frankrijk, uitgeschakeld in België (BO-03-03-37).
j.le-label-point-de-vente-tel-que=Het Label Verkooppunt zoals de acquirer het heeft geschreven, in de vorm {TAG}waarde: de kassa geeft het letterlijk door en stelt zelf noch de tag noch de waarde samen. Leeg: er wordt niets toegevoegd, ook als toevoegen is ingeschakeld (BO-03-09-31).
j.lieu-imprimable-par-le-jeton-lieu-lc=Plaats, af te drukken via het token {lieu} (LC-07-05-06).
j.message-affiche-au-caissier-quand-un-article=Bericht dat aan de kassier wordt getoond wanneer een GS1-artikel een korte houdbaarheidsdatum heeft; {date} wordt vervangen door de gelezen datum. Leeg: “KORTE DATUM (datum)” (BO-03-06-64).
j.message-affiche-au-caissier-quand-un-article-2=Bericht dat aan de kassier wordt getoond wanneer een GS1-artikel wordt geweigerd omwille van de vervaldatum; {date} wordt vervangen door de gelezen datum. Leeg: “ARTIKEL VERVALLEN (datum)” (BO-03-06-64).
j.message-imprime-sur-le-ticket-d-un-2=Bericht dat op het kasticket van een kaarthouder wordt gedrukt wanneer de klantenkaartdienst tijdens de verkoop niet heeft geantwoord. Het token {carte} wordt daarin vervangen door het kaartnummer. Leeg: het kasticket vermeldt niets (BO-03-03-29).
j.message-montre-a-l-hote-sse-quand-2=Bericht dat aan de kassamedewerker wordt getoond wanneer de betaling de klant boven zijn kredietlimiet zou brengen. De tokens {encours} en {plafond} worden daarin vervangen door de bedragen (BO-10-04-13).
j.montant-d-especes-au-dela-duquel-la=Bedrag aan contanten waarboven de kassa een waarschuwing AFROMING toont zonder de verkoop te blokkeren, afgestemd op het door de verzekering gedekte bedrag. 0 = geen limiet (EXP-17).
j.montant-maximum-d-une-remise-en-euros=Maximumbedrag van een korting in euro op een regel. Een korting tot dit bedrag wordt aanvaard, daarboven wordt ze geweigerd. 0 = geen limiet in euro (BO-03-07-04).
j.montant-maximum-d-une-remise-ticket-en=Maximumbedrag van een ticketkorting in euro. Een korting tot dit bedrag wordt aanvaard, daarboven wordt ze geweigerd. 0 = geen limiet in euro (BO-03-07-04).
j.montant-maximum-reglable-par-carte-titre-restaur=Maximumbedrag dat per transactie met een maaltijdchequekaart (TRD) kan worden betaald, bovenop de in aanmerking komende basis. 0 = limiet niet toegepast, alleen de basis begrenst (EXP-60).
p.motif-de-reconnaissance-d-un-numero-de=Herkenningspatroon van een klantrekeningnummer, in de vorm van een reguliere expressie (bijvoorbeeld ^CC\\d{8}$). Een nummer buiten het bereik wordt geweigerd vóór elke opzoeking. Leeg: elk nummer wordt aanvaard en bij het scannen wordt geen bereik herkend (BO-03-06-52).
p.motif-de-reconnaissance-d-une-carte-de=Herkenningspatroon van een klantenkaart bij het scannen, in de vorm van een reguliere expressie (bijvoorbeeld ^299\\d{10}$). Leeg: de deploymenteigenschap scan.pattern.fidelity is van toepassing (BO-03-06-54).
j.nombre-de-rapports-caissieres-etats-x-du=AANTAL bewaarde kassiersrapporten (X-rapporten van het technisch logboek) — de oudste boven dit aantal worden verwijderd. Een aantal rapporten, GEEN aantal dagen. 0 = onbeperkt bewaren (BO-10-08-07).
j.nombre-de-jours-apres-la-derniere-activite=Aantal dagen na de laatste activiteit (laatste bijwerking van de fiche) waarna een klant wordt opgeschoond. Een klant met een kredietsaldo verschillend van nul of die nog aan een factuur gekoppeld is, wordt niet opgeschoond. 0 = onbeperkt bewaren (BO-10-08-26).
j.nombre-de-jours-apres-la-fin-de=Aantal dagen na het einde van de geldigheid waarna een verlopen promotie wordt verwijderd. 0 = onbeperkt bewaren (BO-10-08-17).
j.nombre-de-jours-de-conservation-des-alertes=Aantal dagen dat de in het technisch logboek geregistreerde meldingen (supervisoroproepen) worden bewaard. 0 = onbeperkt bewaren (BO-10-08-11).
j.nombre-de-jours-de-conservation-des-articles=Aantal dagen dat “verwijderde” (gedeactiveerde) artikelen worden bewaard vóór definitieve verwijdering. Een artikel waarnaar nog door een prijs of een ticketregel wordt verwezen, wordt niet verwijderd. 0 = onbeperkt bewaren (BO-10-08-24).
j.nombre-de-jours-de-conservation-des-factures=Aantal dagen dat facturen en leveringsbonnen worden bewaard. Een factuur gekoppeld aan een nog actieve (niet geblokkeerde) klant wordt niet verwijderd. 0 = onbeperkt bewaren (BO-10-08-16).
j.nombre-de-jours-de-conservation-des-lignes=Aantal dagen dat de regels van de audit van referentiegegevensupdates worden bewaard vóór VERWIJDERING door de opschoning op het einde van de periode. 0 = onbeperkt bewaren (BO-10-08-10).
j.nombre-de-jours-de-conservation-des-tickets=Aantal dagen dat geparkeerde tickets worden bewaard vóór verwijdering. Een geparkeerd ticket dat aan een nog open sessie gekoppeld is, wordt niet verwijderd. 0 = onbeperkt bewaren (BO-10-08-12).
j.nombre-de-jours-de-conservation-des-ventes=Aantal dagen dat artikelverkopen (afgesloten tickets) worden bewaard vóór VERWIJDERING door de opschoning op het einde van de periode. Een verkoop gekoppeld aan een factuur of een terugbetaling wordt nooit verwijderd. 0 = onbeperkt bewaren. Er is gekozen voor verwijdering; archivering is een beslissing van de klant en valt buiten de implementatie (BO-10-08-03).
j.nombre-de-jours-de-conservation-des-evenements=Aantal dagen dat dagelijkse technische gebeurtenissen worden bewaard die niet onder een eigen regel vallen (buiten toegangslogboek en meldingen). 0 = onbeperkt bewaren (BO-10-08-08).
j.nombre-de-jours-de-conservation-du-journal=Aantal dagen dat het toegangslogboek wordt bewaard (authenticatieblokkeringen, wachtwoorden, vergrendeling / ontgrendeling van de kassa). 0 = onbeperkt bewaren (BO-10-08-09).
j.nombre-maximum-de-promotions-echues-supprimees-a=Maximumaantal verlopen promoties dat bij ELKE opschoonronde wordt verwijderd, zodat de opschoning het einde van de periode niet blokkeert. Dit is geen bewaartermijn, maar een limiet per uitvoering. 0 = geen limiet (BO-10-08-18).
j.prix-unitaire-au-dela-duquel-la-saisie=Eenheidsprijs waarboven bij het invoeren van een artikel een waarschuwing aan de kassier wordt getoond. 0 = geen waarschuwing.
j.reference-optionnelle-imprimable-par-banque-lc-0=Optionele referentie, af te drukken via {banque} (LC-07-05-07).
j.un-compte-doit-rester-d-un-niveau-2=Een account moet een niveau hebben dat strikt lager is dan het uwe, en alleen een beheerder kan een beheerder aanmaken.
j.une-regle-par-ligne-get-manual-required=Eén regel per lijn: GET /manual=REQUIRED of POST /sale-tax-id=REQUIRED. NONE stelt de functie vrij van goedkeuring; blokkeringen en bedrijfsdrempels blijven van toepassing. De annulering van het enige artikel behoudt haar verplichte goedkeuring. Het achtervoegsel /* dekt de subpaden. De laatste overeenkomende regel heeft voorrang. De handeling en haar formulier wachten op de goedkeuring en worden daarna één keer opnieuw uitgevoerd. De routes voor aanmelding, goedkeuring en polling blijven toegankelijk (LC-01-05-01).
