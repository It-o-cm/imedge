j.commandes-e-commerce=E-commercebestellingen
j.e-commerce=E-commerce
j.mobilite=Mobiliteit
j.commande-integree=Bestelling geïntegreerd
j.article-en-vente-interdite=Artikel met verkoopverbod
j.moyen-de-paiement-par-defaut-inconnu-de-l-encaissement=Standaard betaalmiddel onbekend in het kassasysteem
j.operateur-d-integration-inconnu=Onbekende integratie-operator
j.aucun-point-de-vente-sur-le-noeud-magasin=Geen verkooppunt op de winkelnode
j.e-commerce-non-active-sur-ce-point-de-vente=E-commerce niet geactiveerd in dit verkooppunt
j.canaux-externes=EXTERNE KANALEN
j.e-commerce-activation=E-commerce: activering
j.le-point-de-vente-integre-les-commandes=Het verkooppunt integreert de gevalideerde e-commercebestellingen: de winkelnode aanvaardt ze, boekt ze als transacties van de winkel en de kassa neemt de e-commercemanden over. Uitgeschakeld: elke e-commercebestelling wordt geweigerd (BO-10-01-01).
j.e-commerce-prix-des-articles=E-commerce: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-un=Prijs voor de artikelen van een e-commercemand: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de transactie) of TRANSACTION (de prijs van de transactie). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-07).
j.e-commerce-articles-en-vente-interdite=E-commerce: artikelen met verkoopverbod
j.integration-d-une-commande-e-commerce-portant=Integratie van een e-commercebestelling met een artikel met verkoopverbod: ACCEPT (geïntegreerd, het artikel vermeld in het verslag) of REJECT (volledig geweigerd, er wordt niets geboekt; het verslag noemt het artikel) (BO-10-01-14).
j.e-commerce-ean-generique-des-articles-inconnus=E-commerce: generieke EAN voor onbekende artikelen
j.ean-qui-porte-sans-bloquer-l-integration=EAN die, zonder de integratie te blokkeren, een artikel van een e-commercebestelling draagt dat de database van het verkooppunt niet kent: de lijn behoudt haar omschrijving, gemarkeerd « ART. INCONNU » met de oorspronkelijke code, op het ticket en in het integratieverslag. Leeg: de lijn behoudt haar eigen code, het verslag vermeldt ze altijd (BO-10-01-06).
j.e-commerce-canal-promotion=E-commerce: promotiekanaal
j.canal-transmis-au-moteur-de-promotion-avantage=Kanaal dat aan de promotiemotor (kaartvoordeel en directe korting) wordt doorgegeven voor de in de kassa overgenomen e-commercemanden: POINT_OF_SALE (verkooppunt), WEB of OTHER (ander). Leeg: er wordt geen kanaal doorgegeven en de aanvraag blijft byte voor byte gelijk (BO-10-01-13).
j.e-commerce-ilot-de-rattachement=E-commerce: gekoppeld eiland
j.code-de-l-ilot-auquel-la-caisse=Code van het eiland waaraan de virtuele e-commercekassa gekoppeld is: de omzet van de e-commercetransacties wordt eraan toegewezen en de regels ervan (stromen, overzichten per eiland) zijn van toepassing. Leeg: de virtuele kassa hoort bij geen enkel eiland (BO-10-01-08).
j.e-commerce-caisse-virtuelle=E-commerce: virtuele kassa
j.identifiant-de-la-caisse-virtuelle-sur-laquelle=Identificatie van de virtuele kassa waarop de winkelnode de geïntegreerde e-commercetransacties boekt; het ticketnummer is deze identificatie gevolgd door de referentie van de bestelling (BO-10-01-08).
j.e-commerce-operateur-d-integration=E-commerce: integratie-operator
j.identifiant-de-l-employe-au-nom-duquel=Login van de medewerker op wiens naam de e-commercetransacties in het kassasysteem worden geboekt; een onbekende login doet de integratie mislukken, met de reden in het verslag (BO-10-01-03).
j.e-commerce-moyen-de-paiement-par-defaut=E-commerce: standaard betaalmiddel
j.code-du-moyen-de-paiement-cash-card=Code van het betaalmiddel (CASH, CARD, CHEQUE, TR, VOUCHER…) waaronder een e-commercebestelling die met een in het kassasysteem onbekend middel betaald is, wordt geïntegreerd; het verslag meldt de vervanging (BO-10-01-09).
j.e-commerce-archivage-des-commandes-d-origine=E-commerce: archivering van de oorspronkelijke bestellingen
j.la-commande-e-commerce-telle-que-la=De e-commercebestelling zoals het platform ze verzonden heeft, wordt met haar verslag gearchiveerd voor de supportanalyse (scherm E-commercebestellingen). Uitgeschakeld: alleen het verslag wordt bewaard (BO-10-01-11).
j.e-commerce-duree-d-archivage-jours=E-commerce: archiveringsduur (dagen)
j.au-dela-de-ce-nombre-de-jours=Na dit aantal dagen verwijdert de opschoning aan het einde van de periode de gearchiveerde e-commercebestellingen. 0: onbeperkt bewaard (BO-10-01-11).
j.e-commerce-types-de-retour-ticket-autorises=E-commerce: toegestane retourtypes voor een ticket
j.types-de-retour-libelles-de-la-liste=Retourtypes (omschrijvingen uit de lijst van retourtypes, gescheiden door « ; ») die toegestaan zijn voor de retour van het volledige ticket van een e-commercetransactie; een ander type, of geen type, wordt geweigerd. Leeg: elke retour is toegestaan (BO-10-01-04).
j.e-commerce-types-de-retour-article-autorises=E-commerce: toegestane retourtypes voor een artikel
j.types-de-retour-libelles-separes-par-autorises=Retourtypes (omschrijvingen gescheiden door « ; ») die toegestaan zijn voor de retour van een deel van de artikelen van een e-commercetransactie; een ander type, of geen type, wordt geweigerd. Leeg: elke retour is toegestaan (BO-10-01-05).
j.selfscanning-activation=Selfscanning: activering
j.le-self-scanning-est-ouvert-sur-ce=Selfscanning is geopend in dit verkooppunt: de kassa haalt de manden van de selfscanningtoestellen op en controleert ze. Uitgeschakeld: elke selfscanningmand wordt met een bericht geweigerd (BO-10-01-15).
j.selfscanning-mode-de-recuperation=Selfscanning: ophaalwijze
j.comment-la-caisse-recupere-un-panier-selfscanning=Hoe de kassa een selfscanningmand ophaalt: SCAN (lezen van de streepjescode), KEYED (invoer van de code op het scherm OPROEPEN) of BOTH (beide) (BO-10-01-16).
j.selfscanning-ajout-d-articles-en-caisse=Selfscanning: artikelen toevoegen aan de kassa
j.quand-le-caissier-peut-saisir-des-articles=Wanneer de kassier artikelen kan invoeren rond het ophalen van een selfscanningmand: BEFORE (alleen ervoor), AFTER (alleen erna), BOTH (ervoor en erna) of NONE (noch ervoor noch erna) (BO-10-01-17).
j.selfscanning-identifiant-de-reprise=Selfscanning: identificatie voor de overname
j.ce-qui-identifie-le-panier-selfscanning-a=Wat de over te nemen selfscanningmand identificeert: TRANSACTION (de streepjescode van de transactie) of CUSTOMER (het klantnummer, ingevoerd op het scherm OPROEPEN: de kassa neemt de laatste mand van die klant over) (BO-10-01-18).
j.selfscanning-prix-des-articles=Selfscanning: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-un-panier=Prijs voor de artikelen van een selfscanningmand: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de transactie) of TRANSACTION (de prijs van de transactie). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-19).
j.selfscanning-coupons-du-panier=Selfscanning: coupons van de mand
j.les-coupons-et-bons-d-achat-scannes=De in een selfscanningmand gescande coupons en aankoopbonnen worden aanvaard en in de kassa als betalingen overgenomen. Uitgeschakeld: ze worden niet overgenomen en de kassa meldt het (BO-10-01-20).
j.selfscanning-ean-generique-des-articles-inconnus=Selfscanning: generieke EAN voor onbekende artikelen
j.ean-qui-porte-sans-bloquer-la-reprise=EAN die, zonder de overname te blokkeren, een artikel van een selfscanningmand draagt dat de database van het verkooppunt niet kent: de lijn behoudt haar omschrijving, gemarkeerd « ART. INCONNU » met de oorspronkelijke code, op het scherm en op het ticket. Leeg: de lijn behoudt haar eigen code, zonder markering (BO-10-01-21).
j.selfscanning-canal-promotion=Selfscanning: promotiekanaal
j.canal-transmis-au-moteur-de-promotion-avantage-carte=Kanaal dat aan de promotiemotor (kaartvoordeel en directe korting) wordt doorgegeven voor de selfscanningmanden: POINT_OF_SALE (verkooppunt), WEB of OTHER (ander). Leeg: er wordt geen kanaal doorgegeven en de aanvraag blijft byte voor byte gelijk (BO-10-01-22).
j.selfscanning-articles-en-vente-interdite=Selfscanning: artikelen met verkoopverbod
j.integration-d-un-panier-selfscanning-portant-un=Integratie van een selfscanningmand met een artikel met verkoopverbod: ACCEPT (geïntegreerd zoals de andere) of REJECT (volledig geweigerd; de kassa toont de omschrijving, de code en het bericht van het artikel en laadt niets) (BO-10-01-23).
j.gestion-commerciale-articles-en-vente-interdite=Commercieel beheer: artikelen met verkoopverbod
j.integration-d-une-commande-d-un-devis=Integratie van een bestelling, offerte of verkoopbon uit het commercieel beheer met een artikel met verkoopverbod: ACCEPT (geïntegreerd zoals de andere) of REJECT (volledig geweigerd; de kassa toont de omschrijving, de code en het bericht van het artikel en laadt niets) (BO-10-01-24).
j.gestion-commerciale-mode-de-recuperation=Commercieel beheer: ophaalwijze
j.comment-la-caisse-recupere-une-commande-ou=Hoe de kassa een bestelling of offerte uit het commercieel beheer ophaalt: SCAN (lezen van de streepjescode), KEYED (invoer van de code op het scherm OPROEPEN) of BOTH (beide) (BO-10-01-25).
j.gestion-commerciale-transmission-des-commandes=Commercieel beheer: overdracht van de bestellingen
j.sens-et-mecanisme-d-echange-des-commandes=Richting en mechanisme van uitwisseling van de bestellingen en offertes: PUSH (het commercieel beheer zet ze op de winkelnode, POST /api/orders) of PULL (de winkelnode haalt ze zelf op via het adres en met de frequentie hieronder) (BO-10-01-25).
j.gestion-commerciale-adresse-de-tirage=Commercieel beheer: ophaaladres
j.adresse-http-que-le-n-ud-magasin=HTTP-adres dat de winkelnode in PULL-modus raadpleegt; het antwoordt met de JSON-lijst van de documenten in de vorm van de afgifte. Leeg: niets wordt opgehaald (BO-10-01-25).
j.gestion-commerciale-frequence-de-tirage-minutes=Commercieel beheer: ophaalfrequentie (minuten)
j.intervalle-entre-deux-tirages-des-commandes-en=Interval tussen twee ophaalbeurten van de bestellingen in PULL-modus; 0 staat voor één minuut (BO-10-01-25).
j.gestion-commerciale-document-imprime-a-l-encaissement=Commercieel beheer: document afgedrukt bij afrekening
j.code-du-modele-de-document-ecran-modeles=Code van het documentsjabloon (scherm Documentsjablonen) dat automatisch wordt afgedrukt na de afrekening van een bestelling of offerte uit het commercieel beheer. Leeg: geen extra document (BO-10-01-26).
j.gestion-commerciale-moyen-de-paiement-des-acomptes=Commercieel beheer: betaalmiddel van de voorschotten
j.code-du-moyen-de-paiement-cash-card-cheque=Code van het betaalmiddel (CASH, CARD, CHEQUE…) waaronder het in de kassa ontvangen voorschot op een bestelling of offerte wordt geboekt; alleen een voorschot in contanten komt in de lade. Leeg: contanten (BO-10-01-27).
j.gestion-commerciale-canal-promotion=Commercieel beheer: promotiekanaal
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et=Kanaal dat aan de promotiemotor (kaartvoordeel en directe korting) wordt doorgegeven voor de bestellingen, offertes en verkoopbonnen uit het commercieel beheer: POINT_OF_SALE (verkooppunt), WEB of OTHER (ander). Leeg: er wordt geen kanaal doorgegeven en de aanvraag blijft byte voor byte gelijk (BO-10-01-28).
j.gestion-commerciale-prix-des-articles=Commercieel beheer: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-une=Prijs voor de artikelen van een bestelling of offerte uit het commercieel beheer: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de bestelling) of TRANSACTION (de prijs van de bestelling). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-29).
j.qbusting-mode-de-recuperation=Qbusting: ophaalwijze
j.comment-la-caisse-recupere-un-panier-qbusting=Hoe de kassa een qbustingmand ophaalt: SCAN (lezen van de streepjescode), KEYED (invoer van de code op het scherm OPROEPEN) of BOTH (beide) (BO-10-01-30).
j.qbusting-canal-promotion=Qbusting: promotiekanaal
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise=Kanaal dat aan de promotiemotor (kaartvoordeel en directe korting) wordt doorgegeven voor de qbustingmanden: POINT_OF_SALE (verkooppunt), WEB of OTHER (ander). Leeg: er wordt geen kanaal doorgegeven en de aanvraag blijft byte voor byte gelijk (BO-10-01-31).
j.qbusting-articles-en-vente-interdite=Qbusting: artikelen met verkoopverbod
j.integration-d-une-transaction-qbusting-portant-un=Integratie van een qbustingtransactie met een artikel met verkoopverbod: ACCEPT (geïntegreerd zoals de andere) of REJECT (volledig geweigerd; de kassa toont de omschrijving, de code en het bericht van het artikel en laadt niets) (BO-10-01-32).
j.qbusting-prix-des-articles=Qbusting: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-un-panier-qbusting=Prijs voor de artikelen van een qbustingmand: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de transactie) of TRANSACTION (de prijs van de transactie). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-33).
j.mobilite-canal-promotion=Mobiliteit: promotiekanaal
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise-immediate=Kanaal dat aan de promotiemotor (kaartvoordeel en directe korting) wordt doorgegeven voor de mobiliteitstransacties: POINT_OF_SALE (verkooppunt), WEB of OTHER (ander). Leeg: er wordt geen kanaal doorgegeven en de aanvraag blijft byte voor byte gelijk (BO-10-01-34).
j.mobilite-prix-des-articles=Mobiliteit: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-un-panier-mobilite=Prijs voor de artikelen van een mobiliteitsmand: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de transactie) of TRANSACTION (de prijs van de transactie). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-36).
j.mobilite-articles-en-vente-interdite=Mobiliteit: artikelen met verkoopverbod
j.integration-d-une-transaction-mobilite-portant-un=Integratie van een mobiliteitstransactie met een artikel met verkoopverbod: ACCEPT (geïntegreerd zoals de andere) of REJECT (volledig geweigerd; de kassa toont de omschrijving, de code en het bericht van het artikel en laadt niets) (BO-10-01-37).
j.mobilite-moyen-de-paiement-complementaire=Mobiliteit: aanvullend betaalmiddel
j.code-du-moyen-de-paiement-ajoute-a=Code van het betaalmiddel dat bij de integratie van een mobiliteitstransactie waarvan het betaalde totaal lager is dan het tickettotaal (promotie toegekend in mobiliteit maar niet bij de afrekening) voor het verschil wordt toegevoegd. Leeg: het verschil blijft in de kassa verschuldigd (BO-10-01-39).
j.bon-de-vente-mode-de-recuperation=Verkoopbon: ophaalwijze
j.comment-la-caisse-recupere-un-bon-de=Hoe de kassa een verkoopbon — alleen dezelfde dag geldig, want het nummer wordt dagelijks opnieuw ingesteld ophaalt: SCAN (lezen van de streepjescode), KEYED (invoer van de code op het scherm OPROEPEN) of BOTH (beide) (BO-10-01-40).
j.bon-de-vente-prix-des-articles=Verkoopbon: prijs van de artikelen
j.prix-retenu-pour-les-articles-d-un-bon=Prijs voor de artikelen van een verkoopbon: POS (de actuele prijs uit de database van het verkooppunt; een onbekend artikel behoudt de prijs van de verkoopbon) of TRANSACTION (de prijs van de verkoopbon). Leeg: de regel van de opgeroepen documenten geldt (BO-10-01-41).

