j.rc3-parametre-01=Kant-en-klare kortingstoetsen, gescheiden door « ; ». Een item is een label, dan « > », dan PERCENT of AMOUNT, « : » en de waarde; « ,CUMUL » toevoegen staat deze korting toe op een artikel dat al afgeprijsd of in promotie is. Voorbeeld: « -20%>PERCENT:20 ; 2€ minder>AMOUNT:2,CUMUL ». Leeg: geen vooraf ingestelde toets, alleen vrije invoer (BO-03-07-03, BO-03-07-06, BO-03-07-11).
j.rc3-parametre-02=Koppelingen D16:code=MIDDEL of D46:code=MIDDEL gescheiden door puntkomma's. Een bekende D16 gaat voor, dan D46; anders CARD (LC-07-07-04).
j.rc3-parametre-03=Toepassingen van derden bereikbaar vanaf de kassa, gescheiden door puntkomma's, in de vorm LABEL>URL (bv. Klantenkaart>https://fid.magasin/caisse). Een onjuist item wordt genegeerd. Leeg: geen toepassing aangeboden (BO-03-09-27).
j.rc3-parametre-04=Identificatie van het machineaccount van de kassa bij de loyaliteitsdienst. Leeg: de uitrolinstelling pos.fid.user geldt. Het wachtwoord wordt ingesteld met de parameter « Wachtwoord van de loyaliteitsdienst » (BO-11-04-04, BO-10-03-08).
j.rc3-parametre-05=Goedkeuring supervisor: hertoewijzing van een ticket
j.rc3-parametre-06=Het hertoewijzen van een afgesloten ticket aan een loyale klant vereist goedkeuring van een supervisor (LC-03-06-01). Uitgeschakeld: de kassier wijst zelf opnieuw toe.
j.rc3-parametre-07=Duplicaat verkooppunt bij hertoewijzing
j.rc3-parametre-08=Het hertoewijzen van een ticket drukt ook een duplicaat af voor het verkooppunt (LC-03-06-05). Uitgeschakeld: alleen het ticket van de klant komt eruit.
j.rc3-parametre-09=Overeenkomst tussen de nominale waarde van een munt of biljet en de waarde in euro van een volledige rol, gescheiden door puntkomma's, in de vorm NOMINAAL:WAARDE_ROL — voorbeeld 0.20:8.00;0.01:0.50. Dient voor de kruisberekening bedrag <-> aantal rollen (LC-12-05-06/07). Leeg: geen kruisberekening aangeboden.
j.rc3-parametre-10=Retourtypes aangeboden aan de kassa naast de twee basishandelingen, gescheiden door puntkomma's. Een type schrijft men « Label », of « Label>TICKET » voor een type dat een apart retourticket opent in plaats van het artikel in de verkoop terug te nemen. Leeg: alleen de twee basishandelingen worden aangeboden (LC-05-04-01).
j.rc3-parametre-11=Elke regel van het winkelmandje dat naar de promotie-engine gaat, draagt de code van de familie van het artikel en die van de subfamilie, zodat voordelen op dat niveau kunnen worden geactiveerd; het mandje gaat ongewijzigd naar het loyaliteitsprogramma, dat dus de subfamilie van elk artikel ontvangt (artikelbeheer op subfamilie, Intermarché France). Uitgeschakeld: de regel draagt alleen de artikelcode (BO-10-03-19, BO-10-08-22).
j.rc3-parametre-12=Koppeling van een knooppuntcode van rang 0 aan een van de vier sectoren FRAIS_TRAD, FRAIS_LS, SEC, NON_ALIMENTAIRE, in de vorm « code>SECTOR » gescheiden door « ; » (R16). De eerste drie vormen de voedingsomzet.
j.rc3-parametre-13=Maakt de drie panelbestanden — Scannels, Scvenmag, Tlogextr — in één archief MS.<PDV>.<jour>.zip (BO-11-01-19).
j.rc3-parametre-14=Saldi van de spaarpotten opvragen
j.rc3-parametre-15=De kassa vraagt het loyaliteitsprogramma het saldo van ELK van zijn spaarpotten (FID Portugal), berekend met de gegevens van de lopende transactie: loyaliteitsvoordelen van het ticket en reeds voldane loyaliteitsbetaling. De saldi worden getoond op het loyaliteitsscherm van de kassa en opnieuw gelezen bij het afsluiten van het ticket. Uitgeschakeld — de standaard — alleen het saldo van de rekening wordt opgevraagd (BO-10-02-33).
j.rc3-parametre-16=Betaalmiddel van de loyaliteitsbetaling
j.rc3-parametre-17=Sleutel van het betaalmiddel waaronder een betaling met de loyaliteitsspaarpot wordt geregistreerd op het ticket, in de rapporten en in de stromen. Een onbekende sleutel valt terug op FIDELITY (BO-10-03-06).
j.rc3-parametre-18=Wachtwoord van de loyaliteitsdienst
j.rc3-parametre-19=Wachtwoord van het machineaccount van de kassa bij de loyaliteitsdienst, met de andere parameters naar de kassa's verdeeld en nooit opnieuw getoond: een leeg gelaten veld behoudt de opgeslagen waarde. Leeg: de uitrolinstelling pos.fid.password geldt (BO-10-03-08).
j.rc3-parametre-20=Verbindingstijd met de loyaliteitsdienst (ms)
j.rc3-parametre-21=Tijd toegekend voor het openen van de verbinding met de loyaliteitsdienst, in milliseconden. Daarna toont de kassa dat loyaliteit niet beschikbaar is en gaat de verkoop zonder verder. 0: 1500 ms (BO-10-03-10).
j.rc3-parametre-22=Antwoordtijd van de loyaliteitsdienst (ms)
j.rc3-parametre-23=Tijd toegekend aan de loyaliteitsdienst om op een oproep te antwoorden (spaarpot, voordelen, zoeken, betaling), in milliseconden. Daarna toont de kassa dat loyaliteit niet beschikbaar is en gaat de verkoop zonder verder. 0: 2500 ms (BO-10-03-10).
j.rc3-parametre-24=De besteldatum naar de promotie-engine sturen
j.rc3-parametre-25=Wanneer het ticket een bestelling overneemt, draagt het mandje dat naar de promotie-engine gaat — en via haar naar het loyaliteitsprogramma — de datum van de bestelling, zodat de op die datum verworven voordelen worden geactiveerd, verlopen campagnes inbegrepen. Uitgeschakeld — de standaard — alleen de datum van het ticket wordt doorgegeven (BO-10-03-17).
j.rc3-parametre-26=Frequentie van de knooppuntrapporten (seconden)
j.rc3-parametre-27=Interval tussen twee rapporten van een kassa aan haar winkel en van een winkel aan de centrale: versie, updatestatus, randapparatuur, inventaris, integraties, gebruik van de functies. Gelezen bij het opstarten van het knooppunt; nul of minder: zestig seconden (BO-08-04-15, BO-08-04-16, BO-08-04-20, BO-08-03-01).
j.rc3-parametre-28=Telling van het gebruik van de functies
j.rc3-parametre-29=Elke kassafunctie en elke handeling in de backoffice wordt per dag, per knooppunt en per functie geteld en daarna naar de centrale gestuurd voor de statistieken. Uitgeschakeld: er wordt niets geteld (BO-08-02-02).
j.rc3-parametre-30=De onderhoudsopdrachten van de centrale of de winkel (herstart betaalterminal, herinitialisatie van een randapparaat, opnieuw ophalen van de referentiëlen, updatecontrole) worden door het knooppunt uitgevoerd. Uitgeschakeld: het knooppunt weigert ze en de weigering wordt vastgelegd (BO-08-04-17).
j.rc3-parametre-31=Automatisch opnieuw starten van mislukte integraties
j.rc3-parametre-32=Een gedeponeerd bestand waarvan de integratie mislukte of regels weigerde, wordt bewaard en automatisch opnieuw geïntegreerd op de ingestelde frequentie. Uitgeschakeld: alleen de handmatige herstart in de integratieconsole speelt het opnieuw af (BO-08-04-03, BO-08-04-04, BO-08-04-05, BO-08-04-06, BO-08-04-07, BO-08-04-08).
j.rc3-parametre-33=Tijd tussen twee herstarts van een integratie (minuten)
j.rc3-parametre-34=Minimale tijd tussen twee automatische herintegraties van eenzelfde mislukte deponering. Nul of minder: tien minuten (BO-08-04-03, BO-08-04-08).
j.rc3-parametre-35=Maximaal aantal herstarts van een integratie
j.rc3-parametre-36=Daarna wordt de deponering door de automatische herstart opgegeven en vertrekt ze alleen nog via de handmatige herstart. Nul of minder: vijf (BO-08-04-03, BO-08-04-09, BO-08-04-13).
j.rc3-parametre-37=Kassameldingen op mobiel toestel
j.rc3-parametre-38=De kassameldingen (oproepen van een supervisor) verschijnen op de mobiele pagina van de backoffice, waar een verantwoordelijke ze op afstand bevestigt, toestaat of weigert. Uitgeschakeld: de mobiele pagina toont geen enkele melding (BO-10-08-02).
j.rc3-parametre-39=Automatische update bij het opstarten
j.rc3-parametre-40=Een knooppunt waarvan de versie lager is dan die van zijn uitrolbatch, werkt zichzelf bij bij het opstarten, zelfs buiten het venster van de batch: de seizoenskassa of -winkel haalt de versie in bij het aanzetten. Uitgeschakeld: het wacht op het volgende venster (BO-08-03-07).
j.rc3-parametre-41=Aantal updatepogingen
j.rc3-parametre-42=Een mislukte update wordt automatisch opnieuw geprobeerd bij het volgende rapport van het knooppunt, tot dit aantal; daarna start alleen een forcering vanuit de uitrolconsole haar opnieuw. Nul of minder: drie (BO-08-04-01, BO-08-04-02).
j.rc3-parametre-43=Automatisch terugdraaien
j.rc3-parametre-44=Een geïnstalleerde versie die haar zelftest niet doorstaat, wordt automatisch vervangen door de vorige applicatieversie, zonder de gegevens van de referentiëlen aan te raken. Uitgeschakeld: het knooppunt blijft op de mislukte versie, gemeld als afwijking (BO-08-04-14).
