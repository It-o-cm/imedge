j.nb-forcages-prix=Aant. geforceerde prijzen
j.nb-total-de-clients=Totaal aant. klanten
j.niveau-de-detail=Detailniveau
j.niveau-de-la-nomenclature-ifls-auquel-le=Niveau van de IFLS-nomenclatuur waarop de omzet per nomenclatuur wordt weergegeven (R16): 0 is de wortel. Standaard 1.
j.niveau-du-controle-none-aucun-controle-warn=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Geactiveerd boven de hieronder vermelde maximale hoeveelheid (BO-10-02-06).
j.niveau-du-controle-none-aucun-controle-warn-2=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Geactiveerd boven het hieronder vermelde maximale totaal (BO-10-02-07). ENDORSE geldt hier als BLOCK: op dit moment bestaat er geen goedkeuringsprocedure.
j.niveau-du-controle-none-aucun-controle-warn-3=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Wachtende tickets die niet worden hernomen, worden door de afsluiting geannuleerd: deze controle verwittigt de kassier daarvan (BO-10-02-08). ENDORSE geldt hier als BLOCK: op dit moment bestaat er geen goedkeuringsprocedure.
j.niveau-du-controle-none-aucun-controle-warn-4=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Betreft het annuleren van reeds ontvangen betalingen van een ticket dat wordt betaald (BO-10-02-02).
j.niveau-du-controle-none-aucun-controle-warn-5=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Betreft het gebruik van elektronische betaalmiddelen aan de kassa (BO-10-02-10). ENDORSE geldt hier als BLOCK: op dit moment bestaat er geen goedkeuringsprocedure.
j.niveau-du-controle-none-aucun-controle-warn-6=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Betreft het bedrag ingevoerd voor een betaalmiddel, vergeleken in absolute waarde (BO-10-02-17). ENDORSE geldt hier als BLOCK: op dit moment bestaat er geen goedkeuringsprocedure.
j.niveau-du-controle-none-aucun-controle-warn-7=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Betreft de geforceerde prijs van een regel, vergeleken in absolute waarde: een verkoop en een retour hebben hetzelfde plafond (BO-10-02-16).
j.niveau-du-controle-none-aucun-controle-warn-8=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Betreft het openen van de lade zonder verkoop: dienstaanvang en afsluiting van de sessie (BO-10-02-04). ENDORSE geldt hier als BLOCK: op dit moment bestaat er geen goedkeuringsprocedure.
j.niveau-du-controle-none-aucun-controle-warn-9=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Zonder effect wanneer de supervisorgoedkeuring voor regelannulering uitgeschakeld is: deze vlag bepaalt OF de handeling bewaakt wordt, deze sleutel bepaalt wat er dan gebeurt (BO-10-02-01).
j.niveau-du-controle-none-aucun-controle-warn-10=Controleniveau: NONE (geen controle), WARN (niet-blokkerende waarschuwing, de handeling gaat door en de operator wordt verwittigd), BLOCK (handeling geweigerd, door geen enkele kassabevoegdheid op te heffen) of ENDORSE (handeling geweigerd tot een supervisor goedkeuring geeft). Een onbekende waarde valt terug op de standaard van dit punt. Zonder effect wanneer de supervisorgoedkeuring voor terugbetaling uitgeschakeld is: deze vlag bepaalt OF de handeling bewaakt wordt, deze sleutel bepaalt wat er dan gebeurt (BO-10-02-03).
j.niveau-introuvable=Niveau niet gevonden.
j.niveau-echelon-et-parametre-sont-obligatoires=Niveau, trap en parameter zijn verplicht.
j.nom-de-l-organisme-qui-a-certifie=Naam van de instantie die het weegsysteem van de kassa heeft gecertificeerd (aangemelde instantie), getoond via de toets METROLOGIE van het onderhoudsscherm. Leeg: “niet ingevuld” (LC-14-03-01).
j.nom-de-la-caissiere=Naam van de kassierster
j.nom-du-point-de-retrait=Naam van het afhaalpunt
j.nom-du-segment-auquel-un-client-en=Naam van het segment waartoe een klant op rekening moet behoren opdat zijn korting van toepassing is. Leeg: de korting van de fiche geldt voor elke klant op rekening die er een heeft (BO-10-04-07).
j.nom-du-theme-applique-a-l-ecran=Naam van het thema dat in oefenmodus op het kassascherm wordt toegepast, om het te onderscheiden van het standaard verkoopscherm (donker, licht). Leeg: de opleiding behoudt het gewone thema en alleen de banner geeft ze aan (BO-10-07-08).
j.nom-ou-badge-du-valideur-obligatoire=Naam of badge van de valideerder verplicht.
j.nombre-d-articles=Aantal artikelen
j.nombre-d-articles-que-le-caissier-re=Aantal artikelen dat de kassier opnieuw scant bij een gedeeltelijke controle; een artikel dat in het winkelmandje ontbreekt of te veel is, zet over naar een volledige controle (LC-06-05-04, LC-06-05-05).
j.nombre-d-articles-retenus-au-classement-des=Aantal artikelen opgenomen in de ranglijst van de best verkochte artikelen, gerangschikt op afnemende hoeveelheid (R19). Standaard 20.
j.nombre-d-authentifications-back-office-erronees=Aantal opeenvolgende mislukte backoffice-aanmeldingen waarna het account wordt vergrendeld. 0: geen vergrendeling, de pogingen worden niet geteld (BO-01-01-01).
j.nombre-d-exemplaires-du-bon-d-enlevement=Aantal exemplaren van de afhaalbon
j.nombre-de-clients=Aantal klanten
j.nombre-de-colonnes-de-saisie-directe-de=Aantal kolommen voor directe invoer, van 2 tot 6 (LC-02-07-02).
j.nombre-de-decimales-de-la-base-hors=Aantal decimalen van de basis excl. BTW van elke regel van de BTW-tabel: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
j.nombre-de-decimales-du-montant-de-taxe=Aantal decimalen van het belastingbedrag van elke regel van de BTW-tabel: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
j.nombre-de-decimales-du-prix-unitaire-hors=Aantal decimalen van de eenheidsprijs excl. BTW op de factuur en de leveringsbon: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-hors-taxe=Aantal decimalen van het totaal excl. BTW in de voet van het document: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-toutes-taxes=Aantal decimalen van het totaal incl. BTW in de voet van het document: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
j.nombre-de-declenchements=Aantal activeringen
j.nombre-de-jours-au-bout-desquels-la=Aantal dagen waarna de kassa en de backoffice de houder vragen zijn code te wijzigen. 0: geen vervaldatum, de code blijft onbeperkt geldig. Een nooit gewijzigd geheim wordt als vervallen beschouwd zodra een termijn is ingesteld (BO-01-02-12).
j.nombre-de-jours-avant-la-date-de=Aantal dagen vóór de vervaldatum vanaf wanneer die als nabij wordt beschouwd. Nul: alleen een bereikte of overschreden datum activeert de waarschuwing (LC-11-03-13).
j.nombre-de-jours-en-arriere-sur-lesquels=Aantal dagen terug waarover de kassa een afgesloten ticket zoekt — herdruk, omruiling, terugbetaling — voordat ze de zoekopdracht opgeeft. 0 of negatieve waarde: de ingebouwde diepte van 30 dagen (BO-10-07-16).
j.nombre-de-jours-pendant-lesquels-les-etats=Aantal dagen gedurende welke de aan het einde van elke periode automatisch aangemaakte rapporten met hun document worden bewaard. 0: onbeperkte bewaring, zoals elke niet-ingestelde bewaartermijn (BO-09-03-02).
j.nombre-de-jours-pendant-lesquels-un-bon=Aantal dagen gedurende welke een bon, een tegoed of een cadeaukaart waarvan de geldigheid verstreken is ZONDER ooit te zijn gebruikt, in de database blijft vóór verwijdering, geteld vanaf de geldigheidsdatum. 0: onbeperkte bewaring (BO-10-08-13).
j.nombre-de-jours-pendant-lesquels-un-instrument=Aantal dagen gedurende welke een instrument ZONDER geldigheidsdatum na de uitgifte in de database blijft, vóór verwijdering. 0: onbeperkte bewaring (BO-10-08-15).
j.nombre-de-jours-pendant-lesquels-un-instrument-2=Aantal dagen gedurende welke een gedateerd en opgebruikt instrument na het opgebruiken in de database blijft, vóór verwijdering. 0: onbeperkte bewaring (BO-10-08-14).
j.nombre-de-jours-date-proche=Aantal dagen “datum nabij”
j.nombre-de-lignes-annulees-et-montant-ttc=Aantal geannuleerde regels en ingetrokken bedrag incl. BTW. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-de-lignes-imprimees-sur-une-facturette=Aantal regels afgedrukt op een betaalbewijs voordat het volgende blad wordt gevraagd. Onder 1 wordt het betaalbewijs in één keer afgedrukt (LC-08-04-12/13).
j.nombre-de-lignes-vendues-avec-prix-force=Aantal regels verkocht met geforceerde prijs en hun uiteindelijk bedrag incl. BTW. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-de-minutes-avant-la-fin-de=Aantal minuten vóór het einde van de periode vanaf wanneer de nog open kassa's worden gesloten. Een kassa midden in een verkoop wordt niet gesloten: de opdracht blijft in wacht en de kassa voert ze uit zodra ze in rust is (BO-09-03-07).
j.nombre-de-minutes-pendant-lesquelles-une-caisse=Aantal minuten gedurende welke een kassa geen teken van leven meer kan geven voordat de backoffice haar als niet-verbonden aanmerkt. Elke kassa haalt elke twintig seconden haar opdrachten op, dus een waarde van drie minuten laat acht gemiste rondes toe. 0 of minder: drie minuten; een tolerantie van nul zou iedereen tussen twee oproepen offline verklaren (BO-04-03-05).
j.nombre-de-pochettes=Aantal enveloppen:
j.nombre-de-reglements-et-montant-encaisse-par=Aantal betalingen en ontvangen bedrag per betaalmiddel. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-de-secondes-entre-deux-lectures-du=Aantal seconden tussen twee lezingen van de FTP-map van de weegschalen. Nul: ophalen gestopt (BO-03-06-56).
j.nombre-de-touches-de-groupe-d-articles=Aantal toetsen voor artikelgroepen per pagina op het scherm voor directe invoer. Onder 1 geldt de standaardwaarde (BO-03-01-06).
j.nombre-de-touches-groupe-par-page=Aantal groepstoetsen per pagina
j.nombre-et-montant-ttc-des-tickets-abandonnes=Aantal en bedrag incl. BTW van de geannuleerde tickets. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-et-montant-des-apports-au-tiroir=Aantal en bedrag van de aanvullingen in de lade. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-et-montant-des-depenses-de-caisse=Aantal en bedrag van de kasuitgaven. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nombre-et-montant-des-prelevements-du-tiroir=Aantal en bedrag van de afromingen uit de lade. Weergave en afdruk van het omzetrapport (LC-12-07-02).
j.nomenclature-introuvable=Nomenclatuur niet gevonden.
j.nothing-to-encode=Nothing to encode
j.numero-fiscal-presente-en-caisse-avant-validatio=Fiscaal nummer dat aan de kassa wordt voorgesteld vóór de validatie van het ticket, en dat de kassamedewerker kan vervangen door dat van de klant. Leeg: er wordt geen NIF voorgesteld (BO-10-04-15).
j.numero-de-certification-du-logiciel-delivre-par=Certificeringsnummer van de software, uitgereikt door de belastingadministratie, afgedrukt op alle verkoop- en retourdocumenten van de kassa. Leeg: er wordt geen vermelding afgedrukt, wat het geval is voor elk land dat er geen vereist. Ingesteld op niveau PAYS, geldt het voor alle kassa's van dat land (BO-10-06-03).
j.numero-de-demande-obligatoire=Aanvraagnummer verplicht.
j.numero-de-pochette-obligatoire=Envelopnummer verplicht.
j.numero-de-sac-obligatoire=Zaknummer verplicht.
j.numero-du-certificat-d-examen-de-type=Nummer van het typekeuringscertificaat of het evaluatiecertificaat van het weegsysteem, getoond via de toets METROLOGIE van het onderhoudsscherm. Leeg: “niet ingevuld” (LC-14-03-01).
j.numeros-de-lot-en-rappel=Lotnummers in terugroeping
j.n-article=Artikelnr.
j.n-de-certificat-metrologique=Nr. metrologisch certificaat
j.n-de-certification-fiscale=Nr. fiscale certificering
j.n-de-compte-deja-attribue=Rekeningnr. al toegekend:
j.n-de-compte-obligatoire=Rekeningnr. verplicht.
j.n-de-la-caissiere=Nr. van de kassierster
j.n-de-la-promotion=Nr. van de promotie
j.n-de-la-raison=Nr. van de reden
j.n-du-ticket=Nr. van het ticket
j.n-famille=Familienr.
j.n-fiscal-deja-enregistre=Fiscaal nr. al geregistreerd:
j.n-remboursement=Terugbetalingsnr.
j.n-ticket=Ticketnr.
j.objet=Onderwerp:
j.offres-de=Aanbiedingen van
j.ordre-d-affichage-des-touches-groupe-sur=Weergavevolgorde van de groepstoetsen op het scherm voor directe invoer: ALPHA (alfabetisch, standaard), CUSTOM (aangepaste volgorde van de groepsfiche) of VOLUME (afnemend verkoopvolume). Een onbekende waarde valt terug op ALPHA (BO-03-01-10/11/13).
j.ordre-d-impression-des-articles-sur-le=Afdrukvolgorde van de artikelen op het kassaticket: ENTRY (volgorde van registratie, standaard), LABEL (alfabetisch op omschrijving) of FAMILY (gegroepeerd onder de omschrijving van hun familie). Een onbekende waarde valt terug op ENTRY (LC-08-01-07).
j.ordre-des-articles-sur-le-ticket=Volgorde van de artikelen op het ticket
j.ordre-des-touches-articles=Volgorde van de artikeltoetsen
j.ordre-des-touches-groupe=Volgorde van de groepstoetsen
j.ordre-personnalise-invalide-entier-positif-atten=Ongeldige aangepaste volgorde — positief geheel getal verwacht.
j.organisme-de-certification-metrologique=Metrologische certificeringsinstantie
j.origine-du-montant-inconnue=Onbekende herkomst van het bedrag.
j.ouverture-du-tiroir-a-la-cloture-de=Openen van de lade bij afsluiting van de sessie
j.ouverture-du-tiroir-au-paiement=Openen van de lade bij betaling
j.ouverture-du-tiroir-a-la-prise-de=Openen van de lade bij dienstaanvang
j.ouvre-la-proposition-d-envoi-apres-la=Opent het verzendvoorstel na het afsluiten van een verkoop, zonder automatisch een bericht te verzenden: de e-mail vertrekt naar het adres dat aan de kassa gekozen wordt. Uitgeschakeld: geen voorstel bij het einde van de verkoop (LC-08-02-05, BO-10-07-22).
j.ou-l-eco-participation-des-articles-qui=Waar de recyclagebijdrage van de artikelen die er een hebben op het ticket wordt afgedrukt: NONE (nergens, standaard), LINE (onder elk betrokken artikel) of TOTAL (één enkele regel, onder de BTW-uitsplitsing). Een onbekende waarde valt terug op NONE (BO-10-06-06).
j.ou-le-nombre-d-articles-de-la=Waar het aantal artikelen van de verkoop wordt afgedrukt: NONE (nergens, standaard), TOTAL_LINE (tussen haakjes op de regel van het te betalen totaal) of OWN_LINE (op een eigen regel, onder het totaal). Een onbekende waarde valt terug op NONE (BO-10-07-10).
j.ou-sortent-les-lignes-portant-l-attribut=Waar de regels met het sorteerattribuut worden afgedrukt: NONE (alleen sorteren, standaard), START (apart aan het begin van het ticket) of END (apart aan het einde). Een onbekende waarde valt terug op NONE (BO-03-03-18).
j.pain-complet-500g=VOLKORENBROOD 500G
j.pdv-a-renommer-introuvable=Te hernoemen PDV niet gevonden.
j.per-op-l-aval-vaut-pour-un=PER_OP: de goedkeuring geldt voor één enkele handeling (standaard). PER_TICKET: eenmaal gegeven, blijft de goedkeuring aan het ticket gekoppeld tot de toets EINDE SUPERVISOR of het einde van het ticket (EXP-33).
j.points-de-controle=CONTROLEPUNTEN
j.produit-en-rappel-lots=PRODUCT TERUGGEROEPEN - LOTEN:
j.programme-externe=EXTERN PROGRAMMA
j.prelevement-et-transfert=AFROMING EN OVERDRACHT
j.purge-a-la-cloture=OPSCHONING BIJ AFSLUITING
