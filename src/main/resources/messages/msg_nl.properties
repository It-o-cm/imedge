j.une-demande-de-service-tranchee-deja-traitee=Een afgehandelde serviceaanvraag — al verwerkt aan de kassa, teruggestuurd naar de kassa of geweigerd — blijft duidelijk gemarkeerd op het dashboard staan tot ze bevestigd is. Uitgeschakeld: ze verdwijnt uit de lijst zodra ze afgehandeld is (BO-04-02-03/-04/-05).
j.une-image-neuve-demande-un-fichier=Een nieuwe afbeelding vereist een bestand.
j.une-ligne-de-cumul-des-remises-immediates=Een regel met het totaal van de directe kortingen — regelkortingen en ticketkorting — wordt onder de totalen afgedrukt. Uitgeschakeld: geen totaalregel (BO-03-03-24).
j.une-ligne-du-flux-client-en-compte=Een regel van de stroom klanten op rekening waarvan de straat, de postcode of de gemeente ontbreekt, wordt GEWEIGERD en vermeld in het importverslag; de rest van het bestand wordt geïntegreerd. Uitgeschakeld — de standaard — de regel wordt geïntegreerd met het adres dat hij bevat (BO-10-08-27).
j.une-periode-est-deja-ouverte=Er is al een periode open.
j.une-remise-ou-un-discount-ligne-ou=Een korting of discount (regel of ticket) vereist goedkeuring van een supervisor. Uitgeschakeld: de kassier past ze alleen toe (EXP-32).
j.une-remise-ou-un-rabais-saisi-librement=Een vrij ingevoerde korting of afslag geldt voor een artikel dat al een manuele korting of een automatische promotie heeft. Uitgeschakeld: de handeling wordt op die regel geweigerd. Een vooraf ingestelde toets met CUMUL gaat voorbij aan deze standaard (BO-03-07-11).
j.une-regle-par-ligne-path-pay-bloque=Eén regel per lijn: path:/pay blokkeert de betaling; path:/action/discount/* blokkeert alle kortingsacties; key: gevolgd door een identificatie uit het rapport over het toetsgebruik blokkeert die specifieke toets. De toetsen blijven zichtbaar en leggen hun weigering uit. Leeg: geen extra blokkering. Het verlaten van de opleiding blijft toegankelijk; de verboden om echte verrichtingen uit te voeren blijven voorrang hebben (LC-13-05-04).
