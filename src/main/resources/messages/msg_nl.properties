j.comment-l-adresse-ci-dessus-est-rendue=Hoe het adres hierboven wordt weergegeven: QR (QR-code, standaard), BARCODE (barcode), TEXTE (het adres in leesbare tekst) of AUCUN (er wordt niets afgedrukt, zelfs als er een adres is ingevoerd). Een onbekende waarde valt terug op QR (BO-03-05-08).
j.comment-le-ticket-voyage-dans-l-email=Hoe het kasticket in de e-mail meegaat: BODY (in de tekst van het bericht, standaard), ATTACHMENT (als bijlage) of BOTH (beide). Met logo: HTML-tekst met geïntegreerde afbeeldingen en tekstalternatief, zelfstandige HTML-bijlage. Zonder logo: tekst en TXT-bijlage. Een onbekende waarde valt terug op BODY (LC-08-02-07/08).
j.comment-les-lignes-d-avantage-sont-regroupees=Hoe de voordeelregels gegroepeerd worden onder het spaartegoed van de dag: TYPE (per type voordeel, standaard), CATEGORY (per categorie) of NONE (platte lijst). Met CATEGORY komen de groepen in de volgorde van categorieprioriteit die het antwoord van het getrouwheidsprogramma meedeelt, daarna in volgorde van aankomst voor de categorieën zonder rang. Een onbekende waarde valt terug op TYPE (BO-03-03-25, BO-03-03-33, BO-10-03-20).
