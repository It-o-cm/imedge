j.montant-annulations=Bedrag annuleringen
j.montant-au-dela-duquel-le-controle-du=Bedrag waarboven de controle op het artikelbedrag wordt geactiveerd, vergeleken in absolute waarde. Leeg: geen plafond, de controle wordt nooit geactiveerd (BO-10-02-16).
j.montant-au-dela-duquel-le-controle-du-2=Bedrag waarboven de controle op het betalingsbedrag wordt geactiveerd, vergeleken in absolute waarde. Leeg: geen plafond, de controle wordt nooit geactiveerd (BO-10-02-17).
j.montant-au-dela-duquel-un-mouvement-de=Bedrag waarboven een kasbeweging (afroming, aanvulling, uitgave, voorschot, aangifte) goedkeuring van een manager vereist. Een beweging van dit bedrag of minder gaat door zonder goedkeuring (BO-04-01-44).
j.montant-compte-obligatoire-et-positif=Geteld bedrag verplicht en positief.
j.montant-d-article-plafond=Plafond artikelbedrag (€)
j.montant-de-chargement-obligatoire-et-non-nul=Oplaadbedrag verplicht en niet nul.
j.montant-de-l-ecart-visible-du-caissier=Bedrag van het verschil zichtbaar voor de kassier
j.montant-de-la-remise=Bedrag van de korting
j.montant-de-reglement-plafond=Plafond betalingsbedrag (€)
j.montant-des-annulations=Bedrag van de annuleringen
j.montant-des-ventes=Bedrag van de verkopen
j.montant-du-ticket=Bedrag van het ticket
j.montant-du-en-caracteres-agrandis=Verschuldigd bedrag in vergrote tekens
j.montant-maximal-rendu-en-especes-par-cashback=Maximaal bedrag dat per transactie via cashback in contanten wordt teruggegeven; daarboven wordt de aanvraag geweigerd vóór de betaalterminal wordt bevraagd. 0: geen plafond (LC-07-04-07/08).
j.montant-moyen-par-tpv=Gemiddeld bedrag per TPV
j.montant-moyen-par-client=Gemiddeld bedrag per klant
j.montant-net-des-ventes=Nettobedrag van de verkopen
j.montant-obligatoire-et-strictement-positif=Bedrag verplicht en strikt positief.
j.montant-pre-rempli-du-fond-de-caisse=Vooraf ingevuld bedrag van het kasfonds bij het openen van de sessie, dat de kassier kan corrigeren. Beheerd per winkel en overgeërfd per niveau (BO-03-02-41).
j.montant-tenu-par-le-logiciel-realigne=Door de software bijgehouden bedrag opnieuw afgestemd.
j.montant-verse=Betaald bedrag:
j.montant-eligible-aux-eco-cheques-sur-l=Bedrag in aanmerking voor ecocheques op het klantendisplay
j.montant-eligible-a-la-carte-achat-sociale=Bedrag in aanmerking voor de sociale aankoopkaart op het klantendisplay
j.monetique-2=Elektronisch betalen
j.mot-de-passe-ftp-des-balances=FTP-wachtwoord van de weegschalen
j.mot-de-passe-a-la-fermeture=Wachtwoord bij het sluiten
j.mot-de-passe-a-la-prise-de=Wachtwoord bij dienstaanvang
j.mot-de-passe-actuel-incorrect=Huidig wachtwoord onjuist.
j.mot-de-passe-du-compte-ftp-des=Wachtwoord van het FTP-account van de weegschalen (BO-03-06-56).
j.mot-de-passe-modifie-reconnectez-vous=Wachtwoord gewijzigd. Meld u opnieuw aan.
j.motif-de-reconnaissance-en-expression-reguliere=Herkenningspatroon, als reguliere expressie, van de streepjescode van een qbusting-transactie (winkelmandje samengesteld in de wachtrij): aan de kassa gescand, laadt het het op het winkelknooppunt geplaatste winkelmandje. Leeg: geen qbusting-transactie herkend (BO-03-06-57).
j.motifs-d-abandon=Redenen voor annulering
j.motifs-de-demande-de-service=Redenen voor serviceaanvraag
j.motifs-de-depense=Redenen voor uitgave
j.motifs-de-redemarrage=Redenen voor herstart
j.motifs-de-retour=Redenen voor retour
j.motifs-proposes-au-caissier-lors-d-un=Redenen die de kassier bij een retour worden aangeboden, gescheiden door puntkomma's. De gekozen reden geldt voor het hele retour, wordt gelogd en op het retourticket afgedrukt (bruikbaar in de BackOffice-rapporten). Leeg: er wordt geen reden gevraagd (LC-05-05-01/02).
j.motifs-proposes-au-caissier-pour-abandonner-un=Redenen die de kassier worden aangeboden om een ticket te annuleren, gescheiden door puntkomma's. De gekozen reden wordt gelogd en op het annuleringsticket afgedrukt. Leeg: er wordt geen reden gevraagd (LC-04-04-10).
j.motifs-proposes-au-caissier-pour-une-depense=Redenen die de kassier worden aangeboden voor een UITGAVE betaald uit de lade, gescheiden door puntkomma's; de reden is verplicht, een ontbrekende reden weigert de uitgave. De lijst mengt niet langer de redenen voor afroming en aanvulling, die hun eigen schermen hebben (BO-04-01-44).
j.motifs-proposes-a-l-ecran-d-appel=Redenen aangeboden op het scherm voor supervisoroproep, gescheiden door puntkomma's — beheerde lijst in plaats van de vier vaste knoppen (EXP-84).
j.motifs-proposes-separes-par-des-points-virgules=Aangeboden redenen, gescheiden door puntkomma's. Leeg: vertaalde redenen geleverd door de kassa (LC-13-03-04).
j.mouvement-corrige=Beweging gecorrigeerd.
