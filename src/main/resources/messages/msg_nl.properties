j.articles-de-consigne=Statiegeldartikelen
j.codes-ean-des-articles-de-consigne=EAN-codes van de statiegeldartikelen (fles, krat, verpakking met statiegeld), gescheiden door puntkomma's. Een verkoopregel van deze artikelen voedt de statiegeldzijde van de staat statiegeld / teruggave, een teruggenomen regel de teruggavezijde. Leeg: alleen statiegeldretouren en statiegeldbonnen voeden de staat (BO-03-13-11).

