j.l-activation-du-mode-degrade-monetique-force=Het activeren van de geforceerde noodmodus van de betaalterminal aan de kassa vereist goedkeuring van een supervisor. Uitgeschakeld: de operator activeert hem zelf. Het opheffen heeft een eigen parameter (LC-07-08-03, BO-03-02-49).
j.au-bout-de-ce-delai-le-mode-degrade-en-caisse=Na deze termijn wordt de geforceerde noodmodus aan de kassa vanzelf opgeheven, en de in de BackOffice geactiveerde noodmodus geldt niet langer op elke kassa: de operator die hem activeerde, is niet degene die er drie uur later nog staat (LC-07-08-04, BO-03-02-48).
j.composition-des-rouleaux-separes-par-des=Samenstelling van de rollen, gescheiden door puntkomma's, in de vorm NOMINALE_WAARDE:BEDRAG_ROL:AANTAL_MUNTEN — voorbeeld 0.20:8.00:40;0.01:0.50:50; het aantal munten mag worden weggelaten (het is dan het bedrag gedeeld door de nominale waarde), en een invoer waarvan de drie waarden niet overeenkomen, wordt genegeerd. Dient voor de kruisberekening bedrag <-> aantal rollen van de wisselgeldbestelling en voor de rollen die bij de kastelling worden aangeboden (LC-12-05-06/07, BO-03-02-42). Leeg: geen kruisberekening, en de telling biedt haar gebruikelijke rollen aan.

