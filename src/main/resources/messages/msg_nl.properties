j.palier-du-don-centimes=Stap van de donatie (cent)
j.palier-propose-pour-le-don-5-10=Voorgestelde stap voor de donatie: bijvoorbeeld 5, 10, 100 cent (LC-07-17-02).
j.panels-marketing-scan=Marketingpanels (scan)
j.par-caissiere=Per kassierster
