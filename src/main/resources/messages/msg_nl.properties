j.active-l-ecran-d-ecart-affiche-le=Ingeschakeld: het verschilscherm toont het vastgestelde bedrag. Uitgeschakeld (standaard): het meldt alleen dat het verschil de drempel overschrijdt, zonder het cijfer — een kassier die het verschil leest, kan zijn telling aanpassen tot het verdwijnt. Het bedrag blijft in de Z, in het journaal en voor de verantwoordelijke.
j.active-la-touche-monnayeur-regle-les-especes=Ingeschakeld: de toets MUNTAUTOMAAT rekent de contanten af op de muntautomaat, die het wisselgeld teruggeeft; het ingevoerde bedrag wordt op beide displays getoond, de contanten worden aan het einde van de verkoop naar de kluis afgeroomd, en de door de muntautomaat gemelde drempels worden bij de opening en na elke verkoop aangekondigd (LC-07-15-01 tot -04, LC-13-01-01).
j.active-palier-le-plus-proche-desactive-palier=Ingeschakeld: dichtstbijzijnde trap; uitgeschakeld: hogere trap. Er wordt geen negatieve gift toegevoegd (LC-07-17-02).
j.active-pas-de-coupe-avant-le-ticket=Ingeschakeld: geen snede vóór het Verifone-klantenticket; het handelaarsticket blijft gescheiden en wordt niet gearchiveerd (LC-07-04-11).
j.adresse-de-base-du-service-fidelite-appele=Basisadres van de getrouwheidsdienst die wordt aangeroepen om het winkelmandje te waarderen met de getrouwheidsvoordelen, het spaartegoed te projecteren en de transacties te versturen. Leeg: de implementatie-eigenschap pos.fid.url is van toepassing (BO-11-04-04).
