j.un-nif-saisi-ou-scanne-qui-n=Een ingevoerd of gescand NIF dat alleen uit cijfers bestaat, al dan niet voorafgegaan door PT, moet 9 cijfers tellen, met een wettelijk prefix beginnen en het juiste controlecijfer hebben (modulo 11); anders wordt het geweigerd. Een buitenlands NIF, dat letters bevat, wordt niet gecontroleerd (LC-08-06-04).
j.un-article-peut-etre-repris-sans-que=Een artikel kan worden teruggenomen zonder dat het oorspronkelijke ticket is geïdentificeerd: de artikelen worden vrij ingevoerd en hun prijs blijft wijzigbaar. Uitgeschakeld: elk retour verloopt via het oproepen van het oorspronkelijke ticket (LC-05-02-09/14).
j.un-article-scanne-alors-qu-un-reglement=Een artikel dat wordt gescand terwijl een betaling bezig is, wordt op de verkoop geregistreerd. Uitgeschakeld — de standaard — het wordt geweigerd en de kassier wordt verwittigd: een winkelmandje dat groeit terwijl men afrekent, is een winkelmandje waarvan het totaal niet meer klopt (BO-10-02-15).
j.un-article-scanne-que-le-referentiel-ne=Een gescand artikel dat het referentiebestand niet kent, stuurt een serviceaanvraag naar het dashboard, net als een supervisoroproep. Uitgeschakeld — de standaard — het onbekende artikel is pas achteraf in het logboek te raadplegen (BO-04-02-06).
