j.n19-parametre-2=De artikelen van een groep op het scherm voor directe invoer worden getoond van meest naar minst verkocht, volgens het verkoopvolume dat het winkelknooppunt berekent op de kassaverkopen. Uitgeschakeld: ze worden alfabetisch op omschrijving getoond, de standaardsortering wanneer aan de kassa geen sortering is gekozen (BO-03-01-10, BO-03-01-13).
