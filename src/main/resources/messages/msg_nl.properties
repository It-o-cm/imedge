j.ce-que-fait-la-caisse-au-bout=Wat de kassa doet na afloop van de inactiviteitstermijn: LOCK (vergrendeling — de operator blijft op post en hervat zijn verkoop met alleen zijn code, standaard) of CLOSE (sluiting van de werksessie — de operator wordt afgemeld en een volledige postovername is nodig). Een onbekende waarde valt terug op LOCK (BO-10-02-28).
j.ce-que-fait-la-caisse-quand-elle=Wat de kassa doet wanneer ze een barcode leest terwijl ze de verbinding met het winkelknooppunt kwijt is: NONE (niets), INFO (melding aan de kassier, de code wordt verwerkt) of BLOCK (de code wordt geweigerd). Leeg of onbekend: NONE (BO-03-06-45).
j.ce-que-fait-la-caisse-quand-un=Wat de kassa doet wanneer een gescande bon, tegoedbon of cadeaukaart noch door de kassa noch door het winkelknooppunt gekend is: INFO (melding, geen betaling) of BLOCK (foutmelding, de bon wordt geweigerd). Leeg of onbekend: BLOCK (BO-03-06-48).
j.ce-que-fait-la-caisse-quand-un-2=Wat de kassa doet wanneer een GS1-code een nabije, bereikte of verstreken houdbaarheidsdatum (AI 17) bevat: NONE (niets), INFO (melding aan de kassier, het artikel wordt geregistreerd), BLOCK (artikel geweigerd) of SUPERVISOR (artikel geweigerd, een supervisor kan de registratie forceren). Leeg of onbekend: NONE (LC-11-03-13, BO-03-06-64).
j.ce-que-fait-la-caisse-quand-un-3=Wat de kassa doet wanneer een GS1-coupon een bereikte of verstreken vervaldatum (AI 17) bevat: NONE, INFO of BLOCK. Leeg of onbekend: NONE (LC-11-03-13).
j.ce-que-fait-la-caisse-quand-un-4=Wat de kassa doet wanneer er al een gedeeltelijke betaling geregistreerd is: CONFIRM (het scherm kondigt de betalingen aan die geannuleerd zullen worden en de operator bevestigt) of BLOCK (het afbreken wordt geweigerd, de operator moet eerst de betaling annuleren). Leeg of onbekend: CONFIRM (LC-04-04-06/07/08/09).
j.ce-que-la-fin-de-periode-du=Wat de periodeafsluiting van het VERKOOPPUNT achtereenvolgens uitvoert, namen gescheiden door puntkomma's en in volgorde: CLOSE_REGISTERS (de open gebleven kassa's sluiten), SAFE_COUNT (telling van de kluis), Z_REPORT (geconsolideerd Z-rapport), BANK_DEPOSIT (bankstorting). Een onbekende naam wordt genegeerd. Leeg: de periodeafsluiting doet alleen wat de sleutels hierboven beschrijven, kassa per kassa (BO-03-12-02).
j.cet-identifiant-est-deja-pris=Deze gebruikers-ID is al in gebruik.
