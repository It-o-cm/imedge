j.m19-niveau-nomenclature-regroupement=Nomenclatuurniveau voor het groeperen van artikelen
j.m19-niveau-nomenclature-regroupement-aide=Wanneer de artikelen per familie worden gegroepeerd, het niveau van de nomenclatuur waaronder ze worden samengebracht: 1 voor het eerste niveau (afdeling), 2 voor het tweede, enzovoort. De gedrukte kop is het label van het knooppunt van dat niveau. 0: de familie van het artikel, zoals voorheen. Een niveau dat de nomenclatuur niet heeft, of een artikel zonder nomenclatuur, behoudt zijn eigen familie (BO-03-03-17).
j.m19-emplacement-promotions=Plaats van de promotieregels
j.m19-emplacement-promotions-aide=Waar het ticket de promoties van de motor afdrukt: LINE onder het betrokken artikel, FOOTER gegroepeerd onderaan het ticket, ENGINE volgens de plaats die elk voordeel draagt (onder het artikel wanneer de motor het vraagt, anders onderaan). Onbekende waarde: ENGINE (BO-03-03-23).
j.m19-attributs-facture=Artikelattributen gedrukt op de factuur
j.m19-attributs-facture-aide=Codes van de artikelattributen gedrukt onder elke regel van de factuur en van de leveringsbon, gescheiden door puntkomma's (bv. ORIGINE;CATEGORIE;VARIETE). Elk attribuut wordt gedrukt als « label : waarde », een attribuut zonder waarde voor het artikel wordt weggelaten. Deze attributen worden nooit op het kasticket gedrukt. Leeg: alleen de familie van het artikel wordt vermeld (BO-03-03-21).
j.m19-lignes-page-a4=Artikelregels per A4-pagina
j.m19-lignes-page-a4-aide=Aantal artikelregels op een A4-factuurpagina: daarboven gaat het document naar een nieuwe pagina, waarbij elke pagina de kop en de vermelding « pagina X / Y » herneemt. 0: één enkele pagina (BO-03-03-02).
j.m19-compte-client-obligatoire=Klantrekeningnummer verplicht
j.m19-compte-client-obligatoire-aide=Een factuur of een leveringsbon kan alleen worden uitgegeven voor een klant met een klantrekeningnummer, gedrukt in het klantblok van het document. Uitgeschakeld: het nummer wordt gedrukt wanneer de klant er een heeft (BO-03-04-16).
j.m19-validation-client=Validatie van de klantgegevens vóór het afdrukken
j.m19-validation-client-aide=Na de selectie van de klant toont de kassa zijn gegevens (adres, SIRET, btw, fiscaal nummer, rekening) zodat de kassamedewerker ze kan bevestigen of wijzigen vóór het afdrukken van het document. Uitgeschakeld: het document wordt meteen getoond, zonder validatiestap (BO-03-04-18).
j.m19-message-fid-2-lignes=Getrouwheidsvoordeelbericht 2 regels
j.m19-message-fid-2-lignes-aide=Het korte bericht (2 regels) van het getrouwheidsprogramma wordt gedrukt in de kaartvoordeelzone, vóór de lijst van de voordelen van de transactie. Uitgeschakeld: het wordt niet gedrukt (BO-03-03-26).
j.m19-messages-commerciaux-fid=Commerciële getrouwheidsberichten 10 regels
j.m19-messages-commerciaux-fid-aide=Maximaal aantal commerciële berichten (elk 10 regels) van het getrouwheidsprogramma, gedrukt aan het einde van de getrouwheidssectie van het ticket, van 0 tot 5. 0: er wordt geen commercieel bericht gedrukt (BO-03-03-27).
j.m19-documents-toujours-imprimes-aide=Documenten die ambtshalve worden gedrukt ongeacht de keuze van de kassier, gescheiden door puntkomma's: TICKET, CARTE, BON, AVOIR, FID, ENLEVEMENT, RETOUR, ACOMPTE, CARTE_PREPAYEE (bewijs van betaling met cadeau- of prepaidkaart), DEMAT (activeringsticket van een gedematerialiseerd product). TICKET, CARTE en BON vullen de keuze van de kassier aan. De andere documenten, ook de terugbetalingstegoedbon en de twee voorschottrajecten, worden alleen gedrukt als ze hier genoemd zijn wanneer de afdrukkeuze geactiveerd is. Leeg: geen bijbehorend document wordt gedrukt. Afdrukkeuze uitgeschakeld: gebruikelijke afdruk. De klantkopieën blijven per e-mail beschikbaar, ook zonder papier (LC-08-03-07, BO-03-03-01).
j.m19-atcud-aide=Validatiecode die de belastingadministratie aan elke documentreeks van de kassa toekent, in de vorm TYPE:CODE gescheiden door puntkomma's (bv. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). De gedrukte ATCUD is de code, een streepje, dan de rang van het document in zijn reeks. Per kassa te beheren, elke kassa heeft haar eigen reeksen. Een code van minder dan 8 tekens is geen code van de administratie en geldt als ontbrekende code. Type zonder code: ATCUD « 0-rang » (LC-08-04-23, BO-03-04-27).
