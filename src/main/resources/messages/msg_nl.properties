j.codes-des-paniers-selfscanning=Codes van de selfscanning-mandjes
j.codes-des-etats-edites-automatiquement-a-la=Codes van de rapporten die automatisch worden afgedrukt aan het einde van de periode, gescheiden door puntkomma's en in afdrukvolgorde. Een onbekende code wordt genegeerd. Leeg: geen automatische afdruk (BO-09-01-10, BO-09-01-11).
j.codes-pays-iso-separes-par-une-virgule=ISO-landcodes gescheiden door een komma, aangeboden aan de kassa voor de invoer van een buitenlandse NIF. De Portugese NIF volgt zijn eigen algoritme en staat niet in deze lijst (BO-10-04-17).
