# ---- lot 21: T ----
j.t21-parametre-1=Integratiestroom: opgehaalde stromen
j.t21-parametre-2=Codes van de stromen die het winkelknooppunt ophaalt, gescheiden door « ; », op het adres van de dienstverlener van het type Commerciële dienst in het protocol HTTP/JSON die op het scherm Dienstverleners is aangegeven: artikelen PRODUCTS, families FAMILIES, klanten CUSTOMERS, btw VAT_RATES, nomenclatuur NOMENCLATURE=<schema>. Elke stroom wordt gelezen met GET op <adres>/<code> met de sleutel van de dienstverlener en geïntegreerd als een aanlevering. Een bestand dat identiek is aan het laatst geïntegreerde wordt niet opnieuw verwerkt. Leeg: er wordt niets opgehaald (BO-11-01-01).
j.t21-parametre-3=Integratiestroom: frequentie (minuten)
j.t21-parametre-4=Interval tussen twee ophalingen van de integratiestromen, van 1 tot 1440 minuten (BO-11-01-01).
j.t21-parametre-5=Door de centrale terugbetaalde aanbiedingen
j.t21-parametre-6=Beginletters van aanbiedingslabels van de promotiemotor, gescheiden door « ; », waarvan de directe kortingen door de centrale worden terugbetaald: hun bedrag, gedragen door elke afgeprijsde regel, vult de kolom REMISES_AMONT van de stroom omzet per familie en per eiland. Leeg: alle directe kortingen van de motor gelden als terugbetaald door de centrale (BO-11-01-08).
j.t21-parametre-9=Stroom GS1-betalingen en gescande bonnen
j.t21-parametre-10=Produceert elke dag het bestand van de aan de kassa gelezen betaalcodes — GS1-bonnen (DataMatrix, QR, Databar), aankoopbonnen, tegoedbonnen, kaarten — met hun kassa, hun ticket, hun bedrag en hun verbruiksstatus, en van de bonnen verrekend op de afgesloten tickets (BO-11-01-18).
j.t21-parametre-11=Gecentraliseerd verbruik van de bonnen
j.t21-parametre-12=Voordat een GS1-bon wordt aanvaard, vraagt de kassa aan het winkelknooppunt of hij al is verrekend op een ticket van een kassa van de winkel; een reeds verbruikte bon wordt geweigerd. Uitgeschakeld: alleen de lopende verkoop wordt gecontroleerd (BO-11-01-18).
j.t21-parametre-13=Beheer van de zegels
j.t21-parametre-14=De kassa berekent het theoretische aantal zegels van elk ticket volgens de formule hieronder, drukt het af op het ticket en biedt het scherm waarop de kassierster de tijdens haar dienst uitgedeelde zegels aangeeft (BO-11-01-20).
j.t21-parametre-15=Zegels: aankoopschijf (€)
j.t21-parametre-16=Aankoopbedrag incl. btw dat recht geeft op zegels: het theoretische aantal van een ticket is het aantal volledige schijven van dit bedrag vermenigvuldigd met het aantal zegels per schijf. 0: geen theoretische zegel (BO-11-01-20).
j.t21-parametre-17=Zegels per schijf
j.t21-parametre-18=Aantal uitgedeelde zegels per volledige aankoopschijf (BO-11-01-20).
j.t21-parametre-19=Stroom theoretische en aangegeven zegels
j.t21-parametre-20=Produceert elke dag, per kassa en per dienst, het aantal tickets, theoretische zegels berekend volgens de beheerde formule en door de kassierster aangegeven zegels, en hun verschil (BO-11-01-20).
j.t21-parametre-21=Prijzen beschikbaar voor prijszuilen
j.t21-parametre-22=Het winkelknooppunt antwoordt de prijszuilen die op het scherm Dienstverleners zijn aangegeven (type Prijszuil) op GET /api/price-kiosk/<EAN>, met de sleutel van de dienstverlener in de header Authorization: Bearer: label, prijs incl. btw, prijs per kilo of per liter. Uitgeschakeld: elke aanvraag wordt geweigerd (BO-11-02-06).
j.t21-parametre-23=Antwoordformaat van de prijszuilen
j.t21-parametre-24=Formaat dat het protocol van de zuil verwacht: JSON, XML of TEXT (één regel EAN|label|prijs). Elke andere waarde: JSON (BO-11-02-06).
j.t21-parametre-25=Automatisch verzenden van de prijzen naar de etiketten
j.t21-parametre-26=Elke prijs die wordt aangemaakt, gewijzigd of van kracht wordt, wordt vanzelf verzonden naar alle actieve leveranciers van elektronische etiketten van het verkooppunt; bij de eerste doorgang vertrekken alle huidige prijzen. Een leverancier die niet heeft geantwoord, ontvangt bij de volgende doorgang alles wat hij heeft gemist. Uitgeschakeld: alleen het handmatig verzenden van een artikellijst is van toepassing (BO-11-03-05).
j.t21-parametre-27=Verzendritme naar de etiketten (seconden)
j.t21-parametre-28=Interval tussen twee automatische verzendingen van de prijzen naar de elektronische etiketten, van 10 tot 86400 seconden (BO-11-03-05).
j.t21-parametre-29=Inbreng en opnames via de muntautomaat
j.t21-parametre-30=Een inbreng van wisselgeld in contanten wordt in de muntautomaat gestort, die telt wat hij heeft aanvaard; een opname van contanten wordt door de muntautomaat afgegeven, die meldt wat hij heeft uitgegeven; het bedrag van de muntautomaat wordt geregistreerd. Het scherm Muntautomaat toont het contantniveau per coupure. Uitgeschakeld: inbreng en opnames worden met de hand geteld (BO-11-03-03).
j.t21-parametre-31=Adres van de NEXO Retailer-server
j.t21-parametre-32=Basisadres van de server van de gedematerialiseerde producten (cadeaukaarten en -boxen) die de kassa aanroept in het protocol NEXO Retailer, op <adres>/api/nexo. Leeg: de deploymenteigenschap pos.nexo.hub-url is van toepassing (BO-11-03-04).
j.t21-parametre-33=NEXO POI-identificatie
j.t21-parametre-34=Identificatie POIID die de kassa op de NEXO Retailer-server adresseert. Leeg: de deploymenteigenschap pos.nexo.poi-id is van toepassing (BO-11-03-04).
j.t21-parametre-35=Moment van de NEXO-uitwisseling bij de verkoop
j.t21-parametre-36=SCAN: het gedematerialiseerde product wordt geactiveerd zodra het wordt verkocht, bij het scannen van zijn code. PAYMENT: het wordt geactiveerd bij het begin van de betaling, alle producten van het ticket samen; een geweigerd product verlaat het ticket vóór elke betaling (BO-11-03-04).
j.t21-parametre-37=Bevestiging van de betalingen met prepaidkaart
j.t21-parametre-38=Bij het afsluiten van het ticket wordt elke door de NEXO Retailer-server gevalideerde betaling met prepaidkaart bevestigd met een bericht Payment van het type Completion. Uitgeschakeld: alleen de validatie van de betaling wordt gevraagd (BO-11-03-04).
j.t21-parametre-41=E-commerce: waarderingsmotor beschikbaar
j.t21-parametre-42=Het e-commerceplatform laat zijn winkelmandjes waarderen door de promotiemotor van het verkooppunt op POST /api/ecommerce/valuation, met hetzelfde token als bij het aanleveren van de bestellingen. Uitgeschakeld: de aanvraag wordt geweigerd (BO-11-04-03).
j.t21-parametre-43=E-commerce: terugmelding van de integratiestatus
j.t21-parametre-44=Het integratieverslag van elke e-commercebestelling — geïntegreerd, geweigerd, kanaal gesloten —, met het nummer van het verkooppunt, wordt teruggestuurd naar de dienstverleners van het type E-commerce, en opnieuw verzonden tot het is bevestigd. Uitgeschakeld: het platform leest de status alleen door erom te vragen (BO-11-04-03).
j.t21-parametre-45=Synchrone VT-loyaliteitsaanroep
j.t21-parametre-46=Aan het einde van het ticket stuurt de kassa het winkelmandje naar de loyaliteitsdienst en wacht op zijn antwoord (VT-aanroep), binnen de beheerde antwoordtijd. Een niet geslaagde verzending wordt toevertrouwd aan het GT-herzenden. Uitgeschakeld: het winkelmandje vertrekt uitgesteld via de verzendwachtrij (BO-11-04-05).
j.t21-parametre-47=Betaalgegevens in de VT-aanroep
j.t21-parametre-48=De VT-aanroep bevat alle betalingen van het ticket: betaalmiddel, bedrag, autorisatiereferentie. Uitgeschakeld: hij bevat alleen het gewaardeerde winkelmandje (BO-11-04-05).
j.t21-parametre-49=GT-herzending van niet geslaagde transacties
j.t21-parametre-50=De loyaliteitstransacties die aan het einde van het ticket niet zijn geslaagd, worden met de GT-aanroep opnieuw naar de loyaliteitsdienst gestuurd, in het ritme hieronder, tot ze worden aanvaard. Uitgeschakeld: ze blijven wachten en worden niet opnieuw verzonden (BO-11-04-06).
j.t21-parametre-51=Ritme van de GT-herzending (seconden)
j.t21-parametre-52=Interval tussen twee GT-herzendingen van de niet geslaagde loyaliteitstransacties, van 5 tot 3600 seconden (BO-11-04-06).
j.t21-parametre-53=Pad van de GT-aanroep
j.t21-parametre-54=Pad, op het adres van de loyaliteitsdienst, waarnaar de GT-aanroep een niet geslaagde transactie opnieuw stuurt. Leeg: het pad van de VT-aanroep (/api/events/ticket-closed, /api/events/ticket-return) (BO-11-04-06).
j.t21-parametre-55=VT-loyaliteitsaanroep vóór het afdrukken
j.t21-parametre-56=Vóór het afdrukken van het ticket roept de kassa de loyaliteitsdienst opnieuw aan met de lopende transactie, loyaliteitsbetaling inbegrepen, en drukt het saldo van de kaart af dat hij terugstuurt. Uitgeschakeld: het afgedrukte saldo is dat van de laatste waardering (BO-11-04-07).
