j.delai-de-connexion-au-service-fidelite=Verbindingstermijn met de getrouwheidsdienst (ms)
j.temps-accorde-a-l-ouverture-de-la-connexion-fidelite=Tijd die wordt toegekend aan het openen van de verbinding met de getrouwheidsdienst, in milliseconden. Daarna toont de kassa dat de getrouwheid niet beschikbaar is en gaat de verkoop zonder haar verder. 0: 1500 ms (BO-10-03-10).
j.envoyer-la-date-de-commande-au-moteur=De besteldatum naar de promotiemotor sturen
j.quand-le-ticket-reprend-une-commande-le-panier=Wanneer het kasticket een bestelling overneemt, draagt het winkelmandje dat naar de promotiemotor — en via haar naar het getrouwheidsprogramma — wordt gestuurd de datum van de bestelling, zodat de voordelen die op die datum verworven zijn worden toegekend, verlopen campagnes inbegrepen. Uitgeschakeld — de standaard — wordt alleen de datum van het kasticket doorgegeven (BO-10-03-17).
j.mot-de-passe-du-service-fidelite=Wachtwoord van de getrouwheidsdienst
j.mot-de-passe-du-compte-machine-de-la-caisse=Wachtwoord van de machineaccount van de kassa bij de getrouwheidsdienst, met de andere parameters naar de kassa's verspreid en nooit opnieuw getoond: een leeg gelaten veld behoudt de opgeslagen waarde. Leeg: de implementatie-eigenschap pos.fid.password is van toepassing (BO-10-03-08).
j.moyen-de-paiement-du-paiement-fidelite=Betaalmiddel van de getrouwheidsbetaling
j.cle-du-moyen-de-paiement-sous-lequel-fidelite=Sleutel van het betaalmiddel waaronder een betaling met het getrouwheidsspaarpotje wordt geregistreerd op het kasticket, in de rapporten en in de stromen. Een onbekende sleutel valt terug op FIDELITY (BO-10-03-06).
j.demander-les-soldes-des-cagnottes=De saldi van de spaarpotten opvragen
j.la-caisse-demande-le-solde-de-chacune-cagnotte=De kassa vraagt het getrouwheidsprogramma het saldo van ELK van zijn spaarpotten (FID Portugal), berekend met de gegevens van de lopende transactie: getrouwheidsvoordelen van het kasticket en reeds betaalde getrouwheidsbetaling. De saldi worden getoond op het getrouwheidsscherm van de kassa en opnieuw gelezen bij het afsluiten van het kasticket. Uitgeschakeld — de standaard — wordt alleen het saldo van de rekening opgevraagd (BO-10-02-33).
j.delai-de-reponse-du-service-fidelite=Antwoordtermijn van de getrouwheidsdienst (ms)
j.temps-accorde-au-service-fidelite-pour-repondre=Tijd die de getrouwheidsdienst krijgt om op een oproep te antwoorden (spaarpot, voordelen, zoeken, betaling), in milliseconden. Daarna toont de kassa dat de getrouwheid niet beschikbaar is en gaat de verkoop zonder haar verder. 0: 2500 ms (BO-10-03-10).
j.chaque-ligne-du-panier-porte-famille-et-sous-famille=Elke regel van het winkelmandje dat naar de promotiemotor wordt gestuurd draagt de code van de familie van het artikel en die van zijn subfamilie, zodat op dat niveau voordelen kunnen worden toegekend; het winkelmandje gaat ongewijzigd naar het getrouwheidsprogramma, dat dus de subfamilie van elk artikel ontvangt (artikelbeheer per subfamilie, Intermarché Frankrijk). Uitgeschakeld: de regel draagt alleen zijn artikelcode (BO-10-03-19, BO-10-08-22).
j.identifiant-du-compte-machine-mot-de-passe-parametre=Identificatie van de machineaccount van de kassa bij de getrouwheidsdienst. Leeg: de implementatie-eigenschap pos.fid.user is van toepassing. Het wachtwoord wordt ingesteld met de parameter « Wachtwoord van de getrouwheidsdienst » (BO-11-04-04, BO-10-03-08).
