j.r20-parametre-1=Token van extern systeem verplicht
j.r20-parametre-2=Een verkoop die door een extern systeem (e-commerce, mobiliteit) wordt afgegeven, moet het token van het systeem voorleggen dat in het scherm Externe systemen is aangemeld, in de header X-Integration-Token; het synchronisatietoken van de kassa's volstaat dan niet meer. Gedeactiveerd: het token van een aangemeld systeem identificeert het, en het synchronisatietoken blijft aanvaard (BO-07-01-01).
j.r20-parametre-3=Spaartegoed loyaliteit van de e-commercebestellingen
j.r20-parametre-4=Een geïntegreerde e-commercebestelling met een klantenkaart activeert haar spaartegoed: het event afgesloten ticket, kanaal Web, gaat via de verzendwachtrij van de winkelnode naar het loyaliteitsprogramma, zoals een kassaticket. Gedeactiveerd: de bestelling spaart niet (BO-07-01-03).
j.r20-parametre-5=Automatische start van het einde van de periode
j.r20-parametre-6=Op het uur van het einde van de periode start de winkelnode zelf de verwerking van het einde van de periode: technische ingangspunten, registratie van de wachtende tickets, controle van de kassa's, financiële overzichten, geconsolideerde afsluiting, geprogrammeerde edities, verkoopvolumes, bewaartermijnopruiming. Gedeactiveerd: niets start vanzelf, de verwerking wordt gestart vanuit het scherm Dagafsluiting (BO-09-03-03).
j.r20-parametre-7=Registratie van de wachtende tickets bij de dagafsluiting
j.r20-parametre-8=De dagafsluiting, automatisch of gestart vanuit de back-office, gebeurt met de wachtende tickets: elk wordt geregistreerd — kassa, nummer, kassier, artikelen, bedrag — en in het elektronisch journaal opgenomen. Gedeactiveerd: alleen de Z-afsluiting aan de kassa schrijft hun lot (BO-09-01-05, BO-09-02-01).
j.r20-parametre-9=Automatische reset van de wachtende tickets
j.r20-parametre-10=Bij het automatische einde van de periode worden de wachtende tickets gereset: elke kassa krijgt de opdracht ze te annuleren en traceert de opruiming, zoals bij de Z-afsluiting. Gedeactiveerd: de reset wordt gevraagd vanuit het scherm Dagafsluiting (BO-09-01-08).
j.r20-parametre-11=Technisch ticket bij de gedwongen sluiting
j.r20-parametre-12=Een kassa die door het einde van de periode of vanuit de back-office ambtshalve wordt gesloten, drukt een technisch ticket af — kassa, sessie, operator, oorzaak, wachtende tickets — en neemt het op in het elektronisch journaal. Gedeactiveerd: alleen het ingestelde sluitingsticket wordt afgedrukt (BO-09-01-06, BO-09-02-03).
j.r20-parametre-13=Automatische aangifte van de hosts van de zelfscaneilanden
j.r20-parametre-14=Bij het einde van de periode wordt de sessie van een host die gekoppeld is aan een eiland van zelfscankassa's in automatische aangifte afgesloten op het theoretische bedrag, zonder telling, en wordt de Z afgedrukt. De hosts worden aan het eiland gekoppeld in het scherm Kassa-eilanden; een eiland zonder aangewezen host neemt alle hosts van zijn kassa's (BO-09-03-01).
j.r20-parametre-15=Technische ingangspunten van het einde van de periode
j.r20-parametre-16=De hieronder aangewezen scripts worden voor en na de verwerking van het einde van de periode, automatisch of manueel, uitgevoerd; hun returncode en hun uitvoer worden bewaard en in het journaal opgenomen. Gedeactiveerd: geen enkel script wordt uitgevoerd (BO-09-02-04).
j.r20-parametre-17=Script voor het einde van de periode
j.r20-parametre-18=Naam van het script dat voor de verwerking van het einde van de periode wordt uitgevoerd, uit de map van de ingangspunten van de winkelnode (letters, cijfers, punt, koppelteken, liggend streepje). Leeg: niets ervoor (BO-09-02-04).
j.r20-parametre-19=Script na het einde van de periode
j.r20-parametre-20=Naam van het script dat na de verwerking van het einde van de periode wordt uitgevoerd, uit de map van de ingangspunten van de winkelnode. Leeg: niets erna (BO-09-02-04).
j.r20-parametre-21=Maximale duur van een script van het einde van de periode (s)
j.r20-parametre-22=Daarboven wordt het script gestopt en de uitvoering als mislukt genoteerd; de verwerking van het einde van de periode gaat verder. Onder 1: 60 seconden (BO-09-02-04).
j.r20-parametre-23=Controle kassa / server bij het einde van de periode
j.r20-parametre-24=Tijdens het einde van de periode vergelijkt elke kassa haar verkopen van de dag met die welke de server heeft ontvangen; bij een verschil stuurt ze haar verkopen opnieuw en synchroniseert ze haar referentiegegevens opnieuw, en het resultaat wordt in het journaal opgenomen. Gedeactiveerd: alleen de doorlopende controle van de referentiegegevens geldt (BO-09-03-05).
j.r20-parametre-25=Printer van de overzichten van het einde van de periode
j.r20-parametre-26=Netwerkprinter, in het formaat host:poort (standaard poort 9100), waarnaar elk overzicht dat bij het einde van de periode automatisch wordt uitgegeven, meteen na de uitgifte wordt gestuurd. Leeg: de overzichten worden alleen bewaard en kunnen worden gedownload vanuit het scherm Dagafsluiting (BO-09-01-10).
j.r20-aucune-valeur-a-representer-sur-la-periode=Geen waarde om weer te geven over de periode.

# ---- lot 21: S ----
j.s21-def-journal-secondary-monetic-servers-label=Secundaire betaalservers
j.s21-def-journal-secondary-monetic-servers-hint=Codes van de acceptatieserver (VWAY-tag die de terminal teruggeeft) die de secundaire server van de noodmodus aanduiden — 4, de server die de noodmodus forceert (LC-07-08-02) —, gescheiden door puntkomma's. Het elektronisch journaal vindt de tickets terug die per kaart op een van deze servers zijn betaald, voor de supportdienst. Leeg: geen enkele server geldt als secundair (BO-04-01-48).
j.s21-def-auth-endorsement-profiles-label=Profielen die een goedkeuring mogen geven
j.s21-def-auth-endorsement-profiles-hint=Namen van de profielen waarvan de houder een handeling aan de kassa mag goedkeuren, ongeacht zijn rol, gescheiden door puntkomma's. Een goedkeuringsregel per functie kan ook zijn eigen profielen noemen na de modus, bijvoorbeeld POST /action/pay-tender=REQUIRED:Chef de caisse. Leeg: alleen de bevoegde rollen keuren goed (BO-04-02-01).
j.s21-def-control-alert-rules-label=Kassa-alarmen
j.s21-def-control-alert-rules-hint=Eén alarm per regel: doel = type ; opties. Doelen: function:POST /abandon (een functie), payment:CHEQUE (een betaalwijze), article:3017620422003 of article:F1020 (een artikel of een familie), barcode:20* (een barcodeprefix), offline (kassa offline), expired (verstreken datum gelezen op een GS1-code). Types: YESNO (ja/nee-vraag aan de kassa), SUPERVISOR (validatie door een supervisor), BACKOFFICE (informatiemelding aan de backoffice), BLOCK (functie geblokkeerd). Opties gescheiden door puntkomma's: text=getoond bericht, notify (melding aan de kassier(ster)), max=n (aantal keren in de transactie). Leeg: geen alarm (BO-04-03-08, BO-04-03-09).
j.s21-def-justification-function-routes-label=Gerechtvaardigde kassafuncties
j.s21-def-justification-function-routes-hint=Eén functie per regel: methode pad=functiecode, bijvoorbeeld POST /abandon=CANCEL_TICKET. Wanneer een lijst met rechtvaardigingen deze functiecode bedient, vraagt de kassa de rechtvaardiging voordat de functie wordt uitgevoerd, registreert ze in het elektronisch journaal en voert de functie daarna opnieuw uit. Een functie zonder beheerde lijst wordt zonder vraag uitgevoerd (BO-04-03-10, BO-04-03-12).
j.s21-def-control-indicators-bar-label=Controle-indicatoren op alle schermen
j.s21-def-control-indicators-bar-hint=Toont bovenaan elk scherm van de backoffice, voor de profielen die toegang hebben tot de controle-indicatoren, de omzet van de dag, de omzet per afdeling of familie, het gemiddelde winkelmandje in aantal, het aantal klanten en de vergelijking met het vorige jaar. Uitgeschakeld: de indicatoren worden alleen nog op hun eigen scherm getoond (BO-04-03-01).
j.s21-def-control-revenue-level-label=Nomenclatuurniveau van het omzetdetail
j.s21-def-control-revenue-level-hint=Rang van het nomenclatuurniveau waarop de omzet van de dag wordt gedetailleerd (1: afdeling, 2: familie, enzovoort over de hele nomenclatuur). 0 of een onbekend niveau: de familie waartoe het artikel behoort (BO-04-03-01).
j.s21-def-control-revenue-top-label=Aantal rubrieken van het omzetdetail
j.s21-def-control-revenue-top-hint=Aantal afdelingen of families getoond in het omzetdetail, de sterkste eerst, van 1 tot 20 (BO-04-03-01).
j.s21-def-audit-watched-menus-label=Bewaakte menu's van de backoffice
j.s21-def-audit-watched-menus-hint=Schermen van de backoffice waarvan elke opening in het elektronisch journaal wordt geregistreerd, gescheiden door puntkomma's: een schermcode (journal, settings, account...) of het begin van een pad (/admin/journal). *: alle schermen. Leeg: alleen de aanmeldingen worden geregistreerd (BO-04-03-04).
j.s21-def-supervision-global-alerts-label=Kassa-alarmen op alle schermen
j.s21-def-supervision-global-alerts-hint=Een verzoek om goedkeuring of dienst van een kassa verschijnt onmiddellijk bovenaan elk scherm van de backoffice, voor de profielen die toegang hebben tot de supervisie, met de behandelingsopties (goedkeuren, aan de kassa te behandelen, weigeren, bevestigen). Uitgeschakeld: de verzoeken verschijnen alleen op het dashboard (BO-04-02-12).
j.s21-def-supervision-live-event-types-label=Handelingen van de realtime opvolging
j.s21-def-supervision-live-event-types-hint=Types handelingen die het scherm voor realtime bewaking van de kassa's toont, gescheiden door puntkomma's (TICKET_CLOSED, TICKET_CANCELLED, LINE_CANCELLED, PRICE_MODIFIED, DRAWER_OPENED, REFUND_CREATED, PAYMENT_CANCELLED, CONTROL_ALERT...). Leeg: alle handelingen (BO-04-03-07).
