j.nombre-de-chiffres-du-code-saisi-en=Aantal cijfers van de code die in de kassa wordt ingevoerd: aanmeldpad, codewijziging en gegenereerde code bij het aanmaken van een account. Van 4 tot 8; daaronder 4, daarboven 8 (BO-10-02-23).
j.nombre-de-decimales-du-total-hors-taxe-2=Aantal decimalen van het totaal excl. btw van elke artikelregel op de factuur en de leveringsbon: 2 of 3. Een andere waarde valt terug op 2 (BO-10-02-19).
