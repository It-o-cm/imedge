j.lignes-separees-par-des-points-virgules-jetons=Regels gescheiden door puntkomma's. Tokens montant, montant-lettres, date, heure, pdv, caisse, ticket, beneficiaire, lieu, banque, compte (LC-07-05-06).
j.liste-creee=Lijst aangemaakt.
j.liste-des-contenants-proposes-au-caissier-pour=Lijst van verpakkingen die de kassier voor een eenmalige tarra worden aangeboden, gescheiden door puntkomma's, in de vorm CODE:OMSCHRIJVING:GEWICHT_KG (bv. SACPAP:Kraftzak:0.010;BQS:Schaaltje S:0.035). De verpakkingstarra vervangt eenmalig de artikel- of standaardtarra en wordt niet bewaard. Leeg: geen verpakking aangeboden (LC-14-01-04/05).
j.liste-enregistree=Lijst opgeslagen.
