j.une-carte-reconnue-par-la-plage-des=Een kaart die door de reeks van klantenkaarten wordt herkend, wordt alleen aanvaard als het laatste cijfer de Luhn-sleutel van de voorgaande is, ongeacht de lengte (19 cijfers inbegrepen). Uitgeschakeld: alleen de reeks beslist, zoals voorheen (BO-03-06-54).
