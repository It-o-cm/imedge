j.un-recu-portant-le-numero-de-reprise=Bij elke wachtzetting wordt een ontvangstbewijs met het hervattingsnummer afgedrukt (LC-04-01-02).
j.un-ticket-de-caisse-comprenant-un-article=Een kassaticket met een artikel dat onder de Wettelijke Conformiteitsgarantie valt, wordt automatisch afgedrukt (LC-08-03-09).
j.un-ticket-de-prelevement-est-imprime-apres=Na validatie wordt een afromingsticket afgedrukt, met de coupures voor contanten en de transacties voor de andere middelen (LC-12-03-07).
j.un-ticket-de-reprise-date-numero-du=Bij elke hervatting van een in wacht gezet ticket wordt een hervattingsticket afgedrukt — datum, ticketnummer en nummer van het oorspronkelijke ticket. Uitgeschakeld: de hervatting drukt niets af (BO-03-03-07).
j.un-ticket-de-sortie-titre-code-barres=Een uitgangsticket — titel, streepjescode, totaal incl. BTW, aantal artikelen en de duurste artikelen — wordt IN PLAATS VAN het kassaticket afgedrukt. Uitgeschakeld: het kassaticket wordt normaal afgedrukt (BO-03-03-36).
j.un-ticket-mouvement-financier-est-imprime-apres=Na validatie wordt een ticket “Financiële beweging” afgedrukt, met het ontvangen middel, het teruggegeven middel en het bedrag. Uitgeschakeld: er wordt geen ticket afgedrukt (LC-12-06-03).
j.un-ticket-transfert-reglement-est-imprime-apres=Na validatie wordt een ticket “Overdracht betaling” afgedrukt, met de bron- en bestemmingsmiddelen en het overgedragen bedrag (LC-12-10-05).
j.un-ticket-paiement-carte-cadeau-code-de=Een ticket “betaling cadeaukaart” (code van de kaart, bedrag, oud en nieuw saldo, leverancier en zijn code) wordt naast het kassaticket afgedrukt. Uitgeschakeld: alleen het kassaticket wordt afgedrukt (LC-07-11-03).
j.un-ticket-emis-par-un-autre-point=Een ticket uitgegeven door een ander verkooppunt wordt aanvaard voor retour. Uitgeschakeld: retour kan alleen in het verkooppunt waar de aankopen zijn gedaan, wat de regel is tussen zelfstandige aangeslotenen (LC-05-02-07).
