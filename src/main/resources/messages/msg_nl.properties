j.u-def-fiscal-archive-auto=Automatische maandelijkse fiscale archieven
j.u-def-fiscal-archive-auto-aide=Het winkelknooppunt maakt zelf, aan het begin van elke maand, de fiscale archieven van de afgelopen maand TaxAuditExtracts_XXXXX_jjjjmmdd.zip (tickets, regels, betalingen, btw, retours, facturen, sessies, bewegingen) en TaxAuditReports_XXXXX_jjjjmmdd.zip (dagomzet, btw per tarief, betalingen per middel, sessies), ter beschikking van de controller op het scherm Fiscale archieven. Uitgeschakeld: de archieven worden alleen op aanvraag aangemaakt (BO-05-01-01).
j.u-def-fiscal-online-retention-years=Online bewaring van tickets en facturen (jaren)
j.u-def-fiscal-online-retention-years-aide=Duur gedurende welke de tickets, facturen, creditnota's en fiscale documenten raadpleegbaar, exporteerbaar en afdrukbaar blijven op het scherm Export van de transacties: geen bewaringsopschoning verwijdert een verkoop of factuur die recenter is, welke bewaartermijn elders ook is ingesteld (BO-05-01-06).
j.u-def-fiscal-einvoicing-enabled=Elektronische facturatie (e-invoicing)
j.u-def-fiscal-einvoicing-enabled-aide=Elke door de kassa's uitgegeven factuur aan een in Frankrijk btw-plichtige professionele klant (SIRET of btw FR) wordt omgezet naar het gestructureerde formaat UN/CEFACT CII (profiel EN 16931) en neergelegd op het aangewezen dematerialisatieplatform, met opvolging van haar levenscyclus (neergelegd, verworpen, ter beschikking gesteld, goedgekeurd, geweigerd, geïnd…); de kassa drukt de vermelding van elektronische factuur op de factuur. Uitgeschakeld: geen enkele factuur wordt doorgegeven (BO-05-01-02).
j.u-def-fiscal-einvoicing-mention=Vermelding van elektronische factuur
j.u-def-fiscal-einvoicing-mention-aide=Tekst die de kassa onderaan elke factuur afdrukt wanneer de elektronische facturatie actief is (categorie van de verrichting, doorgifte via erkend platform). Leeg: geen vermelding (BO-05-01-02).
j.u-def-fiscal-pdp-provider=Dematerialisatieplatform (code van de leverancier)
j.u-def-fiscal-pdp-provider-aide=Code van de dienstverlener van het type Fiscaal (scherm Dienstverleners) die als dematerialisatieplatform optreedt: zijn adres en sleutel dienen voor de neerlegging van de elektronische facturen en de doorgifte van de e-reportinggegevens (BO-05-01-02, BO-05-01-03).
j.u-def-fiscal-ereporting-enabled=E-reporting van de transacties
j.u-def-fiscal-ereporting-enabled-aide=Aan het einde van elke periode extraheert het winkelknooppunt de geconsolideerde B2C- en internationale B2B-transacties (verkopen en retours, per dag en per btw-tarief), zet ze in het doorgifteformaat en geeft ze door aan het dematerialisatieplatform, en volgt daarna de ontvangstbevestiging op; een mislukte verzending wordt opnieuw uitgevoerd. Uitgeschakeld: de periodes worden alleen op aanvraag doorgegeven (BO-05-01-03).
j.u-def-fiscal-ereporting-period=Periodiciteit van de e-reporting
j.u-def-fiscal-ereporting-period-aide=DECADE: één doorgifte per decade (van de 1e tot de 10e, van de 11e tot de 20e, van de 21e tot het einde van de maand); MONTH: één doorgifte per maand (BO-05-01-03).
j.u-def-fiscal-saft-realtime=SAF-T in real time
j.u-def-fiscal-saft-realtime-aide=Elk door een kassa doorgestuurd Portugees fiscaal document (FS, FT, NC, RC) wordt één keer, meteen, doorgegeven aan elke actieve dienstverlener met protocol SAFT: in het formaat RegisterInvoice aan de dienst van de belastingadministratie (type Fiscaal) voor facturen en creditnota's, in het formaat SAF-T (PT) aan de andere; een mislukte verzending wordt herhaald, en de gegevens blijven raadpleegbaar via de API /api/fiscal/saft/documents. Uitgeschakeld: geen doorlopende verzending (BO-05-01-05, BO-11-04-02).
j.u-def-fiscal-saft-deadline-day=Maandelijkse SAF-T: uiterste extractiedag
j.u-def-fiscal-saft-deadline-day-aide=Dag van de maand vóór welke het verkooppunt het SAF-T-bestand van de vorige maand extraheert en doorgeeft; het scherm Export SAF-T herinnert eraan en meldt de achterstand, van 1 tot 28 (BO-05-01-04).
j.u-def-fiscal-transmission-retry-seconds=Termijn tussen twee fiscale doorgiftepogingen (seconden)
j.u-def-fiscal-transmission-retry-seconds-aide=Termijn vóór het opnieuw uitvoeren van een mislukte neerlegging van een elektronische factuur, een doorgifte van e-reporting of een SAF-T-verzending, van 10 tot 86400 seconden (BO-05-01-02, BO-05-01-03, BO-05-01-05).
j.u-def-safe-pouch-requires-day-validation=Afgifte aan de kluis na validatie van de dag
j.u-def-safe-pouch-requires-day-validation-aide=Een zakje wordt pas aangegeven zodra de boekhoudkundige dag gevalideerd is op het scherm Historiek van de dagen: elke kassierbeweging gevalideerd, daarna de netto-omzet van de dag. Uitgeschakeld: een zakje kan op elk moment worden aangegeven (BO-05-02-10).
j.u-def-safe-pouches-per-day=Aantal zakjes per boekhoudkundige dag
j.u-def-safe-pouches-per-day-aide=Maximaal aantal aan de kluis afgegeven zakjes voor eenzelfde boekhoudkundige dag; 0: zonder limiet (BO-05-02-10).
j.u-def-safe-forcing-level-control=Controle van het forceringsniveau
j.u-def-safe-forcing-level-control-aide=Een kluisbeweging ingevoerd door een werknemer met een forceringsniveau wordt alleen gevalideerd door een werknemer met een strikt hoger niveau. Uitgeschakeld: elke bevoegde validator valideert (BO-05-02-15).
j.u-def-safe-advance-limit-control=Controle van het voorschotplafond
j.u-def-safe-advance-limit-control-aide=Een kluisuitgave aan een werknemer met een voorschotplafond wordt geweigerd wanneer zij het hem uitbetaalde totaal boven dat plafond zou brengen. Uitgeschakeld: het plafond is indicatief (BO-05-02-15).

