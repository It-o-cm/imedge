j.adresse-de-base-du-service-de-garantie=Basisadres van de chequegarantiedienst (de kassa roept <adres>/api/cheque-guarantee/authorize aan). Leeg: het op de kassa geconfigureerde adres, dat in ontwikkeling de gesimuleerde dienst van de kassa zelf is (BO-03-02-24).
