t.le-fichier-reprend-les-documents-tels-que-les-caisses=Het bestand neemt de documenten over zoals de kassa's ze genummerd, ondertekend en afgedrukt hebben.
j.identifiant-saf-t-de-la-fatura-simplificada=SAF-T-identificatie van de fatura simplificada (FS)
j.code-numerique-du-type-de-document-vente=Numerieke code van het Portugese verkoopticketdocument, gedragen door elke uitgegeven FS en opgenomen in de SAF-T-export. Het voorvoegsel FS blijft dat van het documentsjabloon (BO-10-06-01).
j.identifiant-saf-t-de-la-nota-de=SAF-T-identificatie van de nota de crédito (NC)
j.code-numerique-du-type-de-document-avoir=Numerieke code van het Portugese creditnotadocument, gedragen door elke uitgegeven NC en opgenomen in de SAF-T-export. Het voorvoegsel NC blijft dat van het documentsjabloon (BO-10-06-02).
j.attributs-article-portant-une-eco-taxe=Artikelattributen met een milieubijdrage
j.codes-des-attributs-dynamiques-article-dont-la=Codes van de dynamische artikelattributen waarvan de waarde een milieubijdrage per eenheid is, gescheiden door puntkomma's, zonder maximum. Elke code kan gevolgd worden door « =Label » (het afgedrukte label) en door « >NOPRINT » zodat deze milieubijdrage niet op het ticket wordt afgedrukt; ze blijft opgeteld op facturen, leveringsbonnen en hun extracties. Voorbeeld: « DEEE=Eco DEEE;DEA=Eco mobilier;PILES;PNEUS>NOPRINT;EMB ». Het attribuut ECO_TAX is altijd een afgedrukte milieubijdrage, tenzij het met >NOPRINT vermeld wordt. Leeg: enkel ECO_TAX (BO-10-06-05, BO-10-06-06).
j.texte-cheque-des-unites-monetaires=Chequetekst van de munteenheden
j.mot-imprime-sur-le-cheque-apres-le=Woord dat op de cheque wordt gedrukt na het in letters geschreven bedrag van de eenheden, bijvoorbeeld « Euro(s) ». Leeg: het woord van de kassataal, aangepast aan het getal (BO-10-07-05).
j.texte-cheque-des-centimes=Chequetekst van de centen
j.mot-imprime-sur-le-cheque-apres-les=Woord dat op de cheque wordt gedrukt na de in letters geschreven centen, bijvoorbeeld « Cent(s) ». Leeg: het woord van de kassataal, aangepast aan het getal (BO-10-07-05).
j.logos-monetique-sur-le-ticket-monetique=Betaallogo's op het betaalticket
j.le-ticket-monetique-sort-avec-ses-images=Het betaalticket wordt met zijn afbeeldingen afgedrukt: het beheerde betaallogo bovenaan elk ticket van de betaalterminal, en het contactloos-logo op dat van een contactloze betaling, een wettelijke verplichting. De afbeeldingen zijn die van het scherm Afbeeldingen (gebruik « Logo monétique » en « Logo sans contact »); zonder beheerde afbeelding wordt niets toegevoegd. Uitgeschakeld: de frames van de terminal worden alleen afgedrukt (BO-10-07-13).
j.sous-totaux-par-famille=Subtotalen per familie
j.quand-les-articles-sont-imprimes-par-nomenclature=Wanneer de artikelen per nomenclatuur worden afgedrukt (volgorde FAMILY), wordt onder de artikelen van elke familie een subtotaal afgedrukt. Uitgeschakeld: de families volgen elkaar op zonder subtotaal (BO-10-07-15).
j.montants-en-gras=Bedragen in vet
j.les-montants-des-lignes-articles-des-sous=De bedragen van de artikelregels, de subtotalen en het te betalen totaal van het kasticket worden in vet afgedrukt, via de vetinstructie van de printer, geplaatst na de uitlijning. Uitgeschakeld: gewoon lettertype (BO-10-07-15).
j.premiere-langue-de-la-visu-client=Eerste taal van het klantenscherm
j.langue-principale-de-la-visu-client-independante=Hoofdtaal van het klantenscherm, los van die van de kassier: fr, nl of pt. De tweede taal van het klantenscherm wordt ernaast getoond. Leeg of onbekend: de taal van de kassa (BO-10-07-17).
j.message-caisse-ouverte-deuxieme-langue=Bericht kassa open (tweede taal)
j.traduction-du-message-caisse-ouverte-dans-la=Vertaling van het bericht kassa open in de tweede taal van het klantenscherm, naast het hoofdbericht getoond wanneer het klantenscherm tweetalig is. Leeg: enkel het hoofdbericht (BO-10-07-17).
j.message-caisse-fermee-deuxieme-langue=Bericht kassa gesloten (tweede taal)
j.traduction-du-message-caisse-fermee-dans-la=Vertaling van het bericht kassa gesloten in de tweede taal van het klantenscherm, naast het hoofdbericht getoond wanneer het klantenscherm tweetalig is. Leeg: enkel het hoofdbericht (BO-10-07-17).
j.apparence-caisse-en-mode-deconnecte=Kassaweergave in offline modus
j.quand-la-caisse-ne-joint-plus-son=Wanneer de kassa haar winkelserver niet meer bereikt, tijdens of buiten een transactie, verandert het kassascherm van uiterlijk (achtergrond en balk « OFFLINE MODUS ») na de vertraging hieronder, en krijgt het zijn verbonden uiterlijk terug zodra de server antwoordt. Uitgeschakeld: ongewijzigd uiterlijk (BO-10-07-19).
j.delai-avant-l-apparence-deconnectee-secondes=Vertraging vóór de offline weergave (seconden)
j.duree-pendant-laquelle-la-caisse-doit-rester=Tijd gedurende welke de kassa zonder antwoord van de winkelserver moet blijven voordat ze de offline weergave aanneemt. 0: vanaf het eerste verlies van verbinding; een negatieve waarde geldt als 0 (BO-10-07-19).
j.decimales-des-quantites-en-unite-de-mesure=Decimalen van hoeveelheden in maateenheid
j.nombre-de-decimales-affichees-et-imprimees-apres=Aantal decimalen dat na de komma wordt getoond en afgedrukt voor een niet-gehele hoeveelheid verkocht per maateenheid (meter, liter…), van 0 tot 4. Buiten dit bereik: 2 (BO-10-08-28).
j.decimales-des-quantites-pesees=Decimalen van gewogen hoeveelheden
j.nombre-de-decimales-affichees-et-imprimees-apres-2=Aantal decimalen dat na de komma wordt getoond en afgedrukt voor een gewicht, van 0 tot 4. Buiten dit bereik: 3 (BO-10-08-28).
j.symbole-des-quantites-pesees=Symbool van gewogen hoeveelheden
j.symbole-affiche-sur-la-visu-caisse-et=Symbool dat op het kassascherm en het klantenscherm wordt getoond en op de tickets wordt afgedrukt naast een gewicht en een prijs per gewicht, bijvoorbeeld kg of KG. Leeg: kg (BO-10-08-29).
j.lignes-annulees-sur-le-ticket=Geannuleerde regels op het ticket
j.les-lignes-annulees-en-caisse-annulation-ligne=De aan de kassa geannuleerde regels (regelannulering of artikelannulering) worden op het ticket en op het parkeerbewijs afgedrukt, gemarkeerd als GEANNULEERD en buiten de totalen. Uitgeschakeld: ze komen er niet op voor (BO-10-08-30).
j.articles-identiques-detailles-sur-le-ticket=Identieke artikelen gedetailleerd op het ticket
j.chaque-article-identique-saisi-plusieurs-fois-est=Elk identiek artikel dat meerdere keren wordt ingevoerd, wordt op een eigen regel per eenheid afgedrukt. Uitgeschakeld, wat de standaardoptimalisatie is: identieke artikelen worden gegroepeerd op één regel met de hoeveelheid (BO-10-08-31).
j.mode-d-arrondi-des-calculs=Afrondingsmodus van de berekeningen
j.mode-d-arrondi-des-montants-calcules-ventilation=Afrondingsmodus van de berekende bedragen (btw-uitsplitsing): HALF_UP (naar het dichtstbijzijnde, standaard), HALF_EVEN, UP, DOWN, CEILING of FLOOR. Een onbekende waarde valt terug op HALF_UP (BO-10-02-18).
