j.libelle-de-la-raison=Omschrijving van de reden
j.libelle-de-la-touche-de-l-ecran=Omschrijving van de toets op het kassascherm die het op de kassa geïnstalleerde externe programma start, bijvoorbeeld het cashmanagement van de wisselgeldautomaat (LC-09-01-04).
j.libelle-de-la-touche-du-programme-externe=Omschrijving van de toets van het externe programma
j.libelle-de-periode-obligatoire=Omschrijving van de periode verplicht.
j.libelle-du-code-tva=Omschrijving van de BTW-code
j.libelle-du-mode=Omschrijving van de wijze
j.libelle-imprime-devant-le-solde-de-cagnotte=Omschrijving afgedrukt vóór het verwachte spaarpotsaldo na de verkoop (imfid antwoord B). Het bedrag is een prognose: er wordt niets gecrediteerd vóór de verwerking van het ticket (BO-03-03-31).
j.libelle-obligatoire=Omschrijving verplicht.
