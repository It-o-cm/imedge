j.code-de-la-raison=Code van de reden
j.code-de-validation-attribue-par-l-administration=Validatiecode toegekend door de belastingadministratie aan elke documentreeks van de kassa, in de vorm TYPE:CODE gescheiden door puntkomma's (bv. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). De afgedrukte ATCUD is de code, een streepje, en dan de rang van het document in zijn reeks. Beheerbaar per kassa, aangezien elke kassa haar eigen reeksen heeft. Type zonder code: ATCUD “0-rang” (LC-08-04-23).
j.code-du-gabarit-imprime-quand-aucune-carte=Code van het sjabloon dat wordt afgedrukt wanneer geen kaart werd aangeboden en het programma heeft geantwoord, d.w.z. voor de anonieme projectie. Leeg: de kassa drukt haar geïntegreerde zone af (BO-10-03-05).
j.code-du-gabarit-imprime-quand-aucune-carte-2=Code van het sjabloon dat wordt afgedrukt wanneer geen kaart werd aangeboden en het programma niet heeft geantwoord. Leeg: de kassa drukt haar geïntegreerde zone af, beperkt tot het bericht van de winkel (BO-10-03-05, BO-10-03-13).
j.code-du-gabarit-imprime-quand-une-carte=Code van het sjabloon dat wordt afgedrukt wanneer een kaart werd aangeboden en het programma niet heeft geantwoord. Leeg: de kassa drukt haar geïntegreerde zone af, kaart en offlinebericht (BO-10-03-05, BO-10-03-11).
j.code-du-gabarit-imprime-a-la-place=Code van het sjabloon dat in plaats van de geïntegreerde getrouwheidszone wordt afgedrukt wanneer een kaart werd aangeboden en het programma heeft geantwoord. Leeg: de kassa drukt haar geïntegreerde zone af (BO-10-03-05, BO-10-03-12).
j.code-du-gabarit-imprime-a-la-place-2=Code van het sjabloon dat in plaats van het online houderssjabloon wordt afgedrukt wanneer de groepering van de voordelen CATEGORY is. Leeg: het online houderssjabloon is van toepassing, al dan niet gegroepeerd (BO-10-03-21).
j.code-du-monnayeur-obligatoire=Code van de muntautomaat verplicht.
j.code-du-type-de-reglement-associe-a=Code van het betalingstype gekoppeld aan een GS1-coupon (AI 255). Leeg: geen GS1-coupon aanvaard als betaling (LC-11-03-06).
