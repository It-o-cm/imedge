j.champs-demandes-a-la-creation-d-un=Velden gevraagd bij het aanmaken van een klant aan de kassa, gescheiden door puntkomma's, een sterretje markeert de verplichte: companyName, contactName, street, postalCode, city, siret, vatNumber, phone, email. Leeg: alle velden, bedrijfsnaam verplicht (LC-08-04-10).
j.champs-du-client-en-compte=Velden van de rekeningklant
j.changement-de-langue-pendant-la-session=Taalwijziging tijdens de sessie
j.chaque-acompte-percu-sur-une-commande-ou=Elk voorschot ontvangen op een bestelling of offerte — aangemaakt aan de kassa of opgeroepen — drukt naast het bewijsstuk een genummerde voorschotfactuur af: identiteit van de winkel, artikelen en bedragen van de bestelling, bedrag van het voorschot en de btw per tarief, reeds betaald en nog verschuldigd. Uitgeschakeld: alleen het voorschotbewijs wordt afgedrukt (LC-08-04-15).
j.chaque-integration-de-referentiel-article-nomenc=Elke integratie van het referentiebestand — artikel, nomenclatuur, klant, promotie — laat een gedateerde regel achter in de update-audit, raadpleegbaar op het supervisiescherm van de synchronisaties. Uitgeschakeld — de standaard — alleen de huidige vingerafdruk wordt bewaard, zonder historiek (BO-10-08-23).
j.chaque-ligne-du-panier-transmis-au-moteur=Elke regel van het winkelmandje dat naar de promotie-engine wordt doorgestuurd, bevat de code van de familie van het artikel en die van de subfamilie, zodat voordelen op dat niveau kunnen worden geactiveerd. Uitgeschakeld: de regel bevat alleen zijn artikelcode (BO-10-03-19).
