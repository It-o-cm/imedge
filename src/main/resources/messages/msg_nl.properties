j.plage-article-inconnue=Onbekende artikelreeks.
j.plage-article-supprimee=Artikelreeks verwijderd.
j.plage-creee=Reeks aangemaakt.
j.plage-d-identifiants-modifiable-par-le-point=Reeks van identificaties aanpasbaar door het verkooppunt
j.plage-de-dates=Datumbereik
j.plage-de-numeros-que-la-caisse-attribue=Nummerreeks die de kassa toekent aan de klanten die ze aanmaakt, in de vorm PREFIX:EERSTE-LAATSTE (bv. CLI:500000-599999). Het prefix en de grenzen zijn die welke de centrale voor het verkooppunt reserveert, zodat een aan de kassa aangemaakte klant nooit botst met een geïntegreerde klant. Leeg: nummering per kassa CAISSE-CLInnnnnn, die van vóór deze parameter (BO-03-06-53).
j.plage-des-cartes-de-fidelite=Reeks van de klantenkaarten
j.plage-des-codes-clients-attribues-en-caisse=Reeks van aan de kassa toegekende klantcodes
j.plage-des-numeros-de-compte-client=Reeks van de klantrekeningnummers
j.plage-des-transactions-qbusting=Reeks van de qbusting-transacties
j.plage-enregistree=Reeks opgeslagen.
j.plage-inconnue=Onbekende reeks.
j.planification-annulee=Planning geannuleerd.
j.planification-introuvable-ou-deja-executee=Planning niet gevonden of al uitgevoerd.
j.plusieurs-cartes-de-fidelite-peuvent-etre-scanne=Er kunnen tijdens de transactie meerdere klantenkaarten worden gescand; alleen de laatste wordt behouden. Uitgeschakeld: een reeds gescande kaart blokkeert de volgende (BO-10-03-02).
j.pochette-remise-au-coffre=Envelop afgegeven aan de kluis.
