j.active-defaut-les-z-de-fin-de=Ingeschakeld (standaard): de Z's van de periodeafsluiting (dag, week, maand) worden automatisch uitgegeven bij de afsluiting. Uitgeschakeld: alleen de manuele uitgifte vanuit het scherm produceert Z's.
