j.moyens-de-paiement-proposes-pour-un-mouvement=Betaalmiddelen aangeboden voor een kasbeweging (afroming/aanvulling van een cheque, een maaltijdcheque...), gescheiden door puntkomma's. Leeg: de beweging betreft altijd contanten (BO-03-02-20).
j.moyens-de-paiement-proposes-en-destination-d=Betaalmiddelen aangeboden als BESTEMMING van een financiële beweging, zelfde syntaxis als de bron — voorbeeld CREDIT:Klantkrediet, dient onder meer om de schuld van een klant op rekening te vereffenen. Leeg: de financiële beweging wordt niet aangeboden (LC-12-06-01/02).
j.moyens-de-paiement-proposes-en-source-d=Betaalmiddelen aangeboden als BRON van een financiële beweging — een bedrag ontvangen in dit middel wordt buiten een verkoop in een ander teruggegeven, gescheiden door puntkomma's, in de vorm SLEUTEL:OMSCHRIJVING — voorbeeld CASH:Contanten;CARD:Bankkaart. Leeg: de financiële beweging wordt niet aangeboden (LC-12-06-01/02).
j.moyens-de-paiement-restreints-dont-l-assiette=Beperkte betaalmiddelen waarvan de in aanmerking komende basis tijdens de verkoop wordt getoond, gescheiden door puntkomma's, in de vorm CODE:ATTRIBUUT:OMSCHRIJVING — beschikbare attributen: MEAL_VOUCHER_ELIGIBLE, ECO_VOUCHER_ELIGIBLE, SOCIAL_CARD_ELIGIBLE. Leeg: maaltijdcheque, ecocheque en sociale aankoopkaart (LC-09-01-11 tot -18).
j.moyens-de-paiement-source=Betaalmiddelen bron
j.moyens-de-reglement-proposes-au-prelevement-manu=Betaalmiddelen aangeboden voor manuele afroming, gescheiden door puntkomma's, in de vorm SLEUTEL:OMSCHRIJVING — voorbeeld CASH:Contanten;CHEQUE:Cheques. Een automatisch afgeroomd middel staat er niet in en wordt niet aan de kassa aangeboden (LC-12-03-02/03).
j.moyens-de-reglement-proposes-en-source-et=Betaalmiddelen aangeboden als bron en bestemming van een betalingsoverdracht, zelfde syntaxis als de afroming. Leeg: de lijst van de afroming is van toepassing (LC-12-10-02).
j.moyens-de-reglement-prelevables-manuellement=Manueel af te romen betaalmiddelen
