j.k19-def-ticket-header-template-label=Model van de tickethoofding
j.k19-def-ticket-header-template-hint=Code van het sjabloon Tickethoofding dat bovenaan de tickets van deze kassa wordt afgedrukt, gekozen uit de beheerde sjablonen. Leeg of onbekende code: het eerste actieve hoofdingsjabloon, anders het hoofdingbericht (BO-03-09-02).
j.k19-def-ticket-footer-template-label=Model van de ticketvoet
j.k19-def-ticket-footer-template-hint=Code van het sjabloon Ticketvoet dat onderaan de tickets van deze kassa wordt afgedrukt, gekozen uit de beheerde sjablonen. Leeg of onbekende code: het eerste actieve voetsjabloon, anders het voetbericht (BO-03-09-02).
j.k19-def-ticket-vat-table-label=Btw-tabel op het ticket
j.k19-def-ticket-vat-table-hint=Model van de btw-tabel op het ticket: NONE (geen), COMBINED (gecombineerd met het ticket, onder het totaal), SEPARATE (apart, op een afzonderlijke strook na het ticket) of AMOUNT_ONLY (alleen het btw-bedrag). Leeg: de btw-uitsplitsing van het ticket beslist (BO-03-09-03).
j.k19-def-print-logo-code-label=Afgedrukt logo
j.k19-def-print-logo-code-hint=Code van het ticketlogo dat bovenaan de documenten van deze kassa wordt afgedrukt, gekozen uit de logo's die in de afbeeldingenbibliotheek zijn geïmporteerd. Leeg of onbekende code: het logo dat voor de winkel is bepaald (BO-03-09-04).
j.k19-def-menu-code-label=Kassamenu
j.k19-def-menu-code-hint=Code van het kassamenu dat de kassa toont, gekozen uit de beheerde menu's. Op het eiland geplaatst, geldt het voor zijn kassa's; op de kassa geplaatst, wint het van dat van het eiland; op land of formule geplaatst, wordt het het standaardmenu. Leeg: alle toetsen (BO-03-09-06, BO-03-10-09, BO-03-10-16, BO-03-10-18).
j.k19-def-queue-single-enabled-label=Enkele wachtrij actief
j.k19-def-queue-single-enabled-hint=De kassa toont de toets ENKELE WACHTRIJ, waarmee de kassierster aan het externe wachtrijsysteem meldt dat de kassa beschikbaar is voor de volgende klant of niet beschikbaar. Uitgeschakeld: geen toets en geen verzending (BO-03-09-10).
j.k19-def-queue-single-url-label=Adres van het wachtrijsysteem
j.k19-def-queue-single-url-hint=URL waarop de kassa haar beschikbaarheid publiceert: POST van een JSON-body met de terminal en de toestand AVAILABLE of UNAVAILABLE. Leeg: de toestand wordt niet gepubliceerd (BO-03-09-10).
j.k19-def-hardware-drawer-enabled-label=Kassalade actief
j.k19-def-hardware-drawer-enabled-hint=Het stuurprogramma van de kassalade is actief op deze kassa: openingsimpulsen en uitlezing van de sensor. Uitgeschakeld: er wordt geen impuls verzonden en de lade geldt als gesloten (BO-03-09-11).
j.k19-def-hardware-drawer-address-label=Adres van de kassalade
j.k19-def-hardware-drawer-address-hint=Adres van het ladestuurprogramma dat aan de hardwaremodule wordt doorgegeven: I/O-poort (bijvoorbeeld 0x48F), seriële poort (bijvoorbeeld /dev/ttyS0) of PRINTER voor een lade die op de printer is aangesloten. Leeg: het opstartadres van de module (BO-03-09-11).
j.k19-def-hardware-scanner-driver-label=Stuurprogramma van de scanner
j.k19-def-hardware-scanner-driver-hint=Leesstuurprogramma van de scanner: AUTO (automatische detectie), EVDEV (HID-toetsenbord), HIDRAW (HID POS) of OPOS (OPOS-stuurprogramma Datalogic, beheerd door de hardwaremodule). Een onbekende waarde valt terug op AUTO (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-name-patterns-label=Herkende scanners
j.k19-def-hardware-scanner-name-patterns-hint=Fragmenten van de naam van de apparaten die als scanner worden herkend, gescheiden door puntkomma's, bijvoorbeeld datalogic;honeywell. Leeg: de uitrollijst van de kassa (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-opos-device-label=OPOS-apparaat van de scanner
j.k19-def-hardware-scanner-opos-device-hint=Logische OPOS-naam van de Datalogic-scanner die aan de hardwaremodule wordt doorgegeven wanneer het stuurprogramma OPOS is, bijvoorbeeld DLS_Magellan. Leeg: het standaardapparaat van het stuurprogramma (BO-03-09-17).
j.k19-def-hardware-scanner2-enabled-label=Tweede scanner actief
j.k19-def-hardware-scanner2-enabled-hint=Een tweede scanner aan klantzijde leest tegelijk met de eerste de klantenkaarten en de coupons: zijn lezingen gaan naar de klantenbinding en de bonnen, nooit naar de artikelen. Uitgeschakeld: alle scanners voeden de verkoop (BO-03-09-18).
j.k19-def-hardware-scanner2-name-patterns-label=Tweede scanner: apparaten
j.k19-def-hardware-scanner2-name-patterns-hint=Fragmenten van de naam van de apparaten die de tweede scanner vormen, gescheiden door puntkomma's, bijvoorbeeld zebra;client. Leeg: er is geen apparaat aangewezen en de tweede scanner blijft stil (BO-03-09-18).
j.k19-def-hardware-printer-type-label=Type printer
j.k19-def-hardware-printer-type-hint=Model van de ticketprinter dat aan het stuurprogramma wordt doorgegeven: ESCPOS (generiek), EPSON_TM, WINCOR_TH, IBM_4610 of TOSHIBA_TCX. Een onbekende waarde valt terug op ESCPOS (BO-03-09-21).
j.k19-def-hardware-printer-speed-label=Snelheid van de printer (baud)
j.k19-def-hardware-printer-speed-hint=Communicatiesnelheid van de ticketprinter die aan het stuurprogramma wordt doorgegeven, in baud (9600, 19200, 38400, 115200). 0 of negatieve waarde: de snelheid van het stuurprogramma (BO-03-09-21).
j.k19-def-hardware-printer-code-page-label=Codepagina van de printer
j.k19-def-hardware-printer-code-page-hint=Tekencodepagina van de ticketprinter, bijvoorbeeld 858 (West-Europa met de euro), 850 of 1252. 0 of negatieve waarde: 858 (BO-03-09-21).
j.k19-def-hardware-printer-paper-width-label=Papierbreedte (mm)
j.k19-def-hardware-printer-paper-width-hint=Paginaformaat van de ticketprinter: 80 of 58 millimeter. Elke andere waarde: 80 (BO-03-09-21).
j.k19-def-hardware-printer-cheque-flip-label=Omkeren van de cheque
j.k19-def-hardware-printer-cheque-flip-hint=De printer draait de cheque om de voorkant te bedrukken na het lezen van de magnetische lijn. Uitgeschakeld: de cheque wordt niet omgedraaid (BO-03-09-21).
j.k19-def-printer2-enabled-label=Tweede printer actief
j.k19-def-printer2-enabled-hint=Een tweede printer wordt aan de kassierster voorgesteld om een document buiten de kassarol af te drukken. Uitgeschakeld: alleen de rol en de netwerkprinter van de uitrol worden gebruikt (BO-03-09-22).
j.k19-def-printer2-format-label=Formaat van de tweede printer
j.k19-def-printer2-format-hint=Formaat van de documenten op de tweede printer: A4 (A4-pagina) of TICKET (tekst van de rol). Een onbekende waarde valt terug op A4 (BO-03-09-22).
j.k19-def-printer2-connection-label=Aansluiting van de tweede printer
j.k19-def-printer2-connection-hint=NETWORK (netwerkprinter, het adres is een URL) of LOCAL (printer aangesloten op de kassa en beheerd door de hardwaremodule, het adres is de naam van de afdrukwachtrij). Een onbekende waarde valt terug op NETWORK (BO-03-09-22).
j.k19-def-printer2-address-label=Adres van de tweede printer
j.k19-def-printer2-address-hint=URL van de netwerkafdrukdienst, of naam van de lokale afdrukwachtrij. Leeg: de tweede printer is niet bruikbaar (BO-03-09-22).
j.k19-def-payment-terminal-type-label=Type betaalterminal
j.k19-def-payment-terminal-type-hint=Betaalterminal van deze kassa: VERIFONE (gecentraliseerde betaalterminal), INGENICO_SIBS (Ingenico, Portugal, SIBS) of WORLDLINE (België). Leeg: de betaalterminal van de uitrol. Toegepast bij het opstarten van de kassa (BO-03-09-19).
j.k19-def-payment-terminal-address-label=Adres van de betaalterminal
j.k19-def-payment-terminal-address-hint=Adres host:poort van de betaalclient van deze kassa, bijvoorbeeld 127.0.0.1:8200. Leeg: het adres van de uitrol (BO-03-09-19).
j.k19-def-terminal-island-label-label=Betaallabel van het eiland
