j.nom-du-prestataire-de-garantie-cheque=Naam van de chequegarantieleverancier die wordt geraadpleegd wanneer een chequebetaalmiddel de optie « Chequeautorisatie » heeft (bv. SIMULATEUR in demonstratie). De kassa vraagt de dienst om autorisatie: toegekend, dan wordt de cheque zonder supervisor aanvaard en het autorisatienummer bij de betaling bewaard; geweigerd, dan wordt de cheque geweigerd; dienst onbereikbaar, dan neemt de toestemming van de supervisor het over. Leeg: geen garantie, de toestemming van de supervisor geldt zoals voorheen (BO-03-02-24).
