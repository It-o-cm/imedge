j.un-article-scanne-a-nouveau-s-ajoute=Een opnieuw gescand artikel wordt bij de hoeveelheid van zijn regel opgeteld in plaats van een extra regel te openen, zolang de regel geen gewijzigde prijs heeft en er geen subtotaal na komt. Uitgeschakeld: elk artikel is een regel. Wegingen blijven elk een regel (BO-10-08-32).
j.une-mise-a-jour-des-articles-prix=Een update van artikelen, prijzen, families, btw, codebereiken, bontypes of feeds van de promotiemotor die tijdens een verkoop binnenkomt, wordt uitgesteld tot de kassa vrij is: de lopende mand behoudt de prijzen en promoties waarmee hij begonnen is. Uitgeschakeld: de update wordt meteen toegepast (BO-10-08-25).
