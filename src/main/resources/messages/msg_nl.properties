j.indicateurs-complementaires-affiches-sous-les-cu=Aanvullende indicatoren weergegeven onder de cumulatieven van de dag, gescheiden door puntkomma's en in de gewenste weergavevolgorde: endorsements, endorsements-denied, age-checks, supervisor-calls, parked-tickets, paid-cancelled, duplicates, price-checks, training, cash-movements, offline-registers. Elk ander gegeven van het systeem is ook adresseerbaar: event:TYPE (gebeurtenissen van de dag van een journaaltype, bijvoorbeeld event:PRICE_MODIFIED of event:CONTROL_ALERT), payment:SLEUTEL (betalingen van de dag van een betaalwijze), family:CODE (omzet van de dag van een tak van de nomenclatuur), movement:TYPE (kasbewegingen van de dag van een type). Een onbekende code wordt genegeerd. Leeg: geen aanvullende indicator, alleen de vijf vaste cumulatieven blijven (BO-04-03-01/-03/-15).
j.indicateurs-du-tableau-de-bord=Indicatoren van het dashboard
j.informations-du-point-de-vente-enregistrees=Gegevens van het verkooppunt opgeslagen.
j.intervalle-de-recuperation-ftp=FTP-ophaalinterval
j.intervalle-entre-deux-passes-de-livraison-un=Interval tussen twee leveringsrondes. Een niet-geleverde gebeurtenis behoudt haar plaats en haar plaats in de volgorde: er wordt nooit iets opgegeven (BO-11-02-05).
j.inventaire-enregistre-ecart-de=Inventaris geregistreerd, verschil van
j.inventaire-sans-ecart=Inventaris zonder verschil.
j.isolement-des-lignes-portant-l-attribut=Afzondering van de regels met het attribuut
j.jeton-invalide=Ongeldig token
j.jour-de-fin-de-mois=Dag van het maandeinde
j.jour-de-fin-de-semaine=Dag van het weekeinde
j.jour-de-la-semaine-qui-ferme-la=Dag van de week die de week afsluit, in het Engels en in hoofdletters (MONDAY tot SUNDAY). Onleesbaar of onbekend: SUNDAY (BO-09-01-07).
j.jour-et-mois-qui-ferment-l-annee=Dag en maand die het jaar afsluiten, in het formaat dd/mm. Onleesbaar: 31/12 (BO-09-01-07).
j.journal-d-acces-utilisateurs-retention-jours=Toegangsjournaal gebruikers: bewaartermijn (dagen)
j.jours-de-conservation-des-codes-barres-expires=Bewaardagen van verlopen, niet-gebruikte barcodes
j.jours-de-conservation-des-codes-barres-expires-2=Bewaardagen van verlopen, gebruikte barcodes
j.jours-de-conservation-des-codes-barres-sans=Bewaardagen van barcodes zonder geldigheidsdatum
j.jours-de-conservation-des-resultats-d-integratio=Bewaardagen van de integratieresultaten
j.jours-de-fermeture-hebdomadaire=Wekelijkse sluitingsdagen
j.jours-ou-le-magasin-ne-travaille-pas=Dagen waarop de winkel niet werkt, Engelse DayOfWeek-namen (MONDAY, SUNDAY…) gescheiden door “;”. Er wordt op die dagen geen dagelijkse Z uitgegeven en de wekelijkse grens valt aan het einde van de laatste werkdag (R6). Leeg: alle dagen zijn werkdagen.
j.jours-restants-en-dessous-desquels-l-article=Resterende dagen waaronder het artikel wordt geweigerd
j.justificatif-carte=Kaartbewijs
j.justificatif-d-acompte=Voorschotbewijs
j.justificatif-paiement-carte-cadeau=Betalingsbewijs cadeaukaart
j.justificatif-paiement-fidelite=Betalingsbewijs getrouwheid
j.l-ean-accompagne-le-libelle-article-sur=De EAN vergezelt de artikelomschrijving op het kassascherm, het klantendisplay en het afgedrukte kasticket (LC-02-04).
j.l-abandon-du-ticket-en-cours-exige=Het afbreken van het lopende kasticket vereist een goedkeuring van een supervisor. Uitgeschakeld: de kassier breekt zelf af (EXP-32).
j.l-activation-et-la-levee-du-mode=De activering en de opheffing van de geforceerde degradatiemodus voor elektronisch betalen vereisen een goedkeuring van een supervisor. Uitgeschakeld: de operator beslist zelf (LC-07-08-03/04).
j.l-adresse-email-recuperee-du-referentiel-client=Het e-mailadres uit het klantenreferentiebestand kan aan de kassa worden gecorrigeerd vóór de verzending. Uitgeschakeld: het wordt ongewijzigd verzonden en alleen voor een klant zonder gekend adres wordt er een ingevoerd (LC-08-02-10, BO-10-07-23).
j.l-annulation-d-une-ligne-deja-enregistree=De annulering van een reeds geregistreerde regel vereist een goedkeuring van een supervisor. Uitgeschakeld: de kassier annuleert zelf (EXP-32).
j.l-annulation-rapide-du-dernier-article-saisi=De snelle annulering van het laatst ingevoerde artikel vereist een goedkeuring van een supervisor. Uitgeschakeld: de kassier annuleert zelf het laatste artikel (EXP-32).
j.l-hote-sse-peut-corriger-les-coordonnees=De kassamedewerker kan de contactgegevens van de geïdentificeerde klant corrigeren; de correctie wordt in de database opgeslagen en op het afgedrukte document vermeld. Uitgeschakeld: de fiche is alleen-lezen aan de kassa (BO-10-04-03/04).
j.l-hote-sse-peut-creer-en-caisse=De kassamedewerker kan aan de kassa een VOLATIL klant aanmaken — een passant, zonder rekening of krediet, aangemaakt om een factuur te dragen. Uitgeschakeld: alleen reeds geïntegreerde klanten op rekening kunnen worden gebruikt (BO-10-04-01).
j.l-identifiant-doit-compter-au-moins=De gebruikersnaam moet minstens
j.l-identifiant-du-terminal-est-obligatoire=Het terminal-ID is verplicht.
j.l-image-imprimee-du-ticket-part-compressee=Het afdrukbeeld van het ticket wordt gecomprimeerd verzonden (gzip en daarna Base64) in plaats van als platte tekst. De codering reist mee in de payload: de lezer hoeft ze nooit te raden (BO-11-02-02).
j.l-interrogation-du-service-fidelite-imfid-cagnot=De raadpleging van de loyaliteitsdienst imfid (spaarpot, voordelen, betaling met loyaliteit) is actief. Uitgeschakeld: de kassa gedraagt zich alsof er geen loyaliteitsdienst is geconfigureerd, ook al is de URL ervan ingevuld (BO-10-03-07).
j.l-operateur-peut-changer-la-langue-a=De operator kan op elk moment van taal wisselen, ook tijdens een transactie. Uitgeschakeld: wisselen kan alleen vóór het openen van de kassa (LC-13-06-04).
j.l-ecran-client-affiche-en-permanence-jusqu=Het klantenscherm toont tot de betaling permanent het totaal van de artikelen die in aanmerking komen voor ecocheques, herberekend bij elke wijziging van het ticket. Uitgeschakeld: de vermelding verschijnt niet (LC-10-01-09).
j.l-ecran-client-affiche-en-permanence-jusqu-2=Het klantenscherm toont tot de betaling permanent het totaal van de artikelen die in aanmerking komen voor de sociale aankoopkaart, herberekend bij elke wijziging van het ticket. Uitgeschakeld: de vermelding verschijnt niet (LC-10-01-11).
j.lait-demi-ecreme-1l=HALFVOLLE MELK 1L
j.la-cagnotte-disponible-de-la-carte-rattachee=De beschikbare spaarpot van de gekoppelde kaart, opgevraagd bij de loyaliteitsdienst, wordt tot de betaling op het KLANTENDISPLAY getoond. Onafhankelijk van de naam van de kaarthouder: de winkel kan de spaarpot tonen zonder de identiteit. Uitgeschakeld — de standaard — het klantendisplay toont geen saldo (LC-03-04-13).
j.la-caisse-propose-au-caissier-quels-documents=De kassa laat de kassier kiezen welke documenten worden afgedrukt: alle, kassaticket, bankkaartticket, aankoopbon of geen. Uitgeschakeld: de kassa drukt af zoals nu, zonder keuzescherm (LC-08-03-01).
j.la-caisse-emet-les-documents-fiscaux-portugais=De kassa geeft de Portugese fiscale documenten uit: een fatura simplificada (FS) per verkoop, met het NIF van de klant, of een fatura (FT) wanneer de klant erom vraagt tijdens de verkoop of de betaling; een nota de crédito (NC) na een retour of om een achteraf in FT omgezette FS te annuleren; een recibo (RC) op een FT. Elk document draagt zijn serienummer, zijn ATCUD, de 4 tekens van zijn gekoppelde handtekening, de certificeringsvermelding en de fiscale QR-code. Een verkoop die deels met de sociale aankoopkaart wordt betaald, wordt op twee FS uitgegeven, met de door de kaart betaalde in aanmerking komende artikelen op de eerste. Uitgeschakeld: de kassa drukt haar tickets af zoals voorheen (LC-08-01-05, LC-08-01-06, LC-08-04-18 tot -23, LC-05-07-03).
j.la-carte-de-fidelite-est-transmise-au=De klantenkaart wordt doorgegeven aan de promotiemotor, die de persoonlijke aanbiedingen van de kaarthouder leest en kan activeren. Uitgeschakeld: het winkelmandje wordt anoniem gewaardeerd en er wordt geen gepersonaliseerde promotie geactiveerd (BO-10-03-22).
j.la-connexion-sso-n-est-pas-activee=SSO-aanmelding is niet ingeschakeld op dit knooppunt.
j.la-creation-d-un-client-en-compte=Het aanmaken van een klant op rekening wordt geweigerd, zowel aan de kassa als in de backoffice: een klant op rekening komt binnen via de integratie van het commercieel beheer. Uitgeschakeld: aanmaken wordt weer mogelijk (BO-10-04-05, BO-02-04-12).
j.la-date-de-fin-de-validite-de=De einddatum van de geldigheid van het tegoed wordt op de bon afgedrukt. Uitgeschakeld: de bon vermeldt alleen zijn nummer en bedrag (BO-03-03-08).
j.la-deconnexion-demande-le-code-de-l=Afmelden vraagt de code van de operator. Uitgeschakeld: de toets sluit de kassa zonder iets te vragen (LC-01-02-02/03, BO-10-02-24).
j.la-diffusion-au-fil-de-l-eau=Doorlopende verspreiding is niet ingeschakeld op dit niveau.
j.la-fin-de-diffusion-precede-son-debut=Het einde van de verspreiding ligt vóór het begin.
j.la-langue-que-la-base-des-clients=De taal die het bestand van loyale klanten registreert voor de houder van de aan de kassa geïdentificeerde kaart, wordt de taal van het klantendisplay, het kassaticket en het voor teruggave via API bewaarde ticket, voor de lopende transactie; een taal die de kassa niet aanbiedt, wordt genegeerd. Uitgeschakeld: de taal blijft die van de kassa of die welke de klant kiest (LC-13-06-09, LC-13-06-14).
j.la-largeur-doit-etre-comprise-entre=De breedte moet liggen tussen
j.la-ligne-du-total-a-payer-est=De regel met het te betalen totaal wordt in tekens van dubbele hoogte en dubbele breedte uitgegeven, via dezelfde instructie als vetdruk. Uitgeschakeld: ze wordt in het gewone lettertype afgedrukt (BO-10-07-14).
j.la-longueur-du-code-doit-etre-comprise=De lengte van de code moet liggen tussen
j.la-mention-carte-fidelite-et-son-numero=De vermelding klantenkaart en het nummer ervan worden in de zone kaartvoordeel van het ticket afgedrukt. Uitgeschakeld: het ticket vermeldt de kaart niet (BO-03-03-32).
j.la-remise-accordee-au-client-en-compte=De korting voor de klant op rekening wordt aan de kassamedewerker gemeld zodra de klant gescand of ingevoerd is. Uitgeschakeld: de korting wordt toegepast zonder melding (BO-10-04-08).
j.la-remise-ou-le-rabais-pose-sur=De korting of afslag op het tickettotaal geldt ook voor de regels die al een manuele korting of een automatische promotie hebben. Uitgeschakeld: die regels vallen buiten de basis EN de verdeling — de globale korting kost dan precies wat ze aankondigt op de overige regels (BO-03-07-12).
j.la-remise-le-rabais-ou-le-prix=De korting, de afslag of de geforceerde prijs van een regel wordt onder het betrokken artikel afgedrukt. Uitgeschakeld: alleen de ticketkorting wordt onder de totalen afgedrukt (BO-03-03-22).
j.la-section-cagnotte-du-jour-et-les=De sectie “SPAARPOT VAN DE DAG” en de loyaliteitsvoordelen worden op het ticket afgedrukt. Uitgeschakeld: er wordt geen loyaliteitssectie afgedrukt (BO-10-03-15).
j.la-tare-reellement-appliquee-a-une-pesee=De werkelijk toegepaste tarra bij een weging — verpakking, artikel of standaardtarra — wordt in kilogram onder de regel van het gewogen artikel afgedrukt. Uitgeschakeld: het ticket vermeldt alleen het nettogewicht, zoals voorheen (BO-10-05-04).
j.la-validation-manuelle-d-un-paiement-secours=De manuele validatie van een betaling 'noodprocedure elektronisch betalen' — invoer van het aanvaarde bedrag zonder de QR-code van het antwoord te lezen — vereist goedkeuring van een supervisor. Uitgeschakeld: de operator valideert alleen (LC-07-07-09).
j.la-zone=De zone
j.la-zone-soldes-carte-sort-en-fin=De zone kaartsaldi wordt aan het einde van de loyaliteitssectie afgedrukt: beschikbaar saldo, totaal van de voordelen van de dag, gebruikt bedrag en nieuw saldo na transactie. Uitgeschakeld: geen zone saldi (BO-03-03-31, BO-03-03-34).
j.label-point-de-vente=Label verkooppunt
j.langue-du-client-fidele=Taal van de loyale klant
j.langue-systeme-du-point-de-vente=Systeemtaal van het verkooppunt
j.langues-proposees-en-caisse=Talen aangeboden aan de kassa
j.langues-que-l-operateur-peut-choisir-separees=Talen die de operator kan kiezen, gescheiden door puntkomma's, bijvoorbeeld fr;nl;pt. De lijst van beschikbare talen ligt niet vast in de software: ze wordt afgeleid uit de meegeleverde berichtbestanden en uit die welke in de map pos.messages.dir zijn geplaatst. Een taal zonder berichtbestand wordt genegeerd; lege lijst: alleen Frans wordt aangeboden (LC-13-06-03/04).
j.largeur-de-tranche=Breedte van de schijf
j.largeur-de-tranche-horaire-min=Breedte van de tijdschijf (min)
j.largeur-du-logo-imprime-en-points=Breedte van het afgedrukte logo, in punten
j.largeur-a-laquelle-le-logo-est-imprime=Breedte waarop het logo wordt afgedrukt, in punten van de thermische kop: standaard 384 punten of 48 mm, tot 576 punten voor de volle breedte van een rol van 80 mm (Epson TMH6000 IV en V). Een waarde buiten het interval 8-576 valt terug op 384 (BO-03-03-14).
j.largeur-en-minutes-des-tranches-du-ca=Breedte, in minuten, van de schijven van de omzet per tijdschijf (R17): 15, 30 of 60. De schijven lopen zonder onderbreking van het eerste tot het laatste ticket van de periode. Standaard 60.
j.le-label-point-de-vente-administre-ci=Het hieronder beheerde label verkooppunt wordt toegevoegd aan elke aanvraag die naar de betaalclient wordt gestuurd. Uitgeschakeld: de aanvraag bevat het niet (BO-03-09-31).
j.le-qr-code-de-recuperation-du-ticket=De QR-code om het digitale ticket op te halen verschijnt op het klantenscherm aan het einde van de transactie. Uitgeschakeld: geen QR-code (BO-10-07-02).
j.le-badge-scanne-ouvre-la-caisse-seul=De gescande badge opent de kassa ALLEEN wanneer deze parameter uitgeschakeld is. Actief: de badge vult de gebruikersnaam in en de operator voert zijn code in (LC-01-01-03/09, BO-10-02-22).
j.le-bon-n-est-pas-un-document=De bon is geen fiscaal document: het is een bewijs van uitgifte van goederen. Met twee exemplaren kan de klant het zijne ACHTERLATEN bij het afhaalpunt, waar de verantwoordelijke het 's avonds ophaalt, en er een BEHOUDEN met wat nog af te halen is. 1: één enkele bon, die de klant behoudt (LC-02-08-05).
j.le-bordereau-de-commande-de-monnaie-est=Het borderel voor de bestelling van wisselgeld wordt afgedrukt: kassanummer, operator, tijdstempel en een tabel van de coupures met de kolommen bedrag en aantal rollen, ingevuld of leeg naargelang de invoer. Uitgeschakeld: er wordt geen ingevuld borderel afgedrukt (LC-12-05-08).
j.le-champ=Het veld
j.le-client-choisit-lui-meme-sur-la=De klant kiest zelf, op het aanraakgevoelige klantendisplay, de taal van het klantendisplay en van zijn kassaticket uit de talen die aan de kassa worden aangeboden; de keuze geldt voor de lopende transactie en het klantendisplay gaat dan over op één enkele taal. Uitgeschakeld: geen taaltoets op het klantendisplay (LC-13-06-08/13).
j.le-client-peut-regler-en-carte-un=De klant kan met de kaart een hoger bedrag betalen dan het resterende saldo en het verschil in contanten ontvangen: het kaartbedrag dat boven het resterende saldo wordt ingevoerd, of de toets CASHBACK die het gewenste contante bedrag vraagt en het te debiteren bedrag berekent. Uitgeschakeld: het kaartbedrag is beperkt tot het resterende saldo (LC-07-04-07/08).
j.le-code=De code
j.le-code-de-l-ilot-est-obligatoire=De code van het kassa-eiland is verplicht.
j.le-code-de-la-commande-est-obligatoire=De code van de bestelling is verplicht.
j.le-code-de-la-devise-est-obligatoire=De valutacode is verplicht.
j.le-libelle-de-la-devise-est-obligatoire=De omschrijving van de valuta is verplicht.
j.le-code-de-la-nomenclature-est-obligatoire=De code van de nomenclatuur is verplicht.
j.le-code-de-la-plage-article-est=De code van de artikelreeks is verplicht.
j.le-code-de-la-plage-est-obligatoire=De code van de reeks is verplicht.
j.le-code-doit-comporter-au-moins=De code moet minstens
j.le-code-du-fournisseur-est-obligatoire=De code van de leverancier is verplicht.
j.le-code-du-gabarit-est-obligatoire=De code van het sjabloon is verplicht.
j.le-code-du-groupe-est-obligatoire=De code van de groep is verplicht.
j.le-code-du-nouveau-groupe-est-obligatoire=De code van de nieuwe groep is verplicht.
j.le-code-du-regime-est-obligatoire-et=De code van het regime is verplicht en beperkt tot
j.le-code-enseigne-est-obligatoire=De ketencode is verplicht.
j.le-code-et-le-libelle-de-l=De code en de omschrijving van het attribuut zijn verplicht.
j.le-code-et-le-libelle-de-l-2=De code en de omschrijving van het item zijn verplicht.
j.le-code-et-le-libelle-de-l-3=De code en de omschrijving van de afbeelding zijn verplicht.
j.le-code-et-le-libelle-de-la=De code en de omschrijving van de lijst zijn verplicht.
j.le-code-et-le-libelle-sont-obligatoires=De code en de omschrijving zijn verplicht.
j.le-code-interne-rattache-a-l-ean13=De aan de EAN13 gekoppelde interne code wordt afgedrukt onder de regel van het artikel dat er een heeft — wat gedematerialiseerde producten vereisen. Uitgeschakeld: alleen de artikelregel wordt afgedrukt (BO-10-02-20).
j.le-code-pays-est-obligatoire=De landcode is verplicht.
j.le-code-2=De code “
j.le-compteur-de-transactions-de-la-caisse=De transactieteller van de kassa begint aan het einde van elke periode opnieuw bij 1. Uitgeschakeld — de standaard — hij loopt ononderbroken door. Alleen het ticketnummer begint opnieuw: de fiscale nummering telt nooit terug en wordt niet aangeraakt (BO-09-03-04).
j.le-credit-client-peut-ne-regler-qu=Het klantkrediet kan slechts een deel van het ticket betalen, waarbij de rest anders wordt betaald. Uitgeschakeld: het klantkrediet betaalt het volledige resterende saldo, of niets (BO-10-04-10).
j.le-detail-de-la-tva-par-taux=Het detail van de BTW per tarief (excl. BTW / BTW) wordt afgedrukt op het kassaticket en het retourticket. Uitgeschakeld: er wordt geen BTW-uitsplitsing afgedrukt (BO-10-06-04).
j.le-forcage-du-prix-d-une-ligne=Het forceren van de prijs van een regel vereist goedkeuring van een supervisor. Uitgeschakeld: de kassier forceert alleen (EXP-32).
j.le-fournisseur-et-le-code-message-sont=De leverancier en de berichtcode zijn verplicht.
j.le-lieu-ou-le-client-va-retirer=De plaats waar de klant de artikelen gemarkeerd als AF TE HALEN gaat ophalen, afgedrukt op de afhaalbon: de klant verlaat de kassa en rijdt er met zijn voertuig naartoe, dus de bon moet die plaats vermelden. Eén afhaalpunt per winkel (de BATI in doe-het-zelf, de DRIVE in voeding). Leeg: de bon vermeldt er geen (LC-02-08-05).
j.le-montant-est-declare-encode-mais-aucun=Het bedrag is als gecodeerd aangegeven, maar er is geen veld PRICE ingesteld.
j.le-montant-reglable-en-especes-est-arrondi=Het in contanten te betalen bedrag wordt afgerond op het dichtstbijzijnde veelvoud van deze stap, en het verschil wordt geboekt op het betaalmiddel ARRONDI. 0 of 1: geen afronding (Frankrijk). 5: Belgische wettelijke verplichting sinds 01/12/2019 (LC-07-03-01).
j.le-montant-total-doit-etre-un-nombre=Het totaalbedrag moet een positief getal zijn.
j.le-motif-choisi-est-imprime-sur-le=De gekozen reden wordt op het retourticket afgedrukt. Uitgeschakeld: de reden wordt gelogd maar verschijnt niet op het ticket (LC-05-05-03).
j.le-niveau-du-profil-ne-peut-depasser=Het niveau van het profiel mag het uwe niet overschrijden.
j.le-nom-de-la-selection-est-obligatoire=De naam van de selectie is verplicht.
j.le-nom-du-profil-est-obligatoire=De naam van het profiel is verplicht.
j.le-nom-et-le-prenom-du-porteur=De naam en voornaam van de kaarthouder, wanneer een zoekopdracht ze heeft gevonden, worden bij het koppelen van de kaart op het KLANTENDISPLAY getoond. Uitgeschakeld — de standaard — het klantendisplay toont geen identiteit: het is naar de winkelvloer gericht, en de volgende klant leest het scherm van de klant vóór hem (BO-10-03-03).
j.le-nom-et-le-prenom-trouves-par=De naam en voornaam die een kaartzoekopdracht heeft gevonden, worden aan de kassa naast het nummer getoond. Uitgeschakeld: de kassa toont alleen het kaartnummer, zoals bij een gescande kaart (BO-10-03-04).
j.le-nombre-de-caracteres-doit-etre-un=Het aantal tekens moet een geheel getal van minstens 1 zijn.
j.le-nombre-de-decimales-de-la-valeur=Het aantal decimalen van de waarde valt buiten de gelezen zone.
j.le-nouveau-code-est-obligatoire=De nieuwe code is verplicht.
j.le-nouveau-mot-de-passe-doit-compter=Het nieuwe wachtwoord moet minstens
j.le-nouveau-mot-de-passe-doit-etre=Het nieuwe wachtwoord moet verschillen van het huidige.
j.le-numero=Het nummer
j.le-numero-de-pdv-doit-comporter-exactement=Het PDV-nummer moet precies 5 cijfers bevatten.
j.le-numero-de-tva-doit-etre-un=Het BTW-nummer moet een positief geheel getal zijn.
j.le-plafond-d-acompte-ne-peut-pas=Het plafond voor voorschotten mag niet negatief zijn.
j.le-plafond-doit-etre-un-pourcentage-entre=Het plafond moet een percentage tussen 0 en 100 zijn, of leeg voor een regime zonder plafond.
j.le-prix-initial-de-l-article-est=De oorspronkelijke prijs van het artikel wordt op het scherm herhaald bij een geforceerde prijs. Uitgeschakeld: de oorspronkelijke prijs is verborgen (BO-10-07-12).
j.le-profil=Het profiel “
j.le-prefixe-de-la-plage-est-obligatoire=Het prefix van de reeks is verplicht.
j.le-prefixe-est-plus-long-que-le=Het prefix is langer dan de code zelf.
j.le-prefixe=Het prefix “
j.le-remboursement-d-un-retour-exige-un=De terugbetaling van een retour vereist goedkeuring van een supervisor. Uitgeschakeld: de kassier betaalt alleen terug (EXP-32).
j.le-rendu-monnaie-est-autorise-sur-cet=Teruggave van wisselgeld is toegestaan op dit kassa-eiland. Uitgeschakeld: het eiland verbiedt teruggave, zelfs waar de regel van het betaalmiddel het zou toestaan — het verbod van het eiland heeft voorrang (BO-03-10-04).
j.le-reglement-en-credit-client-reste-possible=Betalen met klantkrediet blijft mogelijk wanneer het klantenbestand niet meer bijgewerkt is (onderbreking tussen de backoffice en de kassa). Uitgeschakeld: klantkrediet wordt geweigerd zolang het bestand niet is vernieuwd, omdat het openstaande saldo en het plafond niet meer betrouwbaar zijn (LC-07-09-05).
j.le-role=De rol
j.le-scan-d-un-badge-deverrouille-la=Het scannen van een badge ontgrendelt de kassa of dient als managergoedkeuring. Uitgeschakeld: de gescande badge wordt genegeerd en de operator voert zijn gebruikersnaam manueel in (BO-10-02-29/30).
j.le-taux-euros-pour-une-unite-doit=De koers (euro voor één eenheid) moet een strikt positief getal zijn.
j.le-taux-doit-etre-un-pourcentage-entre=Het tarief moet een percentage tussen 0 en 100 zijn.
j.le-ticket-carte-bancaire-d-un-remboursement=Het bankkaartticket van een terugbetaling (artikelretour, retourticket) wordt automatisch afgedrukt (LC-08-03-10).
j.le-ticket-carte-bancaire-d-une-transaction=Het bankkaartticket van een niet-voltooide transactie, met de vermelding “debet afgebroken”, wordt automatisch afgedrukt (LC-08-03-12).
j.le-ticket-carte-bancaire-demandant-la-signature=Het bankkaartticket dat de handtekening van de klant vraagt, wordt automatisch afgedrukt (LC-08-03-11).
j.le-ticket-d-abandon-liste-les-articles=Het annuleringsticket vermeldt de artikelen van het geannuleerde ticket. Uitgeschakeld: alleen de hoofding, de reden en het geannuleerde totaal worden afgedrukt (LC-04-04-12).
j.le-ticket-d-article-inconnu-porte-le=Het ticket van een onbekend artikel draagt de gelezen code als STREEPJESCODE onder de transcriptie ervan, zodat de afdeling ze opnieuw kan scannen in plaats van ze opnieuw in te voeren. Uitgeschakeld: de code wordt alleen leesbaar geschreven (BO-10-07-11).
j.le-tiroir-s-ouvre-au-deverrouillage-de=De lade gaat open bij het ontgrendelen van de kassa om het kasfonds te plaatsen. Uitgeschakeld: de lade blijft dicht bij het aanmelden (BO-10-02-25).
j.le-tiroir-s-ouvre-au-lancement-de=De lade gaat open bij het starten van de afsluiting (telling van de Z). Uitgeschakeld: de lade blijft dicht, de telling gebeurt met gesloten lade (BO-10-02-26).
j.le-tiroir-s-ouvre-sur-les-reglements=De lade gaat open bij fysieke betalingen (contanten, cheque, maaltijdcheques). Uitgeschakeld: de lade blijft dicht bij de betaling (BO-10-02-12).
j.les-appels-superviseur-des-caisses-s-affichent=De supervisoroproepen van de kassa's verschijnen op het dashboard van de backoffice. Uitgeschakeld: er wordt geen melding op het scherm getoond (BO-10-08-01).
j.les-caisses-restees-ouvertes-sont-fermees-d=Kassa's die open zijn gebleven, worden automatisch gesloten bij het naderen van het einde van de periode; elke kassa leest de opdracht bij haar volgende lusdoorgang. Uitgeschakeld: een vergeten kassa blijft open tot de volgende dag (LC-01-02-08, BO-09-01-06/09).
j.les-champs=De velden
j.les-deux-saisies-du-nouveau-mot-de=De twee invoeren van het nieuwe wachtwoord verschillen.
j.les-extractions-de-factures-clients-en-compte=De extracties van facturen van klanten op rekening vermelden de vervaldatum van de klant (BO-10-04-19).
j.les-extractions-de-factures-portent-le-montant=De extracties van facturen vermelden het bedrag aan ecotaks dat hoort bij de met klantkrediet betaalde transactie (BO-10-04-14), en het bestand clitva.dat van de facturen van rekeningklanten een ecotaksregel na de btw-regels van elke factuur (BO-11-01-12).
j.les-lignes-d-un-ticket-unique-balance=De regels van een uniek weegschaalticket worden geregistreerd tegen de prijs die de toonbank heeft berekend. Uitgeschakeld: elke regel wordt opnieuw gewaardeerd tegen de prijs uit het referentiebestand, waarbij het gewogen gewicht doorslaggevend is en de toonbank alleen nog weegt (LC-06-01-04).
j.les-listes-standard-existent-deja-rien-n=De standaardlijsten bestaan al: er is niets aangemaakt.
j.les-messages-d-information-lies-a-la=De informatieberichten bij de verkoop van een artikel — het bericht ingesteld op het artikel, de waarschuwing voor een hoge prijs — worden niet meer getoond op de kassa's van dit eiland. WEIGERINGEN worden nooit verzwegen: een verboden handeling blijft verboden en meldt dat (BO-03-10-13).
j.les-messages-d-information-lies-a-un=De informatieberichten bij een betaalmiddel — de niet-blokkerende waarschuwingen van de controlepunten bij betaling — worden niet meer getoond op de kassa's van dit eiland. Weigeringen en goedkeuringsaanvragen worden nooit verzwegen (BO-03-10-14).
j.les-montants-des-documents-de-caisse-portent=De bedragen op de kassadocumenten dragen het valutasymbool. Uitgeschakeld: ze worden zonder symbool afgedrukt, wat winkels vragen waarvan het papier al voorbedrukt is (BO-10-07-04).
j.les-zones-article-et-valeur-se-chevauchent=De zones artikel en waarde overlappen elkaar.
j.libelle-du-nif-par-defaut=Omschrijving van het standaard-NIF
j.libelle-imprime-a-la-place-du-numero=Omschrijving die in plaats van het nummer wordt afgedrukt wanneer het opgegeven NIF het standaard-NIF is (BO-10-04-16).
j.libelle-d-attente-d-articles=Omschrijving bij wachten op artikelen
