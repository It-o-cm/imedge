j.regle-appliquee-quand-un-montant-calcule-en=Regel die wordt toegepast wanneer een in de kassa berekend bedrag op twee decimalen wordt gebracht — regeltotaal, btw-uitsplitsing, bedrag excl. btw van facturen: HALF_UP (naar het dichtstbijzijnde, de helft naar boven, standaard), HALF_EVEN (naar het dichtstbijzijnde, de helft naar even), HALF_DOWN (naar het dichtstbijzijnde, de helft naar beneden), UP (altijd naar boven), DOWN (altijd naar beneden). Een onbekende waarde valt terug op HALF_UP (BO-10-02-18).
