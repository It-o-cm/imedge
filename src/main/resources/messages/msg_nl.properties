j.message-imprime-sur-le-ticket-d-un=Bericht afgedrukt op het ticket van een klant ZONDER kaart wanneer de loyaliteitsdienst tijdens de verkoop niet heeft geantwoord. Leeg: het ticket vermeldt niets (BO-03-03-30).
j.message-inconnu=Onbekend bericht.
