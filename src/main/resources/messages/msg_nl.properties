j.combien-d-articles-du-plus-cher-au=Hoeveel artikelen, van het duurste tot het goedkoopste, op het uitgangsticket worden vermeld. Buiten het bereik 1 tot 20 valt de waarde terug op 3 (BO-03-03-36).
j.combien-de-minutes-avant-la-fin-de=Hoeveel minuten vóór de periodeafsluiting de back-office begint met het aankondigen van de aftelling en de bijbehorende waarschuwingen — open kassa's, niet-verbonden kassa's, kastickets in wacht. 0 of minder: zestig minuten (BO-09-01-04, BO-09-02-02).
