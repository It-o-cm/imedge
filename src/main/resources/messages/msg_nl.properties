j.cette-affectation-depasse-votre-niveau-hierarchi=Deze toewijzing overschrijdt uw hiërarchisch niveau.
j.cette-caisse-n-accepte-que-des-retours=Deze kassa aanvaardt alleen retours: de retourmodus is er permanent en er is geen verkoop mogelijk. Uitgeschakeld: de kassa verkoopt en neemt terug (LC-05-01-03).
j.cette-demande-n-attend-plus-de-livraison=Deze aanvraag wacht niet meer op levering.
