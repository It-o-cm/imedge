j.active-les-gestes-remise-et-rabais-en=Active les gestes remise et rabais en caisse. Désactivé : le caissier ne peut appliquer ni remise ni rabais, ni à la ligne ni au ticket (BO-03-07-01).
j.active-defaut-les-z-de-fin-de=Activé (défaut) : les Z de fin de période (jour, semaine, mois) sont émis automatiquement à la clôture. Désactivé : seule l'émission manuelle depuis l'écran produit des Z.
