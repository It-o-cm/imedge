t.cle-dallas=Clé Dallas
t.16-chiffres-hexadecimaux-vide-aucune=16 chiffres hexadécimaux, vide = aucune
j.cette-cle-dallas-est-deja-attribuee-a=Cette clé Dallas est déjà attribuée à
j.cle-dallas-invalide-seize-chiffres-hexadecimaux=Clé Dallas invalide : seize chiffres hexadécimaux.
j.connexion-par-cle-dallas=Connexion par clé Dallas
j.la-cle-dallas-ibutton-attribuee-a-l=La clé Dallas (iButton) attribuée à l'opérateur à l'écran Comptes ouvre la caisse à elle seule, sans code PIN — la connexion sans mot de passe des caisses libre-service (BO-01-02-07). Désactivé : une clé lue est ignorée.
j.langue-par-defaut-du-backoffice-de-la=Langue par défaut du BackOffice, de la visu caisse, de la visu client et du ticket : fr, nl ou pt. C'est celle qui s'applique quand l'opérateur n'en a pas choisi d'autre et qu'aucune langue ne lui est administrée. Vide ou inconnue : français (LC-13-06-01/05/10, BO-01-01-04, BO-10-07-18).
p.cette-cle-dallas-est-deja-attribuee-a=Cette clé Dallas est déjà attribuée à {0}.
j.beneficiaire-imprimable-par-le-jeton-beneficiair=Bénéficiaire imprimable par le jeton {beneficiaire} (LC-07-05-07).
j.ce-qui-est-imprime-au-dos-du=Ce qui est imprimé au dos du chèque pendant que le lecteur le tient, une ligne par point-virgule. Jetons disponibles : {date}, {heure}, {montant}, {montant-lettres}, {caisse}, {pdv}, {ticket} (LC-07-05-03). Vide : la date et l'heure puis le montant, comme avant ce paramètre (BO-03-02-43).
j.compte-optionnel-imprimable-par-compte-lc-07=Compte optionnel imprimable par {compte} (LC-07-05-07).
j.correspondance-entre-l-identifiant-renvoye-par-l=Correspondance entre l'identifiant renvoyé par le terminal mobile et le libellé enregistré sur le ticket, sous la forme ID=LIBELLE séparés par des virgules. Un identifiant absent de la table est enregistré en 'SECOURS MONETIQUE' (LC-07-07-08).
j.delai-d-inactivite-avant-verrouillage-automatiqu=Délai d'inactivité avant verrouillage automatique de la caisse. 0 = désactivé (LC-01-03-02).
p.expression-reguliere-reconnaissant-au-scan-le-co=Expression régulière reconnaissant, au scan, le code-barre du panier qu'un client a constitué sur un appareil de selfscanning du magasin (ex. SS[0-9]{8}). Le code reconnu rappelle le panier déposé sur le nœud magasin, depuis n'importe quelle caisse, et ouvre l'écran SELFSCANNING : contrôle, puis intégration dans la vente. Vide : les paniers se rappellent par leur code à l'écran RAPPEL (LC-06-05-03).
j.expression-reguliere-reconnaissant-au-scan-le-co-2=Expression régulière reconnaissant, au scan, le code-barre imprimé sur un devis, une commande ou un bon de vente émis par l'outil de gestion commerciale (ex. (DV|CM|BV)[0-9]{6,}). Le code reconnu rappelle le document déposé sur le nœud magasin, comme une saisie à l'écran RAPPEL. Vide : seuls les codes de commande créés en caisse sont reconnus au scan, les autres se saisissent à l'écran RAPPEL (LC-06-02-01, LC-06-02-09).
j.la-lettre-du-regime-de-tva-de=La lettre du régime de TVA de l'article sort sur sa ligne et dans le tableau de TVA (0=A, 1=B, 26=AA). Désactivé : la ligne ne porte que son prix, et le détail de TVA reste dans le tableau des totaux. Activé en France, désactivé en Belgique (BO-03-03-37).
j.le-label-point-de-vente-tel-que=Le Label Point De Vente tel que l'acquéreur l'a écrit, sous la forme {TAG}valeur : la caisse l'émet verbatim, elle ne compose ni le tag ni la valeur. Vide : rien n'est ajouté, même si l'ajout est activé (BO-03-09-31).
j.lieu-imprimable-par-le-jeton-lieu-lc=Lieu imprimable par le jeton {lieu} (LC-07-05-06).
j.message-affiche-au-caissier-quand-un-article=Message affiché au caissier quand un article GS1 est en date courte ; {date} est remplacé par la date lue. Vide : « DATE COURTE (date) » (BO-03-06-64).
j.message-affiche-au-caissier-quand-un-article-2=Message affiché au caissier quand un article GS1 est refusé pour sa date de péremption ; {date} est remplacé par la date lue. Vide : « ARTICLE PÉRIMÉ (date) » (BO-03-06-64).
j.message-imprime-sur-le-ticket-d-un-2=Message imprimé sur le ticket d'un porteur quand le service fidélité n'a pas répondu pendant la vente. Le jeton {carte} y est remplacé par le numéro de carte. Vide : le ticket ne dit rien (BO-03-03-29).
j.message-montre-a-l-hote-sse-quand-2=Message montré à l'hôte(sse) quand le règlement porterait le client au-delà de son plafond de crédit. Les jetons {encours} et {plafond} y sont remplacés par les montants (BO-10-04-13).
j.montant-d-especes-au-dela-duquel-la=Montant d'espèces au-delà duquel la caisse affiche une alerte PRÉLÈVEMENT sans bloquer la vente, calé sur le montant garanti par l'assurance. 0 = aucun plafond (EXP-17).
j.montant-maximum-d-une-remise-en-euros=Montant maximum d'une remise en euros sur une ligne. Une remise à ce montant passe, au-delà elle est refusée. 0 = pas de plafond en euros (BO-03-07-04).
j.montant-maximum-d-une-remise-ticket-en=Montant maximum d'une remise ticket en euros. Une remise à ce montant passe, au-delà elle est refusée. 0 = pas de plafond en euros (BO-03-07-04).
j.montant-maximum-reglable-par-carte-titre-restaur=Montant maximum réglable par carte titre-restaurant (TRD) sur une transaction, en plus de l'assiette éligible. 0 = plafond non appliqué, seule l'assiette limite (EXP-60).
p.motif-de-reconnaissance-d-un-numero-de=Motif de reconnaissance d'un numéro de compte client, sous forme d'expression régulière (par exemple ^CC\\d{8}$). Un numéro hors de la plage est refusé avant toute recherche. Vide : tout numéro est accepté et aucune plage n'est reconnue au scan (BO-03-06-52).
p.motif-de-reconnaissance-d-une-carte-de=Motif de reconnaissance d'une carte de fidélité au scan, sous forme d'expression régulière (par exemple ^299\\d{10}$). Vide : la propriété de déploiement scan.pattern.fidelity s'applique (BO-03-06-54).
j.nombre-de-rapports-caissieres-etats-x-du=NOMBRE de rapports caissières (états X du journal technique) conservés — les plus anciens au-delà de ce nombre sont supprimés. Un nombre de rapports, PAS un nombre de jours. 0 = conservation illimitée (BO-10-08-07).
j.nombre-de-jours-apres-la-derniere-activite=Nombre de jours après la dernière activité (dernière mise à jour de la fiche) au-delà duquel un client est purgé. Un client avec un solde de crédit non nul ou encore lié à une facture n'est pas purgé. 0 = conservation illimitée (BO-10-08-26).
j.nombre-de-jours-apres-la-fin-de=Nombre de jours après la fin de validité au-delà duquel une promotion échue est supprimée. 0 = conservation illimitée (BO-10-08-17).
j.nombre-de-jours-de-conservation-des-alertes=Nombre de jours de conservation des alertes (appels superviseur) tracées au journal technique. 0 = conservation illimitée (BO-10-08-11).
j.nombre-de-jours-de-conservation-des-articles=Nombre de jours de conservation des articles « supprimés » (désactivés) avant suppression définitive. Un article encore référencé par un prix ou une ligne de ticket n'est pas supprimé. 0 = conservation illimitée (BO-10-08-24).
j.nombre-de-jours-de-conservation-des-factures=Nombre de jours de conservation des factures et bons de livraison. Une facture liée à un client encore actif (non bloqué) n'est pas supprimée. 0 = conservation illimitée (BO-10-08-16).
j.nombre-de-jours-de-conservation-des-lignes=Nombre de jours de conservation des lignes de l'audit de mise à jour du référentiel avant SUPPRESSION par le balayage de fin de période. 0 = conservation illimitée (BO-10-08-10).
j.nombre-de-jours-de-conservation-des-tickets=Nombre de jours de conservation des tickets en attente (mis en parking) avant suppression. Un ticket en attente rattaché à une session encore ouverte n'est pas supprimé. 0 = conservation illimitée (BO-10-08-12).
j.nombre-de-jours-de-conservation-des-ventes=Nombre de jours de conservation des ventes article (tickets clôturés) avant SUPPRESSION par le balayage de fin de période. Une vente rattachée à une facture ou à un remboursement n'est jamais supprimée. 0 = conservation illimitée. Suppression retenue ; l'archivage est une décision client, hors implémentation (BO-10-08-03).
j.nombre-de-jours-de-conservation-des-evenements=Nombre de jours de conservation des événements techniques quotidiens non couverts par une ligne dédiée (hors journal d'accès et alertes). 0 = conservation illimitée (BO-10-08-08).
j.nombre-de-jours-de-conservation-du-journal=Nombre de jours de conservation du journal d'accès (verrouillages d'authentification, mots de passe, verrouillage / déverrouillage de caisse). 0 = conservation illimitée (BO-10-08-09).
j.nombre-maximum-de-promotions-echues-supprimees-a=Nombre maximum de promotions échues supprimées à CHAQUE passage du balayage, pour que la purge ne bloque pas la fin de période. Ce n'est pas une rétention, c'est un plafond par exécution. 0 = pas de plafond (BO-10-08-18).
j.prix-unitaire-au-dela-duquel-la-saisie=Prix unitaire au-delà duquel la saisie d'un article affiche un avertissement au caissier. 0 = aucun avertissement.
j.reference-optionnelle-imprimable-par-banque-lc-0=Référence optionnelle imprimable par {banque} (LC-07-05-07).
j.un-compte-doit-rester-d-un-niveau-2=Un compte doit rester d'un niveau strictement inférieur au vôtre, et seul un administrateur crée un administrateur.
j.une-regle-par-ligne-get-manual-required=Une règle par ligne : GET /manual=REQUIRED ou POST /sale-tax-id=REQUIRED. NONE dispense l’aval de la fonction ; les blocages et seuils métier restent applicables. L’annulation de l’unique article conserve son aval obligatoire. Le suffixe /* couvre les sous-chemins. La dernière règle correspondante prime. Le geste et son formulaire attendent l'aval puis sont rejoués une seule fois. Les routes de connexion, d'aval et de sondage restent accessibles (LC-01-05-01).
