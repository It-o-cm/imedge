j.r20-parametre-1=Jeton de système tiers obligatoire
j.r20-parametre-2=Une vente déposée par un système tiers (e-commerce, mobilité) doit présenter le jeton du système déclaré à l'écran Systèmes tiers, dans l'en-tête X-Integration-Token ; le jeton de synchronisation des caisses n'y suffit plus. Désactivé : le jeton d'un système déclaré l'identifie, et le jeton de synchronisation reste accepté (BO-07-01-01).
j.r20-parametre-3=Cagnottage fidélité des commandes e-commerce
j.r20-parametre-4=Une commande e-commerce intégrée portant une carte de fidélité déclenche son cagnottage : l'événement de ticket clôturé, canal Web, part vers le programme de fidélité par la file d'envoi du nœud magasin, comme un ticket de caisse. Désactivé : la commande n'est pas cagnottée (BO-07-01-03).
j.r20-parametre-5=Lancement automatique de la fin de période
j.r20-parametre-6=À l'heure de fin de période, le nœud magasin lance seul le traitement de fin de période : points d'entrée techniques, enregistrement des tickets en attente, contrôle des caisses, états financiers, clôture consolidée, éditions programmées, volumes de vente, purge de rétention. Désactivé : rien ne part tout seul, le traitement se lance depuis l'écran Fin de journée (BO-09-03-03).
j.r20-parametre-7=Enregistrement des tickets en attente à la fin de journée
j.r20-parametre-8=La fin de journée, automatique ou lancée depuis le back-office, se fait avec les tickets en attente : chacun est enregistré — caisse, numéro, caissière, articles, montant — et inscrit au journal électronique. Désactivé : seule la clôture Z en caisse écrit leur sort (BO-09-01-05, BO-09-02-01).
j.r20-parametre-9=Remise à zéro automatique des tickets en attente
j.r20-parametre-10=À la fin de période automatique, les tickets restés en attente sont remis à zéro : chaque caisse reçoit l'ordre de les annuler et en trace la purge, comme à la clôture Z. Désactivé : la remise à zéro se commande depuis l'écran Fin de journée (BO-09-01-08).
j.r20-parametre-11=Ticket technique à la fermeture forcée
j.r20-parametre-12=Une caisse fermée d'office par la fin de période ou depuis le back-office imprime un ticket technique — caisse, session, opérateur, cause, tickets en attente — et l'inscrit au journal électronique. Désactivé : seul le ticket de fermeture paramétré s'imprime (BO-09-01-06, BO-09-02-03).
j.r20-parametre-13=Déclaration automatique des hôtes des îlots libre-service
j.r20-parametre-14=À la fin de période, la session d'un hôte rattaché à un îlot de caisses libre-service en déclaration automatique est clôturée sur son montant théorique, sans comptage, et son Z s'imprime. Les hôtes se rattachent à l'îlot à l'écran Îlots de caisse ; un îlot sans hôte désigné prend tous les hôtes de ses caisses (BO-09-03-01).
j.r20-parametre-15=Points d'entrée techniques de fin de période
j.r20-parametre-16=Les scripts désignés ci-dessous sont exécutés avant et après le traitement de fin de période, automatique ou manuel ; leur code retour et leur sortie sont conservés et inscrits au journal. Désactivé : aucun script n'est exécuté (BO-09-02-04).
j.r20-parametre-17=Script avant fin de période
j.r20-parametre-18=Nom du script exécuté avant le traitement de fin de période, pris dans le répertoire des points d'entrée du nœud magasin (lettres, chiffres, point, tiret, souligné). Vide : rien avant (BO-09-02-04).
j.r20-parametre-19=Script après fin de période
j.r20-parametre-20=Nom du script exécuté après le traitement de fin de période, pris dans le répertoire des points d'entrée du nœud magasin. Vide : rien après (BO-09-02-04).
j.r20-parametre-21=Durée maximale d'un script de fin de période (s)
j.r20-parametre-22=Au-delà, le script est arrêté et son exécution notée en échec ; le traitement de fin de période continue. En dessous de 1 : 60 secondes (BO-09-02-04).
j.r20-parametre-23=Vérification caisse / serveur en fin de période
j.r20-parametre-24=Pendant la fin de période, chaque caisse compare ses ventes du jour à celles que le serveur a reçues ; en cas d'écart elle renvoie ses ventes et resynchronise son référentiel, et le résultat est inscrit au journal. Désactivé : seul le contrôle continu des référentiels s'applique (BO-09-03-05).
j.r20-parametre-25=Imprimante des états de fin de période
j.r20-parametre-26=Imprimante réseau, au format hôte:port (port 9100 par défaut), à laquelle chaque état édité automatiquement en fin de période est envoyé dès son édition. Vide : les états sont seulement conservés et téléchargeables depuis l'écran Fin de journée (BO-09-01-10).
j.r20-aucune-valeur-a-representer-sur-la-periode=Aucune valeur à représenter sur la période.

# ---- lot 21: S ----
j.s21-def-journal-secondary-monetic-servers-label=Serveurs monétiques secondaires
j.s21-def-journal-secondary-monetic-servers-hint=Codes du serveur d'acceptation (balise VWAY rendue par le terminal) qui désignent le serveur secondaire du mode dégradé — 4, celui que le mode dégradé force (LC-07-08-02) —, séparés par des points-virgules. Le journal électronique retrouve les tickets réglés par carte sur l'un de ces serveurs, à destination du service support. Vide : aucun serveur n'est tenu pour secondaire (BO-04-01-48).
j.s21-def-auth-endorsement-profiles-label=Profils habilités à donner un aval
j.s21-def-auth-endorsement-profiles-hint=Noms des profils dont le titulaire peut avaliser un geste en caisse, quel que soit son rôle, séparés par des points-virgules. Une règle d'aval par fonction peut aussi nommer ses propres profils après le mode, par exemple POST /action/pay-tender=REQUIRED:Chef de caisse. Vide : seuls les rôles habilités avalisent (BO-04-02-01).
j.s21-def-control-alert-rules-label=Alertes de caisse
j.s21-def-control-alert-rules-hint=Une alerte par ligne : cible = type ; options. Cibles : function:POST /abandon (une fonction), payment:CHEQUE (un moyen de paiement), article:3017620422003 ou article:F1020 (un article ou une famille), barcode:20* (un préfixe de code-barres), offline (caisse hors ligne), expired (date limite dépassée lue sur un code GS1). Types : YESNO (question oui/non en caisse), SUPERVISOR (validation superviseur), BACKOFFICE (alerte d'information au back-office), BLOCK (fonction bloquée). Options séparées par des points-virgules : text=message affiché, notify (notification à l'hôte(sse) de caisse), max=n (nombre de fois dans la transaction). Vide : aucune alerte (BO-04-03-08, BO-04-03-09).
j.s21-def-justification-function-routes-label=Fonctions de caisse justifiées
j.s21-def-justification-function-routes-hint=Une fonction par ligne : méthode chemin=code de fonction, par exemple POST /abandon=CANCEL_TICKET. Quand une liste de justifications sert ce code de fonction, la caisse demande la justification avant d'exécuter la fonction, la trace au journal électronique puis rejoue la fonction. Une fonction sans liste administrée s'exécute sans question (BO-04-03-10, BO-04-03-12).
j.s21-def-control-indicators-bar-label=Indicateurs de contrôle sur tous les écrans
j.s21-def-control-indicators-bar-hint=Affiche en tête de chaque écran du back-office, pour les profils qui ont accès aux indicateurs de contrôle, le CA du jour, le CA par rayon ou famille, le panier moyen en quantité, le nombre de clients et le comparatif avec l'année précédente. Désactivé : les indicateurs ne sont plus affichés que sur leur propre écran (BO-04-03-01).
j.s21-def-control-revenue-level-label=Niveau de nomenclature du détail du CA
j.s21-def-control-revenue-level-hint=Rang du niveau de nomenclature auquel le CA du jour est détaillé (1 : rayon, 2 : famille, et ainsi de suite sur toute la nomenclature). 0 ou un niveau inconnu : la famille de rattachement de l'article (BO-04-03-01).
j.s21-def-control-revenue-top-label=Nombre de rubriques du détail du CA
j.s21-def-control-revenue-top-hint=Nombre de rayons ou familles affichés dans le détail du CA, les plus forts d'abord, de 1 à 20 (BO-04-03-01).
j.s21-def-audit-watched-menus-label=Menus du back-office surveillés
j.s21-def-audit-watched-menus-hint=Écrans du back-office dont chaque ouverture est tracée au journal électronique, séparés par des points-virgules : un code d'écran (journal, settings, account...) ou un début de chemin (/admin/journal). * : tous les écrans. Vide : seules les connexions sont tracées (BO-04-03-04).
j.s21-def-supervision-global-alerts-label=Alertes de caisse sur tous les écrans
j.s21-def-supervision-global-alerts-hint=Une demande d'autorisation ou de service émise par une caisse s'affiche immédiatement en tête de chaque écran du back-office, pour les profils qui ont accès à la supervision, avec ses options de traitement (autoriser, à traiter en caisse, refuser, acquitter). Désactivé : les demandes ne s'affichent que sur le tableau de bord (BO-04-02-12).
j.s21-def-supervision-live-event-types-label=Opérations du suivi en temps réel
j.s21-def-supervision-live-event-types-hint=Types d'opérations affichés par l'écran de surveillance des caisses en temps réel, séparés par des points-virgules (TICKET_CLOSED, TICKET_CANCELLED, LINE_CANCELLED, PRICE_MODIFIED, DRAWER_OPENED, REFUND_CREATED, PAYMENT_CANCELLED, CONTROL_ALERT...). Vide : toutes les opérations (BO-04-03-07).
