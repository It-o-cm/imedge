j.produit-le-detail-ligne-a-ligne-des=Produit le détail ligne à ligne des transactions de la journée comptable, lignes annulées incluses et marquées (BO-11-01-14).
j.produit-le-fichier-plat-des-factures-et=Produit le fichier plat des factures et bons de livraison clients en compte : identité, coordonnées, échéance, lignes facturées, écotaxe. Activation demandée à l'échelle Pays / Enseigne / Point de Vente (BO-11-01-06, BO-11-01-12).
j.produit-le-flux-de-chiffre-d-affaires=Produit le flux de chiffre d'affaires par journée comptable, cumulable sur plusieurs journées (BO-11-01-03).
j.produit-le-flux-de-chiffre-d-affaires-2=Produit le flux de chiffre d'affaires ventilé par famille d'articles et par îlot de caisse, avec les remises portées par les lignes (BO-11-01-08).
j.produit-le-flux-livre-de-caisse-montants=Produit le flux livre de caisse — montants par moyen de paiement — par journée comptable (BO-11-01-04).
j.produit-les-indicateurs-de-productivite-par-cais=Produit les indicateurs de productivité par caissière et par prise de poste : tickets, articles, durée, articles par heure, panier moyen (BO-11-01-21).
j.produit-par-caisse-les-compteurs-et-la=Produit, par caisse, les compteurs et la plage de numéros de tickets de la journée comptable, ventes et non-ventes séparées, pour le contrôle de complétude (BO-11-01-17).
j.produit-une-fois-par-mois-les-reglements=Produit, une fois par mois, les règlements fidélité ventilés par taux de TVA au prorata du TTC de chaque ticket (BO-11-01-13).
