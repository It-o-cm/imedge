j.porte-d-entree-du-back-office-a=Porte d'entrée du back-office à cet échelon : ANY (mot de passe ou SSO du groupement, défaut), PASSWORD (mot de passe seulement) ou SSO (SSO seulement : aucun mot de passe local n'ouvre le back-office). S'ajoute au mode de connexion de chaque compte ; une valeur inconnue retombe sur ANY (BO-01-02-01, BO-01-02-09).
j.portugal-fatura-ft=Portugal — Fatura (FT)
