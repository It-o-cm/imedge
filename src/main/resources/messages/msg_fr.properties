j.alerte-levee-a-la-lecture-d-un=Alerte levée à la lecture d'un identifiant d'application, séparées par des points-virgules, sous la forme AI=NIVEAU:message — exemple 10=SUPERVISOR:Lot {value} à contrôler;21=WARN:Numéro de série {value}. Niveaux : INFO (message, l'article est enregistré), WARN (avertissement, l'article est enregistré), BLOCK (article refusé) ou SUPERVISOR (article refusé, un superviseur peut forcer son enregistrement). {value} est remplacé par la valeur lue, {ai} par l'identifiant. Vide : aucune alerte (BO-10-09-04).
j.alertes-par-identifiant-gs1=Alertes par identifiant GS1
j.au-scan-d-un-code-que-rien-2=Au scan d'un code que rien ne reconnaît, le message « article inconnu » s'affiche et la caisse enchaîne sur l'écran de saisie directe pour vendre l'article par sa famille ou son code. Désactivé : seul le message s'affiche (BO-10-02-14).
j.ce-que-le-panneau-d-autorisation-superviseur=Ce que le panneau d'autorisation superviseur demande : CODE_PASSWORD (code superviseur, tapé ou lu, puis mot de passe — défaut), BARCODE (code-barres superviseur lu, seul), BARCODE_CODE_PASSWORD (code-barres lu, puis code tapé, puis mot de passe), BARCODE_PASSWORD (code-barres lu, puis mot de passe) ou DALLAS (clé Dallas du superviseur, seule). Une valeur inconnue retombe sur CODE_PASSWORD (BO-10-02-31).
j.comment-le-n-ud-magasin-recoit-les=Comment le nœud magasin reçoit les paniers des balanciers, que la caisse lit au scan du ticket balance : API_FTP (poussés sur l'API du nœud et relevés sur le serveur FTP administré, défaut), API (API seule, le FTP n'est pas relevé), FTP (FTP seul, l'API refuse les paniers) ou OFF (aucun ticket balance : le nœud n'en reçoit plus et la caisse ne reconnaît plus leur code-barres). Une valeur inconnue retombe sur API_FTP (BO-10-05-01).
j.decimales-du-total-ht-de-la-ligne=Décimales du total HT de la ligne
j.en-mode-ecole-le-tiroir-s-ouvre=En mode école, le tiroir s'ouvre comme en vente réelle (paiement, prise de poste, clôture). Désactivé : aucune impulsion d'ouverture n'est envoyée tant que la caisse est en mode école, le tiroir restant fermé sur un encaissement fictif (BO-10-02-12).
j.la-caisse-lit-les-codes-gs1-databar=La caisse lit les codes GS1 (Databar, DataMatrix, QR code, Digital Link) et applique leurs identifiants d'application. Désactivé : un code GS1 n'est plus interprété et suit le chemin d'un code ordinaire (BO-10-09-01).
j.lecture-des-codes-gs1=Lecture des codes GS1
j.message-affiche-en-caisse-quand-un-article=Message affiché en caisse quand un article interdit à la vente ou en retrait/rappel est scanné et que sa fiche ne porte pas de message propre (attribut FORBIDDEN_SALE_MESSAGE). Vide : « ARTICLE EN RETRAIT/RAPPEL » (BO-10-07-20).
