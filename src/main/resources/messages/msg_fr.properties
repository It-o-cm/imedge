j.u-def-fiscal-archive-auto=Archives fiscales mensuelles automatiques
j.u-def-fiscal-archive-auto-aide=Le nœud magasin produit lui-même, dès le début de chaque mois, les archives fiscales du mois écoulé TaxAuditExtracts_XXXXX_aaaammjj.zip (tickets, lignes, règlements, TVA, retours, factures, sessions, mouvements) et TaxAuditReports_XXXXX_aaaammjj.zip (chiffre d'affaires journalier, TVA par taux, règlements par moyen, sessions), mises à disposition du contrôleur de gestion à l'écran Archives fiscales. Désactivé : les archives ne se produisent qu'à la demande (BO-05-01-01).
j.u-def-fiscal-online-retention-years=Conservation en ligne des tickets et factures (années)
j.u-def-fiscal-online-retention-years-aide=Durée pendant laquelle les tickets, factures, avoirs et documents fiscaux restent consultables, extractibles et imprimables à l'écran Export des transactions : aucune purge de rétention ne supprime une vente ou une facture plus récente, quel que soit le délai de rétention administré par ailleurs (BO-05-01-06).
j.u-def-fiscal-einvoicing-enabled=Facturation électronique (e-invoicing)
j.u-def-fiscal-einvoicing-enabled-aide=Chaque facture émise par les caisses à un client professionnel assujetti en France (SIRET ou TVA FR) est convertie au format structuré UN/CEFACT CII (profil EN 16931) et déposée sur la plateforme de dématérialisation désignée, avec suivi de son cycle de vie (déposée, rejetée, mise à disposition, approuvée, refusée, encaissée…) ; la caisse imprime la mention de facture électronique sur la facture. Désactivé : aucune facture n'est transmise (BO-05-01-02).
j.u-def-fiscal-einvoicing-mention=Mention de facture électronique
j.u-def-fiscal-einvoicing-mention-aide=Texte que la caisse imprime au pied de chaque facture lorsque la facturation électronique est active (catégorie de l'opération, transmission par plateforme agréée). Vide : aucune mention (BO-05-01-02).
j.u-def-fiscal-pdp-provider=Plateforme de dématérialisation (code du fournisseur)
j.u-def-fiscal-pdp-provider-aide=Code du fournisseur de service de type Fiscal (écran Fournisseurs de service) qui joue la plateforme de dématérialisation : son adresse et sa clé servent au dépôt des factures électroniques et à la transmission des données d'e-reporting (BO-05-01-02, BO-05-01-03).
j.u-def-fiscal-ereporting-enabled=E-reporting des transactions
j.u-def-fiscal-ereporting-enabled-aide=À la fin de chaque période, le nœud magasin extrait les transactions B2C et B2B internationales consolidées (ventes et retours, par jour et par taux de TVA), les met au format de transmission et les transmet à la plateforme de dématérialisation, puis suit l'accusé de réception ; un envoi en échec est rejoué. Désactivé : les périodes ne se transmettent qu'à la demande (BO-05-01-03).
j.u-def-fiscal-ereporting-period=Périodicité de l'e-reporting
j.u-def-fiscal-ereporting-period-aide=DECADE : une transmission par décade (du 1er au 10, du 11 au 20, du 21 à la fin du mois) ; MONTH : une transmission par mois (BO-05-01-03).
j.u-def-fiscal-saft-realtime=SAF-T au fil de l'eau
j.u-def-fiscal-saft-realtime-aide=Chaque document fiscal portugais remonté par une caisse (FS, FT, NC, RC) est transmis une fois, aussitôt, à chaque fournisseur de service actif de protocole SAFT : au format RegisterInvoice au service de l'administration fiscale (type Fiscal) pour les factures et avoirs, au format SAF-T (PT) aux autres ; un envoi en échec est rejoué, et les données restent consultables par l'API /api/fiscal/saft/documents. Désactivé : aucun envoi au fil de l'eau (BO-05-01-05, BO-11-04-02).
j.u-def-fiscal-saft-deadline-day=SAF-T mensuel : jour limite d'extraction
j.u-def-fiscal-saft-deadline-day-aide=Jour du mois avant lequel le point de vente extrait et transmet le fichier SAF-T du mois précédent ; l'écran Export SAF-T le rappelle et signale le retard, de 1 à 28 (BO-05-01-04).
j.u-def-fiscal-transmission-retry-seconds=Délai entre deux tentatives de transmission fiscale (secondes)
j.u-def-fiscal-transmission-retry-seconds-aide=Délai avant de rejouer un dépôt de facture électronique, une transmission d'e-reporting ou un envoi SAF-T en échec, de 10 à 86400 secondes (BO-05-01-02, BO-05-01-03, BO-05-01-05).
j.u-def-safe-pouch-requires-day-validation=Remise au coffre après validation de la journée
j.u-def-safe-pouch-requires-day-validation-aide=Une pochette ne se déclare qu'une fois la journée comptable validée à l'écran Historique des journées : chaque mouvement des caissières validé, puis le chiffre d'affaires net de la journée. Désactivé : une pochette se déclare à tout moment (BO-05-02-10).
j.u-def-safe-pouches-per-day=Nombre de pochettes par journée comptable
j.u-def-safe-pouches-per-day-aide=Nombre maximal de pochettes remises au coffre pour une même journée comptable ; 0 : sans limite (BO-05-02-10).
j.u-def-safe-forcing-level-control=Contrôle du niveau de forçage
j.u-def-safe-forcing-level-control-aide=Un mouvement du coffre saisi par un salarié portant un niveau de forçage ne se valide que par un salarié de niveau strictement supérieur. Désactivé : tout valideur autorisé valide (BO-05-02-15).
j.u-def-safe-advance-limit-control=Contrôle du plafond d'acompte
j.u-def-safe-advance-limit-control-aide=Une dépense du coffre faite à un salarié qui porte un plafond d'acompte est refusée quand elle porterait le total qui lui a été versé au-delà de ce plafond. Désactivé : le plafond est indicatif (BO-05-02-15).

