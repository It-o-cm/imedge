j.des-articles-peuvent-etre-repris-dans-un=Des articles peuvent être repris dans un ticket qui porte déjà des ventes : le total du ticket est alors positif ou négatif selon les montants. Désactivé : un retour s'enregistre sur son propre ticket, jamais mêlé à une vente (LC-05-01-01).
j.des-mouvements-de-la-periode-ne-sont=Des mouvements de la période ne sont pas validés.
j.destination-de-la-plage-inconnue=Destination de la plage inconnue.
j.destinations-de-prelevement=Destinations de prélèvement
j.destinations-proposees-au-caissier-pour-un-prele=Destinations proposées au caissier pour un prélèvement, en plus du coffre qui est toujours offert, séparées par des points-virgules. La destination est obligatoire : un prélèvement qui ne dit pas où va l'argent n'est pas opposable (LC-12-03).
j.detail-quotidien-des-transactions=Détail quotidien des transactions
j.deuxieme-langue-affichee-a-cote-de-la=Deuxième langue affichée à côté de la première sur la visu client et le ticket, pour les régions bilingues : « Terug te geven / A rendre ». Vide : visu client et ticket monolingues (LC-13-06-06/11).
j.deuxieme-langue-de-la-visu-client-et=Deuxième langue de la visu client et du ticket
j.devise-creee=Devise créée.
j.devise-enregistree=Devise enregistrée.
j.devise-inconnue=Devise inconnue.
j.devise-supprimee=Devise supprimée.
j.devise-sur-les-touches-articles=Devise sur les touches articles
j.diffusion-des-ventes-au-fil-de-l=Diffusion des ventes au fil de l'eau
j.discount-article-maximum=Discount article : % maximum
j.disposition-des-touches-lettres-des-claviers-alp=Disposition des touches lettres des claviers alphabétiques et alphanumériques de la visu caisse, selon le pays ou la région : AZERTY, QWERTY, QWERTZ ou ABCD. Vide ou inconnue : AZERTY (LC-09-01-09).
j.disposition-du-clavier-virtuel=Disposition du clavier virtuel
j.document-imprime-automatiquement-par-moyen-de-re=Document imprimé automatiquement par moyen de règlement
j.document-emis-automatiquement-en-fin-de-transact=Document émis automatiquement en fin de transaction selon le règlement, séparés par des points-virgules, sous la forme REGLEMENT:TYPE — exemple CREDIT:FACTURE. Le document n'est émis que si le règlement désigne un client en compte. Vide : aucune émission automatique (LC-08-04-16).
j.documents-de-retour-et-tickets-contenant-un=Documents de retour et tickets contenant un retour ; montant TTC retourné. Affichage et impression du rapport CA (LC-12-07-02).
j.documents-fiscaux-portugais=Documents fiscaux portugais
j.documents-imprimes-d-office-quel-que-soit=Documents imprimés d'office quel que soit le choix du caissier, séparés par des points-virgules : TICKET, CARTE, BON, AVOIR, FID, ENLEVEMENT, RETOUR, ACOMPTE. TICKET, CARTE et BON complètent le choix du caissier. Les autres documents, y compris l'avoir de remboursement et les deux parcours d'acompte, sortent seulement s'ils sont nommés ici lorsque le choix d'impression est activé. Vide : aucun document associé ne sort. Choix d'impression désactivé : impression habituelle. Les copies client restent disponibles par email même sans papier (LC-08-03-07, BO-03-03-01).
j.documents-toujours-imprimes=Documents toujours imprimés
j.domaine-inconnu=Domaine inconnu:
j.don-au-palier-le-plus-proche=Don au palier le plus proche
j.dont-tva=Dont TVA
j.droit-refuse-affectation-des-profils=Droit refusé : affectation des profils.
j.droit-refuse-gestion-des-profils=Droit refusé : gestion des profils.
j.droit-refuse-etats-financiers=Droit refusé : états financiers.
