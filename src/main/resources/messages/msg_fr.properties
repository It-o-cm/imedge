j.regle-appliquee-quand-un-montant-calcule-en=Règle appliquée quand un montant calculé en caisse est ramené à deux décimales — total de ligne, ventilation de TVA, hors taxe des factures : HALF_UP (au plus proche, la demie vers le haut, défaut), HALF_EVEN (au plus proche, la demie vers le pair), HALF_DOWN (au plus proche, la demie vers le bas), UP (toujours vers le haut), DOWN (toujours vers le bas). Une valeur inconnue retombe sur HALF_UP (BO-10-02-18).
