j.un-recu-portant-le-numero-de-reprise=Un reçu portant le numéro de reprise sort à chaque mise en attente (LC-04-01-02).
j.un-ticket-de-caisse-comprenant-un-article=Un ticket de caisse comprenant un article soumis à la Garantie Légale de Conformité est imprimé d'office (LC-08-03-09).
j.un-ticket-de-prelevement-est-imprime-apres=Un ticket de prélèvement est imprimé après validation, détaillant les dénominations pour les espèces et les transactions pour les autres moyens (LC-12-03-07).
j.un-ticket-de-reprise-date-numero-du=Un ticket de reprise — date, numéro du ticket et numéro du ticket d'origine — sort à chaque reprise d'un ticket mis en attente. Désactivé : la reprise n'imprime rien (BO-03-03-07).
j.un-ticket-de-sortie-titre-code-barres=Un ticket de sortie — titre, code-barres, total TTC, nombre d'articles et les articles les plus chers — est imprimé À LA PLACE du ticket de caisse. Désactivé : le ticket de caisse sort normalement (BO-03-03-36).
j.un-ticket-mouvement-financier-est-imprime-apres=Un ticket « Mouvement financier » est imprimé après validation, indiquant le moyen perçu, le moyen rendu et le montant. Désactivé : aucun ticket n'est imprimé (LC-12-06-03).
j.un-ticket-transfert-reglement-est-imprime-apres=Un ticket « Transfert règlement » est imprimé après validation, indiquant les moyens source et destination et le montant transféré (LC-12-10-05).
j.un-ticket-paiement-carte-cadeau-code-de=Un ticket « paiement carte cadeau » (code de la carte, montant, ancien et nouveau solde, fournisseur et son code) sort en plus du ticket de caisse. Désactivé : seul le ticket de caisse est imprimé (LC-07-11-03).
j.un-ticket-emis-par-un-autre-point=Un ticket émis par un autre point de vente est accepté en retour. Désactivé : le retour ne se fait que sur le point de vente où les achats ont été effectués, ce qui est la règle entre adhérents indépendants (LC-05-02-07).
j.un-visuel-d-avantage-demande-le-code=Un visuel d'avantage demande le code de l'avantage.
j.un-echelon-demande-le-code-de-l=Un échelon demande le code de l'échelon.
