j.moyens-de-paiement-d-un-mouvement=Moyens de paiement d'un mouvement
j.moyens-de-paiement-destination=Moyens de paiement destination
j.moyens-de-paiement-proposes-pour-un-mouvement=Moyens de paiement proposés pour un mouvement de caisse (prélèvement/apport d'un chèque, d'un titre-restaurant...), séparés par des points-virgules. Vide : le mouvement porte toujours sur les espèces (BO-03-02-20).
j.moyens-de-paiement-proposes-en-destination-d=Moyens de paiement proposés en DESTINATION d'un mouvement financier, même syntaxe que la source — exemple CREDIT:Crédit client, sert notamment à régler la dette d'un client en compte. Vide : le mouvement financier n'est pas proposé (LC-12-06-01/02).
j.moyens-de-paiement-proposes-en-source-d=Moyens de paiement proposés en SOURCE d'un mouvement financier — un montant perçu dans ce moyen est rendu dans un autre hors d'une vente, séparés par des points-virgules, sous la forme CLÉ:LIBELLÉ — exemple CASH:Espèces;CARD:Carte bancaire. Vide : le mouvement financier n'est pas proposé (LC-12-06-01/02).
j.moyens-de-paiement-restreints-dont-l-assiette=Moyens de paiement restreints dont l'assiette éligible est affichée pendant la vente, séparés par des points-virgules, sous la forme CODE:ATTRIBUT:LIBELLÉ — attributs disponibles : MEAL_VOUCHER_ELIGIBLE, ECO_VOUCHER_ELIGIBLE, SOCIAL_CARD_ELIGIBLE. Vide : titre-restaurant, éco-chèque et carte achat sociale (LC-09-01-11 à -18).
j.moyens-de-paiement-source=Moyens de paiement source
j.moyens-de-reglement-proposes-au-prelevement-manu=Moyens de règlement proposés au prélèvement manuel, séparés par des points-virgules, sous la forme CLÉ:LIBELLÉ — exemple CASH:Espèces;CHEQUE:Chèques. Un moyen prélevé automatiquement n'y figure pas et n'est pas proposé en caisse (LC-12-03-02/03).
j.moyens-de-reglement-proposes-en-source-et=Moyens de règlement proposés en source et en destination d'un transfert de règlement, même syntaxe que le prélèvement. Vide : la liste du prélèvement s'applique (LC-12-10-02).
j.moyens-de-reglement-prelevables-manuellement=Moyens de règlement prélevables manuellement
j.moyens-de-reglement-transferables=Moyens de règlement transférables
