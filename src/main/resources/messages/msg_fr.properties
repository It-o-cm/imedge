j.position-du-symbole-monetaire=Position du symbole monétaire
j.pourcentage-des-paniers-selfscanning-tires-au-so=Pourcentage des paniers selfscanning tirés au sort pour un contrôle partiel à leur rappel en caisse, en plus de ceux pour lesquels l'appareil demande lui-même un contrôle. 0 : seuls les contrôles demandés par l'appareil (LC-06-05-04).
j.pourcentage-maximal-d-un-discount-de-ligne=Pourcentage maximal d'un discount de ligne (LC-03-02-07).
j.pourcentage-maximal-d-une-remise-ticket-lc=Pourcentage maximal d'une remise ticket (LC-03-02-13).
j.pousse-chaque-ticket-retour-et-ticket-monetique=Pousse chaque ticket, retour et ticket monétique aux fournisseurs de service abonnés dès la consolidation. Désactivé : rien n'est mis en file, et la file existante n'est plus dépilée (BO-11-02-02/03/04).
