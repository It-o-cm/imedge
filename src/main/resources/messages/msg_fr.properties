j.imprimer-les-remises-de-ligne=Imprimer les remises de ligne
j.imprimer-les-soldes-de-la-carte-fidelite=Imprimer les soldes de la carte fidélité
j.indicateurs-complementaires-affiches-sous-les-cu=Indicateurs complémentaires affichés sous les cumuls du jour, séparés par des points-virgules et dans l'ordre d'affichage voulu : endorsements, endorsements-denied, age-checks, supervisor-calls, parked-tickets, paid-cancelled, duplicates, price-checks, training, cash-movements, offline-registers. Toute autre donnée du système s'adresse aussi : event:TYPE (événements du jour d'un type du journal, par exemple event:PRICE_MODIFIED ou event:CONTROL_ALERT), payment:CLE (règlements du jour d'un moyen de paiement), family:CODE (CA du jour d'une branche de la nomenclature), movement:TYPE (mouvements de caisse du jour d'un type). Un code inconnu est ignoré. Vide : aucun indicateur complémentaire, seuls les cinq cumuls fixes restent (BO-04-03-01/-03/-15).
j.indicateurs-du-tableau-de-bord=Indicateurs du tableau de bord
j.informations-du-point-de-vente-enregistrees=Informations du point de vente enregistrées.
