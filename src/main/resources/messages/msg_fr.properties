j.adresse-du-serveur-ftp-ou-les-balances=Adresse du serveur FTP où les balances rayon déposent les fichiers de leurs tickets balance. Vide : aucune récupération FTP, les tickets balance arrivent par l'API du nœud (BO-03-06-56).
