j.symbologies-de-codes-barres-acceptees-en-caisse=Symbologies de codes-barres acceptées en caisse, séparées par des points-virgules, parmi EAN13 (UPC-A compris), EAN8, CODE128, CODE39, ITF, GS1, QR et DATAMATRIX ; le lecteur les annonce par leur identifiant de symbologie (]E0, ]C0, ]Q1, ]d1…), un code lu sans identifiant restant accepté. Vide : toutes les symbologies sont acceptées (BO-03-06-01).
