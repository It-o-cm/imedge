j.nombre-de-chiffres-du-code-saisi-en=Nombre de chiffres du code saisi en caisse : pavé de connexion, changement de code et code généré à la création d'un compte. De 4 à 8 ; en dessous, 4, au-dessus, 8 (BO-10-02-23).
j.nombre-de-decimales-du-total-hors-taxe-2=Nombre de décimales du total hors taxe de chaque ligne article sur la facture et le bon de livraison : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
