j.un-nif-saisi-ou-scanne-qui-n=Un NIF saisi ou scanné qui n'est fait que de chiffres, précédés ou non de PT, doit compter 9 chiffres, commencer par un préfixe légal et porter la bonne clé de contrôle (modulo 11) ; sinon il est refusé. Un NIF étranger, qui contient des lettres, n'est pas contrôlé (LC-08-06-04).
j.un-article-peut-etre-repris-sans-que=Un article peut être repris sans que son ticket d'origine soit identifié : les articles sont saisis librement et leur prix reste modifiable. Désactivé : tout retour passe par le rappel du ticket d'origine (LC-05-02-09/14).
j.un-article-scanne-alors-qu-un-reglement=Un article scanné alors qu'un règlement est en cours est enregistré sur la vente. Désactivé — le défaut — il est refusé et le caissier en est averti : un panier qui grossit pendant qu'on encaisse est un panier dont le total ne vaut plus (BO-10-02-15).
j.un-article-scanne-que-le-referentiel-ne=Un article scanné que le référentiel ne connaît pas remonte une demande de service au tableau de bord, au même titre qu'un appel superviseur. Désactivé — le défaut — l'article inconnu n'est consultable qu'après coup au journal (BO-04-02-06).
