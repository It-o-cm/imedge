j.duree-du-mode-degrade-force-minutes=Durée du mode dégradé forcé (minutes)
j.duree-du-verrouillage-back-office-minutes=Durée du verrouillage back-office (minutes)
j.duree-pendant-laquelle-un-compte-verrouille-pour=Durée pendant laquelle un compte verrouillé pour échecs reste inaccessible. 0 ou moins : quinze minutes, parce qu'un verrouillage sans durée serait un compte perdu (BO-01-01-01).
j.debut-de-plage-numero-de-caisse-decalage=Début de plage + numéro de caisse × décalage, borné à la plage (LC-13-04-04).
j.debut-de-plage-verifone=Début de plage Verifone
j.decalage-verifone-par-caisse-secondes=Décalage Verifone par caisse (secondes)
j.decimales-de-la-base-ht-du-tableau=Décimales de la base HT du tableau de TVA
j.decimales-du-montant-de-tva=Décimales du montant de TVA
j.decimales-du-prix-unitaire-ht=Décimales du prix unitaire HT
j.decimales-du-total-ht=Décimales du total HT
j.decimales-du-total-ttc=Décimales du total TTC
j.decisionnel=Décisionnel
j.declaration-automatique-de-fin-de-periode=Déclaration automatique de fin de période
j.depense=Dépense
j.depenses-dans-le-rapport-ca=Dépenses dans le rapport CA
j.desactive-le-peripherique-est-signale-desactive=Désactivé : le périphérique est signalé désactivé et ne bloque pas la vente (LC-13-02-09/-14).
j.detail-des-articles-sur-le-recu-de=Détail des articles sur le reçu de mise en attente
j.detail-des-articles-sur-le-ticket-d=Détail des articles sur le ticket d'abandon
j.detail-des-retours-sur-un-ticket-separe=Détail des retours sur un ticket séparé
j.ean-sur-les-touches-articles=EAN sur les touches articles
j.ean-sur-les-ecrans-et-le-ticket=EAN sur les écrans et le ticket
j.ean-separes-par-des-points-virgules-dans=EAN séparés par des points-virgules, dans l'ordre souhaité. Les articles non cités suivent par ordre alphabétique (LC-02-07-03).
