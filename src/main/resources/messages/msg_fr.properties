j.peripheriques=PÉRIPHÉRIQUES
j.periode-close=Période close.
j.periode-de-diffusion-invalide-attendu-jj-mm=Période de diffusion invalide (attendu JJ/MM/AAAA HH:MM).
j.qr-code-ticket-sur-l-afficheur-client=QR code ticket sur l'afficheur client
j.quantite-article=QUANTITÉ ARTICLE
j.quand-le-ticket-d-abandon-est-imprime=Quand le ticket d'abandon est imprimé : NEVER (jamais), ALWAYS (systématiquement) ou ON_DEMAND (l'opérateur décide sur l'écran d'abandon). Vide ou inconnu : NEVER (LC-04-04-12).
j.quand-les-articles-sont-regroupes-par-famille=Quand les articles sont regroupés par famille (ordre FAMILY), les intitulés de famille sortent dans l'ordre alphabétique, qui est le comportement par défaut. Désactivé : les familles sortent dans l'ordre d'apparition de leur premier article (BO-03-03-17).
j.quand-un-client-est-identifie-ses-coordonnees=Quand un client est identifié, ses coordonnées sont montrées à l'hôte(sse). Désactivé : seuls son numéro et sa raison sociale apparaissent (BO-10-04-02).
j.quantite-au-dela-de-laquelle-le-controle=Quantité au-delà de laquelle le contrôle de saisie de quantité se déclenche. La borne absolue de 999 reste appliquée quoi qu'il arrive (BO-10-02-06).
