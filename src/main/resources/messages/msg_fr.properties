t.code-du-mode=Code du mode
t.un-code-de-la-caisse-ou-un-code-nouveau=Un code de la caisse, ou un code nouveau pour ajouter un mode réglé selon sa nature.
t.montant-maximum-de-la-depense=Montant maximum (€)
t.valeur-de-la-touche=Valeur (vide : saisie)
t.options-depense=TENDER:CHEQUE,CONTROL:WARNING
t.options-remise=PERCENT,TICKET,CUMUL,MAX:30
t.options-type-retour=TICKET,NOENDORSE,NOORIGIN,PRICE,DECONSIGNE,RANGE:code
p.code-de-moyen-de-reglement-invalide=Code de moyen de règlement invalide : {0}
p.nature-de-reglement-inconnue-de-la-caisse=Nature de règlement inconnue de la caisse : {0}
p.correspondance-monetique-invalide=Correspondance monétique invalide : {0}
j.protocole-de-carte-inconnu=Protocole de carte inconnu.
j.cette-liste-porte-des-types-de-retour-deja=Cette liste porte des types de retour déjà utilisés : désactivez-la plutôt.
p.option-inconnue-pour-ce-genre-de-liste=Option inconnue pour ce genre de liste : {0}.
j.une-remise-porte-percent-ou-amount=Une remise porte PERCENT ou AMOUNT, et un seul des deux.
p.le-type-de-retour-x-est-rattache=Le type de retour {0} est rattaché à {1} retour(s) : il a été désactivé et non supprimé.
j.entree-activee=Entrée activée.
j.entree-desactivee=Entrée désactivée.
j.remises-et-rabais=Remises et rabais
j.etat-consigne-deconsigne=État consigne / déconsigne
j.impression-du-ticket-carte-bancaire=Impression du ticket carte bancaire
j.le-ticket-carte-bancaire-est-imprime-associe=Le ticket carte bancaire est imprimé : associé au ticket de vente ou sur un ticket séparé selon le paramètre « Ticket monétique attaché au ticket de vente ». Désactivé : aucun ticket carte n'est imprimé, sauf celui que le client doit signer ; le ticket reste archivé pour un duplicata (BO-03-02-34).
j.autorisation-superviseur-pour-lever-le-mode=Autorisation superviseur pour lever le mode dégradé
j.la-levee-du-mode-degrade-monetique-force=La levée du mode dégradé monétique forcé en caisse exige un aval superviseur. Désactivé : l'opérateur le lève seul (LC-07-08-04, BO-03-02-50).
j.autorisation-superviseur-pour-activer-le-mode=Autorisation superviseur pour activer le mode dégradé
j.l-activation-du-mode-degrade-monetique-force=L'activation du mode dégradé monétique forcé en caisse exige un aval superviseur. Désactivé : l'opérateur l'active seul. La levée a son propre paramètre (LC-07-08-03, BO-03-02-49).
j.au-bout-de-ce-delai-le-mode-degrade-en-caisse=Au bout de ce délai, le mode dégradé monétique forcé en caisse se lève tout seul, et le mode dégradé activé au BackOffice cesse de s'appliquer sur chaque caisse : l'opérateur qui l'a activé ne sera pas celui qui sera encore là trois heures plus tard (LC-07-08-04, BO-03-02-48).
j.composition-des-rouleaux-separes-par-des=Composition des rouleaux, séparés par des points-virgules, sous la forme FACIALE:MONTANT_ROULEAU:NOMBRE_DE_PIECES — exemple 0.20:8.00:40;0.01:0.50:50 ; le nombre de pièces peut être omis (il vaut alors le montant divisé par la valeur faciale), et une entrée dont les trois valeurs ne concordent pas est écartée. Sert au calcul croisé montant <-> nombre de rouleaux de la commande de monnaie et aux rouleaux proposés au comptage de caisse (LC-12-05-06/07, BO-03-02-42). Vide : aucun calcul croisé, et le comptage propose ses rouleaux habituels.

# lot 19: L2
t.autorisation-cheque-aide=Le service de garantie chèque administré (paramètres « Service de garantie chèque ») est interrogé ; sans service, ou service injoignable, un superviseur autorise le chèque.
t.reimpression-automatique-aide=Le recto du chèque (montant en lettres, bénéficiaire, lieu, date) est imprimé automatiquement selon le modèle « Présentation du recto chèque » avant la lecture, sans geste de l'hôte de caisse.
t.types-de-retour-titre=Types de retour
t.les-types-de-retour-que-la-caisse-propose=Les types de retour que les caisses proposent, avec leurs options. Un type désactivé disparaît des caisses au tirage suivant ; un type déjà utilisé par des retours est désactivé au lieu d'être supprimé.
t.reprendre-les-types-existants=Reprendre les types existants
t.aucun-type-de-retour-administre=Aucun type de retour n'est administré : les caisses lisent la liste des types de retour, puis le paramètre « Types de retours ».
t.retours-rattaches=Retours rattachés :
t.plage-code-barres-retour=Plage de codes-barres retour
t.aucune-plage=Aucune plage
t.mode-ticket-retour=Mode ticket (ticket d'origine identifié)
t.sans-autorisation-superviseur=Sans autorisation superviseur
t.sans-ticket-d-origine=Autorisé sans ticket d'origine
t.prix-a-confirmer=Prix à confirmer
t.retour-deconsigne=Déconsigne
t.nouveau-type-de-retour=Nouveau type de retour
t.le-mode-ticket-impose-l-identification=En mode ticket, la caisse impose l'identification du ticket d'origine (scan du code-barres ou saisie du numéro et de la date) avant le retour. Une plage de codes-barres retour rattachée permet le retour article par scan sans appel superviseur.
t.creer-le-type-de-retour=Créer le type de retour
t.types-de-cartes-prepayees=Types de cartes prépayées
t.le-type-d-une-carte-prepayee-dit=Le type d'une carte prépayée dit dans quel protocole la caisse la traite (NEXO : hub tiers ; LOCAL : registre de la caisse), qui l'émet, quelles plages de numéros lui appartiennent et ce que la caisse peut en faire : paiement, consultation du solde, activation à la vente.
t.aucun-type-de-carte-prepayee=Aucun type de carte prépayée n'est administré : les caisses suivent le protocole des plages de codes-barres.
t.plages-de-cartes=Plages de numéros
t.plages-de-cartes-aide=Préfixe ou préfixe:longueur, séparés par des points-virgules (ex. 6299;296:13). Le préfixe le plus long l'emporte.
t.paiement-autorise=Paiement autorisé
t.consultation-du-solde=Consultation du solde
t.activation-a-la-vente=Activation à la vente
t.nouveau-type-de-carte-prepayee=Nouveau type de carte prépayée
t.creer-le-type-de-carte=Créer le type de carte
j.cartes-prepayees=Cartes prépayées
j.le-code-du-type-de-retour-est-obligatoire=Le code du type de retour est obligatoire (40 caractères au plus).
j.le-libelle-du-type-de-retour-est-obligatoire=Le libellé du type de retour est obligatoire.
j.type-de-retour-cree=Type de retour créé.
j.type-de-retour-enregistre=Type de retour enregistré.
j.type-de-retour-inconnu=Type de retour inconnu.
j.type-de-retour-supprime=Type de retour supprimé.
j.type-de-retour-active=Type de retour activé.
j.type-de-retour-desactive=Type de retour désactivé.
j.aucun-type-de-retour-a-reprendre=Aucun type de retour à reprendre.
p.plage-de-codes-barres-retour-inconnue=Plage de codes-barres retour inconnue : {0}
p.types-de-retour-repris={0} type(s) de retour repris de la liste et du paramètre.
j.le-code-du-type-de-carte-est-obligatoire=Le code du type de carte est obligatoire (40 caractères au plus).
j.le-libelle-du-type-de-carte-est-obligatoire=Le libellé du type de carte est obligatoire.
p.plage-de-cartes-invalide=Plage de cartes invalide : {0}
j.type-de-carte-cree=Type de carte créé.
j.type-de-carte-enregistre=Type de carte enregistré.
j.type-de-carte-inconnu=Type de carte inconnu.
j.type-de-carte-supprime=Type de carte supprimé.
j.type-de-carte-active=Type de carte activé.
j.type-de-carte-desactive=Type de carte désactivé.
j.n-de-document=N° de document
j.consigne=Consigne
j.deconsigne=Déconsigne
j.article-colonne=Article
j.retours-par-type=Retours par type
j.retour-en-vente=Retour en vente
j.reprise-article-consigne=Reprise article consigné
j.retour-deconsigne=Retour déconsigne
j.bon-de-deconsigne=Bon de déconsigne
j.service-de-garantie-cheque=Service de garantie chèque
j.nom-du-prestataire-de-garantie-cheque=Nom du prestataire de garantie chèque interrogé quand un moyen de paiement chèque porte l'option « Autorisation chèque » (ex. SIMULATEUR en démonstration). La caisse demande l'autorisation au service : accordée, le chèque est pris sans superviseur et le numéro d'autorisation est enregistré sur le règlement ; refusée, le chèque est refusé ; service injoignable, l'autorisation superviseur prend le relais. Vide : aucune garantie, l'autorisation superviseur s'applique comme avant (BO-03-02-24).
j.adresse-du-service-de-garantie-cheque=Adresse du service de garantie chèque
j.adresse-de-base-du-service-de-garantie=Adresse de base du service de garantie chèque (la caisse appelle <adresse>/api/cheque-guarantee/authorize). Vide : l'adresse configurée sur la caisse, qui est en développement le service simulé de la caisse elle-même (BO-03-02-24).
j.delai-de-reponse-de-la-garantie-cheque=Délai de réponse de la garantie chèque (ms)
j.delai-maximal-d-attente-de-la-reponse=Délai maximal d'attente de la réponse du service de garantie chèque, en millisecondes ; au-delà, le service est réputé injoignable et l'autorisation superviseur prend le relais (BO-03-02-24).
j.articles-de-consigne=Articles de consigne
j.codes-ean-des-articles-de-consigne=Codes EAN des articles de consigne (bouteille, casier, contenant consigné), séparés par des points-virgules. Une ligne de vente de ces articles alimente le côté consigne de l'état consigne / déconsigne, une ligne reprise le côté déconsigne. Vide : seuls les retours déconsigne et les bons de déconsigne alimentent l'état (BO-03-13-11).

# lot 19: FX
t.fx19-garantie-cheque=Garantie chèque :

# ---- lot 19: M ----
j.m19-niveau-nomenclature-regroupement=Niveau de nomenclature du regroupement des articles
j.m19-niveau-nomenclature-regroupement-aide=Quand les articles sont regroupés par famille, le niveau de la nomenclature sous lequel ils sont rassemblés : 1 pour le premier niveau (rayon), 2 pour le deuxième, et ainsi de suite. L'intitulé imprimé est le libellé du nœud de ce niveau. 0 : la famille de l'article, comme avant. Un niveau que la nomenclature n'a pas, ou un article sans nomenclature, garde sa propre famille (BO-03-03-17).
j.m19-emplacement-promotions=Emplacement des lignes de promotion
j.m19-emplacement-promotions-aide=Où le ticket imprime les promotions du moteur : LINE sous l'article concerné, FOOTER regroupées au pied du ticket, ENGINE selon l'emplacement porté par chaque avantage (sous l'article quand le moteur le demande, au pied sinon). Valeur inconnue : ENGINE (BO-03-03-23).
j.m19-attributs-facture=Attributs article imprimés sur la facture
j.m19-attributs-facture-aide=Codes des attributs article imprimés sous chaque ligne de la facture et du bon de livraison, séparés par des points-virgules (ex. ORIGINE;CATEGORIE;VARIETE). Chaque attribut s'imprime sous la forme « libellé : valeur », un attribut sans valeur pour l'article est omis. Ces attributs ne sont jamais imprimés sur le ticket de caisse. Vide : seule la famille de l'article est rappelée (BO-03-03-21).
j.m19-lignes-page-a4=Lignes articles par page A4
j.m19-lignes-page-a4-aide=Nombre de lignes articles d'une page de facture A4 : au-delà, le document passe sur une nouvelle page, chaque page reprenant l'entête et la mention « page X / Y ». 0 : une seule page (BO-03-03-02).
j.m19-compte-client-obligatoire=Numéro de compte client obligatoire
j.m19-compte-client-obligatoire-aide=Une facture ou un bon de livraison ne peut être émis que pour un client portant un numéro de compte client, imprimé dans le bloc client du document. Désactivé : le numéro s'imprime quand le client en a un (BO-03-04-16).
j.m19-validation-client=Validation des données client avant impression
j.m19-validation-client-aide=Après la sélection du client, la caisse affiche ses données (adresse, SIRET, TVA, NIF, compte) pour que l'hôte de caisse les valide ou les modifie avant l'impression du document. Désactivé : le document s'affiche directement, sans étape de validation (BO-03-04-18).
j.m19-message-fid-2-lignes=Message avantage fidélité 2 lignes
j.m19-message-fid-2-lignes-aide=Le message court (2 lignes) transmis par le programme de fidélité s'imprime dans la zone avantage carte, avant la liste des avantages de la transaction. Désactivé : il n'est pas imprimé (BO-03-03-26).
j.m19-messages-commerciaux-fid=Messages commerciaux fidélité 10 lignes
j.m19-messages-commerciaux-fid-aide=Nombre maximal de messages commerciaux (10 lignes chacun) transmis par le programme de fidélité imprimés en fin de section fidélité du ticket, de 0 à 5. 0 : aucun message commercial n'est imprimé (BO-03-03-27).
j.m19-documents-toujours-imprimes-aide=Documents imprimés d'office quel que soit le choix du caissier, séparés par des points-virgules : TICKET, CARTE, BON, AVOIR, FID, ENLEVEMENT, RETOUR, ACOMPTE, CARTE_PREPAYEE (justificatif de paiement par carte cadeau ou prépayée), DEMAT (ticket d'activation d'un produit dématérialisé). TICKET, CARTE et BON complètent le choix du caissier. Les autres documents, y compris l'avoir de remboursement et les deux parcours d'acompte, sortent seulement s'ils sont nommés ici lorsque le choix d'impression est activé. Vide : aucun document associé ne sort. Choix d'impression désactivé : impression habituelle. Les copies client restent disponibles par email même sans papier (LC-08-03-07, BO-03-03-01).
j.m19-atcud-aide=Code de validation attribué par l'administration fiscale à chaque série de documents de la caisse, sous la forme TYPE:CODE séparés par des points-virgules (ex. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). L'ATCUD imprimé est le code, un tiret, puis le rang du document dans sa série. Administrable par caisse, chaque caisse ayant ses propres séries. Un code de moins de 8 caractères n'est pas un code de l'administration et vaut absence de code. Type sans code : ATCUD « 0-rang » (LC-08-04-23, BO-03-04-27).
j.m19-documents-imprimables=Documents imprimables en caisse
j.m19-ticket-en-attente=Ticket en attente
j.m19-doc-obligatoires=Le code et le nom du document sont obligatoires.
j.m19-nature-inconnue=Nature de document inconnue.
j.m19-document-cree=Document créé.
j.m19-document-enregistre=Document enregistré.
j.m19-document-inconnu=Document inconnu.
j.m19-document-active=Document activé : il est proposé en caisse.
j.m19-document-desactive=Document désactivé : il n'est plus proposé en caisse.
j.m19-document-deja-imprime=Document déjà imprimé en caisse : il est désactivé et non supprimé.
j.m19-document-supprime=Document supprimé.
t.documents-imprimables-en-caisse=Documents imprimables en caisse
t.les-documents-proposes-en-caisse-sur-un-ticket=Les documents proposés en caisse sur un ticket clôturé : leur nom imprimé, leur nature, le gabarit qui assemble leurs zones et leur imprimante. Activé, un document est disponible en caisse au prochain tirage du référentiel.
t.creer-ou-modifier-un-document=Créer ou modifier un document
t.le-code-identifie-le-document-le-reutiliser=Le code identifie le document : le réutiliser modifie le document existant.
t.nom-imprime=Nom imprimé
t.mise-en-page-de-la-caisse=Mise en page de la caisse
