j.mot-de-passe-modifie-reconnectez-vous=Mot de passe modifié. Reconnectez-vous.
j.motif-de-reconnaissance-en-expression-reguliere=Motif de reconnaissance, en expression régulière, du code-barres d'une transaction qbusting (panier constitué dans la file d'attente) : scanné en caisse, il charge le panier déposé sur le nœud magasin. Vide : aucune transaction qbusting reconnue (BO-03-06-57).
j.motifs-d-abandon=Motifs d'abandon
j.motifs-de-demande-de-service=Motifs de demande de service
j.motifs-de-depense=Motifs de dépense
j.motifs-de-redemarrage=Motifs de redémarrage
j.motifs-de-retour=Motifs de retour
j.motifs-proposes-au-caissier-lors-d-un=Motifs proposés au caissier lors d'un retour, séparés par des points-virgules. Le motif choisi s'applique à tout le retour, est journalisé et imprimé sur le ticket de retour (exploitable dans les rapports BackOffice). Vide : la saisie du motif n'est pas demandée (LC-05-05-01/02).
j.motifs-proposes-au-caissier-pour-abandonner-un=Motifs proposés au caissier pour abandonner un ticket, séparés par des points-virgules. Le motif choisi est journalisé et imprimé sur le ticket d'abandon. Vide : la saisie du motif n'est pas demandée (LC-04-04-10).
j.motifs-proposes-au-caissier-pour-une-depense=Motifs proposés au caissier pour une DÉPENSE payée sur le tiroir, séparés par des points-virgules ; le motif est obligatoire, un motif manquant refuse la dépense. La liste ne mélange plus les motifs de prélèvement et d'apport, qui ont leurs propres écrans (BO-04-01-44).
j.motifs-proposes-a-l-ecran-d-appel=Motifs proposés à l'écran d'appel superviseur, séparés par des points-virgules — liste administrée au lieu des quatre boutons figés (EXP-84).
j.motifs-proposes-separes-par-des-points-virgules=Motifs proposés, séparés par des points-virgules. Vide : motifs traduits fournis par la caisse (LC-13-03-04).
