j.une-carte-reconnue-par-la-plage-des=Une carte reconnue par la plage des cartes de fidélité n'est acceptée que si son dernier chiffre est la clé de Luhn des précédents, quelle que soit sa longueur (19 chiffres compris). Désactivé : la plage seule décide, comme avant (BO-03-06-54).
j.une-commande-porte-deja-le-code=Une commande porte déjà le code
j.une-demande-de-service-tranchee-deja-traitee=Une demande de service tranchée — déjà traitée en caisse, renvoyée en caisse ou refusée — reste affichée sur le tableau de bord, clairement marquée, jusqu'à son acquittement. Désactivé : elle disparaît de la liste dès qu'elle est tranchée (BO-04-02-03/-04/-05).
j.une-image-neuve-demande-un-fichier=Une image neuve demande un fichier.
j.une-ligne-de-cumul-des-remises-immediates=Une ligne de cumul des remises immédiates — remises de ligne et remise ticket — sort sous les totaux. Désactivé : aucune ligne de cumul (BO-03-03-24).
j.une-ligne-du-flux-client-en-compte=Une ligne du flux client en compte dont la rue, le code postal ou la ville manque est REJETÉE et nommée dans le compte rendu d'import, le reste du fichier étant intégré. Désactivé — le défaut — la ligne est intégrée avec l'adresse qu'elle porte (BO-10-08-27).
j.une-periode-est-deja-ouverte=Une période est déjà ouverte.
j.une-remise-ou-un-discount-ligne-ou=Une remise ou un discount (ligne ou ticket) exige un aval superviseur. Désactivé : le caissier applique seul (EXP-32).
j.une-remise-ou-un-rabais-saisi-librement=Une remise ou un rabais saisi librement s'applique sur un article qui porte déjà une remise manuelle ou une promotion automatique. Désactivé : le geste est refusé sur cette ligne. Une touche prédéfinie portant CUMUL passe outre ce défaut (BO-03-07-11).
j.une-regle-par-ligne-path-pay-bloque=Une règle par ligne : path:/pay bloque le paiement ; path:/action/discount/* bloque toutes les actions de remise ; key: suivi d'un identifiant du rapport d'utilisation des touches bloque cette touche précise. Les touches restent visibles et expliquent leur refus. Vide : aucun blocage supplémentaire. La sortie de formation reste accessible ; les interdictions de produire des opérations réelles restent prioritaires (LC-13-05-04).
