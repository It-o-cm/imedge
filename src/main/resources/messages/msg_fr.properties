j.heure-a-partir-de-laquelle-une-vente=Heure à partir de laquelle une vente est rattachée à la journée comptable suivante. 0 : la journée comptable est la journée civile. S'applique conjointement aux flux chiffre d'affaires et livre de caisse (BO-11-01-05).
