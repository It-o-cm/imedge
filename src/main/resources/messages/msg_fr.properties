j.somme-de-controle-crc-du-logiciel-legal=Somme de contrôle (CRC) du logiciel légal de la balance, telle que la déclare son certificat, affichée par la touche MÉTROLOGIE de l'écran de maintenance pour comparaison avec celle de la balance. Administrable par caisse, le modèle de balance pouvant varier d'une caisse à l'autre. Vide : « non renseigné » (LC-14-03-01).
