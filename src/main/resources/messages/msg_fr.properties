j.sur-l-ecran-de-vente-la-touche=Sur l'écran de vente, la touche entrée frappée SANS RIEN DE TAPÉ ouvre le règlement. Désactivé — le défaut — elle ne fait rien, ce qu'elle a toujours fait : un code tapé est validé par elle dans les deux cas (BO-10-02-13).
j.sur-un-ticket-melant-ventes-et-retours=Sur un ticket mêlant ventes et retours, le détail des articles retournés et de leurs recalculs s'imprime sur un ticket séparé, le ticket principal n'en portant que la valeur. Désactivé : les retours sont détaillés sur le ticket principal (LC-05-07-02).
j.sur-un-ticket-sans-carte-la-caisse=Sur un ticket sans carte, la caisse demande à imfid ce que le client aurait gagné avec la carte et l'imprime (imfid réponse C). Désactivé : rien n'est demandé ni imprimé pour un ticket sans carte (BO-03-03-28).
j.symbole-accole-aux-montants-imprimes-sur-les=Symbole accolé aux montants imprimés sur les documents de caisse — E, EUR, € selon ce que l'imprimante sait sortir. Vide : les montants sont imprimés nus (BO-10-07-05).
