j.active-la-touche-monnayeur-regle-les-especes=Activé : la touche MONNAYEUR règle les espèces sur le monnayeur, qui rend la monnaie ; le montant inséré s'affiche sur les deux visus, l'espèce est prélevée vers le coffre à la fin de la vente, et les seuils signalés par le monnayeur sont annoncés à l'ouverture et après chaque vente (LC-07-15-01 à -04, LC-13-01-01).
j.active-palier-le-plus-proche-desactive-palier=Activé : palier le plus proche ; désactivé : palier supérieur. Aucun don négatif n'est ajouté (LC-07-17-02).
j.active-pas-de-coupe-avant-le-ticket=Activé : pas de coupe avant le ticket client Verifone ; le ticket commerçant reste séparé et n'est pas archivé (LC-07-04-11).
j.adresse-de-base-du-service-fidelite-appele=Adresse de base du service fidélité appelé pour valoriser le panier avec les avantages fid, projeter la cagnotte et envoyer les transactions. Vide : la propriété de déploiement pos.fid.url s'applique (BO-11-04-04).
