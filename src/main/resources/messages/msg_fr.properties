j.prix-applique-aux-articles-d-un-devis=Prix appliqué aux articles d'un devis, d'une commande ou d'un bon de vente rappelé en caisse : DOCUMENT (le prix mentionné dans le document, défaut) ou CAISSE (le prix courant de l'article dans la base de la caisse ; un article inconnu de la caisse garde le prix du document). Une valeur inconnue retombe sur DOCUMENT (LC-06-02-08, LC-06-02-12).
j.prix-au-detail=Prix au détail
j.prix-des-articles-d-un-document-rappele=Prix des articles d'un document rappelé
