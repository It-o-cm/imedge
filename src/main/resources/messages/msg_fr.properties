j.commandes-e-commerce=Commandes e-commerce
j.e-commerce=E-commerce
j.mobilite=Mobilité
j.commande-integree=Commande intégrée
j.article-en-vente-interdite=Article en vente interdite
j.moyen-de-paiement-par-defaut-inconnu-de-l-encaissement=Moyen de paiement par défaut inconnu de l'encaissement
j.operateur-d-integration-inconnu=Opérateur d'intégration inconnu
j.aucun-point-de-vente-sur-le-noeud-magasin=Aucun point de vente sur le nœud magasin
j.e-commerce-non-active-sur-ce-point-de-vente=E-commerce non activé sur ce point de vente
j.canaux-externes=CANAUX EXTERNES
j.e-commerce-activation=E-commerce : activation
j.le-point-de-vente-integre-les-commandes=Le point de vente intègre les commandes e-commerce validées : le nœud magasin accepte leur dépôt, les enregistre comme transactions du magasin et la caisse reprend les paniers e-commerce. Désactivé : toute commande e-commerce est refusée (BO-10-01-01).
j.e-commerce-prix-des-articles=E-commerce : prix des articles
j.prix-retenu-pour-les-articles-d-un=Prix retenu pour les articles d'un panier e-commerce : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix de la transaction) ou TRANSACTION (le prix de la transaction). Vide : la règle des documents rappelés s'applique (BO-10-01-07).
j.e-commerce-articles-en-vente-interdite=E-commerce : articles en vente interdite
j.integration-d-une-commande-e-commerce-portant=Intégration d'une commande e-commerce portant un article en vente interdite : ACCEPT (intégrée, l'article signalé au compte rendu) ou REJECT (rejetée en entier, rien n'est enregistré ; le compte rendu nomme l'article) (BO-10-01-14).
j.e-commerce-ean-generique-des-articles-inconnus=E-commerce : EAN générique des articles inconnus
j.ean-qui-porte-sans-bloquer-l-integration=EAN qui porte, sans bloquer l'intégration, un article d'une commande e-commerce que la base du point de vente ne connaît pas : la ligne garde son libellé, marqué « ART. INCONNU » avec le code d'origine, sur le ticket et au compte rendu d'intégration. Vide : la ligne garde son propre code, le compte rendu la signale toujours (BO-10-01-06).
j.e-commerce-canal-promotion=E-commerce : canal promotion
j.canal-transmis-au-moteur-de-promotion-avantage=Canal transmis au moteur de promotion (avantage carte et remise immédiate) pour les paniers e-commerce repris en caisse : POINT_OF_SALE (point de vente), WEB ou OTHER (autre). Vide : aucun canal n'est transmis et la requête reste identique à l'octet près (BO-10-01-13).
j.e-commerce-ilot-de-rattachement=E-commerce : îlot de rattachement
j.code-de-l-ilot-auquel-la-caisse=Code de l'îlot auquel la caisse virtuelle e-commerce est rattachée : le chiffre d'affaires des transactions e-commerce y est affecté et ses règles (flux, états par îlot) s'y appliquent. Vide : la caisse virtuelle n'est rattachée à aucun îlot (BO-10-01-08).
j.e-commerce-caisse-virtuelle=E-commerce : caisse virtuelle
j.identifiant-de-la-caisse-virtuelle-sur-laquelle=Identifiant de la caisse virtuelle sur laquelle le nœud magasin enregistre les transactions e-commerce intégrées ; le numéro de ticket est cet identifiant suivi de la référence de la commande (BO-10-01-08).
j.e-commerce-operateur-d-integration=E-commerce : opérateur d'intégration
j.identifiant-de-l-employe-au-nom-duquel=Identifiant de l'employé au nom duquel les transactions e-commerce sont enregistrées dans l'encaissement ; un identifiant inconnu fait rejeter l'intégration, motif au compte rendu (BO-10-01-03).
j.e-commerce-moyen-de-paiement-par-defaut=E-commerce : moyen de paiement par défaut
j.code-du-moyen-de-paiement-cash-card=Code du moyen de paiement (CASH, CARD, CHEQUE, TR, VOUCHER…) sous lequel une commande e-commerce réglée par un moyen inconnu de l'encaissement est intégrée ; le compte rendu signale la substitution (BO-10-01-09).
j.e-commerce-archivage-des-commandes-d-origine=E-commerce : archivage des commandes d'origine
j.la-commande-e-commerce-telle-que-la=La commande e-commerce telle que la plateforme l'a envoyée est archivée avec son compte rendu, pour l'analyse support (écran Commandes e-commerce). Désactivé : seul le compte rendu est gardé (BO-10-01-11).
j.e-commerce-duree-d-archivage-jours=E-commerce : durée d'archivage (jours)
j.au-dela-de-ce-nombre-de-jours=Au-delà de ce nombre de jours, la purge de fin de période supprime les commandes e-commerce archivées. 0 : conservées sans limite (BO-10-01-11).
j.e-commerce-types-de-retour-ticket-autorises=E-commerce : types de retour ticket autorisés
j.types-de-retour-libelles-de-la-liste=Types de retour (libellés de la liste des types de retour, séparés par « ; ») autorisés pour le retour du ticket entier d'une transaction e-commerce ; un autre type, ou aucun type, est refusé. Vide : tout retour est autorisé (BO-10-01-04).
j.e-commerce-types-de-retour-article-autorises=E-commerce : types de retour article autorisés
j.types-de-retour-libelles-separes-par-autorises=Types de retour (libellés séparés par « ; ») autorisés pour le retour d'une partie des articles d'une transaction e-commerce ; un autre type, ou aucun type, est refusé. Vide : tout retour est autorisé (BO-10-01-05).
j.selfscanning-activation=Selfscanning : activation
j.le-self-scanning-est-ouvert-sur-ce=Le self scanning est ouvert sur ce point de vente : la caisse récupère et contrôle les paniers des appareils de selfscanning. Désactivé : tout panier selfscanning est refusé avec un message (BO-10-01-15).
j.selfscanning-mode-de-recuperation=Selfscanning : mode de récupération
j.comment-la-caisse-recupere-un-panier-selfscanning=Comment la caisse récupère un panier selfscanning : SCAN (lecture de son code-barres), KEYED (saisie de son code à l'écran RAPPEL) ou BOTH (les deux) (BO-10-01-16).
j.selfscanning-ajout-d-articles-en-caisse=Selfscanning : ajout d'articles en caisse
j.quand-le-caissier-peut-saisir-des-articles=Quand le caissier peut saisir des articles autour de la récupération d'un panier selfscanning : BEFORE (avant seulement), AFTER (après seulement), BOTH (avant et après) ou NONE (ni avant ni après) (BO-10-01-17).
j.selfscanning-identifiant-de-reprise=Selfscanning : identifiant de reprise
j.ce-qui-identifie-le-panier-selfscanning-a=Ce qui identifie le panier selfscanning à reprendre : TRANSACTION (le code-barres de la transaction) ou CUSTOMER (le numéro de client, saisi à l'écran RAPPEL : la caisse reprend le dernier panier de ce client) (BO-10-01-18).
j.selfscanning-prix-des-articles=Selfscanning : prix des articles
j.prix-retenu-pour-les-articles-d-un-panier=Prix retenu pour les articles d'un panier selfscanning : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix de la transaction) ou TRANSACTION (le prix de la transaction). Vide : la règle des documents rappelés s'applique (BO-10-01-19).
j.selfscanning-coupons-du-panier=Selfscanning : coupons du panier
j.les-coupons-et-bons-d-achat-scannes=Les coupons et bons d'achat scannés dans un panier selfscanning sont acceptés et repris en caisse comme règlements. Désactivé : ils ne sont pas repris et la caisse le signale (BO-10-01-20).
j.selfscanning-ean-generique-des-articles-inconnus=Selfscanning : EAN générique des articles inconnus
j.ean-qui-porte-sans-bloquer-la-reprise=EAN qui porte, sans bloquer la reprise, un article d'un panier selfscanning que la base du point de vente ne connaît pas : la ligne garde son libellé, marqué « ART. INCONNU » avec le code d'origine, à l'écran et sur le ticket. Vide : la ligne garde son propre code, sans marque (BO-10-01-21).
j.selfscanning-canal-promotion=Selfscanning : canal promotion
j.canal-transmis-au-moteur-de-promotion-avantage-carte=Canal transmis au moteur de promotion (avantage carte et remise immédiate) pour les paniers selfscanning : POINT_OF_SALE (point de vente), WEB ou OTHER (autre). Vide : aucun canal n'est transmis et la requête reste identique à l'octet près (BO-10-01-22).
j.selfscanning-articles-en-vente-interdite=Selfscanning : articles en vente interdite
j.integration-d-un-panier-selfscanning-portant-un=Intégration d'un panier selfscanning portant un article en vente interdite : ACCEPT (intégré comme les autres) ou REJECT (rejeté en entier ; la caisse affiche le libellé, le code et le message de l'article, et ne charge rien) (BO-10-01-23).
j.gestion-commerciale-articles-en-vente-interdite=Gestion commerciale : articles en vente interdite
j.integration-d-une-commande-d-un-devis=Intégration d'une commande, d'un devis ou d'un bon de vente de la gestion commerciale portant un article en vente interdite : ACCEPT (intégré comme les autres) ou REJECT (rejeté en entier ; la caisse affiche le libellé, le code et le message de l'article, et ne charge rien) (BO-10-01-24).
j.gestion-commerciale-mode-de-recuperation=Gestion commerciale : mode de récupération
j.comment-la-caisse-recupere-une-commande-ou=Comment la caisse récupère une commande ou un devis de la gestion commerciale : SCAN (lecture de son code-barres), KEYED (saisie de son code à l'écran RAPPEL) ou BOTH (les deux) (BO-10-01-25).
j.gestion-commerciale-transmission-des-commandes=Gestion commerciale : transmission des commandes
j.sens-et-mecanisme-d-echange-des-commandes=Sens et mécanisme d'échange des commandes et devis : PUSH (la gestion commerciale les dépose sur le nœud magasin, POST /api/orders) ou PULL (le nœud magasin les tire lui-même à l'adresse et à la fréquence ci-dessous) (BO-10-01-25).
j.gestion-commerciale-adresse-de-tirage=Gestion commerciale : adresse de tirage
j.adresse-http-que-le-n-ud-magasin=Adresse HTTP que le nœud magasin interroge en mode PULL ; elle répond la liste JSON des documents dans la forme du dépôt. Vide : aucun tirage (BO-10-01-25).
j.gestion-commerciale-frequence-de-tirage-minutes=Gestion commerciale : fréquence de tirage (minutes)
j.intervalle-entre-deux-tirages-des-commandes-en=Intervalle entre deux tirages des commandes en mode PULL ; 0 vaut une minute (BO-10-01-25).
j.gestion-commerciale-document-imprime-a-l-encaissement=Gestion commerciale : document imprimé à l'encaissement
j.code-du-modele-de-document-ecran-modeles=Code du modèle de document (écran Modèles de documents) imprimé automatiquement après l'encaissement d'une commande ou d'un devis de la gestion commerciale. Vide : aucun document de plus (BO-10-01-26).
j.gestion-commerciale-moyen-de-paiement-des-acomptes=Gestion commerciale : moyen de paiement des acomptes
j.code-du-moyen-de-paiement-cash-card-cheque=Code du moyen de paiement (CASH, CARD, CHEQUE…) sous lequel l'acompte perçu en caisse sur une commande ou un devis est enregistré ; seul un acompte en espèces entre dans le tiroir. Vide : espèces (BO-10-01-27).
j.gestion-commerciale-canal-promotion=Gestion commerciale : canal promotion
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et=Canal transmis au moteur de promotion (avantage carte et remise immédiate) pour les commandes, devis et bons de vente de la gestion commerciale : POINT_OF_SALE (point de vente), WEB ou OTHER (autre). Vide : aucun canal n'est transmis et la requête reste identique à l'octet près (BO-10-01-28).
j.gestion-commerciale-prix-des-articles=Gestion commerciale : prix des articles
j.prix-retenu-pour-les-articles-d-une=Prix retenu pour les articles d'une commande ou d'un devis de la gestion commerciale : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix de la commande) ou TRANSACTION (le prix de la commande). Vide : la règle des documents rappelés s'applique (BO-10-01-29).
j.qbusting-mode-de-recuperation=Qbusting : mode de récupération
j.comment-la-caisse-recupere-un-panier-qbusting=Comment la caisse récupère un panier qbusting : SCAN (lecture de son code-barres), KEYED (saisie de son code à l'écran RAPPEL) ou BOTH (les deux) (BO-10-01-30).
j.qbusting-canal-promotion=Qbusting : canal promotion
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise=Canal transmis au moteur de promotion (avantage carte et remise immédiate) pour les paniers qbusting : POINT_OF_SALE (point de vente), WEB ou OTHER (autre). Vide : aucun canal n'est transmis et la requête reste identique à l'octet près (BO-10-01-31).
j.qbusting-articles-en-vente-interdite=Qbusting : articles en vente interdite
j.integration-d-une-transaction-qbusting-portant-un=Intégration d'une transaction qbusting portant un article en vente interdite : ACCEPT (intégré comme les autres) ou REJECT (rejeté en entier ; la caisse affiche le libellé, le code et le message de l'article, et ne charge rien) (BO-10-01-32).
j.qbusting-prix-des-articles=Qbusting : prix des articles
j.prix-retenu-pour-les-articles-d-un-panier-qbusting=Prix retenu pour les articles d'un panier qbusting : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix de la transaction) ou TRANSACTION (le prix de la transaction). Vide : la règle des documents rappelés s'applique (BO-10-01-33).
j.mobilite-canal-promotion=Mobilité : canal promotion
j.canal-transmis-au-moteur-de-promotion-avantage-carte-et-remise-immediate=Canal transmis au moteur de promotion (avantage carte et remise immédiate) pour les transactions mobilité : POINT_OF_SALE (point de vente), WEB ou OTHER (autre). Vide : aucun canal n'est transmis et la requête reste identique à l'octet près (BO-10-01-34).
j.mobilite-prix-des-articles=Mobilité : prix des articles
j.prix-retenu-pour-les-articles-d-un-panier-mobilite=Prix retenu pour les articles d'un panier mobilité : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix de la transaction) ou TRANSACTION (le prix de la transaction). Vide : la règle des documents rappelés s'applique (BO-10-01-36).
j.mobilite-articles-en-vente-interdite=Mobilité : articles en vente interdite
j.integration-d-une-transaction-mobilite-portant-un=Intégration d'une transaction mobilité portant un article en vente interdite : ACCEPT (intégré comme les autres) ou REJECT (rejeté en entier ; la caisse affiche le libellé, le code et le message de l'article, et ne charge rien) (BO-10-01-37).
j.mobilite-moyen-de-paiement-complementaire=Mobilité : moyen de paiement complémentaire
j.code-du-moyen-de-paiement-ajoute-a=Code du moyen de paiement ajouté à l'intégration d'une transaction mobilité dont le total payé est inférieur au total du ticket (promotion déclenchée en mobilité mais pas à l'encaissement), pour la différence. Vide : la différence reste due en caisse (BO-10-01-39).
j.bon-de-vente-mode-de-recuperation=Bon de vente : mode de récupération
j.comment-la-caisse-recupere-un-bon-de=Comment la caisse récupère un bon de vente — valable le jour même seulement, son numéro étant réinitialisé chaque jour : SCAN (lecture de son code-barres), KEYED (saisie de son code à l'écran RAPPEL) ou BOTH (les deux) (BO-10-01-40).
j.bon-de-vente-prix-des-articles=Bon de vente : prix des articles
j.prix-retenu-pour-les-articles-d-un-bon=Prix retenu pour les articles d'un bon de vente : POS (le prix courant de la base du point de vente ; un article inconnu garde le prix du bon de vente) ou TRANSACTION (le prix du bon de vente). Vide : la règle des documents rappelés s'applique (BO-10-01-41).

