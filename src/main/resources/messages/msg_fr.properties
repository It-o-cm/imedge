t.export-saf-t=Export SAF-T
t.documents-fiscaux-portugais-emis-par-les-caisses=Documents fiscaux portugais émis par les caisses et fichier d'audit SAF-T de la période
t.n-de-certification-fiscale=N° de certification fiscale
t.non-renseigne=non renseigné
t.exporter-le-fichier-saf-t=Exporter le fichier SAF-T
t.aucun-document-fiscal-sur-la-periode=Aucun document fiscal sur la période.
t.le-fichier-reprend-les-documents-tels-que-les-caisses=Le fichier reprend les documents tels que les caisses les ont numérotés, signés et imprimés.
j.identifiant-saf-t-de-la-fatura-simplificada=Identifiant SAF-T de la fatura simplificada (FS)
j.code-numerique-du-type-de-document-vente=Code numérique du type de document vente ticket portugais, porté par chaque FS émise et repris dans l'exportation SAF-T. Le préfixe FS reste celui du gabarit du document (BO-10-06-01).
j.identifiant-saf-t-de-la-nota-de=Identifiant SAF-T de la nota de crédito (NC)
j.code-numerique-du-type-de-document-avoir=Code numérique du type de document avoir portugais, porté par chaque NC émise et repris dans l'exportation SAF-T. Le préfixe NC reste celui du gabarit du document (BO-10-06-02).
j.attributs-article-portant-une-eco-taxe=Attributs article portant une éco-taxe
j.codes-des-attributs-dynamiques-article-dont-la=Codes des attributs dynamiques article dont la valeur est un montant d'éco-taxe unitaire, séparés par des points-virgules, sans limite de nombre. Chaque code peut être suivi de « =Libellé » (le libellé imprimé) et de « >NOPRINT » pour que cette éco-taxe ne soit pas imprimée sur le ticket ; elle reste totalisée sur les factures, bons de livraison et leurs extractions. Exemple : « DEEE=Eco DEEE;DEA=Eco mobilier;PILES;PNEUS>NOPRINT;EMB ». L'attribut ECO_TAX est toujours une éco-taxe imprimée, sauf s'il est listé avec >NOPRINT. Vide : seul ECO_TAX (BO-10-06-05, BO-10-06-06).
j.texte-cheque-des-unites-monetaires=Texte chèque des unités monétaires
j.mot-imprime-sur-le-cheque-apres-le=Mot imprimé sur le chèque après le montant des unités écrit en lettres, par exemple « Euro(s) ». Vide : le mot de la langue de la caisse, accordé au nombre (BO-10-07-05).
j.texte-cheque-des-centimes=Texte chèque des centimes
j.mot-imprime-sur-le-cheque-apres-les=Mot imprimé sur le chèque après les centimes écrits en lettres, par exemple « Cent(s) ». Vide : le mot de la langue de la caisse, accordé au nombre (BO-10-07-05).
j.logos-monetique-sur-le-ticket-monetique=Logos monétique sur le ticket monétique
j.le-ticket-monetique-sort-avec-ses-images=Le ticket monétique sort avec ses images : le logo monétique administré en tête de chaque ticket du terminal de paiement, et le logo sans contact sur celui d'un paiement sans contact, obligation légale. Les images sont celles de l'écran Images (usages « Logo monétique » et « Logo sans contact ») ; sans image administrée rien n'est ajouté. Désactivé : les trames du terminal sortent seules (BO-10-07-13).
j.sous-totaux-par-famille=Sous-totaux par famille
j.quand-les-articles-sont-imprimes-par-nomenclature=Quand les articles sont imprimés par nomenclature (ordre FAMILY), un sous-total de la famille est imprimé sous ses articles. Désactivé : les familles s'enchaînent sans sous-total (BO-10-07-15).
j.montants-en-gras=Montants en gras
j.les-montants-des-lignes-articles-des-sous=Les montants des lignes articles, des sous-totaux et du total à payer du ticket de caisse sont émis en gras, par la directive de mise en gras de l'imprimante, posée après cadrage. Désactivé : fonte courante (BO-10-07-15).
j.premiere-langue-de-la-visu-client=Première langue de la visu client
j.langue-principale-de-la-visu-client-independante=Langue principale de la visu client, indépendante de celle du caissier : fr, nl ou pt. La deuxième langue de la visu client s'affiche à côté d'elle. Vide ou inconnue : la langue de la caisse (BO-10-07-17).
j.message-caisse-ouverte-deuxieme-langue=Message caisse ouverte (deuxième langue)
j.traduction-du-message-caisse-ouverte-dans-la=Traduction du message caisse ouverte dans la deuxième langue de la visu client, affichée à côté du message principal quand la visu client est bilingue. Vide : le message principal seul (BO-10-07-17).
j.message-caisse-fermee-deuxieme-langue=Message caisse fermée (deuxième langue)
j.traduction-du-message-caisse-fermee-dans-la=Traduction du message caisse fermée dans la deuxième langue de la visu client, affichée à côté du message principal quand la visu client est bilingue. Vide : le message principal seul (BO-10-07-17).
j.apparence-caisse-en-mode-deconnecte=Apparence caisse en mode déconnecté
j.quand-la-caisse-ne-joint-plus-son=Quand la caisse ne joint plus son serveur magasin, en transaction ou hors transaction, l'écran caisse change d'apparence (fond d'écran et bandeau « MODE DÉCONNECTÉ ») au bout du délai ci-dessous, et reprend son apparence connectée dès que le serveur répond. Désactivé : apparence inchangée (BO-10-07-19).
j.delai-avant-l-apparence-deconnectee-secondes=Délai avant l'apparence déconnectée (secondes)
j.duree-pendant-laquelle-la-caisse-doit-rester=Durée pendant laquelle la caisse doit rester sans réponse du serveur magasin avant de prendre l'apparence déconnectée. 0 : dès la première perte de liaison ; une valeur négative vaut 0 (BO-10-07-19).
j.decimales-des-quantites-en-unite-de-mesure=Décimales des quantités en unité de mesure
j.nombre-de-decimales-affichees-et-imprimees-apres=Nombre de décimales affichées et imprimées après la virgule pour une quantité vendue à l'unité de mesure (mètre, litre…) qui n'est pas entière, de 0 à 4. Hors de cette plage : 2 (BO-10-08-28).
j.decimales-des-quantites-pesees=Décimales des quantités pesées
j.nombre-de-decimales-affichees-et-imprimees-apres-2=Nombre de décimales affichées et imprimées après la virgule pour un poids, de 0 à 4. Hors de cette plage : 3 (BO-10-08-28).
j.symbole-des-quantites-pesees=Symbole des quantités pesées
j.symbole-affiche-sur-la-visu-caisse-et=Symbole affiché sur la visu caisse et la visu client et imprimé sur les tickets à côté d'un poids et d'un prix au poids, par exemple kg ou KG. Vide : kg (BO-10-08-29).
j.lignes-annulees-sur-le-ticket=Lignes annulées sur le ticket
j.les-lignes-annulees-en-caisse-annulation-ligne=Les lignes annulées en caisse (annulation ligne ou annulation article) sont imprimées sur le ticket et sur le reçu de mise en attente, marquées ANNULÉ et hors des totaux. Désactivé : elles n'y figurent pas (BO-10-08-30).
j.articles-identiques-detailles-sur-le-ticket=Articles identiques détaillés sur le ticket
j.chaque-article-identique-saisi-plusieurs-fois-est=Chaque article identique saisi plusieurs fois est imprimé sur sa propre ligne, à l'unité. Désactivé, ce qui est l'optimisation par défaut : les articles identiques sortent regroupés sur une seule ligne portant la quantité (BO-10-08-31).
j.mode-d-arrondi-des-calculs=Mode d'arrondi des calculs
j.mode-d-arrondi-des-montants-calcules-ventilation=Mode d'arrondi des montants calculés (ventilation de TVA) : HALF_UP (au plus proche, défaut), HALF_EVEN, UP, DOWN, CEILING ou FLOOR. Une valeur inconnue retombe sur HALF_UP (BO-10-02-18).
j.unites-de-mesure=UNITÉS DE MESURE
j.calcul=CALCUL
j.export-saf-t=Export SAF-T
j.logo-monetique=Logo monétique
j.logo-sans-contact=Logo sans contact

