j.k19-def-ticket-header-template-label=Modèle d'entête de ticket
j.k19-def-ticket-header-template-hint=Code du gabarit Entête de ticket imprimé en tête des tickets de cette caisse, choisi parmi les gabarits administrés. Vide ou code inconnu : le premier gabarit d'entête actif, sinon le message d'entête (BO-03-09-02).
j.k19-def-ticket-footer-template-label=Modèle de pied de ticket
j.k19-def-ticket-footer-template-hint=Code du gabarit Pied de ticket imprimé au bas des tickets de cette caisse, choisi parmi les gabarits administrés. Vide ou code inconnu : le premier gabarit de pied actif, sinon le message de pied (BO-03-09-02).
j.k19-def-ticket-vat-table-label=Tableau TVA du ticket
j.k19-def-ticket-vat-table-hint=Modèle du tableau de TVA imprimé sur le ticket : NONE (aucun), COMBINED (combiné au ticket, sous le total), SEPARATE (séparé, sur un coupon à part après le ticket) ou AMOUNT_ONLY (uniquement le montant de la TVA). Vide : la ventilation TVA du ticket décide (BO-03-09-03).
j.k19-def-print-logo-code-label=Logo imprimé
j.k19-def-print-logo-code-hint=Code du logo de ticket imprimé en tête des documents de cette caisse, choisi parmi les logos importés dans la bibliothèque d'images. Vide ou code inconnu : le logo résolu pour le magasin (BO-03-09-04).
j.k19-def-menu-code-label=Menu caisse
j.k19-def-menu-code-hint=Code du menu caisse affiché par la caisse, choisi parmi les menus administrés. Posé sur l'îlot, il vaut pour ses caisses ; posé sur la caisse, il l'emporte sur celui de l'îlot ; posé au pays ou à l'enseigne, il en devient le menu par défaut. Vide : toutes les touches (BO-03-09-06, BO-03-10-09, BO-03-10-16, BO-03-10-18).
j.k19-def-queue-single-enabled-label=File unique activée
j.k19-def-queue-single-enabled-hint=La caisse affiche la touche FILE UNIQUE, qui permet à l'hôtesse de déclarer au système tiers de file unique que la caisse est disponible pour le client suivant ou non disponible. Désactivé : ni touche ni envoi (BO-03-09-10).
j.k19-def-queue-single-url-label=Adresse du système de file unique
j.k19-def-queue-single-url-hint=URL à laquelle la caisse publie son état de disponibilité : POST d'un corps JSON portant le terminal et l'état AVAILABLE ou UNAVAILABLE. Vide : l'état n'est pas publié (BO-03-09-10).
j.k19-def-hardware-drawer-enabled-label=Tiroir-caisse activé
j.k19-def-hardware-drawer-enabled-hint=Le pilote du tiroir-caisse est actif sur cette caisse : impulsions d'ouverture et lecture du capteur. Désactivé : aucune impulsion n'est envoyée et le tiroir est réputé fermé (BO-03-09-11).
j.k19-def-hardware-drawer-address-label=Adresse du tiroir-caisse
j.k19-def-hardware-drawer-address-hint=Adresse du pilote du tiroir transmise au module matériel : port d'entrée-sortie (par exemple 0x48F), port série (par exemple /dev/ttyS0) ou PRINTER pour un tiroir branché sur l'imprimante. Vide : l'adresse de lancement du module (BO-03-09-11).
j.k19-def-hardware-scanner-driver-label=Pilote du scanner
j.k19-def-hardware-scanner-driver-hint=Pilote de lecture du scanner : AUTO (découverte automatique), EVDEV (clavier HID), HIDRAW (HID POS) ou OPOS (pilote OPOS Datalogic, tenu par le module matériel). Une valeur inconnue retombe sur AUTO (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-name-patterns-label=Scanners reconnus
j.k19-def-hardware-scanner-name-patterns-hint=Fragments du nom des périphériques reconnus comme scanner, séparés par des points-virgules, par exemple datalogic;honeywell. Vide : la liste de déploiement de la caisse (BO-03-09-16, BO-03-09-17).
j.k19-def-hardware-scanner-opos-device-label=Périphérique OPOS du scanner
j.k19-def-hardware-scanner-opos-device-hint=Nom logique OPOS du scanner Datalogic transmis au module matériel quand le pilote est OPOS, par exemple DLS_Magellan. Vide : le périphérique par défaut du pilote (BO-03-09-17).
j.k19-def-hardware-scanner2-enabled-label=Second scanner activé
j.k19-def-hardware-scanner2-enabled-hint=Un second scanner, côté client, lit en même temps que le premier les cartes de fidélité et les coupons : ses lectures vont à la fidélité et aux bons, jamais aux articles. Désactivé : tous les scanners alimentent la vente (BO-03-09-18).
j.k19-def-hardware-scanner2-name-patterns-label=Second scanner : périphériques
j.k19-def-hardware-scanner2-name-patterns-hint=Fragments du nom des périphériques qui forment le second scanner, séparés par des points-virgules, par exemple zebra;client. Vide : aucun périphérique n'est désigné et le second scanner reste muet (BO-03-09-18).
j.k19-def-hardware-printer-type-label=Type d'imprimante
j.k19-def-hardware-printer-type-hint=Modèle de l'imprimante ticket transmis au pilote : ESCPOS (générique), EPSON_TM, WINCOR_TH, IBM_4610 ou TOSHIBA_TCX. Une valeur inconnue retombe sur ESCPOS (BO-03-09-21).
j.k19-def-hardware-printer-speed-label=Vitesse de l'imprimante (bauds)
j.k19-def-hardware-printer-speed-hint=Vitesse de communication de l'imprimante ticket transmise au pilote, en bauds (9600, 19200, 38400, 115200). 0 ou valeur négative : la vitesse du pilote (BO-03-09-21).
j.k19-def-hardware-printer-code-page-label=Page d'encodage de l'imprimante
j.k19-def-hardware-printer-code-page-hint=Page de code des caractères de l'imprimante ticket, par exemple 858 (Europe de l'Ouest avec l'euro), 850 ou 1252. 0 ou valeur négative : 858 (BO-03-09-21).
j.k19-def-hardware-printer-paper-width-label=Largeur du papier (mm)
j.k19-def-hardware-printer-paper-width-hint=Taille de page de l'imprimante ticket : 80 ou 58 millimètres. Toute autre valeur : 80 (BO-03-09-21).
j.k19-def-hardware-printer-cheque-flip-label=Retournement du chèque
j.k19-def-hardware-printer-cheque-flip-hint=L'imprimante retourne le chèque pour en imprimer le recto après la lecture de la ligne magnétique. Désactivé : le chèque n'est pas retourné (BO-03-09-21).
j.k19-def-printer2-enabled-label=Seconde imprimante activée
j.k19-def-printer2-enabled-hint=Une seconde imprimante est proposée à l'hôtesse pour imprimer un document hors du rouleau de caisse. Désactivé : seuls le rouleau et l'imprimante réseau de déploiement servent (BO-03-09-22).
j.k19-def-printer2-format-label=Format de la seconde imprimante
j.k19-def-printer2-format-hint=Format des documents sortis sur la seconde imprimante : A4 (page A4) ou TICKET (texte du rouleau). Une valeur inconnue retombe sur A4 (BO-03-09-22).
j.k19-def-printer2-connection-label=Raccordement de la seconde imprimante
j.k19-def-printer2-connection-hint=NETWORK (imprimante réseau, l'adresse est une URL) ou LOCAL (imprimante branchée sur la caisse et tenue par le module matériel, l'adresse est le nom de la file d'impression). Une valeur inconnue retombe sur NETWORK (BO-03-09-22).
j.k19-def-printer2-address-label=Adresse de la seconde imprimante
j.k19-def-printer2-address-hint=URL du service d'impression réseau, ou nom de la file d'impression locale. Vide : la seconde imprimante n'est pas utilisable (BO-03-09-22).
j.k19-def-payment-terminal-type-label=Type de monétique
j.k19-def-payment-terminal-type-hint=Monétique de cette caisse : VERIFONE (monétique centralisée), INGENICO_SIBS (Ingenico, Portugal, SIBS) ou WORLDLINE (Belgique). Vide : la monétique de déploiement. Pris en compte au démarrage de la caisse (BO-03-09-19).
j.k19-def-payment-terminal-address-label=Adresse de la monétique
j.k19-def-payment-terminal-address-hint=Adresse hôte:port du client monétique de cette caisse, par exemple 127.0.0.1:8200. Vide : l'adresse de déploiement (BO-03-09-19).
j.k19-def-terminal-island-label-label=Label monétique de l'îlot
j.k19-def-terminal-island-label-hint=Label d'îlot transmis dans les requêtes de la monétique centralisée Verifone sous le tag D7V ; il se pose sur l'îlot et vaut pour toutes ses caisses. Vide : aucun tag D7V (BO-03-09-29).
j.k19-def-catalina-enabled-label=Flux Catalina activé
j.k19-def-catalina-enabled-hint=Les tickets de vente de cette caisse, lignes articles et moyens de paiement, remontent en temps réel au serveur Catalina déclaré parmi les fournisseurs de service (protocole Catalina). Désactivé : rien n'est envoyé à Catalina (BO-03-09-20).
j.k19-def-export-planexa-enabled-label=Flux Planexa
j.k19-def-export-planexa-enabled-hint=Le magasin produit le fichier Planexa des transactions par caisse et par tranche horaire, base du planning des hôtesses ; les caisses des îlots exclus du flux Planexa n'y figurent pas (BO-03-10-06).
j.k19-section-menu-caisse=MENU CAISSE
j.k19-section-file-unique=FILE UNIQUE

