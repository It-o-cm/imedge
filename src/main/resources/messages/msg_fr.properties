j.dates-de-fermeture-ponctuelle-au-format-aaaa=Dates de fermeture ponctuelle au format AAAA-MM-JJ, séparées par « ; » (jours fériés, inventaire…). Traitées comme un jour non travaillé au même titre que les jours de fermeture hebdomadaire (R6). Vide : aucune fermeture exceptionnelle.
j.delai-de-fermeture-avant-la-fin-de=Délai de fermeture avant la fin de période (minutes)
