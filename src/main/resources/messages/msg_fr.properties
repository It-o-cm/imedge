j.rc3-parametre-01=Touches de remise prêtes à l'emploi, séparées par « ; ». Une entrée est un libellé, puis « > », puis PERCENT ou AMOUNT, « : » et la valeur ; ajouter « ,CUMUL » autorise cette remise sur un article déjà remisé ou en promotion. Exemple : « -20%>PERCENT:20 ; 2€ de moins>AMOUNT:2,CUMUL ». Vide : aucune touche prédéfinie, seule la saisie libre (BO-03-07-03, BO-03-07-06, BO-03-07-11).
j.rc3-parametre-02=Associations D16:code=MOYEN ou D46:code=MOYEN séparées par des points-virgules. D16 connu prime, puis D46 ; sinon CARD (LC-07-07-04).
j.rc3-parametre-03=Applications tierces atteignables depuis le poste, séparées par des points-virgules, sous la forme LIBELLÉ>URL (ex. Carte fidélité>https://fid.magasin/caisse). Une entrée mal formée est écartée. Vide : aucune application proposée (BO-03-09-27).
j.rc3-parametre-04=Identifiant du compte machine de la caisse auprès du service fidélité. Vide : la propriété de déploiement pos.fid.user s'applique. Le mot de passe se règle par le paramètre « Mot de passe du service fidélité » (BO-11-04-04, BO-10-03-08).
j.rc3-parametre-05=Aval superviseur : réaffectation d'un ticket
j.rc3-parametre-06=La réaffectation d'un ticket clôturé à un client fidélisé exige un aval superviseur (LC-03-06-01). Désactivé : le caissier réaffecte seul.
j.rc3-parametre-07=Duplicata PDV de la réaffectation
j.rc3-parametre-08=La réaffectation d'un ticket imprime aussi un duplicata pour le point de vente (LC-03-06-05). Désactivé : seul le ticket du client sort.
j.rc3-parametre-09=Correspondance entre la valeur faciale d'une pièce ou d'un billet et la valeur en euros d'un rouleau complet, séparées par des points-virgules, sous la forme FACIALE:VALEUR_ROULEAU — exemple 0.20:8.00;0.01:0.50. Sert au calcul croisé montant <-> nombre de rouleaux (LC-12-05-06/07). Vide : aucun calcul croisé n'est proposé.
j.rc3-parametre-10=Types de retours proposés en caisse en plus des deux gestes de base, séparés par des points-virgules. Un type s'écrit « Libellé », ou « Libellé>TICKET » pour un type qui ouvre un ticket de retour dédié au lieu de reprendre l'article dans la vente. Vide : seuls les deux gestes de base sont proposés (LC-05-04-01).
j.rc3-parametre-11=Chaque ligne du panier transmis au moteur de promotion porte le code de la famille de l'article et celui de sa sous-famille, pour que des avantages puissent être déclenchés à ce niveau ; le panier part tel quel au programme de fidélité, qui reçoit donc la sous-famille de chaque article (gestion article à la sous-famille, Intermarché France). Désactivé : la ligne ne porte que son code article (BO-10-03-19, BO-10-08-22).
j.rc3-parametre-12=Association d'un code de nœud de rang 0 à l'un des quatre secteurs FRAIS_TRAD, FRAIS_LS, SEC, NON_ALIMENTAIRE, sous la forme « code>SECTEUR » séparée par « ; » (R16). Les trois premiers forment le CA alimentaire.
j.rc3-parametre-13=Produit les trois fichiers de panel — Scannels, Scvenmag, Tlogextr — dans une archive unique MS.<PDV>.<jour>.zip (BO-11-01-19).
j.rc3-parametre-14=Demander les soldes des cagnottes
j.rc3-parametre-15=La caisse demande au programme de fidélité le solde de CHACUNE de ses cagnottes (FID Portugal), calculé avec les éléments de la transaction en cours : avantages fidélité du ticket et paiement fidélité déjà réglé. Les soldes sont affichés sur l'écran fidélité de la caisse et relus à la clôture du ticket. Désactivé — le défaut — seul le solde du compte est interrogé (BO-10-02-33).
j.rc3-parametre-16=Moyen de paiement du paiement fidélité
j.rc3-parametre-17=Clé du moyen de paiement sous lequel un règlement sur la cagnotte fidélité est enregistré sur le ticket, dans les états et dans les flux. Une clé inconnue retombe sur FIDELITY (BO-10-03-06).
j.rc3-parametre-18=Mot de passe du service fidélité
j.rc3-parametre-19=Mot de passe du compte machine de la caisse auprès du service fidélité, distribué aux caisses avec les autres paramètres et jamais réaffiché : un champ laissé vide conserve la valeur enregistrée. Vide : la propriété de déploiement pos.fid.password s'applique (BO-10-03-08).
j.rc3-parametre-20=Délai de connexion au service fidélité (ms)
j.rc3-parametre-21=Temps accordé à l'ouverture de la connexion vers le service fidélité, en millisecondes. Au-delà, la caisse affiche que la fidélité est indisponible et la vente continue sans elle. 0 : 1500 ms (BO-10-03-10).
j.rc3-parametre-22=Délai de réponse du service fidélité (ms)
j.rc3-parametre-23=Temps accordé au service fidélité pour répondre à un appel (cagnotte, avantages, recherche, paiement), en millisecondes. Au-delà, la caisse affiche que la fidélité est indisponible et la vente continue sans elle. 0 : 2500 ms (BO-10-03-10).
j.rc3-parametre-24=Envoyer la date de commande au moteur de promotion
j.rc3-parametre-25=Quand le ticket reprend une commande, le panier transmis au moteur de promotion — et, par lui, au programme de fidélité — porte la date de la commande, pour que les avantages acquis à cette date soient déclenchés, campagnes échues comprises. Désactivé — le défaut — seule la date du ticket est transmise (BO-10-03-17).
j.rc3-parametre-26=Cadence des rapports de nœud (secondes)
j.rc3-parametre-27=Intervalle entre deux rapports d'une caisse à son magasin et d'un magasin au central : version, état de mise à jour, périphériques, inventaire, intégrations, usage des fonctions. Lu au démarrage du nœud ; zéro ou moins : soixante secondes (BO-08-04-15, BO-08-04-16, BO-08-04-20, BO-08-03-01).
j.rc3-parametre-28=Comptage de l'usage des fonctions
j.rc3-parametre-29=Chaque fonction de caisse et chaque geste du back-office est compté par jour, par nœud et par fonction, puis remonté au central pour les statistiques. Désactivé : rien n'est compté (BO-08-02-02).
j.rc3-parametre-30=Les ordres de maintenance émis par le central ou le magasin (relance TPV, réinitialisation d'un périphérique, relance des référentiels, contrôle de mise à jour) sont exécutés par le nœud. Désactivé : le nœud les refuse, et le refus est tracé (BO-08-04-17).
j.rc3-parametre-31=Relance automatique des intégrations en erreur
j.rc3-parametre-32=Un fichier déposé dont l'intégration a échoué ou laissé des lignes rejetées est conservé et réintégré automatiquement à la cadence administrée. Désactivé : seule la relance manuelle de la console d'intégration le rejoue (BO-08-04-03, BO-08-04-04, BO-08-04-05, BO-08-04-06, BO-08-04-07, BO-08-04-08).
j.rc3-parametre-33=Délai entre deux relances d'intégration (minutes)
j.rc3-parametre-34=Temps minimal entre deux réintégrations automatiques d'un même dépôt en erreur. Zéro ou moins : dix minutes (BO-08-04-03, BO-08-04-08).
j.rc3-parametre-35=Nombre maximal de relances d'intégration
j.rc3-parametre-36=Au-delà, le dépôt est abandonné par la relance automatique et ne repart que par la relance manuelle. Zéro ou moins : cinq (BO-08-04-03, BO-08-04-09, BO-08-04-13).
j.rc3-parametre-37=Alertes caisses sur appareil mobile
j.rc3-parametre-38=Les alertes caisses (appels superviseur) s'affichent sur la page mobile du back-office, où un responsable les acquitte, les autorise ou les refuse à distance. Désactivé : la page mobile n'affiche aucune alerte (BO-10-08-02).
j.rc3-parametre-39=Mise à jour automatique au démarrage
j.rc3-parametre-40=Un nœud dont la version est inférieure à celle de son lot de déploiement se met à jour à son démarrage, même hors de la fenêtre du lot : la caisse ou le magasin saisonnier rattrape la version en s'allumant. Désactivé : il attend la prochaine fenêtre (BO-08-03-07).
j.rc3-parametre-41=Nombre de tentatives de mise à jour
j.rc3-parametre-42=Une mise à jour en échec est retentée automatiquement au rapport suivant du nœud, jusqu'à ce nombre ; au-delà, seul un forçage depuis la console de déploiement la relance. Zéro ou moins : trois (BO-08-04-01, BO-08-04-02).
