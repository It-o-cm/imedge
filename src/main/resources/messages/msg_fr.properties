j.promotions-echues-retention-jours=Promotions échues : rétention (jours)
j.proposer-le-ticket-par-e-mail-en=Proposer le ticket par e-mail en fin de vente
j.protocole-inconnu=Protocole inconnu.
j.prefixe-ajoute-devant-le-numero-de-ticket=Préfixe ajouté devant le numéro de ticket dans le code-barres imprimé en pied de ticket, pour que les portiques ou les bornes de jeux reconnaissent la plage qui leur est réservée. Vide : le code-barres porte le numéro de ticket seul, comme aujourd'hui (BO-03-06-55).
j.prefixe-du-code-barres-imprime-sur-le=Préfixe du code-barres imprimé sur le ticket
j.prefixe-du-code-barres-superviseur=Préfixe du code-barres superviseur
j.prefixe-imprime-devant-le-code-superviseur-sur=Préfixe imprimé devant le code superviseur sur son code-barres. Tant qu'il est posé, une identification superviseur n'est acceptée QUE d'un code préfixé : le code seul, qui se tape, ne vaut plus identification. Vide : le code superviseur suffit, comme avant (BO-10-02-32).
j.prefixes-des-bons-sogec=Préfixes des bons SOGEC
j.prefixes-reconnaissant-un-bon-sogec-separes-par=Préfixes reconnaissant un bon SOGEC, séparés par des points-virgules ; un code portant l'un d'eux part dans le circuit de compensation SOGEC au lieu du coupon GS1 générique. Vide : aucun bon SOGEC reconnu (EXP-58).
