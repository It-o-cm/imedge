j.ouvre-la-proposition-d-envoi-apres-la=Ouvre la proposition d'envoi après la clôture d'une vente, sans envoyer automatiquement de message : l'email part vers l'adresse choisie en caisse. Désactivé : aucune proposition en fin de vente (LC-08-02-05, BO-10-07-22).
j.ou-l-eco-participation-des-articles-qui=Où l'éco-participation des articles qui en portent une est imprimée sur le ticket : NONE (nulle part, défaut), LINE (sous chaque article concerné) ou TOTAL (une seule ligne, sous la ventilation de TVA). Une valeur inconnue retombe sur NONE (BO-10-06-06).
j.ou-le-nombre-d-articles-de-la=Où le nombre d'articles de la vente est imprimé : NONE (nulle part, défaut), TOTAL_LINE (entre parenthèses sur la ligne du total à payer) ou OWN_LINE (sur une ligne à lui, sous le total). Une valeur inconnue retombe sur NONE (BO-10-07-10).
j.ou-sortent-les-lignes-portant-l-attribut=Où sortent les lignes portant l'attribut de tri : NONE (tri seul, défaut), START (isolées en début de ticket) ou END (isolées en fin). Une valeur inconnue retombe sur NONE (BO-03-03-18).
j.pain-complet-500g=PAIN COMPLET 500G
j.pdv-a-renommer-introuvable=PDV à renommer introuvable.
j.per-op-l-aval-vaut-pour-un=PER_OP : l'aval vaut pour un seul geste (défaut). PER_TICKET : une fois donné, l'aval reste attaché au ticket jusqu'à la touche FIN SUPERVISEUR ou la fin du ticket (EXP-33).
