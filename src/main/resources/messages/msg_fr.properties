j.creation=Création
j.creation-de-compte-client-interdite-par-le=Création de compte client interdite par le paramétrage.
j.credit-client-autorise-en-mode-degrade=Crédit client autorisé en mode dégradé
j.cumul-sur-un-article-deja-remise=Cumul sur un article déjà remisé
j.cote-du-montant-ou-le-symbole-est=Côté du montant où le symbole est imprimé : RIGHT (après le montant, défaut) ou LEFT (avant). Une valeur inconnue retombe sur RIGHT (BO-10-07-06).
j.demande-de-monnaie=DEMANDE DE MONNAIE
j.devis-et-commandes=DEVIS ET COMMANDES
j.date-s-n=Date   : %s%n
j.date=Date :
j.date-d-echeance-dans-les-extractions-de=Date d'échéance dans les extractions de factures
j.date-d-effet-invalide-attendu-aaaa-mm=Date d'effet invalide (attendu AAAA-MM-JJ).
j.date-de-fin-d-annee=Date de fin d'année
