j.ce-que-fait-la-caisse-au-bout=Ce que fait la caisse au bout du délai d'inactivité : LOCK (verrouillage — l'opérateur reste en poste et reprend sa vente avec son seul code, défaut) ou CLOSE (fermeture de la session de travail — l'opérateur est déconnecté et une prise de poste complète est nécessaire). Une valeur inconnue retombe sur LOCK (BO-10-02-28).
j.ce-que-fait-la-caisse-quand-elle=Ce que fait la caisse quand elle lit un code-barres alors qu'elle a perdu le lien avec le nœud magasin : NONE (rien), INFO (message au caissier, le code est traité) ou BLOCK (le code est refusé). Vide ou inconnu : NONE (BO-03-06-45).
j.ce-que-fait-la-caisse-quand-un=Ce que fait la caisse quand un bon, un avoir ou une carte cadeau scanné n'est connu ni de la caisse ni du nœud magasin : INFO (message, aucun règlement) ou BLOCK (message d'erreur, le bon est refusé). Vide ou inconnu : BLOCK (BO-03-06-48).
j.ce-que-fait-la-caisse-quand-un-2=Ce que fait la caisse quand un code GS1 porte une date de péremption (AI 17) proche, atteinte ou dépassée : NONE (rien), INFO (message au caissier, l'article est enregistré), BLOCK (article refusé) ou SUPERVISOR (article refusé, un superviseur peut forcer son enregistrement). Vide ou inconnu : NONE (LC-11-03-13, BO-03-06-64).
j.ce-que-fait-la-caisse-quand-un-3=Ce que fait la caisse quand un coupon GS1 porte une date d'expiration (AI 17) atteinte ou dépassée : NONE, INFO ou BLOCK. Vide ou inconnu : NONE (LC-11-03-13).
j.ce-que-fait-la-caisse-quand-un-4=Ce que fait la caisse quand un règlement partiel est déjà enregistré : CONFIRM (l'écran annonce les règlements qui seront annulés et l'opérateur valide) ou BLOCK (l'abandon est refusé, l'opérateur doit annuler le règlement d'abord). Vide ou inconnu : CONFIRM (LC-04-04-06/07/08/09).
j.ce-que-la-fin-de-periode-du=Ce que la fin de période du POINT DE VENTE enchaîne, noms séparés par des points-virgules et dans l'ordre : CLOSE_REGISTERS (fermer les caisses restées ouvertes), SAFE_COUNT (comptage du coffre), Z_REPORT (état Z consolidé), BANK_DEPOSIT (remise en banque). Un nom inconnu est ignoré. Vide : la fin de période ne fait que ce que les clés ci-dessus décrivent, caisse par caisse (BO-03-12-02).
j.cet-identifiant-est-deja-pris=Cet identifiant est déjà pris.
j.cet-inventaire-ne-presente-pas-d-ecart=Cet inventaire ne présente pas d'écart à régulariser.
j.cette-affectation-depasse-votre-niveau-hierarchi=Cette affectation dépasse votre niveau hiérarchique.
j.cette-caisse-n-accepte-que-des-retours=Cette caisse n'accepte que des retours : le mode retour y est permanent et aucune vente n'y est possible. Désactivé : la caisse vend et reprend (LC-05-01-03).
j.cette-demande-n-attend-plus-de-livraison=Cette demande n'attend plus de livraison.
j.cette-demande-ne-peut-plus-etre-annulee=Cette demande ne peut plus être annulée.
j.cette-pochette-existe-deja=Cette pochette existe déjà :
j.cette-population-demande-de-nommer-l-ilot=Cette population demande de nommer l'îlot, la caisse ou l'opérateur.
j.champs-demandes-a-la-creation-d-un=Champs demandés à la création d'un client en caisse, séparés par des points-virgules, une étoile marquant les obligatoires : companyName, contactName, street, postalCode, city, siret, vatNumber, phone, email. Vide : tous les champs, raison sociale obligatoire (LC-08-04-10).
j.champs-du-client-en-compte=Champs du client en compte
j.changement-de-langue-pendant-la-session=Changement de langue pendant la session
j.chaque-acompte-percu-sur-une-commande-ou=Chaque acompte perçu sur une commande ou un devis — créé en caisse ou rappelé — imprime en plus du justificatif une facture d'acompte numérotée : identité du magasin, articles et montants de la commande, montant de l'acompte et sa TVA par taux, déjà versé et reste dû. Désactivé : seul le justificatif d'acompte est imprimé (LC-08-04-15).
j.chaque-integration-de-referentiel-article-nomenc=Chaque intégration de référentiel — article, nomenclature, client, promotion — laisse une ligne datée dans l'audit de mise à jour, consultable sur l'écran de supervision des synchronisations. Désactivé — le défaut — seule l'empreinte courante est conservée, sans historique (BO-10-08-23).
j.chaque-ligne-du-panier-transmis-au-moteur=Chaque ligne du panier transmis au moteur de promotion porte le code de la famille de l'article et celui de sa sous-famille, pour que des avantages puissent être déclenchés à ce niveau. Désactivé : la ligne ne porte que son code article (BO-10-03-19).
j.character-set-b-cannot-encode=Character set B cannot encode
j.chargement-enregistre=Chargement enregistré.
j.chemin-d-acces-complet-du-programme-lance=Chemin d'accès complet du programme lancé par la touche de l'écran caisse. Vide : la touche n'apparaît pas (LC-09-01-04).
j.chemin-du-programme-externe=Chemin du programme externe
j.chemin-ou-le-nud-depose-les-fichiers=Chemin où le nœud dépose les fichiers des flux sortants. Vide : aucun flux n'est produit (BO-11-01-02).
j.chiffre-d-affaires=Chiffre d'affaires
j.chiffre-d-affaires-par-date=Chiffre d'affaires par date
j.choix-d-impression-en-fin-de-transaction=Choix d'impression en fin de transaction
j.choix-de-la-langue-par-le-client=Choix de la langue par le client
j.choix-parmi-les-options=Choix parmi les options
j.cheques-cadeaux-gs1-par-emetteur=Chèques cadeaux GS1 par émetteur
j.cle-du-moyen-de-paiement-sous-lequel=Clé du moyen de paiement sous lequel le crédit client est enregistré sur le ticket et dans les états. Une clé inconnue retombe sur CREDIT (BO-10-04-09).
j.click-and-collect=Click and collect
j.clients-purge-apres-derniere-activite-jours=Clients : purge après dernière activité (jours)
j.cle-d-authentification-effacee=Clé d'authentification effacée.
j.cle-de-controle-luhn-des-cartes-de=Clé de contrôle Luhn des cartes de fidélité
j.code-tva=Code TVA
j.code-article-a-l-ecran=Code article à l'écran
j.code-caissiere=Code caissière
j.code-d-identification-en-pied-de-ticket=Code d'identification en pied de ticket
j.code-de-l-attribut-article-servant-a=Code de l'attribut article servant à trier ou isoler les lignes du ticket. Vide : aucun tri par attribut (BO-03-03-18).
j.code-de-la-raison=Code de la raison
j.code-de-validation-attribue-par-l-administration=Code de validation attribué par l'administration fiscale à chaque série de documents de la caisse, sous la forme TYPE:CODE séparés par des points-virgules (ex. FS:AAJFJMVNTN;FT:AAJFJ3VNTN;NC:AAJFJ4VNTN;RC:AAJFJ5VNTN). L'ATCUD imprimé est le code, un tiret, puis le rang du document dans sa série. Administrable par caisse, chaque caisse ayant ses propres séries. Type sans code : ATCUD « 0-rang » (LC-08-04-23).
j.code-du-gabarit-imprime-quand-aucune-carte=Code du gabarit imprimé quand aucune carte n'a été présentée et que le programme a répondu, c'est-à-dire pour la projection anonyme. Vide : la caisse imprime sa zone intégrée (BO-10-03-05).
j.code-du-gabarit-imprime-quand-aucune-carte-2=Code du gabarit imprimé quand aucune carte n'a été présentée et que le programme n'a pas répondu. Vide : la caisse imprime sa zone intégrée, limitée au message du magasin (BO-10-03-05, BO-10-03-13).
j.code-du-gabarit-imprime-quand-une-carte=Code du gabarit imprimé quand une carte a été présentée et que le programme n'a pas répondu. Vide : la caisse imprime sa zone intégrée, carte et message hors ligne (BO-10-03-05, BO-10-03-11).
j.code-du-gabarit-imprime-a-la-place=Code du gabarit imprimé à la place de la zone fidélité intégrée quand une carte a été présentée et que le programme a répondu. Vide : la caisse imprime sa zone intégrée (BO-10-03-05, BO-10-03-12).
j.code-du-gabarit-imprime-a-la-place-2=Code du gabarit imprimé à la place du gabarit porteur en ligne quand le regroupement des avantages vaut CATEGORY. Vide : le gabarit porteur en ligne s'applique, regroupement ou non (BO-10-03-21).
j.code-du-monnayeur-obligatoire=Code du monnayeur obligatoire.
j.code-du-type-de-reglement-associe-a=Code du type de règlement associé à un coupon GS1 (AI 255). Vide : aucun coupon GS1 accepté en règlement (LC-11-03-06).
j.code-famille=Code famille
j.code-postal-enregistre=Code postal enregistré.
j.code-postal-et-localite-obligatoires=Code postal et localité obligatoires.
j.code-postal-inconnu=Code postal inconnu.
j.code-postal-supprime=Code postal supprimé.
j.code-superviseur=Code superviseur
