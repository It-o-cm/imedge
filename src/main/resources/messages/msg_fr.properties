j.nb-total-de-clients=Nb total de clients
j.niveau-de-detail=Niveau de détail
j.niveau-de-la-nomenclature-ifls-auquel-le=Niveau de la nomenclature IFLS auquel le CA par nomenclature est restitué (R16) : 0 est la racine. Défaut 1.
j.niveau-du-controle-none-aucun-controle-warn=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Déclenché au-delà de la quantité plafond ci-dessous (BO-10-02-06).
j.niveau-du-controle-none-aucun-controle-warn-2=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Déclenché au-delà du total plafond ci-dessous (BO-10-02-07). ENDORSE y vaut BLOCK : aucune cérémonie d'aval n'existe à ce moment.
j.niveau-du-controle-none-aucun-controle-warn-3=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Les tickets en attente non repris sont annulés par la clôture : ce contrôle est ce qui en prévient le caissier (BO-10-02-08). ENDORSE y vaut BLOCK : aucune cérémonie d'aval n'existe à ce moment.
j.niveau-du-controle-none-aucun-controle-warn-4=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Porte sur l'abandon des règlements déjà encaissés d'un ticket en cours de paiement (BO-10-02-02).
j.niveau-du-controle-none-aucun-controle-warn-5=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Porte sur l'usage des moyens de paiement monétiques en caisse (BO-10-02-10). ENDORSE y vaut BLOCK : aucune cérémonie d'aval n'existe à ce moment.
j.niveau-du-controle-none-aucun-controle-warn-6=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Porte sur le montant saisi pour un moyen de paiement, comparé en valeur absolue (BO-10-02-17). ENDORSE y vaut BLOCK : aucune cérémonie d'aval n'existe à ce moment.
j.niveau-du-controle-none-aucun-controle-warn-7=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Porte sur le prix forcé d'une ligne, comparé en valeur absolue : une vente et un retour sont plafonnés de la même façon (BO-10-02-16).
j.niveau-du-controle-none-aucun-controle-warn-8=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Porte sur les ouvertures qui ne règlent aucune vente : prise de poste et clôture de session (BO-10-02-04). ENDORSE y vaut BLOCK : aucune cérémonie d'aval n'existe à ce moment.
j.niveau-du-controle-none-aucun-controle-warn-9=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Sans effet quand l'aval superviseur de l'annulation de ligne est désactivé : ce drapeau dit SI le geste est surveillé, cette clé dit ce qui se passe alors (BO-10-02-01).
j.niveau-du-controle-none-aucun-controle-warn-10=Niveau du contrôle : NONE (aucun contrôle), WARN (alerte non bloquante, le geste passe et l'opérateur est prévenu), BLOCK (geste refusé, qu'aucune habilitation de la caisse ne lève) ou ENDORSE (geste refusé jusqu'à l'aval d'un superviseur). Une valeur inconnue retombe sur le défaut de ce point. Sans effet quand l'aval superviseur du remboursement est désactivé : ce drapeau dit SI le geste est surveillé, cette clé dit ce qui se passe alors (BO-10-02-03).
j.niveau-introuvable=Niveau introuvable.
j.niveau-echelon-et-parametre-sont-obligatoires=Niveau, échelon et paramètre sont obligatoires.
j.nom-de-l-organisme-qui-a-certifie=Nom de l'organisme qui a certifié l'ensemble de pesage de la caisse (organisme notifié), affiché par la touche MÉTROLOGIE de l'écran de maintenance. Vide : « non renseigné » (LC-14-03-01).
j.nom-de-la-caissiere=Nom de la caissière
j.nom-du-point-de-retrait=Nom du point de retrait
j.nom-du-segment-auquel-un-client-en=Nom du segment auquel un client en compte doit appartenir pour que sa remise s'applique. Vide : la remise de la fiche s'applique à tout client en compte qui en porte une (BO-10-04-07).
j.nom-du-theme-applique-a-l-ecran=Nom du thème appliqué à l'écran caisse en mode école, pour le distinguer de l'écran de vente standard (sombre, clair). Vide : la formation garde le thème habituel et seul le bandeau la signale (BO-10-07-08).
j.nom-ou-badge-du-valideur-obligatoire=Nom ou badge du valideur obligatoire.
j.nombre-d-articles=Nombre d'articles
j.nombre-d-articles-que-le-caissier-re=Nombre d'articles que le caissier re-scanne lors d'un contrôle partiel ; un article absent du panier ou en excédent fait basculer en contrôle total (LC-06-05-04, LC-06-05-05).
j.nombre-d-articles-retenus-au-classement-des=Nombre d'articles retenus au classement des meilleures ventes, classées sur la quantité décroissante (R19). Défaut 20.
j.nombre-d-authentifications-back-office-erronees=Nombre d'authentifications back-office erronées consécutives au bout desquelles le compte est verrouillé. 0 : aucun verrouillage, les tentatives ne sont pas comptées (BO-01-01-01).
j.nombre-d-exemplaires-du-bon-d-enlevement=Nombre d'exemplaires du bon d'enlèvement
j.nombre-de-clients=Nombre de clients
j.nombre-de-colonnes-de-saisie-directe-de=Nombre de colonnes de saisie directe, de 2 à 6 (LC-02-07-02).
j.nombre-de-decimales-de-la-base-hors=Nombre de décimales de la base hors taxe de chaque ligne du tableau de TVA : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
j.nombre-de-decimales-du-montant-de-taxe=Nombre de décimales du montant de taxe de chaque ligne du tableau de TVA : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
j.nombre-de-decimales-du-prix-unitaire-hors=Nombre de décimales du prix unitaire hors taxe sur la facture et le bon de livraison : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-hors-taxe=Nombre de décimales du total hors taxe du pied de document : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
j.nombre-de-decimales-du-total-toutes-taxes=Nombre de décimales du total toutes taxes du pied de document : 2 ou 3. Une autre valeur retombe sur 2 (BO-10-02-19).
j.nombre-de-declenchements=Nombre de déclenchements
j.nombre-de-jours-au-bout-desquels-la=Nombre de jours au bout desquels la caisse et le back-office invitent le titulaire à changer son code. 0 : aucune expiration, le code reste valable indéfiniment. Un secret jamais changé est considéré comme échu dès qu'un délai est posé (BO-01-02-12).
j.nombre-de-jours-avant-la-date-de=Nombre de jours avant la date de péremption à partir duquel elle est considérée comme proche. Zéro : seule une date atteinte ou dépassée déclenche l'alerte (LC-11-03-13).
j.nombre-de-jours-en-arriere-sur-lesquels=Nombre de jours en arrière sur lesquels la caisse cherche un ticket clôturé — réimpression, échange, remboursement — avant d'abandonner la recherche. 0 ou valeur négative : la profondeur intégrée de 30 jours (BO-10-07-16).
j.nombre-de-jours-pendant-lesquels-les-etats=Nombre de jours pendant lesquels les états édités automatiquement à la fin de chaque période sont conservés avec leur document. 0 : conservation illimitée, comme toute rétention non armée (BO-09-03-02).
j.nombre-de-jours-pendant-lesquels-un-bon=Nombre de jours pendant lesquels un bon, un avoir ou une carte cadeau dont la validité est passée SANS avoir jamais été utilisé reste en base avant suppression, compté depuis sa date de validité. 0 : conservation illimitée (BO-10-08-13).
j.nombre-de-jours-pendant-lesquels-un-instrument=Nombre de jours pendant lesquels un instrument SANS date de validité reste en base après son émission, avant suppression. 0 : conservation illimitée (BO-10-08-15).
j.nombre-de-jours-pendant-lesquels-un-instrument-2=Nombre de jours pendant lesquels un instrument daté et épuisé reste en base après son épuisement, avant suppression. 0 : conservation illimitée (BO-10-08-14).
j.nombre-de-jours-date-proche=Nombre de jours « date proche »
j.nombre-de-lignes-annulees-et-montant-ttc=Nombre de lignes annulées et montant TTC retiré. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-de-lignes-imprimees-sur-une-facturette=Nombre de lignes imprimées sur une facturette avant de demander la feuille suivante. En dessous de 1, la facturette est imprimée d'un seul tenant (LC-08-04-12/13).
j.nombre-de-lignes-vendues-avec-prix-force=Nombre de lignes vendues avec prix forcé et leur montant TTC final. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-de-minutes-avant-la-fin-de=Nombre de minutes avant la fin de période à partir duquel les caisses encore ouvertes sont fermées. Une caisse en pleine vente n'est pas fermée : l'ordre reste en attente et la caisse le reprend dès qu'elle est au repos (BO-09-03-07).
j.nombre-de-minutes-pendant-lesquelles-une-caisse=Nombre de minutes pendant lesquelles une caisse peut ne plus donner signe de vie avant que le back-office la déclare déconnectée. Chaque caisse vient chercher ses ordres toutes les vingt secondes, donc une valeur de trois minutes laisse passer huit tours manqués. 0 ou moins : trois minutes, une tolérance nulle déclarerait tout le monde hors ligne entre deux appels (BO-04-03-05).
j.nombre-de-pochettes=Nombre de pochettes :
j.nombre-de-reglements-et-montant-encaisse-par=Nombre de règlements et montant encaissé par moyen de paiement. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-de-secondes-entre-deux-lectures-du=Nombre de secondes entre deux lectures du répertoire FTP des balances. Zéro : récupération arrêtée (BO-03-06-56).
j.nombre-de-touches-de-groupe-d-articles=Nombre de touches de groupe d'articles affichées par page sur l'écran de saisie directe. En dessous de 1 la valeur par défaut s'applique (BO-03-01-06).
j.nombre-de-touches-groupe-par-page=Nombre de touches groupe par page
j.nombre-et-montant-ttc-des-tickets-abandonnes=Nombre et montant TTC des tickets abandonnés. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-et-montant-des-apports-au-tiroir=Nombre et montant des apports au tiroir. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-et-montant-des-depenses-de-caisse=Nombre et montant des dépenses de caisse. Affichage et impression du rapport CA (LC-12-07-02).
j.nombre-et-montant-des-prelevements-du-tiroir=Nombre et montant des prélèvements du tiroir. Affichage et impression du rapport CA (LC-12-07-02).
