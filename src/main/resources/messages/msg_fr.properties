j.numero-fiscal-presente-en-caisse-avant-validatio=Numéro fiscal présenté en caisse avant validation du ticket, que l'hôte(sse) peut remplacer par celui du client. Vide : aucun NIF n'est proposé (BO-10-04-15).
j.numero-de-certification-du-logiciel-delivre-par=Numéro de certification du logiciel délivré par l'administration fiscale, imprimé sur tous les documents de vente et de retour de la caisse. Vide : aucune mention n'est imprimée, ce qui est le cas de tout pays qui n'en exige pas. Posé à l'échelon PAYS, il descend à toutes les caisses de ce pays (BO-10-06-03).
