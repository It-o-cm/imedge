t.protocole-carte-prepayee=Protocole carte prépayée
t.aucun-protocole=Aucun (pas une plage de cartes prépayées)
t.ilots-avec-appel-superviseur=Îlots avec appel superviseur
t.codes-d-ilots-separes-par-des-points-virgules=Codes d'îlots séparés par des points-virgules ; vide : aucun.
