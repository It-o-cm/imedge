j.codes-de-validation-atcud-des-series=Codes de validation ATCUD des séries
j.codes-des-devis-commandes-et-bons-de=Codes des devis, commandes et bons de vente externes
j.codes-des-paniers-selfscanning=Codes des paniers selfscanning
j.codes-des-etats-edites-automatiquement-a-la=Codes des états édités automatiquement à la fin de la période, séparés par des points-virgules et dans l'ordre d'édition. Un code inconnu est ignoré. Vide : aucune édition automatique (BO-09-01-10, BO-09-01-11).
j.codes-pays-iso-separes-par-une-virgule=Codes pays ISO séparés par une virgule, proposés en caisse pour la saisie d'un NIF étranger. Le NIF portugais obéit à son propre algorithme et n'est pas dans cette liste (BO-10-04-17).
j.colonnes-de-la-grille-articles=Colonnes de la grille articles
j.combien-d-articles-du-plus-cher-au=Combien d'articles, du plus cher au moins cher, sont nommés sur le ticket de sortie. Hors de la plage 1 à 20, la valeur retombe sur 3 (BO-03-03-36).
j.combien-de-minutes-avant-la-fin-de=Combien de minutes avant la fin de période le back-office commence à annoncer le compte à rebours et ses alertes — caisses ouvertes, caisses déconnectées, tickets en attente. 0 ou moins : soixante minutes (BO-09-01-04, BO-09-02-02).
j.commande-de-redemarrage-du-poste=Commande de redémarrage du poste
j.commande-de-relance-applicative=Commande de relance applicative
j.commande-deja-payee-retiree-ou-annulee-rien=Commande déjà payée, retirée ou annulée : rien à annuler.
j.commande-darret-du-poste=Commande d’arrêt du poste
j.commande-inconnue=Commande inconnue.
j.comment-l-adresse-ci-dessus-est-rendue=Comment l'adresse ci-dessus est rendue : QR (code QR, défaut), BARCODE (code-barres), TEXTE (l'adresse écrite en clair) ou AUCUN (rien n'est imprimé, même si une adresse est saisie). Une valeur inconnue retombe sur QR (BO-03-05-08).
j.comment-le-ticket-voyage-dans-l-email=Comment le ticket voyage dans l'email : BODY (dans le corps du message, défaut), ATTACHMENT (en pièce jointe) ou BOTH (les deux). Avec logo : corps HTML avec images intégrées et alternative texte, pièce jointe HTML autonome. Sans logo : texte et pièce jointe TXT. Une valeur inconnue retombe sur BODY (LC-08-02-07/08).
j.comment-les-lignes-d-avantage-sont-regroupees=Comment les lignes d'avantage sont regroupées sous la cagnotte du jour : TYPE (par type d'avantage, défaut), CATEGORY (par catégorie) ou NONE (liste à plat). Avec CATEGORY, les groupes sortent dans l'ordre de priorité de catégorie communiqué par la réponse du programme de fidélité, puis dans l'ordre d'arrivée pour les catégories sans rang. Une valeur inconnue retombe sur TYPE (BO-03-03-25, BO-03-03-33, BO-10-03-20).
j.compresser-l-image-du-ticket=Compresser l'image du ticket
j.comptage-conforme-au-montant-tenu-par-le=Comptage conforme au montant tenu par le logiciel.
j.comptage-enregistre-ecart-de=Comptage enregistré, écart de
j.compte-ftp-refuse=Compte FTP refusé
j.compte-beneficiaire-cheque=Compte bénéficiaire chèque
j.compte-cree-identifiants-generes=Compte créé : identifiants générés.
j.compte-cree=Compte créé.
j.compte-de-connexion-au-serveur-ftp-des=Compte de connexion au serveur FTP des balances (BO-03-06-56).
j.compte-enregistre=Compte enregistré.
