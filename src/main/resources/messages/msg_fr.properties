j.imprime-le-code-unique-du-ticket-en=Imprime le code unique du ticket en dernière position. Désactivé : aucun code d'identification, sans modifier les autres codes des documents (LC-08-01-03).
j.imprime-le-ticket-d-apport-avec-caisse=Imprime le ticket d'apport avec caisse, numéro et nom d'opérateur et montant total (LC-12-04-04).
