j.un-article-scanne-a-nouveau-s-ajoute=Un article scanné à nouveau s'ajoute à la quantité de sa ligne au lieu d'ouvrir une ligne de plus, tant que la ligne n'a ni prix modifié, ni sous-total après elle. Désactivé : chaque article est une ligne. Les pesées restent une ligne chacune (BO-10-08-32).
j.une-mise-a-jour-des-articles-prix=Une mise à jour des articles, prix, familles, TVA, plages de codes, types de bons ou flux du moteur de promotions arrivant pendant une vente est différée jusqu'à ce que la caisse soit libre : le panier en cours garde les prix et promotions avec lesquels il a été commencé. Désactivé : la mise à jour s'applique aussitôt (BO-10-08-25).
