j.jour-de-la-semaine-qui-ferme-la=Jour de la semaine qui ferme la semaine, en anglais et en majuscules (MONDAY à SUNDAY). Illisible ou inconnu : SUNDAY (BO-09-01-07).
j.jour-et-mois-qui-ferment-l-annee=Jour et mois qui ferment l'année, au format jj/mm. Illisible : 31/12 (BO-09-01-07).
j.journal-d-acces-utilisateurs-retention-jours=Journal d'accès utilisateurs : rétention (jours)
j.jours-de-conservation-des-codes-barres-expires=Jours de conservation des codes-barres expirés non utilisés
j.jours-de-conservation-des-codes-barres-expires-2=Jours de conservation des codes-barres expirés utilisés
j.jours-de-conservation-des-codes-barres-sans=Jours de conservation des codes-barres sans date de validité
j.jours-de-conservation-des-resultats-d-integratio=Jours de conservation des résultats d'intégration
j.jours-de-fermeture-hebdomadaire=Jours de fermeture hebdomadaire
j.jours-ou-le-magasin-ne-travaille-pas=Jours où le magasin ne travaille pas, noms DayOfWeek anglais (MONDAY, SUNDAY…) séparés par « ; ». Aucun Z quotidien n'est émis ces jours-là et la borne hebdomadaire tombe à la fin du dernier jour travaillé (R6). Vide : tous les jours sont travaillés.
j.jours-restants-en-dessous-desquels-l-article=Jours restants en dessous desquels l'article est refusé
j.justificatif-carte=Justificatif carte
j.justificatif-d-acompte=Justificatif d'acompte
j.justificatif-paiement-carte-cadeau=Justificatif paiement carte cadeau
j.justificatif-paiement-fidelite=Justificatif paiement fidélité
j.l-ean-accompagne-le-libelle-article-sur=L'EAN accompagne le libellé article sur la visu caisse, la visu client et le ticket imprimé (LC-02-04).
j.l-abandon-du-ticket-en-cours-exige=L'abandon du ticket en cours exige un aval superviseur. Désactivé : le caissier abandonne seul (EXP-32).
j.l-activation-et-la-levee-du-mode=L'activation et la levée du mode dégradé monétique forcé exigent un aval superviseur. Désactivé : l'opérateur décide seul (LC-07-08-03/04).
j.l-adresse-email-recuperee-du-referentiel-client=L'adresse email récupérée du référentiel client peut être corrigée en caisse avant l'envoi. Désactivé : elle est envoyée telle quelle et seul un client sans adresse connue en fait saisir une (LC-08-02-10, BO-10-07-23).
j.l-annulation-d-une-ligne-deja-enregistree=L'annulation d'une ligne déjà enregistrée exige un aval superviseur. Désactivé : le caissier annule seul (EXP-32).
j.l-annulation-rapide-du-dernier-article-saisi=L'annulation rapide du dernier article saisi exige un aval superviseur. Désactivé : le caissier annule seul le dernier article (EXP-32).
j.l-hote-sse-peut-corriger-les-coordonnees=L'hôte(sse) peut corriger les coordonnées du client identifié ; la correction est enregistrée en base et portée sur le document imprimé. Désactivé : la fiche est en lecture seule en caisse (BO-10-04-03/04).
j.l-hote-sse-peut-creer-en-caisse=L'hôte(sse) peut créer en caisse un client VOLATIL — un client de passage, sans compte ni crédit, créé pour porter une facture. Désactivé : seuls les clients en compte déjà intégrés sont utilisables (BO-10-04-01).
j.l-identifiant-doit-compter-au-moins=L'identifiant doit compter au moins
j.l-identifiant-du-terminal-est-obligatoire=L'identifiant du terminal est obligatoire.
j.l-image-imprimee-du-ticket-part-compressee=L'image imprimée du ticket part compressée (gzip puis Base64) au lieu du texte brut. L'encodage voyage dans la charge : le lecteur n'a jamais à le deviner (BO-11-02-02).
j.l-interrogation-du-service-fidelite-imfid-cagnot=L'interrogation du service fidélité imfid (cagnotte, avantages, paiement fidélité) est active. Désactivé : la caisse se comporte comme si aucun service fidélité n'était configuré, même si son URL est renseignée (BO-10-03-07).
j.l-operateur-peut-changer-la-langue-a=L'opérateur peut changer la langue à tout moment, y compris pendant une transaction. Désactivé : le changement n'est possible qu'avant l'ouverture de caisse (LC-13-06-04).
j.l-ecran-client-affiche-en-permanence-jusqu=L'écran client affiche en permanence, jusqu'au paiement, le total des articles éligibles aux éco-chèques, recalculé à chaque changement du ticket. Désactivé : la mention n'apparaît pas (LC-10-01-09).
j.l-ecran-client-affiche-en-permanence-jusqu-2=L'écran client affiche en permanence, jusqu'au paiement, le total des articles éligibles à la carte achat sociale, recalculé à chaque changement du ticket. Désactivé : la mention n'apparaît pas (LC-10-01-11).
j.lait-demi-ecreme-1l=LAIT DEMI-ECREME 1L
j.la-cagnotte-disponible-de-la-carte-rattachee=La cagnotte disponible de la carte rattachée, lue auprès de la fidélité, est affichée sur le VISEUR CLIENT jusqu'au paiement. Indépendant du nom du porteur : le magasin peut montrer la cagnotte sans l'identité. Désactivé — le défaut — le viseur client n'affiche aucun solde (LC-03-04-13).
j.la-caisse-propose-au-caissier-quels-documents=La caisse propose au caissier quels documents imprimer : tous, ticket de caisse, ticket carte bancaire, bon d'achat ou aucun. Désactivé : la caisse imprime comme aujourd'hui, sans écran de choix (LC-08-03-01).
j.la-caisse-emet-les-documents-fiscaux-portugais=La caisse émet les documents fiscaux portugais : une fatura simplificada (FS) par vente, portant le NIF du client, ou une fatura (FT) quand le client la demande pendant la vente ou le paiement ; une nota de crédito (NC) après un retour ou pour annuler une FS convertie en FT après coup ; un recibo (RC) sur une FT. Chaque document porte son numéro de série, son ATCUD, les 4 caractères de sa signature chaînée, la mention de certification et le QR code fiscal. Une vente payée en partie par carte achat sociale est éditée sur deux FS, les articles éligibles réglés par la carte sur la première. Désactivé : la caisse imprime ses tickets comme avant (LC-08-01-05, LC-08-01-06, LC-08-04-18 à -23, LC-05-07-03).
j.la-carte-de-fidelite-est-transmise-au=La carte de fidélité est transmise au moteur de promotion, qui lit les offres personnelles du porteur et peut les déclencher. Désactivé : le panier est valorisé anonymement et aucune promotion personnalisée n'est déclenchée (BO-10-03-22).
j.la-connexion-sso-n-est-pas-activee=La connexion SSO n'est pas activée sur ce nœud.
j.la-creation-d-un-client-en-compte=La création d'un client en compte est refusée, en caisse comme au back-office : un client en compte entre par l'intégration de la gestion commerciale. Désactivé : la création redevient possible (BO-10-04-05, BO-02-04-12).
j.la-date-de-fin-de-validite-de=La date de fin de validité de l'avoir sort sur le bon. Désactivé : le bon ne porte que son numéro et son montant (BO-03-03-08).
j.la-deconnexion-demande-le-code-de-l=La déconnexion demande le code de l'opérateur. Désactivé : la touche ferme la caisse sans rien demander (LC-01-02-02/03, BO-10-02-24).
j.la-diffusion-au-fil-de-l-eau=La diffusion au fil de l'eau n'est pas activée sur cet échelon.
j.la-fin-de-diffusion-precede-son-debut=La fin de diffusion précède son début.
j.la-langue-que-la-base-des-clients=La langue que la base des clients fidélisés enregistre pour le porteur de la carte identifiée en caisse devient la langue de la visu client, du ticket de caisse et du ticket conservé pour sa restitution par API, pour la transaction en cours ; une langue que la caisse ne propose pas est ignorée. Désactivé : la langue reste celle de la caisse ou celle que le client choisit (LC-13-06-09, LC-13-06-14).
j.la-largeur-doit-etre-comprise-entre=La largeur doit être comprise entre
j.la-ligne-du-total-a-payer-est=La ligne du total à payer est émise en caractères double hauteur et double largeur, par la même directive que la mise en gras. Désactivé : elle est imprimée dans la fonte courante (BO-10-07-14).
j.la-longueur-du-code-doit-etre-comprise=La longueur du code doit être comprise entre
j.la-mention-carte-fidelite-et-son-numero=La mention carte fidélité et son numéro sortent en zone d'avantage carte du ticket. Désactivé : le ticket ne nomme pas la carte (BO-03-03-32).
j.la-remise-accordee-au-client-en-compte=La remise accordée au client en compte est annoncée à l'hôte(sse) dès que le client est scanné ou saisi. Désactivé : la remise s'applique sans être annoncée (BO-10-04-08).
j.la-remise-ou-le-rabais-pose-sur=La remise ou le rabais posé sur le total du ticket porte aussi sur les lignes qui portent déjà une remise manuelle ou une promotion automatique. Désactivé : ces lignes sortent de la base ET de la répartition — la remise globale coûte alors exactement ce qu'elle annonce sur les lignes restantes (BO-03-07-12).
j.la-remise-le-rabais-ou-le-prix=La remise, le rabais ou le prix forcé d'une ligne sort sous l'article concerné. Désactivé : seule la remise ticket sort sous les totaux (BO-03-03-22).
j.la-section-cagnotte-du-jour-et-les=La section « CAGNOTTE DU JOUR » et les avantages fidélité sont imprimés sur le ticket. Désactivé : aucune section fidélité n'est imprimée (BO-10-03-15).
j.la-tare-reellement-appliquee-a-une-pesee=La tare réellement appliquée à une pesée — contenant, article ou tare par défaut — est imprimée en kilogrammes sous la ligne de l'article pesé. Désactivé : le ticket n'énonce que le poids net, comme avant (BO-10-05-04).
j.la-validation-manuelle-d-un-paiement-secours=La validation manuelle d'un paiement 'secours monétique' — saisie du montant accepté sans lecture du QR-code de retour — exige un aval superviseur. Désactivé : l'opérateur valide seul (LC-07-07-09).
j.la-zone=La zone
j.la-zone-soldes-carte-sort-en-fin=La zone soldes carte sort en fin de section fidélité : solde disponible, total des avantages du jour, montant utilisé et nouveau solde après transaction. Désactivé : aucune zone soldes (BO-03-03-31, BO-03-03-34).
j.label-point-de-vente=Label Point De Vente
j.langue-du-client-fidele=Langue du client fidèle
j.langue-systeme-du-point-de-vente=Langue système du point de vente
j.langues-proposees-en-caisse=Langues proposées en caisse
j.langues-que-l-operateur-peut-choisir-separees=Langues que l'opérateur peut choisir, séparées par des points-virgules, par exemple fr;nl;pt. La liste des langues disponibles n'est pas figée dans le logiciel : elle est découverte des fichiers de messages livrés, et de ceux déposés dans le répertoire pos.messages.dir. Une langue sans fichier de messages est ignorée ; liste vide : seul le français est proposé (LC-13-06-03/04).
j.largeur-de-tranche=Largeur de tranche
j.largeur-de-tranche-horaire-min=Largeur de tranche horaire (min)
j.largeur-du-logo-imprime-en-points=Largeur du logo imprimé, en points
j.largeur-a-laquelle-le-logo-est-imprime=Largeur à laquelle le logo est imprimé, en points de la tête thermique : 384 points soit 48 mm par défaut, jusqu'à 576 points pour toute la largeur d'un rouleau 80 mm (Epson TMH6000 IV et V). Une valeur hors de l'intervalle 8-576 retombe sur 384 (BO-03-03-14).
j.largeur-en-minutes-des-tranches-du-ca=Largeur, en minutes, des tranches du CA par tranche horaire (R17) : 15, 30 ou 60. Les tranches couvrent du premier au dernier ticket de la période, sans trou. Défaut 60.
j.le-label-point-de-vente-administre-ci=Le Label Point De Vente administré ci-dessous est ajouté à chaque requête envoyée au client monétique. Désactivé : la requête ne le porte pas (BO-03-09-31).
j.le-qr-code-de-recuperation-du-ticket=Le QR code de récupération du ticket dématérialisé s'affiche sur l'écran client en fin de transaction. Désactivé : aucun QR code (BO-10-07-02).
j.le-badge-scanne-ouvre-la-caisse-seul=Le badge scanné ouvre la caisse SEUL quand ce paramètre est désactivé. Actif : le badge remplit l'identifiant et l'opérateur saisit son code (LC-01-01-03/09, BO-10-02-22).
j.le-bon-n-est-pas-un-document=Le bon n'est pas un document fiscal : c'est une preuve de sortie de marchandise. Deux exemplaires permettent au client de LAISSER le sien au point de retrait, que le responsable relève le soir, et d'en GARDER un portant le reste à enlever. 1 : un seul bon, celui que le client garde (LC-02-08-05).
j.le-bordereau-de-commande-de-monnaie-est=Le bordereau de commande de monnaie est imprimé : numéro de caisse, opérateur, horodatage et un tableau des dénominations avec les colonnes montant et nombre de rouleaux, remplies ou vides selon la saisie. Désactivé : aucun bordereau rempli n'est imprimé (LC-12-05-08).
j.le-champ=Le champ
j.le-client-choisit-lui-meme-sur-la=Le client choisit lui-même, sur la visu client tactile, la langue de la visu client et de son ticket de caisse parmi les langues proposées en caisse ; le choix vaut pour la transaction en cours et la visu client passe alors en une seule langue. Désactivé : aucune touche de langue sur la visu client (LC-13-06-08/13).
j.le-client-peut-regler-en-carte-un=Le client peut régler en carte un montant supérieur au reste dû et recevoir l'écart en espèces : le montant carte saisi au-delà du reste dû, ou la touche CASHBACK qui demande le rendu espèces voulu et calcule le montant à débiter. Désactivé : le montant carte est limité au reste dû (LC-07-04-07/08).
j.le-code=Le code
j.le-code-de-l-ilot-est-obligatoire=Le code de l'îlot est obligatoire.
j.le-code-de-la-commande-est-obligatoire=Le code de la commande est obligatoire.
j.le-code-de-la-devise-est-obligatoire=Le code de la devise est obligatoire.
j.le-libelle-de-la-devise-est-obligatoire=Le libellé de la devise est obligatoire.
j.le-code-de-la-nomenclature-est-obligatoire=Le code de la nomenclature est obligatoire.
j.le-code-de-la-plage-article-est=Le code de la plage article est obligatoire.
j.le-code-de-la-plage-est-obligatoire=Le code de la plage est obligatoire.
j.le-code-doit-comporter-au-moins=Le code doit comporter au moins
j.le-code-du-fournisseur-est-obligatoire=Le code du fournisseur est obligatoire.
j.le-code-du-gabarit-est-obligatoire=Le code du gabarit est obligatoire.
j.le-code-du-groupe-est-obligatoire=Le code du groupe est obligatoire.
j.le-code-du-nouveau-groupe-est-obligatoire=Le code du nouveau groupe est obligatoire.
j.le-code-du-regime-est-obligatoire-et=Le code du régime est obligatoire et limité à
j.le-code-enseigne-est-obligatoire=Le code enseigne est obligatoire.
j.le-code-et-le-libelle-de-l=Le code et le libellé de l'attribut sont obligatoires.
j.le-code-et-le-libelle-de-l-2=Le code et le libellé de l'entrée sont obligatoires.
j.le-code-et-le-libelle-de-l-3=Le code et le libellé de l'image sont obligatoires.
j.le-code-et-le-libelle-de-la=Le code et le libellé de la liste sont obligatoires.
j.le-code-et-le-libelle-sont-obligatoires=Le code et le libellé sont obligatoires.
j.le-code-interne-rattache-a-l-ean13=Le code interne rattaché à l'EAN13 est imprimé sous la ligne de l'article qui en porte un — ce que demandent les produits dématérialisés. Désactivé : seule la ligne article est imprimée (BO-10-02-20).
j.le-code-pays-est-obligatoire=Le code pays est obligatoire.
j.le-code-2=Le code «
j.le-compteur-de-transactions-de-la-caisse=Le compteur de transactions de la caisse repart à 1 à chaque fin de période. Désactivé — le défaut — il continue sans discontinuer. Seul le numéro de ticket repart : la numérotation fiscale, elle, ne compte jamais à rebours et n'est pas touchée (BO-09-03-04).
j.le-credit-client-peut-ne-regler-qu=Le crédit client peut ne régler qu'une partie du ticket, le reste étant payé autrement. Désactivé : le crédit client règle la totalité du reste dû, ou rien (BO-10-04-10).
j.le-detail-de-la-tva-par-taux=Le détail de la TVA par taux (HT / TVA) est imprimé sur le ticket de caisse et le ticket de retour. Désactivé : aucune ventilation TVA n'est imprimée (BO-10-06-04).
j.le-forcage-du-prix-d-une-ligne=Le forçage du prix d'une ligne exige un aval superviseur. Désactivé : le caissier force seul (EXP-32).
j.le-fournisseur-et-le-code-message-sont=Le fournisseur et le code message sont obligatoires.
j.le-lieu-ou-le-client-va-retirer=Le lieu où le client va retirer les articles marqués A ENLEVER, imprimé sur le bon d'enlèvement : le client quitte la caisse et s'y rend en véhicule, donc le bon doit le nommer. Un seul point de retrait par magasin (le BATI en bricolage, le DRIVE en alimentaire). Vide : le bon n'en nomme aucun (LC-02-08-05).
j.le-montant-est-declare-encode-mais-aucun=Le montant est déclaré encodé mais aucun champ PRICE n'est administré.
j.le-montant-reglable-en-especes-est-arrondi=Le montant réglable en espèces est arrondi au multiple le plus proche de ce pas, et l'écart est enregistré sur le moyen de paiement ARRONDI. 0 ou 1 : aucun arrondi (France). 5 : obligation légale belge depuis le 01/12/2019 (LC-07-03-01).
j.le-montant-total-doit-etre-un-nombre=Le montant total doit être un nombre positif.
j.le-motif-choisi-est-imprime-sur-le=Le motif choisi est imprimé sur le ticket de retour. Désactivé : le motif est journalisé mais n'apparaît pas sur le ticket (LC-05-05-03).
j.le-niveau-du-profil-ne-peut-depasser=Le niveau du profil ne peut dépasser le vôtre.
j.le-nom-de-la-selection-est-obligatoire=Le nom de la sélection est obligatoire.
j.le-nom-du-profil-est-obligatoire=Le nom du profil est obligatoire.
j.le-nom-et-le-prenom-du-porteur=Le nom et le prénom du porteur, quand une recherche les a trouvés, sont affichés sur le VISEUR CLIENT au rattachement de la carte. Désactivé — le défaut — le viseur client n'affiche aucune identité : il est tourné vers la salle, et le client qui suit lit l'écran du client devant lui (BO-10-03-03).
j.le-nom-et-le-prenom-trouves-par=Le nom et le prénom trouvés par une recherche de carte sont affichés en caisse à côté du numéro. Désactivé : la caisse n'affiche que le numéro de carte, comme pour une carte scannée (BO-10-03-04).
j.le-nombre-de-caracteres-doit-etre-un=Le nombre de caractères doit être un entier d'au moins 1.
j.le-nombre-de-decimales-de-la-valeur=Le nombre de décimales de la valeur est hors de la zone lue.
j.le-nouveau-code-est-obligatoire=Le nouveau code est obligatoire.
j.le-nouveau-mot-de-passe-doit-compter=Le nouveau mot de passe doit compter au moins
j.le-nouveau-mot-de-passe-doit-etre=Le nouveau mot de passe doit être différent de l'actuel.
j.le-numero=Le numéro
j.le-numero-de-pdv-doit-comporter-exactement=Le numéro de PDV doit comporter exactement 5 chiffres.
j.le-numero-de-tva-doit-etre-un=Le numéro de TVA doit être un entier positif.
j.le-plafond-d-acompte-ne-peut-pas=Le plafond d'acompte ne peut pas être négatif.
j.le-plafond-doit-etre-un-pourcentage-entre=Le plafond doit être un pourcentage entre 0 et 100, ou vide pour un régime non plafonné.
j.le-prix-initial-de-l-article-est=Le prix initial de l'article est rappelé à l'écran lors d'un forçage de prix. Désactivé : le prix d'origine est masqué (BO-10-07-12).
j.le-profil=Le profil «
j.le-prefixe-de-la-plage-est-obligatoire=Le préfixe de la plage est obligatoire.
j.le-prefixe-est-plus-long-que-le=Le préfixe est plus long que le code lui-même.
j.le-prefixe=Le préfixe «
j.le-remboursement-d-un-retour-exige-un=Le remboursement d'un retour exige un aval superviseur. Désactivé : le caissier rembourse seul (EXP-32).
j.le-rendu-monnaie-est-autorise-sur-cet=Le rendu monnaie est autorisé sur cet îlot de caisses. Désactivé : l'îlot interdit le rendu même là où la règle du moyen de paiement l'autoriserait — l'interdiction d'îlot prime (BO-03-10-04).
j.le-reglement-en-credit-client-reste-possible=Le règlement en crédit client reste possible quand le référentiel client n'est plus à jour (coupure entre le BackOffice et la caisse). Désactivé : le crédit client est refusé tant que le référentiel n'a pas été rafraîchi, l'encours et le plafond n'étant plus fiables (LC-07-09-05).
j.le-role=Le rôle
j.le-scan-d-un-badge-deverrouille-la=Le scan d'un badge déverrouille la caisse ou vise un avenant manager. Désactivé : le badge scanné est ignoré et l'opérateur saisit son identifiant à la main (BO-10-02-29/30).
j.le-taux-euros-pour-une-unite-doit=Le taux (euros pour une unité) doit être un nombre strictement positif.
j.le-taux-doit-etre-un-pourcentage-entre=Le taux doit être un pourcentage entre 0 et 100.
j.le-ticket-carte-bancaire-d-un-remboursement=Le ticket carte bancaire d'un remboursement (retour article, ticket retour) est imprimé d'office (LC-08-03-10).
j.le-ticket-carte-bancaire-d-une-transaction=Le ticket carte bancaire d'une transaction non aboutie, portant la mention « abandon débit », est imprimé d'office (LC-08-03-12).
j.le-ticket-carte-bancaire-demandant-la-signature=Le ticket carte bancaire demandant la signature du client est imprimé d'office (LC-08-03-11).
j.le-ticket-d-abandon-liste-les-articles=Le ticket d'abandon liste les articles du ticket abandonné. Désactivé : seuls l'entête, le motif et le total abandonné sont imprimés (LC-04-04-12).
j.le-ticket-d-article-inconnu-porte-le=Le ticket d'article inconnu porte le code lu en CODE-BARRES sous sa transcription, pour que le rayon le rescanne au lieu de le ressaisir. Désactivé : le code n'est écrit qu'en clair (BO-10-07-11).
j.le-tiroir-s-ouvre-au-deverrouillage-de=Le tiroir s'ouvre au déverrouillage de la caisse pour installer le fond. Désactivé : le tiroir reste fermé à la connexion (BO-10-02-25).
j.le-tiroir-s-ouvre-au-lancement-de=Le tiroir s'ouvre au lancement de la clôture (comptage du Z). Désactivé : le tiroir reste fermé, le comptage se fait tiroir clos (BO-10-02-26).
j.le-tiroir-s-ouvre-sur-les-reglements=Le tiroir s'ouvre sur les règlements physiques (espèces, chèque, titres-restaurant). Désactivé : le tiroir reste fermé au paiement (BO-10-02-12).
j.les-appels-superviseur-des-caisses-s-affichent=Les appels superviseur des caisses s'affichent sur le tableau de bord du back-office. Désactivé : aucune alerte n'est remontée à l'écran (BO-10-08-01).
j.les-caisses-restees-ouvertes-sont-fermees-d=Les caisses restées ouvertes sont fermées d'office à l'approche de la fin de période, l'ordre étant relevé par chaque caisse à son tour de boucle. Désactivé : une caisse oubliée reste ouverte jusqu'au lendemain (LC-01-02-08, BO-09-01-06/09).
j.les-champs=Les champs
j.les-deux-saisies-du-nouveau-mot-de=Les deux saisies du nouveau mot de passe diffèrent.
j.les-extractions-de-factures-clients-en-compte=Les extractions de factures clients en compte portent la date d'échéance du client (BO-10-04-19).
j.les-extractions-de-factures-portent-le-montant=Les extractions de factures portent le montant d'éco-taxe associé à la transaction réglée en crédit client (BO-10-04-14), et le fichier clitva.dat des factures clients en compte une ligne d'éco-taxe après les lignes de TVA de chaque facture (BO-11-01-12).
j.les-lignes-d-un-ticket-unique-balance=Les lignes d'un ticket unique balance sont enregistrées au prix calculé par le comptoir. Désactivé : chaque ligne est revalorisée au prix du référentiel, le poids pesé faisant foi et le comptoir n'étant plus qu'un peseur (LC-06-01-04).
j.les-listes-standard-existent-deja-rien-n=Les listes standard existent déjà : rien n'a été créé.
j.les-messages-d-information-lies-a-la=Les messages d'information liés à la vente d'un article — le message administré sur l'article, l'alerte de prix élevé — ne sont plus affichés sur les caisses de cet îlot. Les REFUS ne sont jamais tus : un geste interdit reste interdit et le dit (BO-03-10-13).
j.les-messages-d-information-lies-a-un=Les messages d'information liés à un moyen de paiement — les alertes non bloquantes des points de contrôle de règlement — ne sont plus affichés sur les caisses de cet îlot. Les refus et les demandes d'aval ne sont jamais tus (BO-03-10-14).
j.les-montants-des-documents-de-caisse-portent=Les montants des documents de caisse portent le symbole monétaire. Désactivé : ils sont imprimés nus, ce que demandent les magasins dont le papier est déjà libellé (BO-10-07-04).
j.les-zones-article-et-valeur-se-chevauchent=Les zones article et valeur se chevauchent.
j.libelle-du-nif-par-defaut=Libellé du NIF par défaut
j.libelle-imprime-a-la-place-du-numero=Libellé imprimé à la place du numéro quand le NIF présenté est celui par défaut (BO-10-04-16).
j.libelle-d-attente-d-articles=Libellé d'attente d'articles
j.libelle-de-l-article=Libellé de l'article
j.libelle-de-la-cagnotte-previsionnelle=Libellé de la cagnotte prévisionnelle
j.libelle-de-la-famille=Libellé de la famille
j.libelle-de-la-promotion=Libellé de la promotion
j.libelle-de-la-raison=Libellé de la raison
j.libelle-de-la-touche-de-l-ecran=Libellé de la touche de l'écran caisse qui lance le programme externe installé sur la caisse, par exemple le cash management du monnayeur (LC-09-01-04).
j.libelle-de-la-touche-du-programme-externe=Libellé de la touche du programme externe
j.libelle-de-periode-obligatoire=Libellé de période obligatoire.
j.libelle-du-code-tva=Libellé du code TVA
j.libelle-du-mode=Libellé du mode
j.libelle-imprime-devant-le-solde-de-cagnotte=Libellé imprimé devant le solde de cagnotte projeté après la vente (imfid réponse B). Le montant est prévisionnel : rien n'est crédité avant l'ingestion du ticket (BO-03-03-31).
j.libelle-obligatoire=Libellé obligatoire.
j.libre-service-dn=Libre-service DN
j.libre-service-ncr=Libre-service NCR
j.libre-service-tgcs=Libre-service TGCS
j.lieu-du-cheque=Lieu du chèque
j.ligne-d-origine-absente=Ligne d'origine absente:
j.lignes-par-facturette=Lignes par facturette
j.lignes-separees-par-des-points-virgules-jetons=Lignes séparées par des points-virgules. Jetons montant, montant-lettres, date, heure, pdv, caisse, ticket, beneficiaire, lieu, banque, compte (LC-07-05-06).
j.liste-creee=Liste créée.
j.liste-des-contenants-proposes-au-caissier-pour=Liste des contenants proposés au caissier pour une tare ponctuelle, séparés par des points-virgules, sous la forme CODE:LIBELLÉ:POIDS_KG (ex. SACPAP:Sac kraft:0.010;BQS:Barquette S:0.035). La tare contenant remplace ponctuellement la tare article ou par défaut et n'est pas persistante. Vide : aucun contenant proposé (LC-14-01-04/05).
j.liste-enregistree=Liste enregistrée.
j.liste-inconnue=Liste inconnue.
