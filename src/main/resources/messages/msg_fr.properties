# ---- lot 21: T ----
j.t21-parametre-1=Flux d'intégration : flux récupérés
j.t21-parametre-2=Codes des flux que le nœud magasin va chercher, séparés par « ; », à l'adresse du fournisseur de service de type Service commercial en protocole HTTP/JSON déclaré à l'écran Fournisseurs de service : articles PRODUCTS, familles FAMILIES, clients CUSTOMERS, TVA VAT_RATES, nomenclature NOMENCLATURE=<schéma>. Chaque flux est lu en GET sur <adresse>/<code> avec la clé du fournisseur, et intégré comme un dépôt. Un fichier identique au dernier intégré n'est pas rejoué. Vide : rien n'est récupéré (BO-11-01-01).
j.t21-parametre-3=Flux d'intégration : fréquence (minutes)
j.t21-parametre-4=Intervalle entre deux récupérations des flux d'intégration, de 1 à 1440 minutes (BO-11-01-01).
j.t21-parametre-5=Offres remboursées par l'amont
j.t21-parametre-6=Débuts de libellé d'offre du moteur de promotion, séparés par « ; », dont les remises immédiates sont remboursées par l'amont : leur montant, porté par chaque ligne remisée, alimente la colonne REMISES_AMONT du flux CA par famille et par îlot. Vide : toutes les remises immédiates du moteur sont réputées remboursées par l'amont (BO-11-01-08).
j.t21-parametre-9=Flux paiements GS1 et bons scannés
j.t21-parametre-10=Produit chaque jour le fichier des codes de paiement lus en caisse — bons GS1 (DataMatrix, QR, Databar), bons d'achat, avoirs, cartes — avec leur caisse, leur ticket, leur montant et leur état de consommation, et des bons réglés sur les tickets clôturés (BO-11-01-18).
j.t21-parametre-11=Consommation centralisée des bons
j.t21-parametre-12=Avant d'accepter un bon GS1, la caisse demande au nœud magasin s'il a déjà été réglé sur un ticket d'une caisse du magasin ; un bon déjà consommé est refusé. Désactivé : seule la vente en cours est contrôlée (BO-11-01-18).
j.t21-parametre-13=Gestion des vignettes
j.t21-parametre-14=La caisse calcule le nombre théorique de vignettes de chaque ticket selon la formule ci-dessous, l'imprime sur le ticket et offre l'écran de déclaration des vignettes distribuées par la caissière sur sa prise de poste (BO-11-01-20).
j.t21-parametre-15=Vignettes : tranche d'achat (€)
j.t21-parametre-16=Montant TTC d'achat ouvrant droit aux vignettes : le nombre théorique d'un ticket vaut le nombre de tranches entières de ce montant multiplié par le nombre de vignettes par tranche. 0 : aucune vignette théorique (BO-11-01-20).
j.t21-parametre-17=Vignettes par tranche
j.t21-parametre-18=Nombre de vignettes distribuées par tranche d'achat entière (BO-11-01-20).
j.t21-parametre-19=Flux vignettes théoriques et déclarées
j.t21-parametre-20=Produit chaque jour, par caisse et par prise de poste, le nombre de tickets, de vignettes théoriques calculées selon la formule administrée et de vignettes déclarées par la caissière, et leur écart (BO-11-01-20).
j.t21-parametre-21=Exposition des prix aux bornes de prix
j.t21-parametre-22=Le nœud magasin répond aux bornes de prix déclarées à l'écran Fournisseurs de service (type Borne de prix) sur GET /api/price-kiosk/<EAN>, la clé du fournisseur présentée en en-tête Authorization: Bearer : libellé, prix TTC, prix au kilo ou au litre. Désactivé : toute demande est refusée (BO-11-02-06).
j.t21-parametre-23=Format de réponse des bornes de prix
j.t21-parametre-24=Format attendu par le protocole de la borne : JSON, XML ou TEXT (une ligne EAN|libellé|prix). Toute autre valeur : JSON (BO-11-02-06).
j.t21-parametre-25=Envoi automatique des prix aux étiquettes
j.t21-parametre-26=Chaque prix créé, modifié ou entré en vigueur est envoyé de lui-même à tous les fournisseurs d'étiquettes électroniques actifs du point de vente ; au premier passage, tous les prix courants partent. Un fournisseur qui n'a pas répondu reçoit le passage suivant tout ce qu'il a manqué. Désactivé : seul l'envoi manuel d'une liste d'articles s'applique (BO-11-03-05).
j.t21-parametre-27=Cadence d'envoi aux étiquettes (secondes)
j.t21-parametre-28=Intervalle entre deux envois automatiques des prix aux étiquettes électroniques, de 10 à 86400 secondes (BO-11-03-05).
j.t21-parametre-29=Apports et prélèvements par le monnayeur
j.t21-parametre-30=Un apport de monnaie en espèces est versé dans le monnayeur, qui compte ce qu'il a accepté ; un prélèvement d'espèces est délivré par le monnayeur, qui rend ce qu'il a distribué ; c'est le montant du monnayeur qui est enregistré. L'écran Monnayeur affiche le niveau d'espèces par coupure. Désactivé : apports et prélèvements se comptent à la main (BO-11-03-03).
j.t21-parametre-31=Adresse du serveur NEXO Retailer
j.t21-parametre-32=Adresse de base du serveur des produits dématérialisés (cartes et coffrets cadeaux) que la caisse appelle en protocole NEXO Retailer, sur <adresse>/api/nexo. Vide : la propriété de déploiement pos.nexo.hub-url s'applique (BO-11-03-04).
j.t21-parametre-33=Identifiant POI NEXO
j.t21-parametre-34=Identifiant POIID que la caisse adresse sur le serveur NEXO Retailer. Vide : la propriété de déploiement pos.nexo.poi-id s'applique (BO-11-03-04).
j.t21-parametre-35=Moment de l'échange NEXO à la vente
j.t21-parametre-36=SCAN : le produit dématérialisé est activé dès sa vente, au scan de son code. PAYMENT : il est activé à l'entrée en paiement, tous les produits du ticket ensemble ; un produit refusé sort du ticket avant tout règlement (BO-11-03-04).
j.t21-parametre-37=Acquittement des paiements par carte prépayée
j.t21-parametre-38=À la clôture du ticket, chaque paiement par carte prépayée validé par le serveur NEXO Retailer lui est acquitté par un message Payment de type Completion. Désactivé : seule la validation du paiement est demandée (BO-11-03-04).
j.t21-parametre-41=E-commerce : moteur de valorisation exposé
j.t21-parametre-42=La plateforme e-commerce fait valoriser ses paniers par le moteur de promotion du point de vente sur POST /api/ecommerce/valuation, avec le même jeton que le dépôt des commandes. Désactivé : la demande est refusée (BO-11-04-03).
j.t21-parametre-43=E-commerce : retour du statut d'intégration
j.t21-parametre-44=Le compte rendu d'intégration de chaque commande e-commerce — intégrée, rejetée, canal fermé —, avec le numéro du point de vente, est renvoyé aux fournisseurs de service de type E-commerce, rejoué jusqu'à son acquittement. Désactivé : la plateforme ne lit le statut qu'en le demandant (BO-11-04-03).
j.t21-parametre-45=Appel fidélité VT synchrone
j.t21-parametre-46=À la fin du ticket, la caisse envoie le panier au service fidélité et attend sa réponse (appel VT), dans le délai de réponse administré. Un envoi non abouti est confié au renvoi GT. Désactivé : le panier part en différé par la file d'envoi (BO-11-04-05).
j.t21-parametre-47=Données de paiement dans l'appel VT
j.t21-parametre-48=L'appel VT porte l'ensemble des règlements du ticket : moyen, montant, référence d'autorisation. Désactivé : il ne porte que le panier valorisé (BO-11-04-05).
j.t21-parametre-49=Renvoi GT des transactions non abouties
j.t21-parametre-50=Les transactions fidélité qui n'ont pas abouti en fin de ticket sont renvoyées au service fidélité par l'appel GT, à la cadence ci-dessous, jusqu'à leur acceptation. Désactivé : elles restent en attente et ne sont pas renvoyées (BO-11-04-06).
j.t21-parametre-51=Cadence du renvoi GT (secondes)
j.t21-parametre-52=Intervalle entre deux renvois GT des transactions fidélité non abouties, de 5 à 3600 secondes (BO-11-04-06).
j.t21-parametre-53=Chemin de l'appel GT
j.t21-parametre-54=Chemin, sur l'adresse du service fidélité, auquel l'appel GT renvoie une transaction non aboutie. Vide : le chemin de l'appel VT (/api/events/ticket-closed, /api/events/ticket-return) (BO-11-04-06).
j.t21-parametre-55=Appel fidélité VT avant impression
j.t21-parametre-56=Avant l'impression du ticket, la caisse rappelle le service fidélité avec la transaction en cours, paiement fidélité compris, et imprime le solde de la carte qu'il renvoie. Désactivé : le solde imprimé est celui de la dernière valorisation (BO-11-04-07).
