j.rc3-parametre-44=Une version installée qui échoue à son autotest est remplacée automatiquement par la version applicative précédente, sans toucher aux données des référentiels. Désactivé : le nœud reste sur la version en échec, signalée en anomalie (BO-08-04-14).
