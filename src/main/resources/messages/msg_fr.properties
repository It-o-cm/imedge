# lot 18 recette RC1: FIDÉLITÉ parameters (BO-10-02-33, BO-10-03-06, -08, -10, -17, BO-10-08-22)
j.delai-de-connexion-au-service-fidelite=Délai de connexion au service fidélité (ms)
j.temps-accorde-a-l-ouverture-de-la-connexion-fidelite=Temps accordé à l'ouverture de la connexion vers le service fidélité, en millisecondes. Au-delà, la caisse affiche que la fidélité est indisponible et la vente continue sans elle. 0 : 1500 ms (BO-10-03-10).
j.envoyer-la-date-de-commande-au-moteur=Envoyer la date de commande au moteur de promotion
j.quand-le-ticket-reprend-une-commande-le-panier=Quand le ticket reprend une commande, le panier transmis au moteur de promotion — et, par lui, au programme de fidélité — porte la date de la commande, pour que les avantages acquis à cette date soient déclenchés, campagnes échues comprises. Désactivé — le défaut — seule la date du ticket est transmise (BO-10-03-17).
j.mot-de-passe-du-service-fidelite=Mot de passe du service fidélité
j.mot-de-passe-du-compte-machine-de-la-caisse=Mot de passe du compte machine de la caisse auprès du service fidélité, distribué aux caisses avec les autres paramètres et jamais réaffiché : un champ laissé vide conserve la valeur enregistrée. Vide : la propriété de déploiement pos.fid.password s'applique (BO-10-03-08).
j.moyen-de-paiement-du-paiement-fidelite=Moyen de paiement du paiement fidélité
j.cle-du-moyen-de-paiement-sous-lequel-fidelite=Clé du moyen de paiement sous lequel un règlement sur la cagnotte fidélité est enregistré sur le ticket, dans les états et dans les flux. Une clé inconnue retombe sur FIDELITY (BO-10-03-06).
j.demander-les-soldes-des-cagnottes=Demander les soldes des cagnottes
j.la-caisse-demande-le-solde-de-chacune-cagnotte=La caisse demande au programme de fidélité le solde de CHACUNE de ses cagnottes (FID Portugal), calculé avec les éléments de la transaction en cours : avantages fidélité du ticket et paiement fidélité déjà réglé. Les soldes sont affichés sur l'écran fidélité de la caisse et relus à la clôture du ticket. Désactivé — le défaut — seul le solde du compte est interrogé (BO-10-02-33).
j.delai-de-reponse-du-service-fidelite=Délai de réponse du service fidélité (ms)
j.temps-accorde-au-service-fidelite-pour-repondre=Temps accordé au service fidélité pour répondre à un appel (cagnotte, avantages, recherche, paiement), en millisecondes. Au-delà, la caisse affiche que la fidélité est indisponible et la vente continue sans elle. 0 : 2500 ms (BO-10-03-10).
j.chaque-ligne-du-panier-porte-famille-et-sous-famille=Chaque ligne du panier transmis au moteur de promotion porte le code de la famille de l'article et celui de sa sous-famille, pour que des avantages puissent être déclenchés à ce niveau ; le panier part tel quel au programme de fidélité, qui reçoit donc la sous-famille de chaque article (gestion article à la sous-famille, Intermarché France). Désactivé : la ligne ne porte que son code article (BO-10-03-19, BO-10-08-22).
j.identifiant-du-compte-machine-mot-de-passe-parametre=Identifiant du compte machine de la caisse auprès du service fidélité. Vide : la propriété de déploiement pos.fid.user s'applique. Le mot de passe se règle par le paramètre « Mot de passe du service fidélité » (BO-11-04-04, BO-10-03-08).
