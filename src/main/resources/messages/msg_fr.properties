j.montant-au-dela-duquel-le-controle-du=Montant au-delà duquel le contrôle du montant d'article se déclenche, comparé en valeur absolue. Vide : aucun plafond, le contrôle ne se déclenche jamais (BO-10-02-16).
j.montant-au-dela-duquel-le-controle-du-2=Montant au-delà duquel le contrôle du montant de règlement se déclenche, comparé en valeur absolue. Vide : aucun plafond, le contrôle ne se déclenche jamais (BO-10-02-17).
j.montant-au-dela-duquel-un-mouvement-de=Montant au-delà duquel un mouvement de caisse (prélèvement, apport, dépense, acompte, déclaration) exige un aval manager. Un mouvement à ce montant ou en dessous passe sans aval (BO-04-01-44).
j.montant-compte-obligatoire-et-positif=Montant compté obligatoire et positif.
